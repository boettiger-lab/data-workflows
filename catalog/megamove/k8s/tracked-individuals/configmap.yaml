apiVersion: v1
data:
  megamove-tracked-individuals-convert.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: megamove-tracked-individuals-convert
      labels:
        k8s-app: megamove-tracked-individuals-convert
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: megamove-tracked-individuals-convert
        spec:
          restartPolicy: Never
          containers:
          - name: convert-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-high-seas
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              cng-convert-to-parquet \
                https://s3-west.nrp-nautilus.io/public-high-seas/raw/megamove/sources/tracked-individuals.gpkg \
                s3://public-high-seas/megamove/tracked-individuals.parquet \
                --row-group-size 100000 \
                --layer tracked-individuals
            resources:
              requests:
                cpu: '4'
                memory: 8Gi
              limits:
                cpu: '4'
                memory: 8Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  megamove-tracked-individuals-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: megamove-tracked-individuals-hex
