apiVersion: batch/v1
kind: Job
metadata:
  name: park-access-2020-tract-acres-per-thousand-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "\nset -e\n\necho \"Starting park-access-2020-tract-acres-per-thousand workflow...\"\
          \n\n# Step 0: Setup bucket with public access and CORS\necho \"Step 0: Setting\
          \ up bucket...\"\nkubectl apply -f /yamls/park-access-2020-tract-acres-per-thousand-setup-bucket.yaml\
          \ -n geo-workflows\n\necho \"Waiting for bucket setup to complete...\"\n\
          kubectl wait --for=condition=complete --timeout=600s job/park-access-2020-tract-acres-per-thousand-setup-bucket\
          \ -n geo-workflows\n\n# Step 1: Convert to optimized GeoParquet (needed\
          \ by both pmtiles and hex jobs)\necho \"Step 1: Converting to optimized\
          \ GeoParquet...\"\nkubectl apply -f /yamls/park-access-2020-tract-acres-per-thousand-convert.yaml\
          \ -n geo-workflows\n\necho \"Waiting for GeoParquet conversion to complete...\"\
          \nkubectl wait --for=condition=complete --timeout=3600s job/park-access-2020-tract-acres-per-thousand-convert\
          \ -n geo-workflows\n\n# Step 2: Run pmtiles and hex tiling in parallel (both\
          \ use the converted geoparquet)\necho \"Step 2: H3 hexagonal tiling and\
          \ PMTiles generation (parallel)...\"\nkubectl apply -f /yamls/park-access-2020-tract-acres-per-thousand-pmtiles.yaml\
          \ -n geo-workflows\nkubectl apply -f /yamls/park-access-2020-tract-acres-per-thousand-hex.yaml\
          \ -n geo-workflows\n\necho \"Waiting for hex tiling to complete (PMTiles\
          \ continues in background)...\"\necho \"Timeout set to 48 hours (172800s)...\"\
          \nkubectl wait --for=condition=complete --timeout=172800s job/park-access-2020-tract-acres-per-thousand-hex\
          \ -n geo-workflows\n\necho \"Step 3: Repartitioning by h0...\"\nkubectl\
          \ apply -f /yamls/park-access-2020-tract-acres-per-thousand-repartition.yaml\
          \ -n geo-workflows\n\necho \"Waiting for repartition to complete...\"\n\
          kubectl wait --for=condition=complete --timeout=3600s job/park-access-2020-tract-acres-per-thousand-repartition\
          \ -n geo-workflows\n\necho \"\u2713 Workflow complete!\"\necho \"Note: PMTiles\
          \ job may still be running in the background\"\necho \"\"\necho \"Clean\
          \ up with:\"\necho \"  kubectl delete jobs park-access-2020-tract-acres-per-thousand-setup-bucket\
          \ park-access-2020-tract-acres-per-thousand-convert park-access-2020-tract-acres-per-thousand-pmtiles\
          \ park-access-2020-tract-acres-per-thousand-hex park-access-2020-tract-acres-per-thousand-repartition\
          \ park-access-2020-tract-acres-per-thousand-workflow -n geo-workflows\"\n\
          echo \"  kubectl delete configmap park-access-2020-tract-acres-per-thousand-yamls\
          \ -n geo-workflows\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: park-access-2020-tract-acres-per-thousand-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
