apiVersion: batch/v1
kind: Job
metadata:
  name: wbd-hu2-convert
  labels:
    k8s-app: wbd-hu2-convert
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: wbd-hu2-convert
    spec:
      restartPolicy: Never
      containers:
      - name: convert-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-usgs-wbd
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          echo "Localizing GDB from internal S3 endpoint (fast path)..."
          rclone copy nrp:public-usgs-wbd/raw/WBD_National_GDB.gdb /tmp/WBD_National_GDB.gdb --transfers 8 --checkers 8
          echo "Converting from local GDB..."
          cng-convert-to-parquet \
            /tmp/WBD_National_GDB.gdb \
            s3://public-usgs-wbd/wbd/hu2.parquet \
            --row-group-size 100000 \
            --layer WBDHU2
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 20Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
