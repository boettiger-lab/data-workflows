# HAND-ROLLED: the generator does not write STAC. After a #728 re-hex, set_line_wording.py
# (committed beside this file) replaces the old circumradius-buffer sentences in each LIVE
# collection with how lines are now hexed (every cell the line passes through), and sets
# `updated`. Nothing else on the collection changes. Set COLLECTIONS to the rebuilt ones:
#   kubectl create configmap line-rehex-728-stac-script -n geo-workflows \
#     --from-file=set_line_wording.py=catalog/line-rehex-728/set_line_wording.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   sed 's|value: ""  # set per batch|value: "public-rivers/american-rivers/campaigns ..."|' \
#     catalog/line-rehex-728/line-rehex-728-publish-stac.yaml | kubectl apply -n geo-workflows -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: line-rehex-728-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: line-rehex-728-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {k8s-app: line-rehex-728-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      containers:
      - name: publish
        env:
        - name: COLLECTIONS
          value: ""  # set per batch
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }
          # COLLECTIONS: space-separated collection paths under nrp:, set per batch to the ones
          # whose hex has been rebuilt and validated (the new wording describes the new build).
          for p in $COLLECTIONS; do
            f="nrp:$p/stac-collection.json"
            rclone cat "$f" > /tmp/c.json
            python3 /script/set_line_wording.py /tmp/c.json
            guard_stac /tmp/c.json "$f"
            rclone copyto /tmp/c.json "$f" $R
          done
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: line-rehex-728-stac-script}}
