# Mirror minio:public-iucn/raw/ranges/ → nrp:public-iucn/raw/ranges/ and
# drop the now-redundant pre-packaged zips on the NRP rangemaps/ prefix.
# After this completes, NRP matches MinIO's single-canonical-location layout
# at raw/ranges/.
#
# Apply:
#   kubectl -n biodiversity delete job iucn-nrp-sync --ignore-not-found
#   kubectl apply -f catalog/iucn/audit/k8s/iucn-nrp-sync-job.yaml
#
# Monitor:
#   kubectl -n biodiversity logs -f job/iucn-nrp-sync
---
apiVersion: batch/v1
kind: Job
metadata:
  name: iucn-nrp-sync
  namespace: biodiversity
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
        - name: sync
          image: rclone/rclone:latest
          resources:
            requests: {memory: "2Gi", cpu: "1", ephemeral-storage: "2Gi"}
            limits:   {memory: "2Gi", cpu: "1", ephemeral-storage: "2Gi"}
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              echo "=== move NRP raw/rangemaps/BOTW_2025.zip → raw/ranges/BOTW_2025.zip"
              # Server-side move so the subsequent MinIO→NRP sync skips it
              # (same size at destination = identical).
              if rclone ls nrp:public-iucn/raw/rangemaps/BOTW_2025.zip 2>/dev/null | grep -q BOTW; then
                rclone moveto nrp:public-iucn/raw/rangemaps/BOTW_2025.zip \
                              nrp:public-iucn/raw/ranges/BOTW_2025.zip --s3-no-check-bucket
                echo "  moved BOTW_2025.zip into raw/ranges/"
              else
                echo "  (already moved or missing — skipping)"
              fi

              echo ""
              echo "=== sync minio:public-iucn/raw/ranges/ → nrp:public-iucn/raw/ranges/"
              # 'copy' (not sync) so we never delete existing NRP files we
              # didn't write; rclone skips identical sizes by default.
              rclone copy minio:public-iucn/raw/ranges/ nrp:public-iucn/raw/ranges/ \
                --transfers 8 --checkers 16 --progress --s3-no-check-bucket
              echo ""
              echo "=== delete the now-redundant pre-packaged zips on NRP"
              for f in AMPHIBIANS.zip MAMMALS.zip PLANTS.zip REPTILES.zip README.md; do
                if rclone ls "nrp:public-iucn/raw/rangemaps/$f" 2>/dev/null | grep -q .; then
                  rclone deletefile "nrp:public-iucn/raw/rangemaps/$f"
                  echo "  deleted nrp:public-iucn/raw/rangemaps/$f"
                fi
              done

              echo ""
              echo "=== verify final NRP layout"
              echo "raw/ranges/ (top 10 by size):"
              rclone ls nrp:public-iucn/raw/ranges/ | sort -nr | head -10
              echo ""
              echo "raw/rangemaps/ contents (should be empty):"
              rclone lsf nrp:public-iucn/raw/rangemaps/ 2>&1 || echo "  (gone)"
          volumeMounts:
            - {name: rclone-config, mountPath: /config/rclone, readOnly: true}
          env:
            - name: RCLONE_CONFIG
              value: /config/rclone/rclone.conf
      volumes:
        - name: rclone-config
          secret: {secretName: rclone-config}
