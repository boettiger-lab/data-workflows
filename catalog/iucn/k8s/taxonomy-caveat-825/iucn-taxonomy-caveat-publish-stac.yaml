# HAND-ROLLED: the generator does not write STAC. A metadata-only fix (#825): the
# iucn-taxonomy-2025 collection and README gain a caveat that every bird (and 6,657 other
# taxa) has no assessment details (habitat codes, elevation limits, threats, ...) in this
# table. add_caveat.py (committed beside this file) edits the LIVE files, so nothing else
# on them is touched. This documents the gap; filling it needs a new bird source (#825).
#   kubectl create configmap iucn-taxonomy-caveat-script -n geo-workflows \
#     --from-file=add_caveat.py=catalog/iucn/k8s/taxonomy-caveat-825/add_caveat.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/iucn/k8s/taxonomy-caveat-825/iucn-taxonomy-caveat-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: iucn-taxonomy-caveat-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: iucn-taxonomy-caveat-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: iucn-taxonomy-caveat-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          P=nrp:public-iucn/taxonomy
          rclone cat $P/stac-collection.json > /tmp/live.json
          rclone cat $P/README.md > /tmp/README.md
          cp /tmp/live.json /tmp/c.json
          python3 /script/add_caveat.py /tmp/c.json /tmp/README.md
          python3 /tmp/stac-guard/guard.py /tmp/c.json /tmp/live.json || exit 1
          rclone copyto /tmp/c.json $P/stac-collection.json $R
          rclone copyto /tmp/README.md $P/README.md $R
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: iucn-taxonomy-caveat-script}}
