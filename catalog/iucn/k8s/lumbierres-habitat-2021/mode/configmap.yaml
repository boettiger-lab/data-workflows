# Auto-generated ConfigMap for raster workflow
# Generation command: cng-datasets raster-workflow --dataset lumbierres-habitat-2021 --source-url "s3://public-iucn/raw/lumbierres-habitat-2021/habitat_CGLS.tiff" --bucket public-iucn --h3-resolution 9 --parent-resolutions "8,0"
apiVersion: v1
data:
  lumbierres-habitat-2021-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: lumbierres-habitat-2021-hex
      namespace: geo-workflows
      labels:
        k8s-app: lumbierres-habitat-2021-hex
    spec:
      completions: 122
      parallelism: 30
      completionMode: Indexed
      backoffLimitPerIndex: 2
      maxFailedIndexes: 1
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: lumbierres-habitat-2021-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: GDAL_DATA
              value: /usr/share/gdal
            - name: PYTHONPATH
              value: /usr/lib/python3/dist-packages
            - name: BUCKET
              value: public-iucn
            - name: CNG_HEX_WORKERS
              value: '4'
            - name: CNG_HEX_CHUNK_SIZE
              value: '100000'
            - name: DUCKDB_MEMORY_LIMIT
              value: 27GiB
            - name: GDAL_CACHEMAX
              value: '512'
            command:
            - bash
            - -c
            - |-
              set -e

              cng-datasets raster --input "s3://public-iucn/lumbierres-habitat-2021-cog.tif" --output-parquet s3://public-iucn/lumbierres-habitat-2021/hex/ --h0-index ${JOB_COMPLETION_INDEX} --resolution 9 --parent-resolutions 8,0 --value-column habitat_class --hex-resampling mode --nodata "-32768"
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 20Gi
              limits:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 20Gi
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  lumbierres-habitat-2021-preprocess-cog.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: lumbierres-habitat-2021-preprocess-cog
      namespace: geo-workflows
      labels:
        k8s-app: lumbierres-habitat-2021-preprocess-cog
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            k8s-app: lumbierres-habitat-2021-preprocess-cog
        spec:
          restartPolicy: Never
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          containers:
          - name: preprocess-cog
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: GDAL_CACHEMAX
              value: '4096'
            - name: GDAL_HTTP_TIMEOUT
              value: '60'
            - name: GDAL_HTTP_MAX_RETRY
              value: '5'
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - "set -e\n\necho \"Mosaicking 1 tiles \u2192 s3://public-iucn/lumbierres-habitat-2021-cog.tif\"\
              \n\ncng-datasets raster \\\n  --input \"s3://public-iucn/raw/lumbierres-habitat-2021/habitat_CGLS.tiff\"\
              \ \\\n  --output-cog \"s3://public-iucn/lumbierres-habitat-2021-cog.tif\"\
              \ \\\n  --target-crs EPSG:4326 \\\n  --resampling nearest \\\n  --nodata\
              \ \"-32768\" \\\n  --hex-resampling mode\n\necho \"\u2713 Preprocess COG\
              \ complete: s3://public-iucn/lumbierres-habitat-2021-cog.tif\"\n"
            resources:
              requests:
                cpu: '8'
                memory: 32Gi
                ephemeral-storage: 50Gi
              limits:
                cpu: '8'
                memory: 32Gi
                ephemeral-storage: 50Gi
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  lumbierres-habitat-2021-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: lumbierres-habitat-2021-setup-bucket
      namespace: geo-workflows
      labels:
        k8s-app: lumbierres-habitat-2021-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: lumbierres-habitat-2021-setup-bucket
        spec:
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-iucn
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Setting up bucket with public access and CORS..."
              cng-datasets storage setup-bucket \
                --bucket "${BUCKET}" \
                --remote nrp \
                --verify

              echo "Bucket setup complete!"
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
kind: ConfigMap
metadata:
  name: lumbierres-habitat-2021-yamls
  namespace: geo-workflows
