# HAND-ROLLED: the generator does not write STAC. Adds the marine mammal richness layers (#1045) to the
# LIVE iucn-richness-2025 collection with add_marine_mammal.py (committed beside this file), which
# edits the live file in place, so nothing else on it is touched.
#   kubectl create configmap iucn-marine-mammal-stac-script -n geo-workflows \
#     --from-file=add_marine_mammal.py=catalog/iucn/k8s/richness-2025/add_marine_mammal.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/iucn/k8s/richness-2025/iucn-marine-mammal-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: iucn-marine-mammal-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: iucn-marine-mammal-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: iucn-marine-mammal-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }
          rclone cat nrp:public-iucn/stac-collection.json > /tmp/c.json
          python3 /script/add_marine_mammal.py /tmp/c.json
          guard_stac /tmp/c.json nrp:public-iucn/stac-collection.json
          rclone copyto /tmp/c.json nrp:public-iucn/stac-collection.json $R
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: iucn-marine-mammal-stac-script}}
