# HAND-ROLLED: cng-datasets has no step for rewriting columns of a published table (#1013).
# Builds the corrected taxonomy table from the API cache that flags-fetch.yaml wrote, into a
# STAGING prefix only:
#   s3://public-iucn/taxonomy/staging-1013/iucn-taxonomy.parquet  (+ .report.json, source-md5.txt)
# fix_flags.py build refuses unless every target taxon is cached, and asserts that no column
# other than the two flags changes. Check the report before running flags-publish.yaml.
#
#   kubectl create configmap iucn-flags-script -n geo-workflows \
#     --from-file=fix_flags.py=catalog/iucn/k8s/flags-1013/fix_flags.py \
#     --from-file=backfill_taxonomy.py=catalog/iucn/k8s/taxonomy-backfill-825/backfill_taxonomy.py \
#     --from-file=set_flags_stac.py=catalog/iucn/k8s/flags-1013/set_flags_stac.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f catalog/iucn/k8s/flags-1013/flags-build.yaml
#   kubectl -n geo-workflows logs -f job/iucn-flags-build
apiVersion: batch/v1
kind: Job
metadata:
  name: iucn-flags-build
  namespace: geo-workflows
  labels: {k8s-app: iucn-flags-build}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {k8s-app: iucn-flags-build}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3600
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: build
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests: {cpu: '2', memory: 4Gi, ephemeral-storage: 6Gi}
          limits:   {cpu: '2', memory: 4Gi, ephemeral-storage: 6Gi}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20"
          B=nrp:public-iucn/taxonomy
          ST=$B/staging-1013
          mkdir -p /work/src /work/api-cache /work/out
          rclone copy $B/iucn-taxonomy.parquet /work/src/ $R
          rclone md5sum /work/src/iucn-taxonomy.parquet | tee /work/out/source-md5.txt
          rclone copyto $B/staging-825/previous-iucn-taxonomy.parquet /work/src/previous-iucn-taxonomy.parquet $R
          rclone copyto $ST/red_list_version.txt /work/out/red_list_version.txt $R
          rclone copy $B/api-cache/ /work/api-cache/ --transfers 64 $R
          export SRC_PARQUET=/work/src/iucn-taxonomy.parquet \
                 PRE825_PARQUET=/work/src/previous-iucn-taxonomy.parquet \
                 CACHE_DIR=/work/api-cache OUT_PARQUET=/work/out/iucn-taxonomy.parquet \
                 VERSION_FILE=/work/out/red_list_version.txt
          python /scripts/fix_flags.py build
          rclone copy /work/out/ $ST/ $R
          echo Done.
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: scripts, mountPath: /scripts, readOnly: true}
        - {name: work, mountPath: /work}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: scripts, configMap: {name: iucn-flags-script}}
      - {name: work, emptyDir: {sizeLimit: 6Gi}}
