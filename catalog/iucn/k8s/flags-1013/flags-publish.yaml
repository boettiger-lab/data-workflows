# HAND-ROLLED: the generator does not write STAC or swap a staged table into place. Publishes
# the corrected severe_fragmentation and area_restricted flags of the IUCN taxonomy table
# (#1013), after flags-build.yaml has written s3://public-iucn/taxonomy/staging-1013/ and the
# build report has been checked.
#
#  1. refuses unless the published parquet is still the exact file the build read (md5 in
#     staging-1013/source-md5.txt) and the report shows every target taxon cached;
#  2. keeps the replaced parquet as staging-1013/previous-iucn-taxonomy.parquet (rollback);
#  3. copies the staged parquet over the published one;
#  4. edits the LIVE collection and README with set_flags_stac.py, runs the publish guard,
#     uploads both.
#
# The configmap is the one flags-build.yaml creates in geo-workflows.
#   kubectl apply -n geo-workflows -f catalog/iucn/k8s/flags-1013/flags-publish.yaml
#   kubectl -n geo-workflows logs -f job/iucn-flags-publish
apiVersion: batch/v1
kind: Job
metadata:
  name: iucn-flags-publish
  namespace: geo-workflows
  labels: {k8s-app: iucn-flags-publish}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: iucn-flags-publish}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: scripts, mountPath: /scripts, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          B=nrp:public-iucn/taxonomy
          ST=$B/staging-1013
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }
          mkdir -p /work && cd /work

          # 1. preconditions
          want=$(rclone cat $ST/source-md5.txt | awk '{print $1}')
          have=$(rclone md5sum $B/iucn-taxonomy.parquet | awk '{print $1}')
          staged=$(rclone md5sum $ST/iucn-taxonomy.parquet | awk '{print $1}')
          echo "built from $want; published now $have; staged $staged"
          rclone copyto $ST/iucn-taxonomy.report.json report.json $R
          python3 -c "import json,sys; r=json.load(open('report.json')); print(r); sys.exit(0 if r['not_cached']==0 and r['rows']==179277 else 1)"

          # 2-3. keep the old table, then swap the staged one in (skipped on a re-run after the swap)
          if [ "$have" = "$staged" ]; then
            echo "published parquet is already the staged one; skipping swap"
            rclone lsf $ST/previous-iucn-taxonomy.parquet | grep -q . || { echo "no rollback copy"; exit 1; }
          else
            [ -n "$want" ] && [ "$want" = "$have" ] || { echo "published parquet changed since the backfill was built; rebuild"; exit 1; }
            rclone copyto $B/iucn-taxonomy.parquet $ST/previous-iucn-taxonomy.parquet $R
            rclone copyto $ST/iucn-taxonomy.parquet $B/iucn-taxonomy.parquet $R
          fi
          now=$(rclone md5sum $B/iucn-taxonomy.parquet | awk '{print $1}')
          [ "$now" = "$staged" ] || { echo "swap check failed: $now != $staged"; exit 1; }

          # 4. collection + README, edited in place
          rclone copyto $B/stac-collection.json stac-collection.json $R
          rclone copyto $B/README.md README.md $R
          python3 /scripts/set_flags_stac.py stac-collection.json README.md report.json
          guard_stac stac-collection.json $B/stac-collection.json
          rclone copyto README.md $B/README.md $R
          rclone copyto stac-collection.json $B/stac-collection.json $R
          rclone purge $B/staging-1013-test $R || true   # the ONLY_IDS test run's cache
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: scripts, configMap: {name: iucn-flags-script}}
