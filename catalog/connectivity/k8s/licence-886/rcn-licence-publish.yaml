# HAND-ROLLED: the generator does not write STAC. Publishes a text transcription of TNC's terms of
# use beside rcn-national and points the collection's licence link at it (#886). TNC's Box share
# blocks downloads; the transcription is from an image of the full document that Carl supplied.
# Also removes the image published by the first run of this recipe.
#   kubectl create configmap rcn-licence-886 -n geo-workflows \
#     --from-file=tnc-terms-of-use.txt=catalog/connectivity/k8s/licence-886/tnc-terms-of-use.txt \
#     --from-file=set_licence_link.py=catalog/connectivity/k8s/licence-886/set_licence_link.py \
#     --from-file=guard.py=scripts/stac-publish-guard.py
#   kubectl create -f catalog/connectivity/k8s/licence-886/rcn-licence-publish.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: rcn-licence-886
  namespace: geo-workflows
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 900
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets@sha256:246dc706ea34728a75c0bf1bc8589fd8f5c2e6526876f6c7192660a272cec1b3
        resources:
          requests: {cpu: '1', memory: 1Gi}
          limits: {cpu: '1', memory: 1Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: in, mountPath: /in, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          rclone copyto -L /in/tnc-terms-of-use.txt nrp:public-connectivity/rcn-national/tnc-terms-of-use.txt \
            --header-upload "Content-Type: text/plain; charset=utf-8" --retries 6
          p=public-connectivity/rcn-national/stac-collection.json
          rclone cat "nrp:$p" > /tmp/live.json
          cp /tmp/live.json /tmp/c.json
          python3 /in/set_licence_link.py /tmp/c.json
          python3 /in/guard.py /tmp/c.json /tmp/live.json
          rclone copyto /tmp/c.json "nrp:$p" --retries 6
          rclone deletefile nrp:public-connectivity/rcn-national/tnc-terms-of-use.png 2>/dev/null || true
          echo DONE
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: in, configMap: {name: rcn-licence-886}}
