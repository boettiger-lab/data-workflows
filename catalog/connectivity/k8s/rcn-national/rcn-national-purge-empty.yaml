# TNC RCN CONUS (issue #606) — purge the 0-row hex partitions left by datasets#238.
#
# The fractions reducer writes a partition for every h0 it touches and then deletes the
# ones that turn out to hold no mapped pixel. On an s3:// output that delete raises
# instead (boettiger-lab/datasets#238), so each all-nodata h0 leaves behind a ~375-byte
# 0-row partition. Those are not data: left in place they fake a populated h0 for the
# coverage gate and pollute a `**` glob for the next reader.
#
# This purges every partition under the dataset smaller than 4096 bytes — the same
# threshold scripts/check-hex-coverage.sh uses to tell a real partition (MB to GB) from
# an empty one. It prints what it would remove first, and refuses to touch anything at
# or above the threshold, so it can never delete real data.
#
#   kubectl apply -n geo-workflows -f catalog/connectivity/k8s/rcn-national/rcn-national-purge-empty.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: rcn-national-purge-empty
  namespace: geo-workflows
  labels: {k8s-app: rcn-national-purge-empty}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {k8s-app: rcn-national-purge-empty}}
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: purge
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          MIN=4096
          for LAYER in hex hex-fractions; do
            BASE="nrp:public-connectivity/rcn-national/$LAYER"
            echo "=== $LAYER ==="
            rclone lsf "$BASE/" --recursive --files-only --format "sp" --separator " " \
              > /tmp/$LAYER.txt || true
            awk -v m=$MIN '{ if ($NF+0 < m) print "EMPTY", $0; else print "keep ", $0 }' \
              /tmp/$LAYER.txt
            awk -v m=$MIN '$NF+0 < m { $NF=""; sub(/[ ]+$/,""); print }' /tmp/$LAYER.txt \
              > /tmp/$LAYER.empty
            while read -r f; do
              [ -z "$f" ] && continue
              d=$(dirname "$f")
              echo "purging $BASE/$d/"
              rclone purge "$BASE/$d/"
            done < /tmp/$LAYER.empty
            echo "--- after ---"
            rclone lsf "$BASE/" --recursive --files-only --format "sp" --separator " "
          done
          echo done
        resources:
          requests: {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
          limits:   {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
