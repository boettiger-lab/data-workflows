# TNC RCN CONUS (issue #606) — purge the 0-row hex partitions left by datasets#238.
#
# The fractions reducer writes a partition for every h0 it touches and then deletes the
# ones that turn out to hold no mapped pixel. On an s3:// output that delete raises
# instead (boettiger-lab/datasets#238), so each all-nodata h0 leaves behind a ~375-byte
# 0-row partition. Those are not data: left in place they fake a populated h0 for the
# coverage gate and pollute a `**` glob for the next reader.
#
# This purges every partition under the dataset smaller than 4096 bytes — the same
# threshold scripts/check-hex-coverage.sh uses to tell a real partition (MB to GB) from
# an empty one. It prints what it would remove first, and refuses to touch anything at
# or above the threshold, so it can never delete real data.
#
#   kubectl apply -n geo-workflows -f catalog/connectivity/k8s/rcn-national/rcn-national-purge-empty.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: rcn-national-purge-empty
  namespace: geo-workflows
  labels: {k8s-app: rcn-national-purge-empty}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {k8s-app: rcn-national-purge-empty}}
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: purge
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          MIN=4096
          for LAYER in hex hex-fractions; do
            BASE="nrp:public-connectivity/rcn-national/$LAYER"
            echo "=== $LAYER ==="
            # lsjson, not lsf --format: the field ORDER of --format is easy to get
            # backwards, and reading the path as if it were the size makes every
            # object look empty. Structured output plus the layout guard below means
            # a parse mistake cannot turn into a delete.
            rclone lsjson --recursive --files-only "$BASE/" > /tmp/$LAYER.json
            python3 - "$LAYER" "$MIN" > /tmp/$LAYER.empty <<'PY'
          import json, re, sys
          layer, minb = sys.argv[1], int(sys.argv[2])
          rows = json.load(open(f"/tmp/{layer}.json"))
          empty = []
          for r in rows:
              path, size = r["Path"], r["Size"]
              # Refuse to delete anything that is not exactly a hive partition file.
              if not re.fullmatch(r"h0=\d+/data_0\.parquet", path):
                  sys.exit(f"unexpected object under {layer}, refusing to purge: {path}")
              if size < minb:
                  empty.append(path)
          print("\n".join(empty), end="")
          sys.stderr.write(f"{layer}: {len(rows)} objects, {len(empty)} below {minb} bytes\n")
          PY
            # `|| [ -n "$f" ]`: a bare `read` returns non-zero at EOF, so without it
            # the last line of a file with no trailing newline is silently skipped.
            while read -r f || [ -n "$f" ]; do
              if [ -n "$f" ]; then
                echo "  deleting $f"
                rclone deletefile "$BASE/$f"
                rclone rmdir "$BASE/$(dirname "$f")" || true
              fi
            done < /tmp/$LAYER.empty
            echo "--- after ---"
            rclone lsjson --recursive --files-only "$BASE/" \
              | python3 -c "import json,sys; [print(r['Size'], r['Path']) for r in json.load(sys.stdin)]"
          done
          echo done
        resources:
          requests: {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
          limits:   {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
