# Per-class fractional-coverage companion to rcn-national-hex.
#
# `raster-workflow` emits setup-bucket -> hex only, and hardcodes the hex output
# to .../{dataset}/hex/, so every fractions layer in this repo is a hand-authored
# second Job. This one mirrors catalog/land-cover/k8s/nlcd/nlcd-hex-fractions.yaml,
# with the same completion set as rcn-national-hex (the 16 h0 base cells the COG
# footprint overlaps) so check-hex-coverage.sh can compare the two directly.
apiVersion: batch/v1
kind: Job
metadata:
  name: rcn-national-hex-fractions
  namespace: geo-workflows
  labels: {k8s-app: rcn-national-hex-fractions}
spec:
  completions: 16
  parallelism: 8
  completionMode: Indexed
  backoffLimitPerIndex: 3
  maxFailedIndexes: 2
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {k8s-app: rcn-national-hex-fractions}}
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID,     valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT,     value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS,           value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: GDAL_DATA,           value: /usr/share/gdal}
        - {name: PYTHONPATH,          value: /usr/lib/python3/dist-packages}
        - {name: CNG_HEX_WORKERS,     value: '4'}
        - {name: CNG_HEX_CHUNK_SIZE,  value: '100000'}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -e
          # Only the h0 base cells the COG footprint overlaps; the completion
          # index selects one of them. Must stay in step with rcn-national-hex.
          H0S=(6 9 12 14 15 18 20 35 50 59 71 78 89 90 96 100)
          H0=${H0S[$JOB_COMPLETION_INDEX]}
          if [ -z "${JOB_COMPLETION_INDEX}" ] || [ -z "$H0" ]; then
            echo "No h0 cell for completion index '${JOB_COMPLETION_INDEX}' in (${H0S[*]})" >&2
            exit 1
          fi
          echo "=== RCN national res-10 FRACTIONS, h0-index $H0 ==="
          cng-datasets raster \
            --input "s3://public-connectivity/rcn-national-cog.tif" \
            --output-parquet "s3://public-connectivity/rcn-national/hex-fractions/" \
            --h0-index ${H0} --resolution 10 --parent-resolutions 9,8,7,6,5,0 \
            --value-column rcn_class --hex-resampling fractions --resampling near --nodata "255"
        resources:
          requests: {cpu: '4', memory: 192Gi, ephemeral-storage: 20Gi}
          limits:   {cpu: '4', memory: 192Gi, ephemeral-storage: 20Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
