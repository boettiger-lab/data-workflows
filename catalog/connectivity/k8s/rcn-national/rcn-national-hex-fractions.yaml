# TNC RCN CONUS (issue #606) — H3 res-10 per-class FRACTIONAL COVERAGE companion.
#
# `mode` (rcn-national-hex.yaml) keeps only each cell's dominant class and throws the
# mix away, which is fine for a dominant-class map but wrong for area accounting
# ("how much of h8 X is Resilient, Concentrated Flow?"). This build emits each class's
# fractional coverage per cell instead, so class areas are recoverable.
#
# Same grid as the mode build: native 10, parents 9,8,7,6,5,0, value column rcn_class,
# nodata 255. Unlike the sparse mode layer this reducer writes a FULL h0 grid, including
# 0-row partitions for all-nodata cells — that is expected, and it is the reference the
# coverage gate compares the mode layer against. Purge the empty partitions afterwards
# so they do not fake gaps for the next reader.
#
# Run AFTER rcn-national-hex completes: one k8s hex workflow at a time (AGENTS.md).
#
#   kubectl apply -n geo-workflows -f catalog/connectivity/k8s/rcn-national/rcn-national-hex-fractions.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: rcn-national-hex-fractions
  namespace: geo-workflows
  labels: {k8s-app: rcn-national-hex-fractions}
spec:
  completions: 122
  parallelism: 12
  completionMode: Indexed
  backoffLimitPerIndex: 2
  # NOT 0, unlike the mode build: boettiger-lab/datasets#238 makes an all-nodata h0
  # exit non-zero after its (empty) work is done, and the in-pod handler below only
  # converts that to success on a fresh run. A job already in flight when the defect
  # was found was patched to this value so the multi-hour populated indexes could
  # finish. Coverage is therefore NOT implied by the job condition here — it is
  # proven separately against the mode layer's populated h0 set.
  maxFailedIndexes: 20
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {k8s-app: rcn-national-hex-fractions}}
    spec:
      restartPolicy: Never
      # No priorityClassName: the CONUS h0 cells run for hours at res 10 and
      # `opportunistic` (-2000000000) makes them preemption targets (skill
      # pod-preemption). Most of the 122 indexes are empty and exit in seconds.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID,     valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT,     value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS,           value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: GDAL_DATA,           value: /usr/share/gdal}
        - {name: PYTHONPATH,          value: /usr/lib/python3/dist-packages}
        - {name: CNG_HEX_WORKERS,     value: '8'}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -uo pipefail
          OUT=public-connectivity/rcn-national/hex-fractions
          echo "=== RCN CONUS res-10 FRACTIONS, h0-index ${JOB_COMPLETION_INDEX} ==="
          cng-datasets raster \
            --input "s3://public-connectivity/rcn-national-cog.tif" \
            --output-parquet "s3://$OUT/" \
            --h0-index ${JOB_COMPLETION_INDEX} --resolution 10 --parent-resolutions 9,8,7,6,5,0 \
            --value-column rcn_class --hex-resampling fractions --resampling near --nodata "255" \
            2>&1 | tee /tmp/hex.log
          rc=${PIPESTATUS[0]}

          # Upstream defect boettiger-lab/datasets#238. When an h0 overlaps the raster
          # but holds only nodata, the fractions reducer filters every row, then tries
          # to delete the 0-row partition it just wrote with os.remove() — which is
          # local-filesystem only, so on an s3:// output it raises instead. The h0 is
          # genuinely empty and there is no data to recover; the only damage is the
          # stray empty partition, which we purge here so it cannot fake a populated
          # h0 for the coverage gate or pollute a ** glob.
          #
          # This traceback is the ONLY call site of os.remove(output_path), and it is
          # reached only when the written row count is zero, so matching it is exact.
          # Every other failure still fails the pod.
          if [ "$rc" -ne 0 ]; then
            P=$(grep -oE "s3://$OUT/h0=[0-9]+/data_0\.parquet" /tmp/hex.log | tail -1)
            if [ -n "$P" ] && grep -q 'os\.remove(output_path)' /tmp/hex.log \
                           && grep -q 'FileNotFoundError' /tmp/hex.log; then
              echo "h0 ${JOB_COMPLETION_INDEX} is all nodata; purging the stray 0-row partition (datasets#238)"
              rclone deletefile "nrp:${P#s3://}"
              rclone rmdir "nrp:$(dirname "${P#s3://}")" || true
              exit 0
            fi
            exit "$rc"
          fi
        resources:
          requests: {cpu: '8', memory: 192Gi, ephemeral-storage: 40Gi}
          limits:   {cpu: '8', memory: 192Gi, ephemeral-storage: 40Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
