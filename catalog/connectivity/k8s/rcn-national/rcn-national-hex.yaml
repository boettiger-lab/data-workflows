apiVersion: batch/v1
kind: Job
metadata:
  name: rcn-national-hex
  namespace: geo-workflows
  labels:
    k8s-app: rcn-national-hex
spec:
  completions: 16
  parallelism: 8
  completionMode: Indexed
  backoffLimitPerIndex: 3
  maxFailedIndexes: 2
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: rcn-national-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: BUCKET
          value: public-connectivity
        - name: CNG_HEX_WORKERS
          value: '4'
        - name: CNG_HEX_CHUNK_SIZE
          value: '100000'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - "set -e\n\n# Only the h0 base cells this source overlaps (--h0-subset);\
          \ the\n# completion index selects one of them.\nH0S=(6 9 12 14 15 18 20\
          \ 35 50 59 71 78 89 90 96 100)\nH0=${H0S[$JOB_COMPLETION_INDEX]}\nif [ -z\
          \ \"${JOB_COMPLETION_INDEX}\" ] || [ -z \"$H0\" ]; then\n  echo \"No h0\
          \ cell for completion index '${JOB_COMPLETION_INDEX}' in (${H0S[*]}) \u2014\
          \ completions must match the --h0-subset length\" >&2\n  exit 1\nfi\n\n\
          cng-datasets raster --input \"s3://public-connectivity/rcn-national-cog.tif\"\
          \ --output-parquet s3://public-connectivity/rcn-national/hex/ --h0-index\
          \ ${H0} --resolution 10 --parent-resolutions 9,8,7,6,5,0 --value-column\
          \ rcn_class --hex-resampling mode --nodata \"255\""
        resources:
          requests:
            cpu: '4'
            memory: 192Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: '4'
            memory: 192Gi
            ephemeral-storage: 20Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
