apiVersion: batch/v1
kind: Job
metadata:
  name: rcn-national-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting rcn-national raster workflow...\"\n\n# Step 0:\
          \ Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl apply -f\
          \ /yamls/rcn-national-setup-bucket.yaml -n geo-workflows\nkubectl wait --for=condition=complete\
          \ --timeout=600s job/rcn-national-setup-bucket -n geo-workflows\n\n# Step\
          \ 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal tiling...\"\nkubectl\
          \ apply -f /yamls/rcn-national-hex.yaml -n geo-workflows\nkubectl wait --for=condition=complete\
          \ --timeout=7200s job/rcn-national-hex -n geo-workflows\n\necho \"\u2713\
          \ Workflow complete!\"\necho \"Clean up with:\"\necho \"  kubectl delete\
          \ jobs rcn-national-setup-bucket rcn-national-hex rcn-national-workflow\
          \ -n geo-workflows\"\necho \"  kubectl delete configmap rcn-national-yamls\
          \ -n geo-workflows\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: rcn-national-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
