#
# This ConfigMap is equivalent to running:
#   kubectl create configmap fpa-fod-1992-2024-yamls \
#     --from-file=fpa-fod-1992-2024-setup-bucket.yaml \
#     --from-file=fpa-fod-1992-2024-convert.yaml \
#     --from-file=fpa-fod-1992-2024-pmtiles.yaml \
#     --from-file=fpa-fod-1992-2024-hex.yaml \
