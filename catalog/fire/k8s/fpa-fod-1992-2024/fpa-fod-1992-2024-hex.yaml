# ⛔ --chunk-size is HAND-SET to 13307 and must not be reverted to the generator default.
#
# Hex coverage is completions x chunk-size, NOT a soft cap (data-workflows #494). The Fires layer
# holds 2,661,383 points; 200 x 13307 = 2,661,400 covers it. The generator emitted chunk-size 1000
# (= 200,000, only 7.5% of the data) because it could not count features in the source GPKG and
# fell back to its conservative default -- its zip/vector counter cannot count this source, so the
# count came from the fpa-fod-stage-raw ogrinfo probe instead.
#
# If the source is ever re-staged with a different record count, recompute as
# ceil(N / completions) using the EXACT count -- a chunk-size derived from a rounded 2,660,000
# gives 13300 and silently leaves 1,383 fires unhexed.
#
# MEMORY: 8Gi, not the 16Gi the generator inherited from --hex-memory (one flag also sizes the
# convert and pmtiles jobs, and the 1.08 GB convert is what needed 16Gi). Hexing points is the
# cheapest case there is: each point polyfills to exactly ONE res-10 cell, so there is no
# per-feature cell-array blowup, and a chunk is only 13,307 rows. Re-measure once it runs
# (kubectl top pod -- memory is $3, not $1) and trim toward measured peak + ~50%; an over-ask
# throttles our own concurrency.
#
# Verify after the run: hex COUNT(DISTINCT _cng_fid) == flat COUNT(*) (verify-stac.py HARD-fails
# this as hex-missing-features).
apiVersion: batch/v1
kind: Job
metadata:
  name: fpa-fod-1992-2024-hex
  labels:
    k8s-app: fpa-fod-1992-2024-hex
spec:
  completions: 200
  parallelism: 50
  completionMode: Indexed
  # Never backoffLimit: 0 -- a partial indexed run must surface as Failed, not publish as complete
  # (#409). With backoffLimit: 0 a pod that hangs on a flaky node's broken egress never recovers
  # and blocks the whole fan-out; per-index retries move that index to a healthy node instead.
  backoffLimitPerIndex: 3
  maxFailedIndexes: 10
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: fpa-fod-1992-2024-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-fire
        - name: DATASET
          value: fpa-fod-1992-2024
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector --input s3://public-fire/fpa-fod-1992-2024.parquet --output s3://public-fire/fpa-fod-1992-2024/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 13307 --intermediate-chunk-size 10 --resolution 10 --parent-resolutions 9,8,0
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 10Gi
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            # The generator's GPU exclusion (feature.node.kubernetes.io/pci-10de.present NotIn
            # true) is deliberately DROPPED, per AGENTS.md: excluding GPU nodes from a CPU-only
            # hex reduce only narrows the schedulable pool. Measured on #593: with it in place the
            # scheduler rejected 158 of 529 nodes on affinity alone.
            #
            # The two host exclusions are KEPT -- not capacity tuning. Both have broken egress/S3
            # connectivity, where pods schedule and then hang on the rclone localize with no
            # progress, which an indexed fan-out cannot absorb.
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hpc-nrp-g1.nmsu.edu
                - service-02.nrp.mghpcc.org
