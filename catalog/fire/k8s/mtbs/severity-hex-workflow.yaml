    \        - name: AWS_ACCESS_KEY_ID\n          valueFrom:\n            secretKeyRef:\n            \
    \  name: aws\n              key: AWS_ACCESS_KEY_ID\n        - name: AWS_SECRET_ACCESS_KEY\n      \
    \    valueFrom:\n            secretKeyRef:\n              name: aws\n              key: AWS_SECRET_ACCESS_KEY\n\
    \        - name: AWS_S3_ENDPOINT\n          value: rook-ceph-rgw-nautiluss3.rook\n        - name:\
    \ AWS_PUBLIC_ENDPOINT\n          value: s3-west.nrp-nautilus.io\n        - name: AWS_HTTPS\n     \
    \     value: 'false'\n        - name: AWS_VIRTUAL_HOSTING\n          value: 'FALSE'\n        - name:\
    \ GDAL_DATA\n          value: /usr/share/gdal\n        - name: PYTHONPATH\n          value: /usr/lib/python3/dist-packages\n\
    \        - name: CNG_HEX_WORKERS\n          value: '8'\n        volumeMounts:\n        # The tool\
    \ localizes the COG with rclone before hexing; without this mount the job fails.\n        - name:\
    \ rclone-config\n          mountPath: /root/.config/rclone\n          readOnly: true\n        command:\n\
    \        - bash\n        - -c\n        - |-\n          set -e\n          YEARS=(1984 1985 1986 1987\
    \ 1988 1989 1990 1991 1992 1993 1994 1995 1996 1997 1998 1999 2000 2001 2002 2003 2005 2006 2007 2008\
    \ 2009 2010 2011 2012 2013 2014 2015 2016 2018 2019 2020 2021 2022 2023 2024)\n          H0S=(12 14\
    \ 20 50 71 78)\n          IDX=${JOB_COMPLETION_INDEX}\n          Y=${YEARS[$(( IDX / ${#H0S[@]} ))]}\n\
    \          H0=${H0S[$(( IDX % ${#H0S[@]} ))]}\n          echo \"=== MTBS severity conus $Y res-10\
    \ mode reducer, h0-index $H0 (global idx $IDX) ===\"\n          cng-datasets raster \\\n         \
    \   --input \"s3://public-fire/mtbs-severity-1984-2024-conus/mtbs-severity-conus-${Y}-cog.tif\" \\\
    \n            --output-parquet \"s3://public-fire/mtbs-severity-1984-2024-conus/hex/year=${Y}/\" \\\
    \n            --h0-index ${H0} --resolution 10 --parent-resolutions 9,8,0 \\\n            --value-column\
    \ severity --hex-resampling mode --nodata \"0\"\n        resources:\n          # NLCD's res-10 CONUS\
    \ hex measured a 105-141Gi peak; 192Gi covers it with margin and still\n          # fits every 256Gi\
    \ node (a 256Gi request barely fits allocatable -> chronic\n          # FailedScheduling). Cell enumeration,\
    \ not data volume, sets this -- MTBS being sparse\n          # does not make it cheaper.\n       \
    \   requests:\n            cpu: '8'\n            memory: 192Gi\n            ephemeral-storage: 40Gi\n\
    \          limits:\n            cpu: '8'\n            memory: 192Gi\n            ephemeral-storage:\
    \ 40Gi\n      volumes:\n      - name: rclone-config\n        secret:\n          secretName: rclone-config\n\
    \      affinity:\n        nodeAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n\
    \            nodeSelectorTerms:\n            - matchExpressions:\n              - key: feature.node.kubernetes.io/pci-10de.present\n\
    \                operator: NotIn\n                values:\n                - 'true'\n            \
    \  - key: kubernetes.io/hostname\n                operator: NotIn\n                values:\n     \
    \           - hpc-nrp-g1.nmsu.edu\n                - service-02.nrp.mghpcc.org\n"
kind: ConfigMap
metadata:
  name: mtbs-severity-hex-jobs
  namespace: geo-workflows
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mtbs-severity-hex-workflow
  namespace: geo-workflows
  labels:
    k8s-app: mtbs-severity-hex-workflow
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        k8s-app: mtbs-severity-hex-workflow
    spec:
      restartPolicy: Never
      serviceAccountName: cng-datasets-workflow
      containers:
      - name: orchestrator
        image: bitnami/kubectl:latest
        command:
        - bash
        - -c
        - "set -u\n# Orchestrate the remaining MTBS severity hex jobs strictly one at a time, in-cluster, so the run\n# does not depend on any laptop session staying alive -- which is exactly how the first attempt at\n# this chain was lost after the Alaska mode job finished. Same pattern as the generated vector\n# workflow.yaml: kubectl in a pod, job specs mounted from a ConfigMap.\n#\n# A plain poll loop rather than `kubectl wait`, deliberately: `kubectl wait --for=condition=complete`\n# gives no way to notice the Failed condition without racing a second wait, and these jobs are\n# hardened so that a partial indexed run surfaces as Failed. Polling both conditions is unambiguous.\nN=geo-workflows\n\nrun_job () {\n  local J=$1\n  echo \"=== $(date -u +%FT%TZ) applying $J\"\n  kubectl apply -n $N -f /yamls/$J.yaml || return 1\n  while true; do\n    local C F\n    C=$(kubectl -n $N get job/$J -o jsonpath='{.status.conditions[?(@.type==\"Complete\")].status}' 2>/dev/null || true)\n    F=$(kubectl -n $N get job/$J -o jsonpath='{.status.conditions[?(@.type==\"Failed\")].status}' 2>/dev/null || true)\n    [ -n \"$C$F\" ] && break\n    sleep 60\n  done\n  local FI\n  FI=$(kubectl -n $N get job/$J -o jsonpath='{.status.failedIndexes}' 2>/dev/null || true)\n  kubectl -n $N get job/$J\n  if [ \"$(kubectl -n $N get job/$J -o jsonpath='{.status.conditions[?(@.type==\"Complete\")].status}')\" != \"True\" ] || [ -n \"$FI\" ]; then\n    echo \"ABORT: $J did not complete clean (failedIndexes=[$FI])\"\n    return 1\n  fi\n  echo \"=== $(date -u +%FT%TZ) $J complete, no failed indexes\"\n}\n\nrun_job mtbs-severity-ak-hex-fractions || exit 1\nrun_job mtbs-severity-conus-hex || exit 1\nrun_job mtbs-severity-conus-hex-fractions || exit 1\n\necho \"=== $(date -u +%FT%TZ) all remaining severity hex jobs complete\"\n"
        volumeMounts:
        - name: yamls
          mountPath: /yamls
        resources:
          # ⚠️ ephemeral-storage is declared DELIBERATELY, and its absence cost this campaign a
          # near-miss. On the 2026-08-25 run the orchestrator was EVICTED mid-chain:
          #   "The node was low on resource: ephemeral-storage ... Container orchestrator was
          #    using 2568Ki, request is 0, has larger consumption of ephemeral-storage"
          # A container that requests 0 of a resource is the FIRST thing the kubelet evicts when
          # that resource runs short, however little it is actually using -- and with
          # backoffLimit: 0 (correct here, so the chain is never re-run from the top) an eviction
          # is terminal. It happened to be evicted AFTER launching the final child job, so that
          # job ran to completion on its own and nothing was lost. Evicted one job earlier and the
          # chain would have stopped silently, with every child job reporting success.
          requests:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 1Gi
      volumes:
      - name: yamls
        configMap:
          name: mtbs-severity-hex-jobs
