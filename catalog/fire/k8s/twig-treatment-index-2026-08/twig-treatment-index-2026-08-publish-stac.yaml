# Publish the STAC collection from gen-stac.py (#603).
#   kubectl -n geo-workflows create configmap twig-stac-src --from-file=gen-stac.py \
#     --from-file=vals.py --from-file=activity_values.txt --dry-run=client -o yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: twig-treatment-index-2026-08-publish-stac
  namespace: geo-workflows
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          keep_styles() {  # #881: replacing a live collection must not drop its default style assets or renders
            case "$2" in *.json) ;; *) return 0 ;; esac
            mkdir -p /tmp/keep-styles
            rclone cat "$2" > /tmp/keep-styles/live.json 2>/dev/null || return 0
            python3 -c '
          import json, sys
          try:
              new = json.load(open(sys.argv[1])); live = json.load(open(sys.argv[2]))
          except Exception:
              sys.exit(0)
          kept = {k: a for k, a in live.get("assets", {}).items()
                  if "style" in (a.get("roles") or []) and k not in new.setdefault("assets", {})}
          new["assets"].update(kept)
          renders = {k: v for k, v in live.get("renders", {}).items() if k not in new.get("renders", {})}
          if renders:
              new.setdefault("renders", {}).update(renders)
          for e in live.get("stac_extensions", []):
              if "/render/" in e and e not in new.setdefault("stac_extensions", []):
                  new["stac_extensions"].append(e)
          if kept or renders:
              json.dump(new, open(sys.argv[1], "w"), indent=2)
              print(f"  kept {len(kept)} style asset(s) and {len(renders)} render(s) from the live collection")
          ' "$1" /tmp/keep-styles/live.json
          }
          mkdir -p /tmp/src /tmp/twig
          cp /src/* /tmp/src/
          python3 /tmp/src/gen-stac.py
          keep_styles /tmp/twig/stac-collection.json nrp:public-fire/twig-treatment-index-2026-08/stac-collection.json
          rclone copyto /tmp/twig/stac-collection.json \
            nrp:public-fire/twig-treatment-index-2026-08/stac-collection.json
          rclone lsl nrp:public-fire/twig-treatment-index-2026-08/stac-collection.json
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: src, mountPath: /src, readOnly: true}
        resources:
          requests: {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
          limits:   {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: src, configMap: {name: twig-stac-src}}
