# Stage raw TWIG treatment index from the ReSHAPE ArcGIS FeatureServer to S3.
#
# TWIG (Treatment and Wildfire Interagency Geodatabase, SWERI ReSHAPE) is the interagency
# counterpart to our USFS-only `facts-common-attributes-2026-06`: FACTS *plus* NFPORS, NASF
# and IFPRS. 1,491,072 treatment polygons, WGS84, 25 fields.
#
# The service exposes `Query` only -- no Extract -- so it has to be paged. Two notes on how:
#
#   1. We page by **objectid range**, not `resultOffset`. `objectid` runs 1..1,491,072
#      contiguously (max == count, verified 2026-09-16), so ranges are stable against
#      concurrent edits on a live service and are trivially parallelizable. Offset paging
#      would silently skip or duplicate rows if upstream edits land mid-scrape.
#   2. `f=geojson` returns ready-made GeoJSON, so no esri-rings -> GeoJSON conversion.
#      Dates come back as epoch **milliseconds** and are converted to ISO `YYYY-MM-DD` here.
#
# ⚠️ Dates are dirty upstream and are deliberately NOT cleaned: 62,519 rows carry a future
# `treatment_date`, 12 predate 1980, and the raw range spans 1201-2926. They are preserved
# as-is so downstream can apply an explicit sane-date window and *report* the discarded
# count. Silently dropping them here would destroy that number. Python's datetime covers
# year 1..9999, so every upstream value round-trips.
#
# Output is FlatGeobuf, not one giant GeoJSON FeatureCollection: 1.49M polygons (some with
# 292 rings) would be a ~10 GB in-RAM document to build and re-parse. FGB streams both ways
# and `cng-convert-to-parquet` accepts it.
#
#   Source:  https://gis.reshapewildfire.org/arcgis/rest/services/Hosted/Treatment_Index_View/FeatureServer/0
#   Docs:    https://reshapewildfire.org/resources/twig-data-resources/
#   Licence: CC-BY-4.0 (publisher's data-resources page; the service itself publishes none)
#   Issue:   https://github.com/boettiger-lab/data-workflows/issues/603
apiVersion: batch/v1
kind: Job
metadata:
  name: twig-treatment-index-2026-08-stage-raw
  labels:
    k8s-app: twig-treatment-index-2026-08-stage-raw
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: twig-treatment-index-2026-08-stage-raw
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 21600
      # Cluster DNS on some nodes intermittently fails to resolve external hosts. Append
      # public resolvers as a fallback; cluster DNS is still tried first so the internal
      # rook-ceph-rgw-nautiluss3.rook rclone endpoint keeps resolving.
      dnsConfig:
        nameservers:
        - 8.8.8.8
        - 1.1.1.1
      containers:
      - name: stage-raw
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, threading, time, urllib.parse, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timedelta, timezone

          BASE = ("https://gis.reshapewildfire.org/arcgis/rest/services/Hosted/"
                  "Treatment_Index_View/FeatureServer/0/query")
          PAGE = 1000          # service maxRecordCount
          WORKERS = 6          # polite concurrency against a live public service
          UA = {"User-Agent": "data-workflows/1.0 (boettiger-lab; issue 603)"}
          EPOCH = datetime(1970, 1, 1, tzinfo=timezone.utc)
          OUT_NDJSON = "/tmp/twig.geojsonl"
          OUT_FGB = "/tmp/twig-treatment-index-2026-08.fgb"

          def get(params, tries=6):
              url = BASE + "?" + urllib.parse.urlencode(params)
              for attempt in range(1, tries + 1):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=300) as r:
                          return json.load(r)
                  except (urllib.error.HTTPError, urllib.error.URLError,
                          TimeoutError, json.JSONDecodeError) as e:
                      if attempt == tries:
                          raise
                      wait = min(60, 2 ** attempt)
                      print(f"  retry {attempt}/{tries} after {type(e).__name__} ({e}); sleep {wait}s", flush=True)
                      time.sleep(wait)

          def count_now():
              return get({"where": "1=1", "returnCountOnly": "true", "f": "json"})["count"]

          # --- reconciliation, opening reading -------------------------------------------
          count_before = count_now()
          started = datetime.now(timezone.utc).isoformat()
          print(f"returnCountOnly at start: {count_before}", flush=True)

          oid = get({"where": "1=1", "f": "json",
                     "outStatistics": json.dumps([
                         {"statisticType": "min", "onStatisticField": "objectid",
                          "outStatisticFieldName": "mn"},
                         {"statisticType": "max", "onStatisticField": "objectid",
                          "outStatisticFieldName": "mx"}])})["features"][0]["attributes"]
          lo, hi = int(oid["mn"]), int(oid["mx"])
          print(f"objectid range: {lo}..{hi}", flush=True)

          def ms_to_iso(v):
              # epoch ms -> ISO date. Upstream values span years 1201-2926; all are kept.
              if v is None:
                  return None
              return (EPOCH + timedelta(milliseconds=v)).strftime("%Y-%m-%d")

          DATE_FIELDS = ("treatment_date", "date_current")

          lock = threading.Lock()
          fh = open(OUT_NDJSON, "w")
          written = 0
          seen_oids = set()

          def do_range(a, b):
              """Fetch objectid in [a, b] -- one service page."""
              fc = get({"where": f"objectid>={a} AND objectid<={b}",
                        "outFields": "*", "outSR": "4326", "f": "geojson",
                        "returnGeometry": "true"})
              feats = fc.get("features") or []
              lines, oids = [], []
              for ft in feats:
                  p = ft.get("properties") or {}
                  for d in DATE_FIELDS:
                      p[d] = ms_to_iso(p.get(d))
                  ft["properties"] = p
                  oids.append(p.get("objectid"))
                  # geometry can be null on a malformed record; keep the row, log it
                  lines.append(json.dumps(ft, separators=(",", ":")))
              return lines, oids

          ranges = [(a, min(a + PAGE - 1, hi)) for a in range(lo, hi + 1, PAGE)]
          print(f"{len(ranges)} ranges of {PAGE}", flush=True)

          t0 = time.time()
          with ThreadPoolExecutor(max_workers=WORKERS) as ex:
              futs = {ex.submit(do_range, a, b): (a, b) for a, b in ranges}
              done = 0
              for fut in as_completed(futs):
                  a, b = futs[fut]
                  lines, oids = fut.result()
                  with lock:
                      for ln in lines:
                          fh.write(ln + "\n")
                      written += len(lines)
                      seen_oids.update(oids)
                  done += 1
                  if done % 100 == 0 or done == len(ranges):
                      el = time.time() - t0
                      print(f"  {done}/{len(ranges)} ranges, {written} features, {el:.0f}s", flush=True)
          fh.close()

          # --- reconciliation, closing reading -------------------------------------------
          count_after = count_now()
          finished = datetime.now(timezone.utc).isoformat()
          print(f"returnCountOnly at end:   {count_after}", flush=True)
          print(f"features written:         {written}", flush=True)
          print(f"distinct objectid:        {len(seen_oids)}", flush=True)

          # objectid ranges tile [lo,hi] exactly, so a gap means the service dropped rows.
          if written != len(seen_oids):
              raise SystemExit(f"FAIL: {written} rows but {len(seen_oids)} distinct objectid -- duplicates")
          if written != count_before or written != count_after:
              raise SystemExit(
                  f"FAIL: paged {written} but service reported {count_before} (start) / "
                  f"{count_after} (end). Re-run; do not publish a short scrape.")
          print("reconciled: paged count == returnCountOnly at both ends", flush=True)

          manifest = {
              "dataset": "twig-treatment-index-2026-08",
              "issue": "https://github.com/boettiger-lab/data-workflows/issues/603",
              "service": BASE.rsplit("/query", 1)[0],
              "landing_page": "https://reshapewildfire.org/resources/twig-data-resources/",
              "license": "CC-BY-4.0",
              "fetch_started_utc": started,
              "fetch_finished_utc": finished,
              "access_date": started[:10],
              "returnCountOnly_at_start": count_before,
              "returnCountOnly_at_end": count_after,
              "features_written": written,
              "distinct_objectid": len(seen_oids),
              "objectid_min": lo,
              "objectid_max": hi,
              "page_size": PAGE,
              "pages": len(ranges),
          }
          with open("/tmp/twig-fetch-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2), flush=True)
          PY

          ls -la /tmp/twig.geojsonl
          df -h /tmp | tail -1

          # NDJSON -> FlatGeobuf. GeoJSONSeq streams, so neither side is held in RAM.
          ogr2ogr -f FlatGeobuf /tmp/twig-treatment-index-2026-08.fgb \
            /tmp/twig.geojsonl \
            -nln twig_treatment_index \
            -a_srs EPSG:4326 \
            -nlt PROMOTE_TO_MULTI \
            --config OGR_ORGANIZE_POLYGONS ONLY_CCW
          rm -f /tmp/twig.geojsonl

          ls -la /tmp/twig-treatment-index-2026-08.fgb
          ogrinfo -so /tmp/twig-treatment-index-2026-08.fgb twig_treatment_index

          # The staged raw + its checksum ARE the provenance: the service is live and
          # overwrites in place, so this edition is not otherwise recoverable (AGENTS.md
          # Step 1b). Recompute from the object, never transcribe.
          sha256sum /tmp/twig-treatment-index-2026-08.fgb | tee /tmp/twig-treatment-index-2026-08.fgb.sha256
          python3 - <<'PY'
          import json
          m = json.load(open("/tmp/twig-fetch-manifest.json"))
          line = open("/tmp/twig-treatment-index-2026-08.fgb.sha256").read().split()[0]
          import os
          m["raw_object"] = "s3://public-fire/raw/twig-treatment-index-2026-08.fgb"
          m["raw_sha256"] = line
          m["raw_bytes"] = os.path.getsize("/tmp/twig-treatment-index-2026-08.fgb")
          json.dump(m, open("/tmp/twig-fetch-manifest.json", "w"), indent=2)
          print(json.dumps(m, indent=2))
          PY

          rclone copyto /tmp/twig-treatment-index-2026-08.fgb \
            nrp:public-fire/raw/twig-treatment-index-2026-08.fgb --s3-no-check-bucket
          rclone copyto /tmp/twig-fetch-manifest.json \
            nrp:public-fire/raw/twig-treatment-index-2026-08-fetch-manifest.json --s3-no-check-bucket
          echo "staged raw -> s3://public-fire/raw/twig-treatment-index-2026-08.fgb"
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 50Gi
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 50Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      # No priorityClassName: this pod runs for hours, and `opportunistic` (-2000000000)
      # makes a long pod a preemption magnet (skill `pod-preemption`). Default priority 0
      # is admitted in geo-workflows.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
