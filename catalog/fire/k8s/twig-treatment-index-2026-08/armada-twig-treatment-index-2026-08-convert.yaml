queue: geo-workflows
jobSetId: twig-treatment-index-2026-08-convert
jobs:
- namespace: geo-workflows
  priorityClassName: armada-default
  podSpec:
    restartPolicy: Never
    containers:
    - name: convert-task
      image: ghcr.io/boettiger-lab/datasets:latest
      imagePullPolicy: Always
      env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: aws
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: aws
            key: AWS_SECRET_ACCESS_KEY
      - name: AWS_S3_ENDPOINT
        value: rook-ceph-rgw-nautiluss3.rook
      - name: AWS_PUBLIC_ENDPOINT
        value: s3-west.nrp-nautilus.io
      - name: AWS_HTTPS
        value: 'false'
      - name: AWS_VIRTUAL_HOSTING
        value: 'FALSE'
      - name: BUCKET
        value: public-fire
      volumeMounts:
      - name: rclone-config
        mountPath: /root/.config/rclone
        readOnly: true
      command:
      - bash
      - -c
      - |
        set -e
        cng-convert-to-parquet \
          s3://public-fire/raw/twig-treatment-index-2026-08.fgb \
          s3://public-fire/twig-treatment-index-2026-08.parquet \
          --row-group-size 2000 \
          --expect-features 1491072
      resources:
        requests:
          cpu: '4'
          memory: 8Gi
        limits:
          cpu: '4'
          memory: 8Gi
    volumes:
    - name: rclone-config
      secret:
        secretName: rclone-config
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: feature.node.kubernetes.io/pci-10de.present
              operator: NotIn
              values:
              - 'true'
