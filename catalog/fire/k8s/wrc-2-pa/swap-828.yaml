# HAND-ROLLED: the generator has no step that replaces a live layer from a staged build (#828).
# Replaces the live HURisk `mean` COG + hex with the staged `sum` build from staging/828/, after
# the gates in BUILD.md (#828) pass. Per domain: the COG is streamed over the live key (rclone's
# server-side copy of a >5 GiB multipart object stalls on Ceph, hence --disable copy), each staged
# hex partition overwrites its live key one object at a time, and only then is any live partition
# the staged build did not write removed -- so a pod dying mid-swap leaves a mixture, never an
# empty prefix. staging/828/ is kept until the collections are republished and checked.
#   kubectl create -f catalog/fire/k8s/wrc-2-pa/swap-828.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: wrc-2-pa-hurisk-swap-828
  namespace: geo-workflows
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3600
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: swap
        image: ghcr.io/boettiger-lab/datasets@sha256:246dc706ea34728a75c0bf1bc8589fd8f5c2e6526876f6c7192660a272cec1b3
        resources:
          requests: {cpu: '2', memory: 2Gi}
          limits: {cpu: '2', memory: 2Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 6 --low-level-retries 20 --disable copy"
          for d in conus ak; do
            ds=wrc-2-pa-hurisk-$d
            st=nrp:public-fire/staging/828
            rclone lsf "$st/$ds-cog.tif" | grep -q . || { echo "no staged COG for $ds"; exit 1; }
            n=$(rclone lsf -R --files-only "$st/$ds/hex/" | grep -c 'data_0.parquet$' || true)
            [ "$n" -gt 0 ] || { echo "no staged hex for $ds"; exit 1; }
            rclone copyto "$st/$ds-cog.tif" "nrp:public-fire/$ds-cog.tif" $R
            rclone copy "$st/$ds/hex/" "nrp:public-fire/$ds/hex/" $R
            rclone lsf -R --files-only "$st/$ds/hex/" | sort > /tmp/staged.txt
            rclone lsf -R --files-only "nrp:public-fire/$ds/hex/" | sort > /tmp/live.txt
            comm -13 /tmp/staged.txt /tmp/live.txt | while read -r f; do
              echo "remove stale $ds/hex/$f"; rclone deletefile "nrp:public-fire/$ds/hex/$f"
            done
            echo "$ds: COG + $n hex partitions swapped"
          done
          echo DONE
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
