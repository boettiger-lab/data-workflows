  ics-209-plus-1999-2020-wf-incidents-pmtiles.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ics-209-plus-1999-2020-wf-incidents-pmtiles
      labels:
        k8s-app: ics-209-plus-1999-2020-wf-incidents-pmtiles
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            k8s-app: ics-209-plus-1999-2020-wf-incidents-pmtiles
        spec:
          restartPolicy: Never
          containers:
          - name: pmtiles-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-fire
            - name: DATASET
              value: wf-incidents
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              # Use optimized GeoParquet (has ID column) from convert job
              # GDAL can read parquet via vsicurl
              # -lco AUTODETECT_JSON_STRINGS=NO is REQUIRED here (issue #636).
              # SUP_SERIES is a VARCHAR carrying a pandas-stringified list, e.g. "[nan, nan, 0.0]".
              # Since GDAL 3.7 the GeoJSON writers auto-detect a JSON-looking string and re-emit it
              # as a real JSON array, using a lenient parser that accepts nan and normalises it to a
              # bare NaN token. Bare NaN is not legal JSON, so tippecanoe rejects line 1 outright and
              # exits "Did not read any valid geometries" with 0 features written — 13,058 of the
              # 34,622 records carry it. Disabling the autodetect keeps the value a quoted string,
              # which is what the GeoParquet holds anyway.
              ogr2ogr -wrapdateline -datelineoffset 15 -lco AUTODETECT_JSON_STRINGS=NO \
                -f GeoJSONSeq /tmp/$DATASET.geojsonl \
                /vsicurl/https://s3-west.nrp-nautilus.io/public-fire/ics-209-plus-1999-2020/wf-incidents.parquet -progress

              # Gate: a bare NaN/Infinity token anywhere means the autodetect fix did not take.
              if grep -qE '(^|[^"A-Za-z])-?(NaN|Infinity)([^"A-Za-z]|$)' /tmp/$DATASET.geojsonl; then
                echo "FATAL: non-JSON float literal in GeoJSONSeq output; tippecanoe would drop everything." >&2
                grep -oE '.{60}(NaN|Infinity).{10}' /tmp/$DATASET.geojsonl | head -3 >&2
                exit 1
              fi

              # Generate PMTiles from GeoJSONSeq
              # TIPPECANOE_MAX_THREADS must be a power of 2; Kubernetes nodes can expose
              # non-power-of-2 logical CPU counts which triggers an internal assertion
              # failure "N shards not a power of 2" (felt/tippecanoe#216).
              # Round detected CPU count down to nearest power of 2 to preserve I/O parallelism.
              # Must be `export`ed: tippecanoe is a child process and reads this from the
              # environment, not the shell. A plain assignment is invisible to it, so it
              # falls back to the raw (non-power-of-2) CPU count and crashes (issue #77).
              export TIPPECANOE_MAX_THREADS=$(python3 -c "import os; n=os.cpu_count() or 1; print(1<<(n.bit_length()-1))")
              tippecanoe -o /tmp/$DATASET.pmtiles -l $DATASET --drop-densest-as-needed --extend-zooms-if-still-dropping --force /tmp/$DATASET.geojsonl

              # Upload to S3 using rclone
              rclone copy /tmp/$DATASET.pmtiles nrp:public-fire/ics-209-plus-1999-2020/
              rm /tmp/$DATASET.geojsonl /tmp/$DATASET.pmtiles
            resources:
              requests:
                cpu: '4'
                memory: 8Gi
              limits:
                cpu: '4'
                memory: 8Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
