# Reproject the staged WRC v2 source rasters to EPSG:4326 COGs on NRP S3.
#
# ⛔ THIS STEP IS NOT OPTIONAL AND ITS ABSENCE FAILS SILENTLY.
# `cng-datasets raster` hands H3 cell polygons, in degrees, to exactextract. Against a source in
# Albers metres every cell lands within ~100 m of the projection origin -- EPSG:5070 (0,0) is
# lon -96 / lat 23, in the Gulf of Mexico -- so every cell reads nodata, ZERO rows are written and
# the Job exits 0. Measured on #586. Structural checks all pass on an empty build; only the h0
# coverage gate catches it. Both WRC domains are projected (CONUS EPSG:5070, Alaska EPSG:3338), so
# both need this.
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# ⚠️ WHY S3 IS THE SCRATCH SPACE AND THE `rechunk-scratch` PVC IS NOT — MEASURED, NOT ASSUMED
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# The obvious design for a ~30 GB working set is the cephfs PVC, since raw + warped intermediate +
# COG is ~84 GB and the ephemeral cap is 50Gi. That was tried first and is WRONG here. Measured on
# the same rasters, same cluster, within the same hour:
#
#   S3 -> local ephemeral (/tmp), rclone            375 MiB/s     (RPS_CONUS, 25.5 GiB)
#   S3 -> rechunk-scratch PVC (rook-cephfs)       1.4-6.5 MiB/s   (RPS_CONUS and RPS_AK)
#
# That is 60-250x slower, turning a 75-second localize into a 1-hour one before any GDAL work
# starts. The `raster-hexing` skill's note that "a handful of large-file opens is fine on cephfs"
# holds for OPEN latency; it does not promise write THROUGHPUT, and throughput is what a 30 GB
# sequential write needs.
#
# So: keep every byte on local ephemeral, and use S3 itself as the scratch tier — it is the
# fastest storage available to these pods. The working set is kept under the 50Gi cap by never
# holding two large files at once:
#
#   1. gdalwarp reads the source over /vsis3            -> local: warp only  (~30 GB)
#   2. upload the warped intermediate, delete it locally-> local: 0
#   3. gdal_translate -of COG reads it back over /vsis3 -> local: COG only   (~30 GB)
#   4. upload the COG, delete the S3 intermediate       -> local: 0
#
# ⚠️ This is a deliberate, narrow exception to the raster-hexing rule "never /vsis3 for GDAL".
# That rule exists because localizing is more reliable for the 122-pod hex step, where a flaky
# node retries cheaply. Here /vsis3 is the only way to stay inside the ephemeral cap, so it is
# hardened instead of avoided: an explicit `gdalinfo` gate over /vsis3 fails the pod immediately
# if the endpoint misbehaves, retries and a large read cache are configured below, and the source
# being striped (1 row per block) means the warp reads it near-sequentially, which is the access
# pattern /vsis3 handles best. The COG step reads a TILED intermediate, so its multi-pass overview
# reads are efficient too.
#
# ⚠️ RESAMPLING IS `near`, DELIBERATELY.
# The warp is ~1:1 in ground resolution (30 m -> ~0.00034 deg at 38N), so interpolation buys no
# accuracy, while `bilinear` would smear the -9999 sentinel across every nodata boundary -- the
# exact leak the downstream plausibility bound exists to catch. The real area weighting happens in
# exactextract when hexing. #586 used `near` for both its products for the same reason.
#
# ⚠️ COGs STAY Float32 -- no scale/offset integer encoding.
# These layers have huge dynamic range (RPS spans ~1e-23 to 13.2; the published 1st-percentile
# CONUS RPS is 2.4e-4). A linear Int16 + scale encoding would annihilate the low end and break
# agreement with the source's published percentile table, so the size win is not available here.
#
# Alaska is clipped to -180..-129 lon. Its EPSG:3338 grid spans the antimeridian, and a naive warp
# to EPSG:4326 yields a ~360-deg-wide, almost entirely nodata raster sitting on the dateline seam.
# The clip drops the far-western Aleutians (~157E..180), which hold NO National Forest System land
# -- the Alaska units are the Tongass and Chugach, far to the east -- so nothing relevant to the
# roadless question is lost. Recorded in STAC.
#
# RPS-FIRST: indexes 0 and 1 are RPS_CONUS and RPS_AK. To build only those, apply with
# `sed 's/^  completions: 8$/  completions: 2/'` -- the index map below is unchanged.
apiVersion: batch/v1
kind: Job
metadata:
  name: wrc-2-make-cogs
  namespace: geo-workflows
  labels:
    k8s-app: wrc-2-make-cogs
spec:
  completions: 8
  parallelism: 2
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: wrc-2-make-cogs
    spec:
      restartPolicy: Never
      # ClusterFirst is required: both rclone's nrp: remote and GDAL's /vsis3 resolve the INTERNAL
      # endpoint rook-ceph-rgw-nautiluss3.rook, which only cluster DNS can resolve.
      dnsPolicy: ClusterFirst
      # A CONUS warp over /vsis3 plus the COG pass is a multi-hour pod; bound a true node hang.
      activeDeadlineSeconds: 28800
      containers:
      - name: make-cog
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        # GDAL reads these for /vsis3 as well as rclone for nrp:.
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        # ⛔ Do NOT set PROJ_DATA / PROJ_LIB. The image ships 8 proj.db at differing layout
        # versions and a stale pick breaks -t_srs EPSG:4326 non-deterministically (#453).
        # GDAL's own default resolves the matching one correctly.
        - name: GDAL_CACHEMAX
          value: '8192'
        - name: GDAL_NUM_THREADS
          value: ALL_CPUS
        # /vsis3 hardening: don't list the bucket on open, cache reads, coalesce the striped
        # source's many small row reads into 16 MB range requests, and retry transient 5xx.
        - name: GDAL_DISABLE_READDIR_ON_OPEN
          value: EMPTY_DIR
        - name: VSI_CACHE
          value: 'TRUE'
        - name: VSI_CACHE_SIZE
          value: '1000000000'
        - name: CPL_VSIL_CURL_CHUNK_SIZE
          value: '16777216'
        - name: GDAL_HTTP_MAX_RETRY
          value: '5'
        - name: GDAL_HTTP_RETRY_DELAY
          value: '2'
        - name: TMPDIR
          value: /tmp
        - name: CPL_TMPDIR
          value: /tmp
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail

          # Same index order as wrc-2-stage-raw.yaml.
          SRC=(RPS_CONUS RPS_AK BP_CONUS BP_AK CFL_CONUS CFL_AK Exposure_CONUS Exposure_AK)
          OUT=(wrc-2-rps-conus wrc-2-rps-ak wrc-2-bp-conus wrc-2-bp-ak wrc-2-cfl-conus wrc-2-cfl-ak wrc-2-exposure-conus wrc-2-exposure-ak)
          # Alaska is clipped east of the antimeridian; CONUS needs no clip.
          TE=("" "-te -180 48.8 -129.0 71.6" "" "-te -180 48.8 -129.0 71.6" "" "-te -180 48.8 -129.0 71.6" "" "-te -180 48.8 -129.0 71.6")
          ND=-9999

          i=${JOB_COMPLETION_INDEX}
          s=${SRC[$i]}; o=${OUT[$i]}; te=${TE[$i]}
          RAW="/vsis3/public-fire/raw/wrc-2/${s}.tif"
          WARP_S3="nrp:public-fire/tmp/wrc-2/${o}-warp.tif"
          WARP_VSI="/vsis3/public-fire/tmp/wrc-2/${o}-warp.tif"

          echo "=== [$i] $s -> $o-cog.tif  (nodata $ND) ${te:+clip: $te} ==="
          df -h /tmp | tail -1

          # Gate: fail immediately and loudly if /vsis3 cannot read the source, rather than
          # discovering it mid-warp. This also prints the real CRS/size/nodata for the record.
          echo "--- source over /vsis3 ---"
          gdalinfo "$RAW" > /tmp/src-info.txt
          grep -E '^Size is|ID\["EPSG|Pixel Size|NoData|Type=|Block=' /tmp/src-info.txt | head -20

          # ── 1. warp to EPSG:4326, reading the source over /vsis3 ──────────────────────────────
          # No -tr: let gdalwarp preserve the source ground resolution near the centre of the
          # extent rather than hardcoding a degree value, which would silently rescale the grid.
          echo "--- warping (source streamed from S3, output local) ---"
          time gdalwarp \
            -t_srs EPSG:4326 \
            -r near \
            -srcnodata "$ND" -dstnodata "$ND" \
            $te \
            -multi -wo NUM_THREADS=ALL_CPUS -wm 4096 \
            -co COMPRESS=DEFLATE -co PREDICTOR=3 -co BIGTIFF=YES \
            -co TILED=YES -co BLOCKXSIZE=512 -co BLOCKYSIZE=512 \
            -co NUM_THREADS=ALL_CPUS \
            "$RAW" "/tmp/${o}-warp.tif"

          ls -la "/tmp/${o}-warp.tif"; df -h /tmp | tail -1
          gdalinfo "/tmp/${o}-warp.tif" | grep -E '^Size is|Pixel Size|NoData|Upper Left|Lower Right'

          # ── 2. park the intermediate on S3 and free the disk ─────────────────────────────────
          echo "--- parking warped intermediate on S3 ---"
          rclone copyto "/tmp/${o}-warp.tif" "$WARP_S3" -P --transfers 4 --retries 6
          rm -f "/tmp/${o}-warp.tif"
          df -h /tmp | tail -1

          # ── 3. COG-ify, reading the tiled intermediate back over /vsis3 ──────────────────────
          # AVERAGE overviews are correct for a continuous float layer (NEAREST would be right
          # only for categorical, as in #586's classified WHP).
          echo "--- building COG (intermediate streamed from S3, output local) ---"
          time gdal_translate "$WARP_VSI" "/tmp/${o}-cog.tif" \
            -of COG \
            -co COMPRESS=DEFLATE -co PREDICTOR=3 -co BIGTIFF=YES \
            -co OVERVIEW_RESAMPLING=AVERAGE -co BLOCKSIZE=512 \
            -co NUM_THREADS=ALL_CPUS

          ls -la "/tmp/${o}-cog.tif"; df -h /tmp | tail -1
          echo "--- final COG ---"
          gdalinfo "/tmp/${o}-cog.tif" | grep -E '^Size is|Pixel Size|NoData|Overviews|Block'

          # ── 4. gate: a published all-nodata COG is a real failure mode, and is exactly what
          # hexing the raw Albers source produces. Stats come off the overviews (approx_ok) so
          # this costs seconds rather than a full 30 GB read, and the min/max/mean it prints IS
          # the validation truth the `mean` hex reducer is later checked against.
          # NOTE: gdalinfo -stats caches into a .tif.aux.xml sidecar and reports STALE values on
          # a rebuild; we compute in-process and never write a sidecar.
          python3 - "/tmp/${o}-cog.tif" "$ND" <<'PY'
          import sys
          from osgeo import gdal
          gdal.UseExceptions()

          path, nd = sys.argv[1], float(sys.argv[2])
          ds = gdal.Open(path)
          b = ds.GetRasterBand(1)
          print(f'  size      : {ds.RasterXSize} x {ds.RasterYSize}')
          print(f'  dtype     : {gdal.GetDataTypeName(b.DataType)}')
          print(f'  nodata    : {b.GetNoDataValue()}')
          print(f'  overviews : {b.GetOverviewCount()}')
          if b.GetNoDataValue() is None or abs(b.GetNoDataValue() - nd) > 1e-6:
              print(f'FATAL: COG nodata is {b.GetNoDataValue()}, expected {nd}')
              sys.exit(1)
          try:
              mn, mx, mean, sd = b.ComputeStatistics(True)
          except Exception as exc:
              print(f'FATAL: no valid pixels ({exc})')
              sys.exit(1)
          print(f'  min/max   : {mn} / {mx}')
          print(f'  mean/std  : {mean} / {sd}')
          if mn <= nd + 1e-6:
              print(f'FATAL: nodata sentinel {nd} survived into the valid range')
              sys.exit(1)
          if not (mx > mn):
              print('FATAL: degenerate value range -- COG is constant or empty')
              sys.exit(1)
          PY

          # ── 5. publish, then drop the S3 intermediate ────────────────────────────────────────
          echo "--- uploading COG ---"
          rclone copyto "/tmp/${o}-cog.tif" "nrp:public-fire/${o}-cog.tif" -P --transfers 4 --retries 6
          rclone size "nrp:public-fire/${o}-cog.tif"
          rm -f "/tmp/${o}-cog.tif"

          echo "--- removing warped intermediate from S3 ---"
          rclone deletefile "$WARP_S3" || echo "WARNING: could not delete $WARP_S3 -- remove by hand"
          echo "DONE $o"
        resources:
          # No PVC: everything is on local ephemeral, which measured 375 MiB/s against S3 versus
          # 1.4-6.5 MiB/s for the cephfs PVC. 45Gi holds one ~30 GB file at a time, which is all
          # this design ever needs.
          requests:
            cpu: '8'
            memory: 32Gi
            ephemeral-storage: 45Gi
          limits:
            cpu: '8'
            memory: 32Gi
            ephemeral-storage: 45Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hpc-nrp-g1.nmsu.edu
                - service-02.nrp.mghpcc.org
