# Reproject the six remaining WRC v2 source rasters (BP, CFL, Exposure x CONUS/Alaska) to
# EPSG:4326 COGs on NRP S3. #627, the follow-up to #592's RPS pair.
#
# WHY A SECOND FILE RATHER THAN RE-APPLYING make-cogs.yaml. That file is the record of what
# built the two PUBLISHED RPS COGs, and its indexes 0 and 1 would rebuild and re-upload them.
# Everything structural below is copied from it, and its header remains the authority for the
# three decisions this job inherits unchanged and does not re-argue:
#
#   * the WGS84 COG step is MANDATORY and its absence fails silently (hexing an Albers source
#     writes ZERO rows and exits 0, measured on #586);
#   * EVERYTHING IS LOCAL -- rclone to /tmp, warp local->local, delete the raw, COG-ify, upload.
#     /vsis3 (0.9-2.8 MiB/s) and the rechunk-scratch PVC (1.4-6.5 MiB/s) were both measured
#     against 375 MiB/s for local ephemeral. Do not reintroduce either;
#   * 60Gi ephemeral is a deliberate overage on a LimitRange DEFAULT, not a ceiling, and is
#     earned by deleting the raw before COG-ifying so the peak is max(raw+warp, warp+COG).
#
# ⚠️ `-r near` for all six, and here the argument is the same one make-cogs.yaml makes: the warp
# is ~1:1 in ground resolution, so interpolation buys no accuracy, while `bilinear` would smear
# the -9999 sentinel across every nodata boundary. Unlike the populated-areas publication (#611),
# NOTHING in this publication is an amount integrated over the pixel -- BP is a probability, CFL
# a length, Exposure a normalized index -- so `-r sum` is wrong for all six and the resampler does
# not need to vary by layer. All six are Float32 with nodata -9999, like RPS.
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# TWO THINGS THIS JOB DOES THAT make-cogs.yaml DID NOT, BOTH FIXING A MEASURED #592 DEFECT
# ═══════════════════════════════════════════════════════════════════════════════════════════════
#
# ── 1. STATISTICS ARE EXACT, NOT `ComputeStatistics(True)` ──────────────────────────────────────
# #592's gate called ComputeStatistics(approx_ok=True), which GDAL answers from the
# AVERAGE-resampled overviews. It biased the published max low by 28% (CONUS) and 53% (Alaska)
# and the mean by 3% and 11%, and gen_stac.py feeds facts.json straight into `raster:bands`
# statistics -- so wrong numbers shipped and a separate job had to re-measure them afterwards.
# raster_stats.py below does a full-resolution blockwise pass in float64 with a Kahan-compensated
# sum. It is lifted verbatim from catalog/fire/k8s/wrc-2-pa/make-cogs.yaml (#611) plus the
# footprint accumulator in (2). The figures it prints ARE publishable; nothing is re-measured.
#
# ── 2. EACH COG EMITS ITS OWN VALID-PIXEL TILE FOOTPRINT ────────────────────────────────────────
# This is what lets the hex step fan out over a handful of h0 instead of 122, WITHOUT borrowing
# another product's populated set -- the thing #592 proved unsafe. Its Alaska RPS run populated
# FIVE h0, but the set borrowed from `whp-2023-classified-ak` over the identical clip box has
# THREE; trimming to it would have dropped 4.25 M cells across two partitions, and
# check-hex-coverage.sh could not have caught it (it verifies that expected partitions are
# PRESENT, never that unexpected ones are ABSENT).
#
# So: the full-resolution pass is already reading every pixel for (1). While it does, it records
# which 512x512 tiles contain at least one valid pixel. The union of those tiles is a strict
# SUPERSET of the layer's valid data and tight to ~15 km, so an h0 that misses it provably holds
# no valid pixel and can be dropped as a proof rather than as an inference. Cost is one boolean
# reduce per block, nothing extra read.
#
# Emitted as a `FOOTPRINT <json>` log line; h0_select.py turns it into the H0S list.
#
# ⚠️ ORDER MATTERS: the footprint must come from the COG, not the raw. The raw is Albers.
#
# Apply:
#   kubectl apply -n geo-workflows -f make-cogs-bp-cfl-exposure.yaml
#   kubectl -n geo-workflows logs job/wrc-2-make-cogs-rest --all-containers --prefix | grep -E '^.*(FOOTPRINT|COGSTATS) '
#
# To rebuild ONE layer, set INDEX_OFFSET and completions together (e.g. index 4 alone is
# `completions: 1`, `INDEX_OFFSET: '4'`). Each COG is written to a fixed S3 key, so a rebuild
# replaces it in place.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wrc-2-make-cogs-rest-src
  namespace: geo-workflows
data:
  raster_stats.py: |
    """Exact, blockwise statistics for one raster band, plus its valid-pixel tile footprint.

    Two modes:
      raster_stats.py --assert-nodata <value> <path>
          Read the band's nodata and fail unless it matches <value>. Nothing else.
      raster_stats.py --label <LABEL> [--gate] [--expect-nodata <v>] [--footprint <N>] <path>
          Full-resolution blockwise pass printing count/min/max/mean/std/sum, and with
          --footprint, the set of NxN tiles holding at least one valid pixel.

    ⚠️ WHY NOT ComputeStatistics(True).
    GDAL answers approx_ok from the AVERAGE-resampled overviews. On #592 that biased the
    reported max low by 28% (CONUS) and 53% (Alaska) and the mean by 3% and 11%, and those
    numbers were fed straight into the published raster:bands before being caught. These
    rasters are large but the read is sequential and one pass, so everything printed here is
    publishable as-is.

    Accumulation is float64 and the sum is carried as a Kahan-compensated running total, so a
    ~1.8e10-pixel Float32 raster does not lose the low-order bits.

    THE FOOTPRINT IS A SUPERSET, DELIBERATELY. A tile is reported if ANY pixel in it is valid,
    so the union of reported tiles contains every valid pixel. Downstream may drop an h0 that
    misses the footprint as a proof; it may never treat a reported tile as proof of data.
    """
    import argparse
    import json
    import sys

    import numpy as np
    from osgeo import gdal

    gdal.UseExceptions()


    def band_nodata(path):
        ds = gdal.Open(path)
        return ds.GetRasterBand(1).GetNoDataValue()


    def stats(path, tile=0):
        ds = gdal.Open(path)
        b = ds.GetRasterBand(1)
        nd = b.GetNoDataValue()
        bx, by = b.GetBlockSize()
        # Read whole block-rows: one pass over the file, no random access.
        step = max(by, 1)
        nx, ny = ds.RasterXSize, ds.RasterYSize
        n = 0
        mn, mx = np.inf, -np.inf
        total = 0.0
        comp = 0.0          # Kahan compensation
        sq = 0.0            # sum of squares, for std
        # tile row index -> sorted list of tile column indexes holding a valid pixel
        fp = {}
        ntx = (nx + tile - 1) // tile if tile else 0
        for y in range(0, ny, step):
            rows = min(step, ny - y)
            raw = np.asarray(b.ReadAsArray(0, y, nx, rows), dtype=np.float64)
            if nd is not None and np.isnan(nd):
                valid = ~np.isnan(raw)
            elif nd is not None:
                # Exact equality is right for this publication's -9999 integer-valued sentinel.
                valid = raw != nd
            else:
                valid = np.ones(raw.shape, dtype=bool)
            valid &= np.isfinite(raw)

            if tile:
                # Which tile columns hold a valid pixel, for each tile row this block spans.
                pad = ntx * tile - nx
                for ty in range(y // tile, (y + rows - 1) // tile + 1):
                    y0 = max(ty * tile, y) - y
                    y1 = min((ty + 1) * tile, y + rows) - y
                    sl = valid[y0:y1]
                    if not sl.any():
                        continue
                    cols = sl.any(axis=0)
                    if pad:
                        cols = np.concatenate([cols, np.zeros(pad, dtype=bool)])
                    hit = np.nonzero(cols.reshape(ntx, tile).any(axis=1))[0]
                    if hit.size:
                        fp.setdefault(ty, set()).update(int(c) for c in hit)

            a = raw[valid]
            if a.size == 0:
                continue
            n += a.size
            mn = min(mn, float(a.min()))
            mx = max(mx, float(a.max()))
            s = float(a.sum())
            y_ = s - comp
            t = total + y_
            comp = (t - total) - y_
            total = t
            sq += float((a * a).sum())
        if n == 0:
            return None
        mean = total / n
        var = max(sq / n - mean * mean, 0.0)
        out = dict(count=n, min=mn, max=mx, mean=mean, std=var ** 0.5, sum=total,
                   size=[nx, ny], nodata=nd,
                   dtype=gdal.GetDataTypeName(b.DataType),
                   overviews=b.GetOverviewCount(),
                   gt=list(ds.GetGeoTransform()))
        if tile:
            # Run-length encode each tile row: contiguous columns collapse to [lo, hi]
            # inclusive. A CONUS layer has ~180 tile rows x up to 386 tile columns, which as
            # a list of individual indexes is a ~280 KB log line -- past the point where the
            # container runtime splits lines and a reader has to reassemble them. As ranges
            # it is a few KB, because a raster footprint is contiguous by nature.
            def runs(cols):
                out_, lo = [], None
                prev = None
                for c in sorted(cols):
                    if lo is None:
                        lo = prev = c
                    elif c == prev + 1:
                        prev = c
                    else:
                        out_.append([lo, prev])
                        lo = prev = c
                if lo is not None:
                    out_.append([lo, prev])
                return out_

            out["footprint"] = {"tile": tile,
                                "rows": {str(k): runs(v) for k, v in sorted(fp.items())}}
        return out


    def main():
        p = argparse.ArgumentParser()
        p.add_argument("path")
        p.add_argument("--assert-nodata")
        p.add_argument("--expect-nodata")
        p.add_argument("--label", default="STATS")
        p.add_argument("--dataset", default="")
        p.add_argument("--footprint", type=int, default=0,
                       help="tile size in pixels; 0 disables footprint accumulation")
        p.add_argument("--gate", action="store_true")
        a = p.parse_args()

        if a.assert_nodata is not None:
            got = band_nodata(a.path)
            want = float(a.assert_nodata)
            print(f"  source nodata: {got!r}  expected {want!r}")
            if got is None or not np.isclose(got, want, rtol=1e-12, atol=0.0):
                print(f"FATAL: source nodata is {got!r}, this build was written against {want!r}. "
                      f"The upstream publication changed -- re-measure before proceeding.")
                sys.exit(1)
            print("  nodata OK")
            return

        st = stats(a.path, tile=a.footprint)
        if st is None:
            print(f"FATAL [{a.label}]: no valid pixels -- the raster is empty or all nodata.")
            sys.exit(1)
        fp = st.pop("footprint", None)
        print(f"{a.label}STATS {st!r}", flush=True)
        print(f"  [{a.label}] size {st['size'][0]} x {st['size'][1]}  dtype {st['dtype']}  "
              f"nodata {st['nodata']!r}  overviews {st['overviews']}")
        print(f"  [{a.label}] valid {st['count']:,}  min {st['min']!r}  max {st['max']!r}")
        print(f"  [{a.label}] mean {st['mean']!r}  std {st['std']!r}")
        print(f"  [{a.label}] SUM  {st['sum']!r}")
        if fp is not None:
            ntiles = sum(hi - lo + 1 for v in fp["rows"].values() for lo, hi in v)
            nruns = sum(len(v) for v in fp["rows"].values())
            print(f"  [{a.label}] footprint {ntiles} tiles of {fp['tile']} px over "
                  f"{len(fp['rows'])} tile rows ({nruns} runs)")
            # One line, machine-readable, keyed by dataset: h0_select.py reads this.
            print("FOOTPRINT " + json.dumps(
                {"dataset": a.dataset, "gt": st["gt"], "size": st["size"], **fp},
                separators=(",", ":")), flush=True)

        if a.gate:
            if a.expect_nodata is not None:
                want = float(a.expect_nodata)
                if st["nodata"] is None or not np.isclose(st["nodata"], want):
                    print(f"FATAL: COG nodata is {st['nodata']!r}, expected {want!r}")
                    sys.exit(1)
                if st["min"] <= want + 1e-6:
                    print(f"FATAL: nodata sentinel {want!r} survived into the valid range")
                    sys.exit(1)
            if not st["max"] > st["min"]:
                print("FATAL: degenerate value range -- the COG is constant or empty")
                sys.exit(1)
            if st["min"] < 0:
                print(f"FATAL: negative value {st['min']!r}. Every theme in this publication is "
                      f"non-negative, so this is a sentinel leak, not data.")
                sys.exit(1)
            print("  gate OK")


    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wrc-2-make-cogs-rest
  namespace: geo-workflows
  labels:
    k8s-app: wrc-2-make-cogs-rest
spec:
  completions: 6
  # 3, not #592's 2: three waves of 2 became two waves of 3, and 3 x 60Gi ephemeral on a
  # federation whose nodes hold 869-932 GB is still a small claim.
  parallelism: 3
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        k8s-app: wrc-2-make-cogs-rest
    spec:
      restartPolicy: Never
      # ClusterFirst is required: rclone's nrp: remote resolves the INTERNAL endpoint
      # rook-ceph-rgw-nautiluss3.rook, which only cluster DNS can resolve.
      dnsPolicy: ClusterFirst
      # A CONUS warp + COG + two full-resolution statistics passes is a long pod; bound a true
      # node hang. #592's RPS pair ran 12m22s without the exact passes; BP_CONUS is 26 GB.
      activeDeadlineSeconds: 28800
      containers:
      - name: make-cog
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        # rclone reads these for the nrp: remote.
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        # ⛔ Do NOT set PROJ_DATA / PROJ_LIB. The image ships 8 proj.db at differing layout
        # versions and a stale pick breaks -t_srs EPSG:4326 non-deterministically (#453).
        # GDAL's own default resolves the matching one correctly.
        - name: GDAL_CACHEMAX
          value: '8192'
        - name: GDAL_NUM_THREADS
          value: ALL_CPUS
        # 0 unless rebuilding a single layer; see the header.
        - name: INDEX_OFFSET
          value: '0'
        - name: TMPDIR
          value: /tmp
        - name: CPL_TMPDIR
          value: /tmp
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: src
          mountPath: /src
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail

          # Indexes 2-7 of wrc-2-stage-raw.yaml / make-cogs.yaml, renumbered 0-5 here.
          # 0 and 1 there are RPS_CONUS / RPS_AK, already published under #592.
          SRC=(BP_CONUS BP_AK CFL_CONUS CFL_AK Exposure_CONUS Exposure_AK)
          OUT=(wrc-2-bp-conus wrc-2-bp-ak wrc-2-cfl-conus wrc-2-cfl-ak wrc-2-exposure-conus wrc-2-exposure-ak)
          # Alaska is clipped east of the antimeridian; CONUS needs no clip. Identical box to
          # #592's, so the six new COGs share a grid with the published RPS pair.
          TE=("" "-te -180 48.8 -129.0 71.6" "" "-te -180 48.8 -129.0 71.6" "" "-te -180 48.8 -129.0 71.6")
          ND=-9999
          # 512 px, matching the COG BLOCKSIZE, so a footprint tile is exactly one COG tile.
          TILE=512

          i=$(( ${INDEX_OFFSET:-0} + JOB_COMPLETION_INDEX ))
          s=${SRC[$i]}; o=${OUT[$i]}; te=${TE[$i]}

          echo "=== [$i] $s -> $o-cog.tif  (nodata $ND) ${te:+clip: $te} ==="
          gdalinfo --version

          # ── 1. localize the raw. 375 MiB/s measured; this is the fast path. ──────────────────
          echo "--- localizing raw ---"
          time rclone copyto "nrp:public-fire/raw/wrc-2/${s}.tif" "/tmp/${s}.tif" \
            --transfers 4 --retries 6 --stats-one-line --stats 30s
          ls -la "/tmp/${s}.tif"

          # ── 2. assert the source nodata is what this build was written against ──────────────
          # A tripwire for an upstream re-release, not a formality: the sibling publication
          # (#611) ships EIGHT different sentinels including a positive 255.
          python3 /src/raster_stats.py --assert-nodata "$ND" "/tmp/${s}.tif"

          echo "--- source CRS / size / nodata ---"
          gdalinfo "/tmp/${s}.tif" | grep -E '^Size is|ID\["EPSG|Pixel Size|NoData|Type=|Block=' | head -20

          # ── 3. warp to EPSG:4326, entirely local ────────────────────────────────────────────
          # No -tr: let gdalwarp preserve the source ground resolution near the centre of the
          # extent rather than hardcoding a degree value, which would silently rescale the grid.
          echo "--- warping (all local) ---"
          time gdalwarp \
            -t_srs EPSG:4326 \
            -r near \
            -srcnodata "$ND" -dstnodata "$ND" \
            $te \
            -multi -wo NUM_THREADS=ALL_CPUS -wm 2048 \
            -co COMPRESS=DEFLATE -co PREDICTOR=3 -co BIGTIFF=YES \
            -co TILED=YES -co BLOCKXSIZE=512 -co BLOCKYSIZE=512 \
            -co NUM_THREADS=ALL_CPUS \
            "/tmp/${s}.tif" "/tmp/${o}-warp.tif"

          # ── 4. drop the raw: this is what keeps the peak at ~53 GB rather than ~80 GB ────────
          rm -f "/tmp/${s}.tif"
          ls -la "/tmp/${o}-warp.tif"
          gdalinfo "/tmp/${o}-warp.tif" | grep -E '^Size is|Pixel Size|NoData|Upper Left|Lower Right'

          # ── 5. COG-ify, still local ─────────────────────────────────────────────────────────
          # AVERAGE overviews are correct for a continuous float layer (NEAREST would be right
          # only for categorical, as in #586's classified WHP). Overviews are for display; every
          # published statistic below comes from the full-resolution band.
          echo "--- building COG (all local) ---"
          time gdal_translate "/tmp/${o}-warp.tif" "/tmp/${o}-cog.tif" \
            -of COG \
            -co COMPRESS=DEFLATE -co PREDICTOR=3 -co BIGTIFF=YES \
            -co OVERVIEW_RESAMPLING=AVERAGE -co BLOCKSIZE=512 \
            -co NUM_THREADS=ALL_CPUS
          rm -f "/tmp/${o}-warp.tif"
          ls -la "/tmp/${o}-cog.tif"

          # ── 6. gate + EXACT statistics + valid-pixel tile footprint, in one pass ────────────
          # A published all-nodata COG is a real failure mode and is exactly what hexing the raw
          # Albers source produces. These figures go straight into facts.json and raster:bands;
          # the FOOTPRINT line drives the hex h0 fan-out. See the header for both.
          echo "--- exact COG statistics + footprint + gate ---"
          time python3 /src/raster_stats.py --label COG --gate --expect-nodata "$ND" \
            --footprint "$TILE" --dataset "$o" "/tmp/${o}-cog.tif"

          # ── 7. publish ──────────────────────────────────────────────────────────────────────
          echo "--- uploading COG ---"
          rclone copyto "/tmp/${o}-cog.tif" "nrp:public-fire/${o}-cog.tif" \
            --transfers 4 --retries 6 --stats-one-line --stats 30s
          rclone size "nrp:public-fire/${o}-cog.tif"
          rm -f "/tmp/${o}-cog.tif"
          echo "DONE $o"
        resources:
          # 60Gi: peak is max(raw + warp, warp + COG) ~= 53 GB for BP_CONUS, because the raw is
          # deleted as soon as the warp finishes. A deliberate overage on the 50Gi LimitRange
          # DEFAULT (there is no enforced max); Alaska pods use only ~10 GB of it.
          requests:
            cpu: '8'
            memory: 24Gi
            ephemeral-storage: 60Gi
          limits:
            cpu: '8'
            memory: 24Gi
            ephemeral-storage: 60Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: src
        configMap:
          name: wrc-2-make-cogs-rest-src
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
              # Known-bad egress/S3 hosts: pods schedule but hang on localize.
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hpc-nrp-g1.nmsu.edu
                - service-02.nrp.mghpcc.org
