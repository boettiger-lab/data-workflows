# #735: swap.sh for the very large files (countries 12.8 GB, flood-hazard), run
# in-cluster over the internal endpoint. Set ITEMS to "bucket:key ...".
apiVersion: batch/v1
kind: Job
metadata:
  name: pmtiles-fid-735-swap
  namespace: geo-workflows
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: swap
        image: ghcr.io/boettiger-lab/datasets:latest
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          for it in $ITEMS; do
            b=${it%%:*}; k=${it#*:}
            rclone lsf "nrp:$b/staging/735-fid/$k" | grep -q .
            rclone lsf "nrp:$b/staging/735-nofid-backup/$k" | grep -q . || \
              rclone copyto "nrp:$b/$k" "nrp:$b/staging/735-nofid-backup/$k" -v
            rclone copyto "nrp:$b/staging/735-fid/$k" "nrp:$b/$k" -v
            rclone lsl "nrp:$b/$k"
            echo "swapped $b/$k"
          done
        env:
        - name: ITEMS
          value: "public-overturemaps:2026-02-18.0/countries.pmtiles"
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "2", memory: 4Gi}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
