# HAND-ROLLED: the generator has no cleanup step. Deletes the staged raw build cache
# (raw/global-delta-change/: the GlobalDeltaChange files and the intermediate layer GeoParquets) once
# the published collection passes verify-stac.py; its provenance (repository commit, access date,
# sizes and SHA-256s) is in the STAC description (#796). A rebuild re-stages from GitHub with
# delta-prep.yaml.
#   kubectl apply -n geo-workflows -f catalog/coastal/k8s/global-delta-change/delta-delete-raw.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: global-delta-change-delete-raw
  namespace: geo-workflows
  labels: {k8s-app: global-delta-change-delete-raw}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: global-delta-change-delete-raw}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 600
      priorityClassName: opportunistic
      containers:
      - name: cleanup
        image: ghcr.io/boettiger-lab/datasets:latest
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command: [bash, -c, "set -euo pipefail; rclone lsl nrp:public-coastal/raw/global-delta-change/; rclone purge nrp:public-coastal/raw/global-delta-change/; echo OK"]
        resources:
          requests: {cpu: '1', memory: 512Mi}
          limits:   {cpu: '1', memory: 512Mi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
