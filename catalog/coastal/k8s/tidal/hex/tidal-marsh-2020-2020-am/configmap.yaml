# Auto-generated ConfigMap for raster workflow
# Generation command: cng-datasets raster-workflow --dataset tidal-marsh-2020/staging-2020 --source-url "s3://public-coastal/tidal-marsh-2020/tidal-marsh-2020-cog.tif" --bucket public-coastal --h3-resolution 8 --parent-resolutions "0"
apiVersion: v1
data:
  tidal-marsh-2020-staging-2020-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: tidal-marsh-2020-staging-2020-hex
      namespace: geo-workflows
      labels:
        k8s-app: tidal-marsh-2020-staging-2020-hex
    spec:
      completions: 14
      parallelism: 14
      completionMode: Indexed
      backoffLimitPerIndex: 2
      maxFailedIndexes: 1
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: tidal-marsh-2020-staging-2020-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: GDAL_DATA
              value: /usr/share/gdal
            - name: PYTHONPATH
              value: /usr/lib/python3/dist-packages
            - name: BUCKET
              value: public-coastal
            - name: CNG_HEX_WORKERS
              value: '4'
            - name: CNG_HEX_CHUNK_SIZE
              value: '100000'
            - name: DUCKDB_MEMORY_LIMIT
              value: 13GiB
            - name: GDAL_CACHEMAX
              value: '512'
            command:
            - bash
            - -c
            - "set -e\n\n# Positions in the h0 grid's own ordering, not H3 base cell numbers\n\
              # (--h0-subset / --h0-cells). The completion index selects one.\nH0S=(17\
              \ 19 27 34 38 42 73 76 77 98 104 105 110 120)\nH0=${H0S[$JOB_COMPLETION_INDEX]}\n\
              if [ -z \"${JOB_COMPLETION_INDEX}\" ] || [ -z \"$H0\" ]; then\n  echo \"\
              No h0 cell for completion index '${JOB_COMPLETION_INDEX}' in (${H0S[*]})\
              \ \u2014 completions must match the --h0-subset length\" >&2\n  exit 1\n\
              fi\n\ncng-datasets raster --input \"s3://public-coastal/tidal-marsh-2020/tidal-marsh-2020-cog.tif\"\
              \ --output-parquet s3://public-coastal/tidal-marsh-2020/staging-2020/hex/\
              \ --h0-index ${H0} --resolution 8 --parent-resolutions 0 --value-column\
              \ marsh_px --hex-resampling sum --nodata \"0,255\""
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 20Gi
              limits:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 20Gi
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  tidal-marsh-2020-staging-2020-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: tidal-marsh-2020-staging-2020-setup-bucket
      namespace: geo-workflows
      labels:
        k8s-app: tidal-marsh-2020-staging-2020-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: tidal-marsh-2020-staging-2020-setup-bucket
        spec:
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-coastal
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Setting up bucket with public access and CORS..."
              cng-datasets storage setup-bucket \
                --bucket "${BUCKET}" \
                --remote nrp \
                --verify

              echo "Bucket setup complete!"
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
kind: ConfigMap
metadata:
  name: tidal-marsh-2020-staging-2020-yamls
  namespace: geo-workflows
