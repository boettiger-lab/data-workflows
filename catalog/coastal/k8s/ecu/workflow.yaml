# Ecological Coastal Units (#674) — orchestrator: convert → pmtiles + hex → repartition.
#
# Run order from scratch (namespace geo-workflows):
#   1. kubectl apply -f ecu-setup-bucket.yaml   # public-coastal must exist before staging
#   2. kubectl apply -f ecu-stage-raw.yaml      # writes raw/ecu.gdb.zip, which convert reads;
#                                               # this orchestrator does NOT run it
#   3. kubectl apply -f workflow-rbac.yaml -f configmap.yaml -f workflow.yaml
#
# hex + repartition are pinned to cng-datasets 0.8.1 (line-coverage fix, datasets#239).
apiVersion: batch/v1
kind: Job
metadata:
  name: ecu-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "\nset -e\n\necho \"Starting ecu workflow...\"\n\n# Step 0: Setup bucket\
          \ with public access and CORS\necho \"Step 0: Setting up bucket...\"\nkubectl\
          \ apply -f /yamls/ecu-setup-bucket.yaml -n geo-workflows\n\necho \"Waiting\
          \ for bucket setup to complete...\"\nkubectl wait --for=condition=complete\
          \ --timeout=600s job/ecu-setup-bucket -n geo-workflows\n\n# Step 1: Convert\
          \ to optimized GeoParquet (needed by both pmtiles and hex jobs)\necho \"\
          Step 1: Converting to optimized GeoParquet...\"\nkubectl apply -f /yamls/ecu-convert.yaml\
          \ -n geo-workflows\n\necho \"Waiting for GeoParquet conversion to complete...\"\
          \nkubectl wait --for=condition=complete --timeout=3600s job/ecu-convert\
          \ -n geo-workflows\n\n# Step 2: Run pmtiles and hex tiling in parallel (both\
          \ use the converted geoparquet)\necho \"Step 2: H3 hexagonal tiling and\
          \ PMTiles generation (parallel)...\"\nkubectl apply -f /yamls/ecu-pmtiles.yaml\
          \ -n geo-workflows\nkubectl apply -f /yamls/ecu-hex.yaml -n geo-workflows\n\
          \necho \"Waiting for hex tiling to complete (PMTiles continues in background)...\"\
          \necho \"Timeout set to 48 hours (172800s)...\"\nkubectl wait --for=condition=complete\
          \ --timeout=172800s job/ecu-hex -n geo-workflows\n\necho \"Step 3: Repartitioning\
          \ by h0...\"\nkubectl apply -f /yamls/ecu-repartition.yaml -n geo-workflows\n\
          \necho \"Waiting for repartition to complete...\"\nkubectl wait --for=condition=complete\
          \ --timeout=3600s job/ecu-repartition -n geo-workflows\n\necho \"\u2713\
          \ Workflow complete!\"\necho \"Note: PMTiles job may still be running in\
          \ the background\"\necho \"\"\necho \"Clean up with:\"\necho \"  kubectl\
          \ delete jobs ecu-setup-bucket ecu-convert ecu-pmtiles ecu-hex ecu-repartition\
          \ ecu-workflow -n geo-workflows\"\necho \"  kubectl delete configmap ecu-yamls\
          \ -n geo-workflows\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: ecu-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
