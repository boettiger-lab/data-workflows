apiVersion: batch/v1
kind: Job
metadata:
  name: ccn-carbon-cores-v1-7-checksums
  namespace: geo-workflows
  labels:
    k8s-app: ccn-carbon-cores-v1-7-checksums
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: ccn-carbon-cores-v1-7-checksums
    spec:
      restartPolicy: Never
      containers:
      - name: checksums-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        command:
        - bash
        - -c
        - |
          set -e
          cng-datasets checksums s3://public-coastal/ccn-carbon-cores-v1-7.parquet s3://public-coastal/ccn-carbon-cores-v1-7.pmtiles s3://public-coastal/ccn-carbon-cores-v1-7/hex/ --output s3://public-coastal/ccn-carbon-cores-v1-7.checksums.json --workers 8
        resources:
          requests:
            cpu: '4'
            memory: 2Gi
          limits:
            cpu: '4'
            memory: 2Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
