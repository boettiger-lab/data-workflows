# HAND-ROLLED: the generator has no cleanup step. Deletes the staged raw build cache
# (raw/ccn-v1-7/: the figshare CSVs and the intermediate cores GeoParquet) once the published
# collection passes verify-stac.py; its provenance (DOI, version, access date, MD5s) is in the
# STAC description (#793). A rebuild re-stages from figshare with ccn-prep.yaml.
#   kubectl apply -n geo-workflows -f catalog/coastal/k8s/ccn-carbon-cores-v1-7/ccn-delete-raw.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ccn-carbon-cores-delete-raw
  namespace: geo-workflows
  labels: {k8s-app: ccn-carbon-cores-delete-raw}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: ccn-carbon-cores-delete-raw}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 600
      priorityClassName: opportunistic
      containers:
      - name: cleanup
        image: ghcr.io/boettiger-lab/datasets:latest
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command: [bash, -c, "set -euo pipefail; rclone lsl nrp:public-coastal/raw/ccn-v1-7/; rclone purge nrp:public-coastal/raw/ccn-v1-7/; echo OK"]
        resources:
          requests: {cpu: '1', memory: 512Mi}
          limits:   {cpu: '1', memory: 512Mi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
