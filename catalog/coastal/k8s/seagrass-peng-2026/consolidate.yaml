# HAND-ROLLED: the generator's --years cannot express a tile mosaic per period (see generate.sh), so
# the per-period staging hexes are joined here (#788). Pattern follows
# catalog/coastal/k8s/tidal/consolidate-marsh.yaml.
#
# Input:  seagrass-peng-2026/staging-<period>/hex/h0=*/data_0.parquet (2023-2024 also
#         staging-2023-2024-heavy/, the heavy h0 cells built in res-1 units; see generate.sh),
#         seagrass_km2 = seagrass
#         area per h10 cell (`total`, nodata 0, so only cells with seagrass).
# Output: seagrass-peng-2026/hex/h0=<h0>/data_0.parquet with period, seagrass_km2, h10, h8, h0.
# Prints global km2 per period for comparison with the published total.
#   kubectl apply -n geo-workflows -f catalog/coastal/k8s/seagrass-peng-2026/consolidate.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: seagrass-peng-2026-consolidate
  namespace: geo-workflows
  labels: {k8s-app: seagrass-peng-2026-consolidate}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    metadata: {labels: {k8s-app: seagrass-peng-2026-consolidate}}
    spec:
      # Short pod (minutes): opportunistic per #804.
      priorityClassName: opportunistic
      restartPolicy: Never
      activeDeadlineSeconds: 7200
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: consolidate
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests: {cpu: '4', memory: 16Gi, ephemeral-storage: 20Gi}
          limits:   {cpu: '4', memory: 16Gi, ephemeral-storage: 20Gi}
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          # Start clean: a stale partition from an earlier run would survive a smaller rebuild.
          rclone purge nrp:public-coastal/seagrass-peng-2026/hex/ 2>/dev/null || true
          python3 - <<'PYEOF'
          import duckdb, os, subprocess
          PERIODS = ["2019-2020", "2023-2024"]
          PREFIXES = {"2019-2020": ["staging-2019-2020"],
                      "2023-2024": ["staging-2023-2024", "staging-2023-2024-heavy"]}
          B = "s3://public-coastal/seagrass-peng-2026"
          con = duckdb.connect()
          for ext in ("h3 FROM community", "httpfs"):
              con.execute(f"INSTALL {ext}; LOAD {ext.split()[0]}")
          con.execute("SET http_retries=10; SET http_retry_wait_ms=3000; SET preserve_insertion_order=false")
          con.execute(f"""CREATE SECRET s3 (TYPE S3, KEY_ID '{os.environ["AWS_ACCESS_KEY_ID"]}',
              SECRET '{os.environ["AWS_SECRET_ACCESS_KEY"]}', ENDPOINT '{os.environ["AWS_S3_ENDPOINT"]}',
              URL_STYLE 'path', USE_SSL false)""")

          def h0s_of(prefix):
              out = subprocess.run(["rclone", "lsf", "--dirs-only", f"nrp:public-coastal/seagrass-peng-2026/{prefix}/hex/"],
                                   capture_output=True, text=True, check=True).stdout
              return {d.strip("/").split("=")[1] for d in out.split() if d.startswith("h0=")}
          per = {x: h0s_of(x) for p in PERIODS for x in PREFIXES[p]}
          for x in per: print(f"{x}: {len(per[x])} h0 partitions", flush=True)
          a, b = per["staging-2023-2024"], per["staging-2023-2024-heavy"]
          assert not (a & b), f"h0 in both 2023-2024 prefixes: {sorted(a & b)}"
          for h0 in sorted(set().union(*per.values())):
              lst = ", ".join(f"'{B}/{x}/hex/h0={h0}/data_0.parquet'" for x in per if h0 in per[x])
              con.execute(f"""
                COPY (
                  SELECT regexp_extract(filename, 'staging-([0-9]{{4}}-[0-9]{{4}})(-heavy)?/', 1) AS period,
                         seagrass_km2, h10::UBIGINT AS h10, h8::UBIGINT AS h8, h0::UBIGINT AS h0
                  FROM read_parquet([{lst}], filename = true, hive_partitioning = false)
                  WHERE seagrass_km2 > 0
                  ORDER BY period, h10
                ) TO '{B}/hex/h0={h0}/data_0.parquet' (FORMAT PARQUET, COMPRESSION ZSTD)""")
          print(con.sql(f"""
            SELECT period, COUNT(*) AS cells, ROUND(SUM(seagrass_km2), 1) AS km2,
                   ROUND(MAX(seagrass_km2 / h3_cell_area(h10, 'km^2')), 4) AS max_cover,
                   COUNT(*) FILTER (WHERE seagrass_km2 IS NULL) AS nulls
            FROM read_parquet('{B}/hex/h0=*/data_0.parquet') GROUP BY 1 ORDER BY 1"""))
          PYEOF
          echo OK
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
