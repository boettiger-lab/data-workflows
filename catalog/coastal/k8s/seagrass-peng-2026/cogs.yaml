# HAND-ROLLED (#788): replaces the generated preprocess-cog step, which was preempted twice at
# opportunistic priority (after 13 and 16 min) while it was still opening the 299 tiles one by one
# through the public endpoint, and cannot run at default priority sized to measured use because it
# idles that long. Pattern follows catalog/coastal/k8s/tidal/cogs.yaml.
#
# One global WGS84 COG per period, at the key the generated hex job reads
# (seagrass-peng-2026/seagrass-<period>-cog.tif): tiles are copied in over the internal endpoint,
# mosaicked through a VRT on their own grid (no warp, values unchanged: 1 = seagrass, 0 = nodata)
# and written as one COG. The tiles are already 256x256-blocked COGs, so no re-tiling.
# Overviews are rebuilt rather than taken from the tiles: theirs stop at 1/32 (still 125k pixels
# wide, so a world-scale tile took 7 s) and their nearest sampling drops thin meadows, which left
# a world preview blank. They are built per tile, in parallel (AVERAGE over the valid pixels: any
# seagrass in a coarse pixel keeps it 1), down to 1/256, and the COG reuses them. Building them in
# the COG step instead (OVERVIEWS=IGNORE_EXISTING) read the mosaic single-threaded through
# fractional windows and passed the old 6-hour pod deadline twice without finishing. Per tile it is
# 25 s for the densest tile (Bahamas). Full-resolution values are unchanged.
#   index 0: 2019-2020 (299 tiles), index 1: 2023-2024 (301 tiles)
# Default priority (runs past the preemption window): requests sized to use, limit = request.
#   kubectl apply -n geo-workflows -f catalog/coastal/k8s/seagrass-peng-2026/cogs.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: seagrass-peng-2026-cogs
  namespace: geo-workflows
  labels: {k8s-app: seagrass-peng-2026-cogs}
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 2
  ttlSecondsAfterFinished: 259200
  template:
    metadata: {labels: {k8s-app: seagrass-peng-2026-cogs}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 43200
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: cog
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: GDAL_DATA, value: /usr/share/gdal}
        - {name: PYTHONPATH, value: /usr/lib/python3/dist-packages}
        - {name: GDAL_CACHEMAX, value: '4000'}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          P=(2019-2020 2023-2024); p=${P[$JOB_COMPLETION_INDEX]}; inner="GlobalSeagrass${p/-/_}"
          OUT=seagrass-$p-cog.tif
          W=/tmp/w && mkdir -p $W && cd $W
          time rclone copy "nrp:public-coastal/raw/seagrass-peng-2026/$p/$inner/" tiles/ \
            --transfers 16 --retries 10 --low-level-retries 20
          echo "tiles=$(find tiles -name '*.tif' | wc -l) size=$(du -sh tiles | cut -f1)"
          mkdir -p tiled
          conv() { GDAL_CACHEMAX=512 gdal_translate -q "$1" "tiled/$(basename "$1")" \
                     -co TILED=YES -co BLOCKXSIZE=512 -co BLOCKYSIZE=512 -co COMPRESS=ZSTD -co SPARSE_OK=TRUE -co BIGTIFF=YES \
                   && GDAL_CACHEMAX=512 gdaladdo -q -r average "tiled/$(basename "$1")" 2 4 8 16 32 64 128 256 \
                   && rm "$1"; }
          export -f conv
          time (find tiles -name '*.tif' | xargs -P 4 -I{} bash -c 'conv {}')
          find tiled -name '*.tif' | sort > tiles.txt
          echo "tiled=$(wc -l < tiles.txt)"
          gdalbuildvrt -q -resolution highest -srcnodata 0 -vrtnodata 0 -input_file_list tiles.txt mosaic.vrt
          python3 -c "
          from osgeo import gdal; gdal.UseExceptions()
          ds = gdal.Open('mosaic.vrt', gdal.GA_Update); ds.GetRasterBand(1).SetDescription('seagrass'); ds = None
          ds = gdal.Open('mosaic.vrt'); b = ds.GetRasterBand(1)
          print('size', ds.RasterXSize, ds.RasterYSize, 'gt', ds.GetGeoTransform(), 'nodata', b.GetNoDataValue(),
                'overviews', b.GetOverviewCount())"
          time gdal_translate mosaic.vrt $OUT -of COG \
            -co COMPRESS=DEFLATE -co BLOCKSIZE=512 -co SPARSE_OK=TRUE -co NUM_THREADS=ALL_CPUS \
            -co BIGTIFF=YES -co OVERVIEWS=FORCE_USE_EXISTING
          rm -rf tiles tiled mosaic.vrt
          gdalinfo $OUT | grep -E 'Size is|Pixel Size|Origin|NoData|Description|Overviews' | head
          ls -la $OUT
          rclone copyto $OUT nrp:public-coastal/seagrass-peng-2026/$OUT --s3-no-check-bucket \
            --retries 10 --low-level-retries 20
          echo OK
        resources:
          requests: {cpu: '4', memory: 8Gi, ephemeral-storage: 60Gi}
          limits:   {cpu: '4', memory: 8Gi, ephemeral-storage: 60Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
