# HAND-ROLLED: the generator has no cleanup step. Deletes the staged raw build cache
# (raw/seagrass-peng-2026/: the two Zenodo zips, unzipped to their 600 tiles) and the staging
# hexes once
# the published collection passes verify-stac.py; its provenance (Zenodo record, access date,
# sizes and SHA-256s) is in the STAC description (#788). A rebuild re-stages from Zenodo with
# stage-raw.yaml.
#   kubectl apply -n geo-workflows -f catalog/coastal/k8s/seagrass-peng-2026/delete-raw.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: seagrass-peng-2026-delete-raw
  namespace: geo-workflows
  labels: {k8s-app: seagrass-peng-2026-delete-raw}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: seagrass-peng-2026-delete-raw}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 600
      priorityClassName: opportunistic
      containers:
      - name: cleanup
        image: ghcr.io/boettiger-lab/datasets:latest
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          rclone size nrp:public-coastal/raw/seagrass-peng-2026/
          rclone purge nrp:public-coastal/raw/seagrass-peng-2026/
          # Intermediate build outputs, not in the STAC: the per-period staging hexes that
          # consolidate.yaml merged into hex/, and the empty render files of the generated jobs.
          for d in staging-2019-2020 staging-2023-2024 staging-2023-2024-heavy; do
            rclone size nrp:public-coastal/seagrass-peng-2026/$d/; rclone purge nrp:public-coastal/seagrass-peng-2026/$d/
          done
          for f in staging-2019-2020.render.json staging-2023-2024.render.json; do
            rclone deletefile nrp:public-coastal/seagrass-peng-2026/$f
          done
          echo OK
        resources:
          requests: {cpu: '1', memory: 512Mi}
          limits:   {cpu: '1', memory: 512Mi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
