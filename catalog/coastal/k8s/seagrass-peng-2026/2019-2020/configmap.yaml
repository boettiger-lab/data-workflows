apiVersion: v1
data:
  seagrass-peng-2026-staging-2019-2020-checksums.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: seagrass-peng-2026-staging-2019-2020-checksums
      namespace: geo-workflows
      labels:
        k8s-app: seagrass-peng-2026-staging-2019-2020-checksums
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: seagrass-peng-2026-staging-2019-2020-checksums
        spec:
          restartPolicy: Never
          containers:
          - name: checksums-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            command:
            - bash
            - -c
            - |
              set -e
              cng-datasets checksums s3://public-coastal/seagrass-peng-2026/seagrass-2019-2020-cog.tif s3://public-coastal/seagrass-peng-2026/staging-2019-2020/hex/ --output s3://public-coastal/seagrass-peng-2026/staging-2019-2020.checksums.json --workers 8
            resources:
              requests:
                cpu: '4'
                memory: 2Gi
              limits:
                cpu: '4'
                memory: 2Gi
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  seagrass-peng-2026-staging-2019-2020-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: seagrass-peng-2026-staging-2019-2020-hex
      namespace: geo-workflows
      labels:
        k8s-app: seagrass-peng-2026-staging-2019-2020-hex
    spec:
      completions: 122
      parallelism: 40
      completionMode: Indexed
      backoffLimitPerIndex: 2
      maxFailedIndexes: 1
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: seagrass-peng-2026-staging-2019-2020-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: GDAL_DATA
              value: /usr/share/gdal
            - name: PYTHONPATH
              value: /usr/lib/python3/dist-packages
            - name: BUCKET
              value: public-coastal
            - name: CNG_HEX_WORKERS
              value: '4'
            - name: CNG_HEX_CHUNK_SIZE
              value: '100000'
            - name: CNG_POD_CPU
              value: '4'
            - name: DUCKDB_MEMORY_LIMIT
              value: 13GiB
            - name: GDAL_CACHEMAX
              value: '512'
            command:
            - bash
            - -c
            - |-
              set -e

              cng-datasets raster --input "s3://public-coastal/seagrass-peng-2026/seagrass-2019-2020-cog.tif" --output-parquet s3://public-coastal/seagrass-peng-2026/staging-2019-2020/hex/ --h0-index ${JOB_COMPLETION_INDEX} --resolution 10 --parent-resolutions 8,0 --value-column seagrass_km2 --hex-resampling total --nodata "0" --value-units km2/km2
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 20Gi
              limits:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 20Gi
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
