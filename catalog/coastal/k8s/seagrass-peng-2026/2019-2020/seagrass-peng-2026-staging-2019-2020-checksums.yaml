apiVersion: batch/v1
kind: Job
metadata:
  name: seagrass-peng-2026-staging-2019-2020-checksums
  namespace: geo-workflows
  labels:
    k8s-app: seagrass-peng-2026-staging-2019-2020-checksums
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: seagrass-peng-2026-staging-2019-2020-checksums
    spec:
      restartPolicy: Never
      containers:
      - name: checksums-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        command:
        - bash
        - -c
        - |
          set -e
          cng-datasets checksums s3://public-coastal/seagrass-peng-2026/seagrass-2019-2020-cog.tif s3://public-coastal/seagrass-peng-2026/staging-2019-2020/hex/ --output s3://public-coastal/seagrass-peng-2026/staging-2019-2020.checksums.json --workers 8
        resources:
          requests:
            cpu: '4'
            memory: 2Gi
          limits:
            cpu: '4'
            memory: 2Gi
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
