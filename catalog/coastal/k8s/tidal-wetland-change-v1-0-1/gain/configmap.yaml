            - name: GDAL_HTTP_TIMEOUT
              value: '60'
            - name: GDAL_HTTP_MAX_RETRY
              value: '5'
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - "set -e\n\necho \"Mosaicking 1 tiles \u2192 s3://public-coastal/tidal-wetland-change-v1-0-1/staging-gain-cog.tif\"\
              \n\ncng-datasets raster \\\n  --input \"s3://public-coastal/tidal-wetland-change-v1-0-1/staging/gain-class-cog.tif\"\
              \ \\\n  --output-cog \"s3://public-coastal/tidal-wetland-change-v1-0-1/staging-gain-cog.tif\"\
              \ \\\n  --target-crs EPSG:4326 \\\n  --resampling nearest \\\n  --nodata\
              \ \"0\" \\\n  --hex-resampling fractions\n\necho \"\u2713 Preprocess COG\
              \ complete: s3://public-coastal/tidal-wetland-change-v1-0-1/staging-gain-cog.tif\"\
              \n"
            resources:
              requests:
                cpu: '8'
                memory: 32Gi
                ephemeral-storage: 50Gi
              limits:
                cpu: '8'
                memory: 32Gi
                ephemeral-storage: 50Gi
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
