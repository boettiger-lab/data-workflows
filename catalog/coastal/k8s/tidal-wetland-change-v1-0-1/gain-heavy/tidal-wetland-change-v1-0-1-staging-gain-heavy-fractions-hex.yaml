# DEVIATION from generated output (#800): the input is the class raster cogs.yaml writes, read
# directly. Generated after that raster existed, the tool flags it "not a COG" (it has no
# overviews, which the hex step does not need) and points the hex at a preprocess-cog copy; the
# loss hex read the same kind of raster directly and is correct. The preprocess-cog and render
# manifests are removed, and workflow.yaml (the orchestrator) is not used for this recipe.
apiVersion: batch/v1
kind: Job
metadata:
  name: tidal-wetland-change-v1-0-1-staging-gain-heavy-fractions-hex
  namespace: geo-workflows
  labels:
    k8s-app: tidal-wetland-change-v1-0-1-staging-gain-heavy-fractions-hex
spec:
  completions: 41
  parallelism: 40
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 1
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: tidal-wetland-change-v1-0-1-staging-gain-heavy-fractions-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: BUCKET
          value: public-coastal
        - name: CNG_HEX_WORKERS
          value: '4'
        - name: CNG_HEX_CHUNK_SIZE
          value: '100000'
        - name: CNG_POD_CPU
          value: '4'
        - name: DUCKDB_MEMORY_LIMIT
          value: 13GiB
        - name: GDAL_CACHEMAX
          value: '512'
        command:
        - bash
        - -c
        - |-
          set -e

          cng-datasets raster --input "s3://public-coastal/tidal-wetland-change-v1-0-1/staging/gain-class-cog.tif" --output-parquet s3://public-coastal/tidal-wetland-change-v1-0-1/staging-gain-heavy/hex-fractions-chunks/ --chunk-resolution 1 --chunk-index ${JOB_COMPLETION_INDEX} --h0-subset "4,14,21,44,78,107" --resolution 10 --parent-resolutions 8,0 --value-column class --hex-resampling fractions --nodata "0"
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 20Gi
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
