# HAND-ROLLED (#800): the generator writes one `fractions` table per derived class raster; this
# decodes the class codes and joins loss and gain into the published hex. Pattern follows
# catalog/coastal/k8s/seagrass-peng-2026/consolidate.yaml.
#
# Input:  tidal-wetland-change-v1-0-1/staging-<loss|gain>/hex-fractions/h0=*/data_0.parquet,
#         one row per (class, h10 cell): class = type x 100 + year (9/99 = missing), frac = the
#         class's coverage-weighted share of the cell; nodata rows (class 0) are dropped.
# Output: tidal-wetland-change-v1-0-1/hex/h0=<h0>/data_0.parquet with
#         change, ecosystem, period, area_km2 (= frac x H3 cell area), h10, h8, h0.
# Prints global km2 by change, ecosystem and period.
#   kubectl apply -n geo-workflows -f catalog/coastal/k8s/tidal-wetland-change-v1-0-1/consolidate.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: tidal-wetland-change-consolidate
  namespace: geo-workflows
  labels: {k8s-app: tidal-wetland-change-consolidate}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    metadata: {labels: {k8s-app: tidal-wetland-change-consolidate}}
    spec:
      # Short pod (minutes): opportunistic per #804.
      priorityClassName: opportunistic
      restartPolicy: Never
      activeDeadlineSeconds: 7200
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: consolidate
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests: {cpu: '4', memory: 16Gi, ephemeral-storage: 20Gi}
          limits:   {cpu: '4', memory: 16Gi, ephemeral-storage: 20Gi}
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          # Start clean: a stale partition from an earlier run would survive a smaller rebuild.
          rclone purge nrp:public-coastal/tidal-wetland-change-v1-0-1/hex/ 2>/dev/null || true
          python3 - <<'PYEOF'
          import duckdb, os, subprocess
          B = "s3://public-coastal/tidal-wetland-change-v1-0-1"
          con = duckdb.connect()
          for ext in ("h3 FROM community", "httpfs"):
              con.execute(f"INSTALL {ext}; LOAD {ext.split()[0]}")
          con.execute("SET http_retries=10; SET http_retry_wait_ms=3000; SET preserve_insertion_order=false")
          con.execute(f"""CREATE SECRET s3 (TYPE S3, KEY_ID '{os.environ["AWS_ACCESS_KEY_ID"]}',
              SECRET '{os.environ["AWS_SECRET_ACCESS_KEY"]}', ENDPOINT '{os.environ["AWS_S3_ENDPOINT"]}',
              URL_STYLE 'path', USE_SSL false)""")

          def h0s_of(c):
              out = subprocess.run(["rclone", "lsf", "--dirs-only",
                                    f"nrp:public-coastal/tidal-wetland-change-v1-0-1/staging-{c}/hex-fractions/"],
                                   capture_output=True, text=True, check=True).stdout
              return {d.strip("/").split("=")[1] for d in out.split() if d.startswith("h0=")}
          per = {c: h0s_of(c) for c in ("loss", "gain")}
          for c in per: print(f"{c}: {len(per[c])} h0 partitions", flush=True)
          print(con.sql(f"DESCRIBE SELECT * FROM read_parquet('{B}/staging-loss/hex-fractions/h0={sorted(per['loss'])[0]}/data_0.parquet')"))
          for h0 in sorted(per["loss"] | per["gain"]):
              lst = ", ".join(f"'{B}/staging-{c}/hex-fractions/h0={h0}/data_0.parquet'" for c in per if h0 in per[c])
              con.execute(f"""
                COPY (
                  WITH f AS (
                    SELECT regexp_extract(filename, 'staging-(loss|gain)/', 1) AS change,
                           class::INTEGER AS class, frac, h10, h8, h0
                    FROM read_parquet([{lst}], filename = true, hive_partitioning = false)
                    WHERE class IS NOT NULL AND class > 0 AND frac > 0
                  )
                  SELECT change,
                         CASE class // 100 WHEN 2 THEN 'tidal flat' WHEN 3 THEN 'mangrove'
                                           WHEN 5 THEN 'tidal marsh' ELSE 'unassigned' END AS ecosystem,
                         CASE WHEN class % 100 BETWEEN 4 AND 19
                              THEN printf('%d-%d', 2000 + class % 100 - 2, 2000 + class % 100)
                              ELSE 'unassigned' END AS period,
                         frac * h3_cell_area(h10, 'km^2') AS area_km2,
                         h10::UBIGINT AS h10, h8::UBIGINT AS h8, h0::UBIGINT AS h0
                  FROM f ORDER BY change, ecosystem, period, h10
                ) TO '{B}/hex/h0={h0}/data_0.parquet' (FORMAT PARQUET, COMPRESSION ZSTD)""")
          t = f"read_parquet('{B}/hex/h0=*/data_0.parquet')"
          print(con.sql(f"""SELECT change, ecosystem, ROUND(SUM(area_km2), 1) AS km2, COUNT(*) AS rows
                            FROM {t} GROUP BY ALL ORDER BY ALL"""))
          print(con.sql(f"""SELECT change, period, ROUND(SUM(area_km2), 1) AS km2 FROM {t} GROUP BY ALL ORDER BY ALL"""))
          print(con.sql(f"""SELECT COUNT(*) FILTER (WHERE area_km2 IS NULL) AS nulls, MIN(area_km2), MAX(area_km2),
                                   COUNT(DISTINCT h10) AS cells FROM {t}"""))
          PYEOF
          echo OK
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
