# HAND-ROLLED: the generator does not move published objects or write STAC. Three collections
# publish an asset from a raw/ prefix, which holds only upstream input staged for a rebuild
# (#721, #545, #656). This job copies each object to a normal asset location (server-side, size
# checked), then repoints the live STAC with move_hrefs.py and the README text with sed.
# The raw/ objects are left in place: two are genuine upstream input, and the GHS-POP COG is
# removed separately once the new href has been live for a while.
#   kubectl create configmap raw-hrefs-script -n geo-workflows \
#     --from-file=move_hrefs.py=catalog/raw-hrefs-721/move_hrefs.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/raw-hrefs-721/raw-hrefs-publish.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: raw-hrefs-publish
  namespace: geo-workflows
  labels: {k8s-app: raw-hrefs-publish}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {k8s-app: raw-hrefs-publish}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 7200
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }
          size() { rclone size --json "nrp:$1" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['count']==1, d; print(d['bytes'])"; }

          # old key | new key | collection | README to rewrite (or -)
          while IFS='|' read -r old new stac readme; do
            echo "== $old -> $new"
            # Streamed through the pod: a server-side copy of the 12 GB COG wrote nothing in an hour.
            rclone copyto "nrp:$old" "nrp:$new" --s3-no-check-bucket --disable copy \
              --stats 60s --stats-one-line -v $R
            a=$(size "$old"); b=$(size "$new")
            [ "$a" = "$b" ] || { echo "size mismatch $a vs $b"; exit 1; }
            echo "copied $b bytes"

            rclone cat "nrp:$stac" > /tmp/c.json
            python3 /script/move_hrefs.py /tmp/c.json
            guard_stac /tmp/c.json "nrp:$stac"
            rclone copyto /tmp/c.json "nrp:$stac" $R

            if [ "$readme" != "-" ]; then
              rclone cat "nrp:$readme" > /tmp/r.md
              sed -i "s#/$old#/$new#g" /tmp/r.md
              ! grep -q "/$old" /tmp/r.md
              rclone copyto /tmp/r.md "nrp:$readme" $R
            fi
          done <<'EOF'
          public-population/raw/ghs-pop-2020-cog.tif|public-population/ghs-pop-2020-cog.tif|public-population/ghs-pop-2020/stac-collection.json|public-population/README.md
          public-tpl/landvote/raw/Measures.csv|public-tpl/landvote/Measures.csv|public-tpl/landvote/stac-collection.json|-
          public-obis/raw/licenses.tsv|public-obis/2026-09-09/licenses.tsv|public-obis/stac-collection.json|public-obis/README.md
          EOF
          echo OK
        resources:
          requests: {cpu: '2', memory: 2Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '2', memory: 2Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: raw-hrefs-script}}
