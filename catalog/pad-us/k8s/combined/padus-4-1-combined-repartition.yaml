# DEVIATION from generated output (#617): repartition memory raised to 64Gi (DuckDB 40GiB); at 32Gi it was OOM-killed on h0=577727389698621439 (700M hex rows). At 64Gi that partition then passed 200Gi of sort scratch and was evicted, so the remaining partitions were written by combined-repartition-617/. The generator has no repartition-memory option.
# DEVIATION from generated output (#617, datasets#315): image pinned to datasets:0.12.1, the first release that repairs the invalid antimeridian crosser (FID 868); the generator has no image-tag option.
apiVersion: batch/v1
kind: Job
metadata:
  name: padus-4-1-combined-repartition
  namespace: geo-workflows
  labels:
    k8s-app: padus-4-1-combined-repartition
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: padus-4-1-combined-repartition
    spec:
      restartPolicy: Never
      containers:
      - name: repartition-task
        image: ghcr.io/boettiger-lab/datasets:0.12.1
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-padus
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          cng-datasets repartition --chunks-dir s3://public-padus/padus-4-1/combined/chunks --output-dir s3://public-padus/padus-4-1/combined/hex --source-parquet s3://public-padus/padus-4-1/combined.parquet --cleanup --memory-limit 40GiB
        resources:
          requests:
            cpu: '4'
            memory: 64Gi
            ephemeral-storage: 200Gi
          limits:
            cpu: '4'
            memory: 64Gi
            ephemeral-storage: 200Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
