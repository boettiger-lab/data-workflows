# HAND-ROLLED: the generator does not write STAC. After the cng-datasets 0.12.0 rebuild (#617)
# the PAD-US layers lose the `bbox` column and keep OBJECTID; fix_columns.py (committed beside
# this file) edits each LIVE collection's table:columns to match, so nothing else is touched.
# Set LAYERS to the layers whose rebuild has landed.
#   kubectl create configmap padus-stac-columns-script -n geo-workflows \
#     --from-file=fix_columns.py=catalog/pad-us/k8s/stac-columns-617/fix_columns.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/pad-us/k8s/stac-columns-617/padus-stac-columns-publish.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: padus-stac-columns-publish
  namespace: geo-workflows
  labels: {k8s-app: padus-stac-columns-publish}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {k8s-app: padus-stac-columns-publish}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: LAYERS, value: fee}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }
          for d in $LAYERS; do
            p="nrp:public-padus/padus-4-1/$d/stac-collection.json"
            rclone cat "$p" > /tmp/c.json
            python3 /script/fix_columns.py /tmp/c.json
            guard_stac /tmp/c.json "$p"
            rclone copyto /tmp/c.json "$p" $R
          done
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: padus-stac-columns-script}}
