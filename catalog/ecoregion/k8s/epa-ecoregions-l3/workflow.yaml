apiVersion: batch/v1
kind: Job
metadata:
  name: epa-ecoregions-l3-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "\nset -e\n\necho \"Starting epa-ecoregions-l3 workflow...\"\n\n# Step 0: Setup bucket with public access and CORS\necho \"Step 0: Setting up bucket...\"\nkubectl apply -f /yamls/epa-ecoregions-l3-setup-bucket.yaml -n geo-workflows\n\necho \"Waiting for bucket setup to complete...\"\nkubectl wait --for=condition=complete --timeout=600s job/epa-ecoregions-l3-setup-bucket -n geo-workflows\n\n# Step 1 (convert) is intentionally absent: catalog/ecoregion/k8s/epa-ecoregions/preprocess-l3.yaml\n# already reprojected the source to EPSG:4326 and wrote s3://public-ecoregion/epa-ecoregions-l3.parquet.\n\n# Step 2: Run pmtiles and hex tiling in parallel (both use the converted geoparquet)\necho \"Step 2: H3 hexagonal tiling and PMTiles generation (parallel)...\"\nkubectl apply -f /yamls/epa-ecoregions-l3-pmtiles.yaml -n geo-workflows\nkubectl apply -f /yamls/epa-ecoregions-l3-hex.yaml -n geo-workflows\n\necho \"Waiting for hex tiling to complete (PMTiles continues in background)...\"\necho \"Timeout set to 48 hours (172800s)...\"\nkubectl wait --for=condition=complete --timeout=172800s job/epa-ecoregions-l3-hex -n geo-workflows\n\necho \"Step 3: Repartitioning by h0...\"\nkubectl apply -f /yamls/epa-ecoregions-l3-repartition.yaml -n geo-workflows\n\necho \"Waiting for repartition to complete...\"\nkubectl wait --for=condition=complete --timeout=3600s job/epa-ecoregions-l3-repartition -n geo-workflows\n\necho \"\u2713 Workflow complete!\"\necho \"Note: PMTiles job may still be running in the background\"\necho \"\"\necho \"Clean up with:\"\necho \"  kubectl delete jobs epa-ecoregions-l3-setup-bucket epa-ecoregions-l3-pmtiles epa-ecoregions-l3-hex epa-ecoregions-l3-repartition epa-ecoregions-l3-workflow -n geo-workflows\"\necho \"  kubectl delete configmap epa-ecoregions-l3-yamls -n geo-workflows\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: epa-ecoregions-l3-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
