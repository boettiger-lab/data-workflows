# HAND-ROLLED: post-hex rollup of a published hex asset; cng-datasets has no step that derives coarser per-category land rollups (#522, #1077)
#
# data-workflows#1077 — the three ecoregion hex assets carry the same columns.
#
# The GLEN benchmark found the levels disagreeing: res 10 had CA_Ecoregi but no
# land_area_km2; res 9 and 8 had land_area_km2 but no CA_Ecoregi. Models joined the
# wrong level for the column they needed: 27 binder errors and three wrong answers
# (car-09, car-10, car-14). After this job every level has
#   h<res> parent keys, CA_Ecoregi, land_area_km2, h0   (+ nland at res 9 and 8)
#
#   res 10: one row per cell (each res-10 cell lies in exactly one ecoregion);
#           land_area_km2 = h3_cell_area(h10, 'km^2'), added to the existing rows.
#   res 9/8: one row per (cell, ecoregion). A parent straddling two ecoregions now has
#           two rows, each with that ecoregion's share: nland and land_area_km2 count
#           only the res-10 children in that ecoregion. Summing land_area_km2 over all
#           rows still gives California's land area exactly, and the conserved-areas
#           weights join (SUM(w * land_area_km2) / SUM(land_area_km2)) is unchanged,
#           because the per-ecoregion rows partition each cell's area. Straddling
#           parents (2026-11-28): 29,897 of 3,662,101 at res 9, 15,350 of 525,034 at res 8.
#
# This replaces the #522 Part 2 job of the same name. Its nland equivalence check read
# `nland` from conserved-areas hex-weights-res8, which #522 later removed, so the old
# job could no longer run.
#
# Every output is staged and validated against the live grid before any flip:
#   - res 10: same row count, same (h10, CA_Ecoregi) pairs, total area conserved;
#   - res 9/8: per-cell SUM(land_area_km2) and SUM(nland) equal the live single-row
#     values, cell for cell; rows = distinct (cell, ecoregion) pairs;
#   - the documented statewide GAP 1+2 share still comes out at 26.135.
apiVersion: batch/v1
kind: Job
metadata:
  name: ecoregion-hex-parents-1077
  namespace: geo-workflows
  labels:
    k8s-app: ecoregion-hex-parents-1077
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: ecoregion-hex-parents-1077
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: ecoregion-hex-parents-1077
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: PYTHONPATH, value: /usr/lib/python3/dist-packages}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |
          set -e
          echo "=== #1077: ca30x30-ecoregion hex column parity ==="
          python3 - <<'PYEOF'
          import duckdb, os

          BASE = 's3://public-ca30x30/ecoregion'
          ECO  = BASE + '/hex/h0=*/data_0.parquet'
          W8   = ('s3://public-ca30x30/conserved-areas-terrestrial-2025/'
                  'hex-weights-res8/h0=*/data_0.parquet')

          con = duckdb.connect()
          con.execute("INSTALL httpfs; LOAD httpfs")
          con.execute("INSTALL h3 FROM community; LOAD h3")
          con.execute("SET http_retries=10; SET http_retry_wait_ms=3000")
          con.execute("SET preserve_insertion_order=false")
          con.execute("SET temp_directory='/tmp/duckdb-spill'")
          con.execute("SET memory_limit='48GiB'")
          con.execute(
              "CREATE SECRET s3_secret (TYPE S3, KEY_ID '{}', SECRET '{}', "
              "ENDPOINT '{}', URL_STYLE 'path', USE_SSL false)".format(
                  os.environ['AWS_ACCESS_KEY_ID'], os.environ['AWS_SECRET_ACCESS_KEY'],
                  os.environ.get('AWS_S3_ENDPOINT', 'rook-ceph-rgw-nautiluss3.rook')))

          def cols(path):
              return [r[0] for r in con.execute(
                  "DESCRIBE SELECT * FROM read_parquet('{}')".format(path)).fetchall()]

          # Materialise the live res-10 asset once; every output derives from it.
          live10_cols = [c for c in cols(ECO) if c != 'land_area_km2']
          con.execute("CREATE TABLE e10 AS SELECT {} FROM read_parquet('{}')".format(
              ', '.join(live10_cols), ECO))
          n10, cells10, pairs10 = con.execute(
              "SELECT COUNT(*), COUNT(DISTINCT h10), COUNT(DISTINCT (h10, CA_Ecoregi)) FROM e10"
          ).fetchone()
          print('RES10 ROWS={} CELLS={} PAIRS={}'.format(n10, cells10, pairs10))
          assert n10 == cells10 == pairs10, 'res 10 is no longer one row per cell'
          assert con.execute(
              "SELECT COUNT(*) FROM e10 WHERE CA_Ecoregi IS NULL").fetchone()[0] == 0

          # --- res 10: add land_area_km2 before h0, keep every existing column.
          out10_cols = [c for c in live10_cols if c != 'h0'] + ['land_area_km2', 'h0']
          sel10 = ', '.join("h3_cell_area(h10, 'km^2') AS land_area_km2" if c == 'land_area_km2'
                            else c for c in out10_cols)
          for (h0,) in con.execute("SELECT DISTINCT h0 FROM e10 ORDER BY h0").fetchall():
              out = '{}/hex-staging/h0={}/data_0.parquet'.format(BASE, h0)
              con.execute("COPY (SELECT {} FROM e10 WHERE h0 = {} ORDER BY h10) TO '{}' "
                          "(FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)".format(
                              sel10, h0, out))
              print('wrote', out)
          s10 = BASE + '/hex-staging/h0=*/data_0.parquet'
          r, a, same = con.execute("""
              SELECT COUNT(*), SUM(s.land_area_km2),
                     SUM(CASE WHEN s.CA_Ecoregi = e.CA_Ecoregi THEN 1 ELSE 0 END)
              FROM read_parquet('{}') s JOIN e10 e USING (h0, h10)
          """.format(s10)).fetchone()
          area10 = con.execute("SELECT SUM(h3_cell_area(h10, 'km^2')) FROM e10").fetchone()[0]
          print('RES10 STAGED rows={} area={:.4f} ecoregion_agrees={}'.format(r, a, same))
          assert r == n10 and same == n10, 'res 10 staging lost or changed rows'
          assert abs(a - area10) < 1e-6
          assert cols(s10) == out10_cols, cols(s10)

          # --- res 9 and 8: one row per (cell, ecoregion).
          for res, keys in ((9, 'h9, h8'), (8, 'h8')):
              cell = 'h{}'.format(res)
              live = '{}/hex-res{}/h0=*/data_0.parquet'.format(BASE, res)
              con.execute("""
                  CREATE OR REPLACE TABLE p{res} AS
                  SELECT {keys}, CA_Ecoregi,
                         COUNT(*)::INTEGER              AS nland,
                         SUM(h3_cell_area(h10, 'km^2')) AS land_area_km2,
                         h0
                  FROM e10 GROUP BY {keys}, CA_Ecoregi, h0
              """.format(res=res, keys=keys))
              staging = '{}/hex-res{}-staging'.format(BASE, res)
              for (h0,) in con.execute(
                      "SELECT DISTINCT h0 FROM p{} ORDER BY h0".format(res)).fetchall():
                  out = '{}/h0={}/data_0.parquet'.format(staging, h0)
                  con.execute("COPY (SELECT * FROM p{} WHERE h0 = {} ORDER BY {}, CA_Ecoregi) "
                              "TO '{}' (FORMAT PARQUET, COMPRESSION ZSTD, "
                              "ROW_GROUP_SIZE 100000)".format(res, h0, cell, out))
                  print('wrote', out)
              s = staging + '/h0=*/data_0.parquet'
              rows, pairs, cells, nland = con.execute("""
                  SELECT COUNT(*), COUNT(DISTINCT ({c}, CA_Ecoregi)), COUNT(DISTINCT {c}),
                         SUM(nland) FROM read_parquet('{s}')
              """.format(c=cell, s=s)).fetchone()
              # Cell-for-cell against the live single-row rollup.
              live_cells, mismatched = con.execute("""
                  WITH st AS (SELECT h0, {c}, SUM(nland) n, SUM(land_area_km2) a
                              FROM read_parquet('{s}') GROUP BY h0, {c})
                  SELECT COUNT(*),
                         SUM(CASE WHEN st.n IS DISTINCT FROM l.nland
                                    OR abs(st.a - l.land_area_km2) > 1e-9 THEN 1 ELSE 0 END)
                  FROM read_parquet('{l}') l FULL JOIN st USING (h0, {c})
              """.format(c=cell, s=s, l=live)).fetchone()
              print('RES{} ROWS={} PAIRS={} CELLS={} SUM_NLAND={} LIVE_CELLS={} MISMATCH={}'.format(
                  res, rows, pairs, cells, nland, live_cells, mismatched))
              assert rows == pairs, 'res{} not one row per (cell, ecoregion)'.format(res)
              assert nland == n10, 'res{} rollup loses land cells'.format(res)
              assert cells == live_cells and mismatched == 0, (
                  'res{} per-cell totals differ from the live rollup'.format(res))
              want = ['h9', 'h8'] if res == 9 else ['h8']
              assert cols(s) == want + ['CA_Ecoregi', 'nland', 'land_area_km2', 'h0'], cols(s)

          # --- the documented statewide aggregation still returns 26.135.
          share = con.execute("""
              SELECT ROUND(100*SUM(COALESCE(w.w1+w.w2, 0)*e.land_area_km2)
                             /SUM(e.land_area_km2), 3)
              FROM read_parquet('{}/hex-res8-staging/h0=*/data_0.parquet') e
              LEFT JOIN read_parquet('{}') w USING (h0, h8)
          """.format(BASE, W8)).fetchone()[0]
          print('STATEWIDE GAP1+2 area-weighted={} (target 26.135)'.format(share))
          assert abs(float(share) - 26.135) <= 0.01

          open('/tmp/ok', 'w').write('ok')
          PYEOF
          test -f /tmp/ok || { echo 'staging validation failed; NOT flipping'; exit 1; }

          for A in hex hex-res9 hex-res8; do
            echo "--- flipping ecoregion/${A} ---"
            rclone purge nrp:public-ca30x30/ecoregion/${A}/ 2>/dev/null || true
            REMAIN=$(rclone lsf -R nrp:public-ca30x30/ecoregion/${A}/ 2>/dev/null | wc -l)
            test "$REMAIN" -eq 0 || { echo "target ${A} not empty after purge ($REMAIN); refusing to flip"; exit 1; }
            rclone move nrp:public-ca30x30/ecoregion/${A}-staging/ \
                        nrp:public-ca30x30/ecoregion/${A}/
            rclone lsf -R --format sp nrp:public-ca30x30/ecoregion/${A}/ | head -5
          done
          echo '=== #1077: ecoregion hex levels published with matching columns ==='
        resources:
          requests: {cpu: '8', memory: 64Gi, ephemeral-storage: 50Gi}
          limits:   {cpu: '8', memory: 64Gi, ephemeral-storage: 50Gi}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values: ['true']
