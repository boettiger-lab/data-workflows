apiVersion: batch/v1
kind: Job
metadata:
  name: ecoregion-convert
  labels:
    k8s-app: ecoregion-convert
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: ecoregion-convert
    spec:
      restartPolicy: Never
      containers:
      - name: convert-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-ca30x30
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          # Raw zip lives on MinIO; the internal NRP RGW endpoint cannot read it,
          # so pull it with rclone, unzip locally, and convert the shapefile.
          mkdir -p /tmp/ecoregion
          rclone copy minio:public-ca30x30/CBN/Ecoregion/30x30_Ecoregions.zip /tmp/ecoregion/
          unzip -o /tmp/ecoregion/30x30_Ecoregions.zip -d /tmp/ecoregion/shp
          cng-convert-to-parquet \
            /tmp/ecoregion/shp/ACE_Ecoregions_BaileyDerived_2024_Cnty19_1_LandWaterAgnostic.shp \
            s3://public-ca30x30/ecoregion.parquet \
            --row-group-size 100000
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
          limits:
            cpu: '4'
            memory: 32Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
