apiVersion: batch/v1
kind: Job
metadata:
  name: ecoregion-dedup
  labels:
    k8s-app: ecoregion-dedup
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: ecoregion-dedup
    spec:
      restartPolicy: Never
      containers:
      - name: dedup-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          # Issue #387: the ca30x30 ecoregion hex has 8,635 byte-identical duplicate
          # rows emitted by the cng-datasets hex step. SELECT DISTINCT * collapses the
          # pure duplicates while preserving the single legitimate two-ecoregion cell.
          # Write deduped output to a staging prefix, verify in-job, then swap over live.
          HEX=s3://public-ca30x30/ecoregion/hex
          STG=s3://public-ca30x30/ecoregion/hex-staging
          PARTS="577199624117288959 577762574070710271"

          python3 - "$PARTS" <<'PY'
          import os, sys, duckdb
          parts = sys.argv[1].split()
          con = duckdb.connect()
          con.execute("INSTALL httpfs; LOAD httpfs;")
          con.execute("SET s3_endpoint='rook-ceph-rgw-nautiluss3.rook'; SET s3_use_ssl=false; SET s3_url_style='path';")
          con.execute(f"SET s3_access_key_id='{os.environ['AWS_ACCESS_KEY_ID']}';")
          con.execute(f"SET s3_secret_access_key='{os.environ['AWS_SECRET_ACCESS_KEY']}';")
          total_dedup = 0
          for p in parts:
              src = f"s3://public-ca30x30/ecoregion/hex/h0={p}/data_0.parquet"
              dst = f"s3://public-ca30x30/ecoregion/hex-staging/h0={p}/data_0.parquet"
              raw = con.execute(f"SELECT COUNT(*) FROM read_parquet('{src}')").fetchone()[0]
              con.execute(f"""COPY (SELECT DISTINCT * FROM read_parquet('{src}'))
                              TO '{dst}' (FORMAT PARQUET, ROW_GROUP_SIZE 100000, COMPRESSION ZSTD)""")
              dd = con.execute(f"SELECT COUNT(*) FROM read_parquet('{dst}')").fetchone()[0]
              dd_distinct = con.execute(f"SELECT COUNT(*) FROM (SELECT DISTINCT * FROM read_parquet('{dst}'))").fetchone()[0]
              assert dd == dd_distinct, f"partition {p}: staging still has dup rows {dd} != {dd_distinct}"
              print(f"partition {p}: raw={raw} deduped={dd}", flush=True)
              total_dedup += dd
          # 523,173 distinct h8 cells + 1 extra row for the single legitimate
          # two-ecoregion boundary cell (removes exactly 8,635 pure-duplicate rows).
          assert total_dedup == 523174, f"expected 523174 deduped rows total, got {total_dedup}"
          print(f"TOTAL deduped rows = {total_dedup} (expected 523174) OK", flush=True)
          PY

          echo "Verification passed; swapping staging -> live"
          for p in $PARTS; do
            rclone copyto "nrp:public-ca30x30/ecoregion/hex-staging/h0=${p}/data_0.parquet" \
                          "nrp:public-ca30x30/ecoregion/hex/h0=${p}/data_0.parquet"
          done
          echo "Swap complete; purging staging"
          rclone purge nrp:public-ca30x30/ecoregion/hex-staging || true
          echo "DONE"
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: '2'
            memory: 8Gi
            ephemeral-storage: 20Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
