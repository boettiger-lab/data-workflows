apiVersion: v1
data:
  epa-ecoregions-l4-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: epa-ecoregions-l4-hex
      labels:
        k8s-app: epa-ecoregions-l4-hex
    spec:
      completions: 197
      parallelism: 50
      completionMode: Indexed
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: epa-ecoregions-l4-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-ecoregion
            - name: DATASET
              value: epa-ecoregions-l4
            command:
            - bash
            - -c
            - |-
              set -e
              cng-datasets vector --input s3://public-ecoregion/epa-ecoregions-l4.parquet --output s3://public-ecoregion/epa-ecoregions-l4/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 30 --intermediate-chunk-size 10 --resolution 8 --parent-resolutions 0
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 10Gi
              limits:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 10Gi
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
      backoffLimitPerIndex: 2
      maxFailedIndexes: 0
  epa-ecoregions-l4-pmtiles.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: epa-ecoregions-l4-pmtiles
      labels:
        k8s-app: epa-ecoregions-l4-pmtiles
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: epa-ecoregions-l4-pmtiles
        spec:
          restartPolicy: Never
          containers:
          - name: pmtiles-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-ecoregion
            - name: DATASET
              value: epa-ecoregions-l4
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              # Use optimized GeoParquet (has ID column) from convert job
              # GDAL can read parquet via vsicurl
              ogr2ogr -wrapdateline -datelineoffset 15 -f GeoJSONSeq /tmp/$DATASET.geojsonl /vsicurl/https://s3-west.nrp-nautilus.io/public-ecoregion/epa-ecoregions-l4.parquet -progress

              # Generate PMTiles from GeoJSONSeq
              # TIPPECANOE_MAX_THREADS must be a power of 2; Kubernetes nodes can expose
              # non-power-of-2 logical CPU counts which triggers an internal assertion
              # failure "N shards not a power of 2" (felt/tippecanoe#216).
              # Round detected CPU count down to nearest power of 2 to preserve I/O parallelism.
              # Must be `export`ed: tippecanoe is a child process and reads this from the
              # environment, not the shell. A plain assignment is invisible to it, so it
              # falls back to the raw (non-power-of-2) CPU count and crashes (issue #77).
              export TIPPECANOE_MAX_THREADS=$(python3 -c "import os; n=os.cpu_count() or 1; print(1<<(n.bit_length()-1))")
              tippecanoe -o /tmp/$DATASET.pmtiles -l $DATASET --drop-densest-as-needed --extend-zooms-if-still-dropping --force /tmp/$DATASET.geojsonl

              # Upload to S3 using rclone
              rclone copy /tmp/$DATASET.pmtiles nrp:public-ecoregion/
              rm /tmp/$DATASET.geojsonl /tmp/$DATASET.pmtiles
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
              limits:
                cpu: '4'
                memory: 16Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  epa-ecoregions-l4-repartition.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: epa-ecoregions-l4-repartition
      labels:
        k8s-app: epa-ecoregions-l4-repartition
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: epa-ecoregions-l4-repartition
        spec:
          restartPolicy: Never
          containers:
          - name: repartition-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-ecoregion
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              cng-datasets repartition --chunks-dir s3://public-ecoregion/epa-ecoregions-l4/chunks --output-dir s3://public-ecoregion/epa-ecoregions-l4/hex --source-parquet s3://public-ecoregion/epa-ecoregions-l4.parquet --cleanup --memory-limit 27GiB
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 50Gi
              limits:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 50Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  epa-ecoregions-l4-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: epa-ecoregions-l4-setup-bucket
      labels:
        k8s-app: epa-ecoregions-l4-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: epa-ecoregions-l4-setup-bucket
        spec:
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-ecoregion
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Setting up bucket with public access and CORS..."
              cng-datasets storage setup-bucket \
                --bucket "${BUCKET}" \
                --remote nrp \
                --verify

              echo "Bucket setup complete!"
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
kind: ConfigMap
metadata:
  name: epa-ecoregions-l4-yamls
  namespace: geo-workflows
