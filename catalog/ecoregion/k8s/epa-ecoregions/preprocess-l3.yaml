# Step 1c: Level III preprocess — CONUS (ESRI:102039) + Alaska (EPSG:3338) ship in
# different projections with different attribute schemas, so reproject each to
# EPSG:4326, project down to the shared field set, stamp a `region` column, union,
# and convert to GeoParquet.  data-workflows #633
#
# Shared fields kept (11): US_L3CODE US_L3NAME NA_L3CODE NA_L3NAME NA_L2CODE
#   NA_L2NAME NA_L1CODE NA_L1NAME L3_KEY Shape_Leng Shape_Area
# Dropped (present in only one source): AK's STATE_NAME/EPA_REGION/NA_L{1,2,3}KEY,
#   CONUS's L1_KEY/L2_KEY (both derivable from the NA_L*CODE/NAME pairs).
apiVersion: batch/v1
kind: Job
metadata:
  name: epa-ecoregions-l3-preprocess
  namespace: geo-workflows
  labels:
    k8s-app: epa-ecoregions-l3-preprocess
spec:
  backoffLimit: 2
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: epa-ecoregions-l3-preprocess
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hpc-nrp-g1.nmsu.edu
                - service-02.nrp.mghpcc.org
      containers:
      - name: preprocess
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests: {memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi"}
          limits:   {memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi"}
        env:
        - {name: AWS_ACCESS_KEY_ID,     valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT,    value: "rook-ceph-rgw-nautiluss3.rook"}
        - {name: AWS_PUBLIC_ENDPOINT, value: "s3-west.nrp-nautilus.io"}
        - {name: AWS_HTTPS,          value: "false"}
        - {name: AWS_VIRTUAL_HOSTING, value: "FALSE"}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          FIELDS="US_L3CODE, US_L3NAME, NA_L3CODE, NA_L3NAME, NA_L2CODE, NA_L2NAME, NA_L1CODE, NA_L1NAME, L3_KEY, Shape_Leng, Shape_Area"
          OUT=/tmp/l3.gpkg
          LAYER=epa_ecoregions_l3

          mkdir -p /tmp/us /tmp/ak
          rclone copyto nrp:public-ecoregion/raw/us_eco_l3.zip /tmp/us_eco_l3.zip -P
          rclone copyto nrp:public-ecoregion/raw/ak_eco_l3.zip /tmp/ak_eco_l3.zip -P
          unzip -q -o /tmp/us_eco_l3.zip -d /tmp/us
          unzip -q -o /tmp/ak_eco_l3.zip -d /tmp/ak

          echo "=== CONUS -> EPSG:4326 (region=CONUS) ==="
          ogr2ogr -f GPKG "$OUT" /tmp/us/us_eco_l3.shp \
            -nln "$LAYER" -nlt PROMOTE_TO_MULTI -t_srs EPSG:4326 \
            -sql "SELECT $FIELDS, 'CONUS' AS region FROM us_eco_l3"

          echo "=== Alaska -> EPSG:4326 (region=AK), appended ==="
          ogr2ogr -f GPKG -update -append "$OUT" /tmp/ak/ak_eco_l3.shp \
            -nln "$LAYER" -nlt PROMOTE_TO_MULTI -t_srs EPSG:4326 \
            -sql "SELECT $FIELDS, 'AK' AS region FROM ak_eco_l3"

          echo "=== merged layer ==="
          ogrinfo -so -al "$OUT" "$LAYER"
          N=$(ogrinfo -so -al "$OUT" "$LAYER" | sed -n 's/^Feature Count: //p')
          echo "feature count = $N (expect 1616 = 1250 CONUS + 366 AK)"
          [ "$N" = "1616" ] || { echo "FATAL: unexpected feature count"; exit 1; }
          echo "region breakdown:"
          ogrinfo -dialect SQLite -sql "SELECT region, COUNT(*) FROM $LAYER GROUP BY region" "$OUT" | grep -A2 region

          echo "=== convert to GeoParquet ==="
          cng-convert-to-parquet "$OUT" s3://public-ecoregion/epa-ecoregions-l3.parquet \
            --layer "$LAYER" --compression ZSTD --compression-level 15 --row-group-size 2000
          echo "OK"
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
