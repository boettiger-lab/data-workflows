apiVersion: batch/v1
kind: Job
metadata:
  name: common-attributes-2026-06-pmtiles
  labels:
    k8s-app: common-attributes-2026-06-pmtiles
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: common-attributes-2026-06-pmtiles
    spec:
      restartPolicy: Never
      containers:
      - name: pmtiles-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /scratch/tmp
        - name: BUCKET
          value: public-facts
        - name: DATASET
          value: common-attributes-2026-06
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: scratch
          mountPath: /scratch
          subPath: common-attributes-2026-06-pmtiles
        command:
        - bash
        - -c
        - |
          set -e
          mkdir -p /scratch/tmp
          rm -f /scratch/$DATASET.* || true

          # 7.3M features: localize the ~20GB parquet to the PVC (internal endpoint via rclone),
          # then read locally. /vsicurl over the public endpoint is too slow/flaky at this size,
          # and the intermediate geojsonl is far larger than the 50Gi ephemeral cap -> use the PVC.
          rclone copyto nrp:public-facts/$DATASET.parquet /scratch/$DATASET.parquet

          # Trim to a curated set of map-relevant fields (keeps tiles lean; _cng_fid joins back
          # to the full 109-column GeoParquet). These fields ARE the PMTiles tile schema (#283).
          ogr2ogr -wrapdateline -datelineoffset 15 -f GeoJSONSeq /scratch/$DATASET.geojsonl \
            /scratch/$DATASET.parquet -progress \
            -select _cng_fid,ADMIN_REGION,ADMIN_FOREST,STATE_ABBR,COUNTY_NAME,ACTIVITY_CODE,ACTIVITY,METHOD,EQUIPMENT,NFPORS_CATEGORY,NFPORS_TREATMENT,PURPOSE_CODE,FISCAL_YEAR_PLANNED,FISCAL_YEAR_COMPLETED,DATE_COMPLETED,GIS_ACRES,NBR_UNITS_ACCOMPLISHED,UOM,NAME,TREATMENT_NAME,NEPA_PROJECT_NAME
          rm -f /scratch/$DATASET.parquet

          # Generate PMTiles from GeoJSONSeq
          # TIPPECANOE_MAX_THREADS must be a power of 2; Kubernetes nodes can expose
          # non-power-of-2 logical CPU counts which triggers an internal assertion
          # failure "N shards not a power of 2" (felt/tippecanoe#216).
          # Round detected CPU count down to nearest power of 2 to preserve I/O parallelism.
          # Must be `export`ed: tippecanoe is a child process and reads this from the
          # environment, not the shell. A plain assignment is invisible to it, so it
          # falls back to the raw (non-power-of-2) CPU count and crashes (issue #77).
          export TIPPECANOE_MAX_THREADS=$(python3 -c "import os; n=os.cpu_count() or 1; print(1<<(n.bit_length()-1))")
          tippecanoe -o /scratch/$DATASET.pmtiles -l $DATASET --coalesce-densest-as-needed --drop-densest-as-needed -z 13 --force /scratch/$DATASET.geojsonl

          # Upload to S3 using rclone
          rclone copy /scratch/$DATASET.pmtiles nrp:public-facts/
          rm -f /scratch/$DATASET.geojsonl /scratch/$DATASET.pmtiles
        resources:
          requests:
            cpu: '8'
            memory: 32Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '8'
            memory: 32Gi
            ephemeral-storage: 15Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: scratch
        persistentVolumeClaim:
          claimName: rechunk-scratch
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
