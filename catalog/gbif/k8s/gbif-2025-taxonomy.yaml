            580612508209905663 580647692581994495 580682876954083327
            580718061326172159 580753245698260991
          )

          H0="${H0_LIST[$JOB_COMPLETION_INDEX]}"
          echo "=== Pod $JOB_COMPLETION_INDEX: h0=${H0} ==="

          python3 - <<PYEOF
          import duckdb, os, sys

          h0 = "${H0}"
          endpoint = os.environ["AWS_S3_ENDPOINT"]
          key = os.environ["AWS_ACCESS_KEY_ID"]
          secret = os.environ["AWS_SECRET_ACCESS_KEY"]

          con = duckdb.connect()
          con.execute(f"""
              CREATE SECRET s3_secret (
                  TYPE S3, KEY_ID '{key}', SECRET '{secret}',
                  ENDPOINT '{endpoint}', URL_STYLE 'path', USE_SSL false
              )
          """)

          src = f"s3://public-gbif/2025-06/hex/h0={h0}/**/*.parquet"
          dst = f"s3://public-gbif/2025-06/taxonomy/h0={h0}/data_0.parquet"

          print(f"  Reading {src} ...", flush=True)
          con.execute(f"""
              COPY (
                  SELECT
                      kingdom, phylum, class, "order", family,
                      genus, species, infraspecificepithet,
                      taxonrank, scientificname,
                      verbatimscientificname, verbatimscientificnameauthorship,
                      COUNT(*) AS n,
                      {h0}::UBIGINT AS h0
                  FROM read_parquet('{src}', hive_partitioning=false)
                  GROUP BY ALL
              ) TO '{dst}'
              (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 1000000)
          """)
          print(f"  Written to {dst}", flush=True)
          PYEOF

          echo "=== Pod $JOB_COMPLETION_INDEX complete ==="

      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
