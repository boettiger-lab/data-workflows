apiVersion: batch/v1
kind: Job
metadata:
  name: gbif-2025-taxonomy
  namespace: biodiversity
  labels:
    k8s-app: gbif-2025-taxonomy
spec:
  completions: 122
  parallelism: 30
  completionMode: Indexed
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: gbif-2025-taxonomy
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      containers:
      - name: taxonomy
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 4Gi
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 4Gi
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |-
          set -euo pipefail

          # 94 INT64 h0 partition keys present in s3://public-gbif/2025-06/hex/
          H0_LIST=(
            576495936675512319 576531121047601151 576566305419689983
            576601489791778815 576636674163867647 576671858535956479
            576707042908045311 576742227280134143 576777411652222975
            576812596024311807 576847780396400639 576882964768489471
            576918149140578303 576953333512667135 576988517884755967
            577023702256844799 577058886628933631 577094071001022463
            577129255373111295 577164439745200127 577199624117288959
            577234808489377791 577269992861466623 577305177233555455
            577340361605644287 577375545977733119 577410730349821951
            577445914721910783 577481099093999615 577516283466088447
            577551467838177279 577586652210266111 577621836582354943
            577657020954443775 577692205326532607 577727389698621439
            577762574070710271 577797758442799103 577832942814887935
            577868127186976767 577903311559065599 577938495931154431
            577973680303243263 578008864675332095 578044049047420927
            578079233419509759 578114417791598591 578149602163687423
            578184786535776255 578219970907865087 578255155279953919
            578290339652042751 578325524024131583 578360708396220415
            578395892768309247 578431077140398079 578466261512486911
            578501445884575743 578536630256664575 578571814628753407
            578606999000842239 578642183372931071 578677367745019903
            578712552117108735 578747736489197567 578782920861286399
            578818105233375231 578853289605464063 578888473977552895
            578923658349641727 578958842721730559 578994027093819391
            579029211465908223 579064395837997055 579099580210085887
            579134764582174719 579169948954263551 579205133326352383
            579240317698441215 579275502070530047 579310686442618879
