apiVersion: batch/v1
kind: Job
metadata:
  name: tree-cover-loss-loss-year-hex
  namespace: geo-workflows
  labels:
    k8s-app: tree-cover-loss-loss-year-hex
spec:
  completions: 122
  parallelism: 40
  completionMode: Indexed
  backoffLimitPerIndex: 3
  maxFailedIndexes: 1
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: tree-cover-loss-loss-year-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: BUCKET
          value: public-forest-change
        - name: CNG_HEX_WORKERS
          value: '4'
        - name: CNG_HEX_CHUNK_SIZE
          value: '100000'
        - name: CNG_POD_CPU
          value: '4'
        - name: DUCKDB_MEMORY_LIMIT
          value: 8704MiB
        - name: GDAL_CACHEMAX
          value: '512'
        command:
        - bash
        - -c
        - |-
          set -e

          cng-datasets raster --input "https://s3-west.nrp-nautilus.io/public-forest-change/tree-cover-loss/loss-year-cog.tif" --output-parquet s3://public-forest-change/tree-cover-loss/loss-year/hex/ --h0-index ${JOB_COMPLETION_INDEX} --resolution 8 --parent-resolutions 0 --value-column loss_year --hex-resampling fractions --nodata "255"
        resources:
          requests:
            cpu: '4'
            memory: 10Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: '4'
            memory: 10Gi
            ephemeral-storage: 20Gi
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
