# DEVIATION from gbif/2026-09/gbif-2026-09-sidecar.yaml (data-workflows#697): a re-run of that job after the hex repair moved
# rows between h0 partitions, which changes species-h0-index.parquet. Same script and output path;
# only the name, TTL and retries differ, and it runs at priorityClassName: opportunistic.
# The original runs at default priority with requests that were never measured, which
# NRP's usage policy does not allow; opportunistic pods are exempt and this job is safe to
# retry (skill pod-preemption).
apiVersion: batch/v1
kind: Job
metadata:
  name: h3-reparent-697-gbif-species-index
  namespace: geo-workflows
  labels:
    k8s-app: h3-reparent-697-gbif-species-index
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        k8s-app: h3-reparent-697-gbif-species-index
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values: ["true"]
      containers:
      - name: build-index
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests: {cpu: "8", memory: 48Gi, ephemeral-storage: 20Gi}
          limits:   {cpu: "8", memory: 48Gi, ephemeral-storage: 50Gi}
        env:
        - name: SRC_HEX
          value: 's3://public-gbif/2026-09/hex/h0=*/data_0.parquet'
        - name: DST_SIDECAR
          value: 's3://public-gbif/2026-09/species-h0-index.parquet'
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        command:
        - bash
        - -c
        - |-
          set -e
          python3 - <<'PYEOF'
          import duckdb, os
          src=os.environ["SRC_HEX"]; dst=os.environ["DST_SIDECAR"]
          key=os.environ["AWS_ACCESS_KEY_ID"]; secret=os.environ["AWS_SECRET_ACCESS_KEY"]
          endpoint=os.environ.get("AWS_S3_ENDPOINT","rook-ceph-rgw-nautiluss3.rook")
          con=duckdb.connect()
          con.execute("INSTALL httpfs; LOAD httpfs")
          con.execute("SET http_retries=10; SET http_retry_wait_ms=3000")
          con.execute(f"CREATE SECRET s3_secret (TYPE S3, KEY_ID '{key}', SECRET '{secret}', ENDPOINT '{endpoint}', URL_STYLE 'path', USE_SSL false)")
          # distinct (specieskey, species, h0); species can be NULL (genus-level records) -> kept.
          con.execute(f"""
              COPY (
                  SELECT DISTINCT specieskey, species, h0
                  FROM read_parquet('{src}', hive_partitioning=true)
                  WHERE specieskey IS NOT NULL
                  ORDER BY specieskey
              ) TO '{dst}' (FORMAT PARQUET, COMPRESSION ZSTD)
          """)
          n, sp = con.execute(f"SELECT COUNT(*), COUNT(DISTINCT specieskey) FROM read_parquet('{dst}')").fetchone()
          print(f"  sidecar rows={n} species={sp}")
          assert n > 100000, "sidecar suspiciously small"
          print("  OK")
          PYEOF
