# HAND-ROLLED: cng-datasets has no step that re-derives parent H3 columns on an already-published
# hex and moves rows between h0 partitions; this repairs a bespoke build (data-workflows#697).
# GBIF stage 2 (merge): assembles one target partition: the rows that stayed (original order), then incoming rows
# sorted by the native cell. The incoming-row sort spills to the rechunk-scratch PVC.
# Reads s3://public-gbif/2026-09/hex/; writes only s3://public-gbif/2026-09-reparent-697/ (staging, never published).
# Priority: opportunistic. Each pod runs well under an hour (the largest GBIF partition is 27 GB),
# so it is exempt from the usage policy and its preemption exposure is small (skill pod-preemption).
# A failed index leaves a gap in staging, which the verification and the merge row counts catch.
apiVersion: batch/v1
kind: Job
metadata:
  name: h3-reparent-697-gbif-merge
  namespace: geo-workflows
  labels:
    k8s-app: h3-reparent-697-gbif-merge
spec:
  completions: 122
  parallelism: 12
  completionMode: Indexed
  backoffLimitPerIndex: 3
  maxFailedIndexes: 10
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        k8s-app: h3-reparent-697-gbif-merge
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values: ["true"]
      containers:
        - name: reparent
          image: ghcr.io/boettiger-lab/datasets:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: scratch
              mountPath: /scratch
          env:
            - name: MODE
              value: "merge"
            - name: BUCKET
              value: "public-gbif"
            - name: SRC_PREFIX
              value: "2026-09/hex"
            - name: STAGE_PREFIX
              value: "2026-09-reparent-697"
            - name: NATIVE
              value: "h10"
            - name: DUCKDB_MEMORY_LIMIT
              value: "24GB"
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
            - name: AWS_S3_ENDPOINT
              value: "rook-ceph-rgw-nautiluss3.rook"
            - name: AWS_HTTPS
              value: "false"
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          resources:
            requests: {cpu: "4", memory: 32Gi, ephemeral-storage: 30Gi}
            limits:   {cpu: "4", memory: 38Gi, ephemeral-storage: 36Gi}
          command:
            - bash
            - -lc
            - |
              set -e
              export DUCKDB_TEMP=/scratch/h3-reparent-697-gbif-merge-$JOB_COMPLETION_INDEX
              pip install -q boto3 pyarrow
              python3 -u /scripts/reparent.py
      volumes:
        - name: scripts
          configMap:
            name: h3-reparent-697-scripts
        - name: scratch
          persistentVolumeClaim:
            claimName: rechunk-scratch
