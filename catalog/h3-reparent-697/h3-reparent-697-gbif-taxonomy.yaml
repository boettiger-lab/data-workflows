# DEVIATION from gbif/2026-09/gbif-2026-09-taxonomy.yaml (data-workflows#697): a re-run of that job after the hex repair moved
# rows between h0 partitions, which changes taxonomy/h0=*/ counts per h0. Same script and output path;
# only the name, TTL and retries differ, and it runs at priorityClassName: opportunistic.
# The original runs at default priority with requests that were never measured, which
# NRP's usage policy does not allow; opportunistic pods are exempt and this job is safe to
# retry (skill pod-preemption).
apiVersion: batch/v1
kind: Job
metadata:
  name: h3-reparent-697-gbif-taxonomy
  namespace: geo-workflows
  labels:
    k8s-app: h3-reparent-697-gbif-taxonomy
spec:
  completions: 122
  parallelism: 20
  completionMode: Indexed
  backoffLimitPerIndex: 3
  maxFailedIndexes: 5
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        k8s-app: h3-reparent-697-gbif-taxonomy
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values: ['true']
      containers:
      - name: taxonomy
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests: {cpu: '4', memory: 16Gi, ephemeral-storage: 4Gi}
          limits:   {cpu: '4', memory: 16Gi, ephemeral-storage: 4Gi}
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          python3 - <<'PYEOF'
          import duckdb, os, sys
          idx = int(os.environ["JOB_COMPLETION_INDEX"])
          key = os.environ["AWS_ACCESS_KEY_ID"]; secret = os.environ["AWS_SECRET_ACCESS_KEY"]
          endpoint = os.environ["AWS_S3_ENDPOINT"]
          con = duckdb.connect()
          con.execute("INSTALL httpfs; LOAD httpfs")
          con.execute("SET http_retries=10; SET http_retry_wait_ms=3000")
          con.execute(f"CREATE SECRET s3_secret (TYPE S3, KEY_ID '{key}', SECRET '{secret}', ENDPOINT '{endpoint}', URL_STYLE 'path', USE_SSL false)")
          h0s = [r[0] for r in con.execute(
              "SELECT DISTINCT regexp_extract(file,'h0=([0-9]+)',1) AS h0 "
              "FROM glob('s3://public-gbif/2026-09/hex/h0=*/data_0.parquet') ORDER BY h0").fetchall()]
          if idx >= len(h0s):
              print(f"idx {idx} >= {len(h0s)} partitions; nothing to do"); sys.exit(0)
          h0 = h0s[idx]
          src = f"s3://public-gbif/2026-09/hex/h0={h0}/data_0.parquet"
          dst = f"s3://public-gbif/2026-09/taxonomy/h0={h0}/data_0.parquet"
          print(f"idx {idx}: {src} -> {dst}", flush=True)
          con.execute(f"""
              COPY (
                  SELECT kingdom, phylum, class, "order", family,
                         genus, species, infraspecificepithet,
                         taxonrank, scientificname,
                         verbatimscientificname, verbatimscientificnameauthorship,
                         COUNT(*) AS n,
                         {h0}::UBIGINT AS h0
                  FROM read_parquet('{src}')
                  GROUP BY ALL
              ) TO '{dst}' (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 1000000)
          """)
          print(f"idx {idx}: done", flush=True)
          PYEOF
