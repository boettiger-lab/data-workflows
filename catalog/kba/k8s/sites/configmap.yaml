  kba-2026-03-sites-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: kba-2026-03-sites-setup-bucket
      labels:
        k8s-app: kba-2026-03-sites-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: kba-2026-03-sites-setup-bucket
        spec:
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
