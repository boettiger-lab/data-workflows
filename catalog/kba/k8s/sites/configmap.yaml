# Auto-generated ConfigMap containing job definitions
# Generated from: kba-2026-03-sites-setup-bucket.yaml, kba-2026-03-sites-convert.yaml, kba-2026-03-sites-pmtiles.yaml, kba-2026-03-sites-hex.yaml, kba-2026-03-sites-repartition.yaml
# Generation command: cng-datasets workflow --dataset kba-2026-03/sites --source-url s3://public-kba/kba-2026-03/sites.parquet --bucket public-kba --h3-resolution 8 --parent-resolutions "0"
#
# This ConfigMap is equivalent to running:
#   kubectl create configmap kba-2026-03-sites-yamls \
#     --from-file=kba-2026-03-sites-setup-bucket.yaml \
#     --from-file=kba-2026-03-sites-convert.yaml \
#     --from-file=kba-2026-03-sites-pmtiles.yaml \
#     --from-file=kba-2026-03-sites-hex.yaml \
#     --from-file=kba-2026-03-sites-repartition.yaml
#
# To update: regenerate workflow with cng-datasets and re-apply with kubectl apply -f configmap.yaml
apiVersion: v1
data:
  kba-2026-03-sites-convert.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: kba-2026-03-sites-convert
      labels:
        k8s-app: kba-2026-03-sites-convert
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: kba-2026-03-sites-convert
        spec:
          restartPolicy: Never
          containers:
          - name: convert-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-kba
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -euo pipefail
              # KBA ships TWO layers with different schemas (POL: 16,222 polygons;
              # PNT: 287 point-only sites). Harmonize to a common column set (site
              # area unified to AreaKM2), normalize the upstream "nan" sentinels to
              # NULL, unify KbaStatus case, merge into ONE mixed-geometry FlatGeobuf,
              # then convert. Result: 16,509 sites, one row each. See
              # kba-2026-03-sites-convert.yaml for the canonical copy of this step.
              mkdir -p /tmp/raw
              rclone copy nrp:public-kba/raw/ /tmp/raw/ \
                --include "KBAsGlobal_2026_March_01_POL.*" \
                --include "KBAsGlobal_2026_March_01_PNT.*"
              cd /tmp/raw
              ogr2ogr -f FlatGeobuf -dialect SQLITE -nlt GEOMETRY -nln sites /tmp/sites.fgb \
                KBAsGlobal_2026_March_01_POL.shp \
                -sql "SELECT SitRecID, Region, Country, ISO3, NatName, IntName, SitLat, SitLong, SitAreaKM2 AS AreaKM2, 'Confirmed' AS KbaStatus, NULLIF(KbaClass,'nan') AS KbaClass, NULLIF(IbaStatus,'nan') AS IbaStatus, NULLIF(LegacyKba,'nan') AS LegacyKba, NULLIF(AzeStatus,'nan') AS AzeStatus, LastUpdate, Source, 'polygon' AS geom_type, geometry FROM KBAsGlobal_2026_March_01_POL"
              ogr2ogr -f FlatGeobuf -dialect SQLITE -nlt GEOMETRY -nln sites -append -update /tmp/sites.fgb \
                KBAsGlobal_2026_March_01_PNT.shp \
                -sql "SELECT SitRecID, Region, Country, ISO3, NatName, IntName, SitLat, SitLong, RepAreaKM2 AS AreaKM2, 'Confirmed' AS KbaStatus, NULLIF(KbaClass,'nan') AS KbaClass, NULLIF(IbaStatus,'nan') AS IbaStatus, NULLIF(LegacyKba,'nan') AS LegacyKba, NULLIF(AzeStatus,'nan') AS AzeStatus, LastUpdate, Source, 'point' AS geom_type, geometry FROM KBAsGlobal_2026_March_01_PNT"
              cng-convert-to-parquet /tmp/sites.fgb \
                s3://public-kba/kba-2026-03/sites.parquet \
                --row-group-size 2000
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
              limits:
                cpu: '4'
                memory: 32Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  kba-2026-03-sites-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: kba-2026-03-sites-hex
      labels:
        k8s-app: kba-2026-03-sites-hex
    spec:
      completions: 200
      parallelism: 50
      completionMode: Indexed
      backoffLimit: 0
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: kba-2026-03-sites-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-kba
            - name: DATASET
              value: kba-2026-03-sites
            command:
            - bash
            - -c
            - |-
              set -e
              cng-datasets vector --input s3://public-kba/kba-2026-03/sites.parquet --output s3://public-kba/kba-2026-03/sites/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 1000 --intermediate-chunk-size 10 --resolution 8 --parent-resolutions 0
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 10Gi
              limits:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 10Gi
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  kba-2026-03-sites-pmtiles.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: kba-2026-03-sites-pmtiles
      labels:
        k8s-app: kba-2026-03-sites-pmtiles
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: kba-2026-03-sites-pmtiles
        spec:
          restartPolicy: Never
          containers:
          - name: pmtiles-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-kba
            - name: DATASET
              value: sites
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              # Use optimized GeoParquet (has ID column) from convert job
              # GDAL can read parquet via vsicurl
              ogr2ogr -wrapdateline -datelineoffset 15 -f GeoJSONSeq /tmp/$DATASET.geojsonl /vsicurl/https://s3-west.nrp-nautilus.io/public-kba/kba-2026-03/sites.parquet -progress

              # Generate PMTiles from GeoJSONSeq
              # TIPPECANOE_MAX_THREADS must be a power of 2; Kubernetes nodes can expose
              # non-power-of-2 logical CPU counts which triggers an internal assertion
              # failure "N shards not a power of 2" (felt/tippecanoe#216).
              # Round detected CPU count down to nearest power of 2 to preserve I/O parallelism.
              # Must be `export`ed: tippecanoe is a child process and reads this from the
              # environment, not the shell. A plain assignment is invisible to it, so it
              # falls back to the raw (non-power-of-2) CPU count and crashes (issue #77).
              export TIPPECANOE_MAX_THREADS=$(python3 -c "import os; n=os.cpu_count() or 1; print(1<<(n.bit_length()-1))")

              # Raise the soft open-file limit before tippecanoe (issue #154). It opens many
              # temp files (per-thread x per-tile shards); on high-core nodes os.cpu_count()
              # reports the node's full core count, so the thread/shard count blows past the
              # container's default soft nofile limit (often 1024) and aborts with
              # "Too many open files". `|| true` keeps going if the limit can't be raised.
              ulimit -n 65536 || true
              tippecanoe -o /tmp/$DATASET.pmtiles -l $DATASET --coalesce-densest-as-needed --drop-densest-as-needed -z 11 --force /tmp/$DATASET.geojsonl

              # Upload to S3 using rclone
              rclone copy /tmp/$DATASET.pmtiles nrp:public-kba/kba-2026-03/
              rm /tmp/$DATASET.geojsonl /tmp/$DATASET.pmtiles
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
              limits:
                cpu: '4'
                memory: 32Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
