apiVersion: batch/v1
kind: Job
metadata:
  name: ugs-mineral-occurrences-convert
  labels:
    k8s-app: ugs-mineral-occurrences-convert
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: ugs-mineral-occurrences-convert
    spec:
      restartPolicy: Never
      containers:
      - name: convert-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-utah
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          # Localize the GeoJSON first: cng-convert reads the source via GDAL ST_Read,
          # which cannot open a GeoJSON over s3:// (the flaky /vsis3 path). A local file
          # read always works; the parquet OUTPUT still writes to s3:// over httpfs.
          rclone copyto nrp:public-utah/raw/ugs-mineral-occurrences.geojson /tmp/ugs-mineral-occurrences.geojson
          cng-convert-to-parquet \
            /tmp/ugs-mineral-occurrences.geojson \
            s3://public-utah/ugs-mineral-occurrences.parquet \
            --row-group-size 100000
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
          limits:
            cpu: '4'
            memory: 16Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
