data:
  ugs_uranium_stage.py: |
    #!/usr/bin/env python3
    """Stage one UGS uranium layer from its ArcGIS REST FeatureServer to a GeoJSON (issue #708).

    Paginates the layer (`resultOffset`, `outSR=4326`, `f=geojson`), drops Esri internals
    (OBJECTID, Shape__Area, Shape__Length -- the shape fields are in the service's internal
    storage units and are not usable areas/lengths), strips the fixed-width space padding the
    SGID Forklift ETL leaves on string fields, collapses empty-after-strip to null, and writes
    a single GeoJSON to `out_path`. A count assertion fails loudly if the service
    under-delivered vs the counts verified 2026-09-22.

    Everything else is preserved VERBATIM. In particular, on `past-producers` the USGS
    CRIB/NURE production and reserve fields (`*_AMT`, `*_U`, `*_ITEM`, `*_ACC`, `*_YEAR`,
    `*_GRADE`) are parallel PACKED MULTI-VALUE strings delimited by U+00FD ('ý'), and are
    typed String upstream even where they hold amounts. They are never cast, split or summed
    here: units vary within a single record (one AP_AMT mixes LB and ST), unit tokens are
    inconsistent across records (LB/LBS/ST/TONS), the amounts mix commodities (U, V, ORE U,
    CON U), and element counts disagree between _AMT/_U/_ITEM in 30 records, so even
    positional zipping is unsafe. See the issue #708 comment for the full analysis.

    Usage:  ugs_uranium_stage.py <layer> <out_path>
            <layer> in {districts, area-boundaries, past-producers, permitted-mines, mills}
    """
    import json
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    BASE = ("https://services1.arcgis.com/99lidPhWCzftIe9K/arcgis/rest/services"
            "/{service}/FeatureServer/0")

    # Esri internals dropped from every layer. Shape__Area/Shape__Length are in the service's
    # internal storage units, not m2/m, so publishing them would invite wrong area math.
    DROP = {"OBJECTID", "Shape__Area", "Shape__Length"}

    # `expect` verified against returnCountOnly on 2026-09-22.
    LAYERS = {
        "districts":       {"service": "UraniumDistricts_UGS",   "expect": 58},
        "area-boundaries": {"service": "UraniumAreaBoundaries",  "expect": 15},
        "past-producers":  {"service": "UraniumPastProducers",   "expect": 748},
        "permitted-mines": {"service": "PermittedUraniumMines",  "expect": 25},
        "mills":           {"service": "UraniumMills",           "expect": 2},
    }

    PAGE = 500


    def _fetch(url, tries=6):
        """GET with exponential backoff: the AGOL service intermittently 503s or times
        out, and one transient blip must not lose the whole scrape."""
        for attempt in range(1, tries + 1):
            try:
                with urllib.request.urlopen(url, timeout=300) as r:
                    return json.load(r)
            except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError,
                    json.JSONDecodeError) as e:
                if attempt == tries:
                    raise
                wait = min(60, 2 ** attempt)
                print(f"  retry {attempt}/{tries} after {type(e).__name__} ({e}); "
                      f"sleep {wait}s", file=sys.stderr, flush=True)
                time.sleep(wait)


    def main():
        layer, out = sys.argv[1], sys.argv[2]
        cfg = LAYERS[layer]
        base = BASE.format(service=cfg["service"])

        feats, offset = [], 0
        while True:
            q = {
                "where": "1=1", "outFields": "*", "outSR": "4326", "f": "geojson",
                "resultOffset": offset, "resultRecordCount": PAGE, "returnGeometry": "true",
            }
            d = _fetch(f"{base}/query?" + urllib.parse.urlencode(q))
            batch = d.get("features", [])
            exceeded = (d.get("properties", {}) or {}).get("exceededTransferLimit") \
                or d.get("exceededTransferLimit")
            for feat in batch:
                src = feat.get("properties", {}) or {}
                props = {}
                for k, v in src.items():
                    if k in DROP:
                        continue
                    if isinstance(v, str):
                        # Fixed-width space padding from the Forklift ETL. Strip the outer
                        # padding only; the internal 'ý' packing is left exactly as found.
                        v = v.strip() or None
                    props[k] = v
                feat["properties"] = props
            feats.extend(batch)
            print(f"  offset {offset}: +{len(batch)} (total {len(feats)})", file=sys.stderr)
            if not batch:
                break
            if len(batch) < PAGE and not exceeded:
                break
            offset += len(batch)

        fc = {"type": "FeatureCollection",
              "crs": {"type": "name",
                      "properties": {"name": "urn:ogc:def:crs:OGC:1.3:CRS84"}},
              "features": feats}
        with open(out, "w") as fh:
            json.dump(fc, fh)

        n_geom = sum(1 for f in feats if f.get("geometry"))
        print(f"WROTE {len(feats)} features -> {out}  ({n_geom} with geometry)",
              file=sys.stderr)
        assert len(feats) == cfg["expect"], \
            f"{layer}: expected {cfg['expect']} features, got {len(feats)}"
        assert n_geom == len(feats), \
            f"{layer}: {len(feats) - n_geom} features have null geometry"


    if __name__ == "__main__":
        main()
