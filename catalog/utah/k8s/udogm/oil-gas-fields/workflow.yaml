apiVersion: batch/v1
kind: Job
metadata:
  name: udogm-oil-gas-fields-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "\nset -e\n\necho \"Starting udogm-oil-gas-fields workflow...\"\n\n# Step\
          \ 0: Setup bucket with public access and CORS\necho \"Step 0: Setting up\
          \ bucket...\"\nkubectl apply -f /yamls/udogm-oil-gas-fields-setup-bucket.yaml\
          \ -n geo-workflows\n\necho \"Waiting for bucket setup to complete...\"\n\
          kubectl wait --for=condition=complete --timeout=600s job/udogm-oil-gas-fields-setup-bucket\
          \ -n geo-workflows\n\n# Step 1: Convert to optimized GeoParquet (needed\
          \ by both pmtiles and hex jobs)\necho \"Step 1: Converting to optimized\
          \ GeoParquet...\"\nkubectl apply -f /yamls/udogm-oil-gas-fields-convert.yaml\
          \ -n geo-workflows\n\necho \"Waiting for GeoParquet conversion to complete...\"\
          \nkubectl wait --for=condition=complete --timeout=3600s job/udogm-oil-gas-fields-convert\
          \ -n geo-workflows\n\n# Step 2: Run pmtiles and hex tiling in parallel (both\
          \ use the converted geoparquet)\necho \"Step 2: H3 hexagonal tiling and\
          \ PMTiles generation (parallel)...\"\nkubectl apply -f /yamls/udogm-oil-gas-fields-pmtiles.yaml\
          \ -n geo-workflows\nkubectl apply -f /yamls/udogm-oil-gas-fields-hex.yaml\
          \ -n geo-workflows\n\necho \"Waiting for hex tiling to complete (PMTiles\
          \ continues in background)...\"\necho \"Timeout set to 48 hours (172800s)...\"\
          \nkubectl wait --for=condition=complete --timeout=172800s job/udogm-oil-gas-fields-hex\
          \ -n geo-workflows\n\necho \"Step 3: Repartitioning by h0...\"\nkubectl\
          \ apply -f /yamls/udogm-oil-gas-fields-repartition.yaml -n geo-workflows\n\
          \necho \"Waiting for repartition to complete...\"\nkubectl wait --for=condition=complete\
          \ --timeout=3600s job/udogm-oil-gas-fields-repartition -n geo-workflows\n\
          \necho \"\u2713 Workflow complete!\"\necho \"Note: PMTiles job may still\
          \ be running in the background\"\necho \"\"\necho \"Clean up with:\"\necho\
          \ \"  kubectl delete jobs udogm-oil-gas-fields-setup-bucket udogm-oil-gas-fields-convert\
          \ udogm-oil-gas-fields-pmtiles udogm-oil-gas-fields-hex udogm-oil-gas-fields-repartition\
          \ udogm-oil-gas-fields-workflow -n geo-workflows\"\necho \"  kubectl delete\
          \ configmap udogm-oil-gas-fields-yamls -n geo-workflows\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: udogm-oil-gas-fields-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
