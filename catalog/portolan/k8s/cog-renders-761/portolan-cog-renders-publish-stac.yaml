# HAND-ROLLED: the generator does not write STAC. A metadata-only fix (#761), Portolan PTL-VIZ-002:
# a `renders` entry for the 6 COGs that had none, in public-iucn (5 richness layers) and
# public-hazard/mid-century-habitat-climate-exposure (MIROC). Rescales are measured; see
# add_renders.py. It edits each LIVE collection, so nothing else changes.
#   kubectl create configmap portolan-cog-renders-script -n geo-workflows \
#     --from-file=catalog/portolan/k8s/cog-renders-761/add_renders.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/portolan/k8s/cog-renders-761/portolan-cog-renders-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: portolan-cog-renders-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: portolan-cog-renders-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: portolan-cog-renders-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }
          for k in public-iucn public-hazard/mid-century-habitat-climate-exposure; do
            p="$k/stac-collection.json"
            rclone cat "nrp:$p" > /tmp/c.json
            python3 /script/add_renders.py /tmp/c.json "$k"
            guard_stac /tmp/c.json "nrp:$p"
            rclone copyto /tmp/c.json "nrp:$p" $R
          done
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: portolan-cog-renders-script}}
