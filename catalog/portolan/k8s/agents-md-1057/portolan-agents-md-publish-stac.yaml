# HAND-ROLLED: the generator does not write STAC. A metadata-only fix (#1057), Portolan
# PTL-FIL-001/002: every catalog and collection has an AGENTS.md beside its STAC file, linked as
# rel: agents. One generic AGENTS.md (decided on #1057) is uploaded to each of the 545 folders of
# the 551 nodes in stac-files.txt (crawled 2026-11-25), all of them before any link is added,
# then fix_agents.py adds the relative link to each LIVE file. Files it leaves unchanged are not
# uploaded.
#   kubectl create configmap portolan-agents-md-script -n geo-workflows \
#     --from-file=AGENTS.md=catalog/portolan/k8s/agents-md-1057/catalog-agents.md \
#     --from-file=catalog/portolan/k8s/agents-md-1057/fix_agents.py \
#     --from-file=catalog/portolan/k8s/agents-md-1057/stac-files.txt \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/portolan/k8s/agents-md-1057/portolan-agents-md-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: portolan-agents-md-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: portolan-agents-md-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: portolan-agents-md-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3000
      priorityClassName: opportunistic
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/guard.py || exit 1
          cp /script/AGENTS.md /tmp/AGENTS.md   # a ConfigMap file is a symlink, which rclone skips
          put() {  # put <folder>: upload AGENTS.md beside the folder's STAC files
            set -euo pipefail
            rclone copyto /tmp/AGENTS.md "nrp:$1/AGENTS.md" --retries 10 --low-level-retries 20 --retries-sleep 20s
            echo "PUT $1"
          }
          one() {  # one <bucket/key>: link the AGENTS.md in the live file, guard it, upload it
            set -euo pipefail
            p="$1"; t=$(mktemp -d)
            rclone cat "nrp:$p" > "$t/live.json"
            rc=0; python3 /script/fix_agents.py "$t/live.json" "$t/new.json" "https://s3-west.nrp-nautilus.io/$p" || rc=$?
            if [ "$rc" = 3 ]; then echo "SAME $p"; rm -rf "$t"; return 0; fi
            [ "$rc" = 0 ] || { echo "FAIL fix $p"; return 1; }
            python3 /tmp/guard.py "$t/new.json" "$t/live.json" || { echo "FAIL guard $p"; return 1; }
            rclone copyto "$t/new.json" "nrp:$p" --retries 10 --low-level-retries 20 --retries-sleep 20s
            echo "DONE $p"; rm -rf "$t"
          }
          export -f put one
          grep -v '^$' /script/stac-files.txt | sed 's|/[^/]*$||' | sort -u \
            | xargs -P 8 -I{} bash -c 'put "$1" || echo "FAILPUT $1"' _ {} > /tmp/put.log 2>&1 || true
          echo "PUT $(grep -c '^PUT' /tmp/put.log)  FAILPUT $(grep -c '^FAILPUT' /tmp/put.log)"
          if grep -q '^FAILPUT' /tmp/put.log; then cat /tmp/put.log; exit 1; fi
          grep -v '^$' /script/stac-files.txt | xargs -P 8 -I{} bash -c 'one "$1" || echo "FAIL $1"' _ {} > /tmp/log 2>&1 || true
          cat /tmp/log
          echo "DONE $(grep -c '^DONE' /tmp/log)  SAME $(grep -c '^SAME' /tmp/log)  FAIL $(grep -c '^FAIL' /tmp/log)"
          ! grep -q '^FAIL' /tmp/log
        resources:
          requests: {cpu: '2', memory: 2Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '2', memory: 2Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: portolan-agents-md-script}}
