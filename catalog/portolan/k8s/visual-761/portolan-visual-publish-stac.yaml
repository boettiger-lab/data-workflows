# HAND-ROLLED: the generator does not write STAC. A metadata-only fix (#761), Portolan PTL-AST-009:
# every PMTiles asset carries the `visual` role. fix_visual.py edits each LIVE file in
# stac-files.txt (52 assets in 41 collections, crawled 2026-11-24), appending `visual` and keeping
# the asset's other roles. Files it leaves unchanged are not uploaded.
#   kubectl create configmap portolan-visual-script -n geo-workflows \
#     --from-file=catalog/portolan/k8s/visual-761/fix_visual.py \
#     --from-file=catalog/portolan/k8s/visual-761/stac-files.txt \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/portolan/k8s/visual-761/portolan-visual-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: portolan-visual-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: portolan-visual-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: portolan-visual-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3000
      priorityClassName: opportunistic
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/guard.py || exit 1
          one() {  # one <bucket/key>: fix the live file, guard it, upload it if it changed
            set -euo pipefail
            p="$1"; t=$(mktemp -d)
            rclone cat "nrp:$p" > "$t/live.json"
            rc=0; python3 /script/fix_visual.py "$t/live.json" "$t/new.json" || rc=$?
            if [ "$rc" = 3 ]; then echo "SAME $p"; rm -rf "$t"; return 0; fi
            [ "$rc" = 0 ] || { echo "FAIL fix $p"; return 1; }
            python3 /tmp/guard.py "$t/new.json" "$t/live.json" || { echo "FAIL guard $p"; return 1; }
            rclone copyto "$t/new.json" "nrp:$p" --retries 10 --low-level-retries 20 --retries-sleep 20s
            echo "DONE $p"; rm -rf "$t"
          }
          export -f one
          grep -v '^$' /script/stac-files.txt | xargs -P 8 -I{} bash -c 'one "$1" || echo "FAIL $1"' _ {} > /tmp/log 2>&1 || true
          cat /tmp/log
          echo "DONE $(grep -c '^DONE' /tmp/log)  SAME $(grep -c '^SAME' /tmp/log)  FAIL $(grep -c '^FAIL' /tmp/log)"
          ! grep -q '^FAIL' /tmp/log
        resources:
          requests: {cpu: '2', memory: 2Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '2', memory: 2Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: portolan-visual-script}}
