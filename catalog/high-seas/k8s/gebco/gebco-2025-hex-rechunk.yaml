apiVersion: batch/v1
kind: Job
metadata:
  name: gebco-2025-hex-rechunk
  labels:
    k8s-app: gebco-2025-hex-rechunk
spec:
  completions: 18
  parallelism: 18
  completionMode: Indexed
  backoffLimit: 0
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: gebco-2025-hex-rechunk
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: BUCKET
          value: public-high-seas
        command:
        - bash
        - -c
        - |-
          set -e

          # Locate PROJ database dynamically to avoid version mismatches
          PROJ_DB=$(find /usr /opt -name "proj.db" 2>/dev/null | head -1)
          if [ -n "$PROJ_DB" ]; then
            export PROJ_DATA="$(dirname $PROJ_DB)"
            export PROJ_LIB="$PROJ_DATA"
          fi

          CHUNK_MAP=(8 17 19 27 28 35 42 73 76 77 87 98 104 105 110 115 120 121)
          H0_INDEX=${CHUNK_MAP[$JOB_COMPLETION_INDEX]}
          echo "Reprocessing h0 cell ${H0_INDEX} (job index ${JOB_COMPLETION_INDEX})"

          cng-datasets raster --input "s3://public-high-seas/gebco-2025-cog.tif" \
            --output-parquet s3://public-high-seas/gebco-2025/hex/ \
            --h0-index ${H0_INDEX} \
            --resolution 8 \
            --parent-resolutions 5,6,7,0 \
            --value-column elevation
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 50Gi
          limits:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 50Gi
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
