apiVersion: batch/v1
kind: Job
metadata:
  name: gebco-2025-download
  labels:
    k8s-app: gebco-2025-download
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: gebco-2025-download
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: download-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-high-seas
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          BASE="https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2025/sub_ice_topography_bathymetry/geotiff"
          TILES=(
            "gebco_2025_sub_ice_n0.0_s-90.0_w-180.0_e-90.0.tif"
            "gebco_2025_sub_ice_n0.0_s-90.0_w-90.0_e0.0.tif"
            "gebco_2025_sub_ice_n0.0_s-90.0_w0.0_e90.0.tif"
            "gebco_2025_sub_ice_n0.0_s-90.0_w90.0_e180.0.tif"
            "gebco_2025_sub_ice_n90.0_s0.0_w-180.0_e-90.0.tif"
            "gebco_2025_sub_ice_n90.0_s0.0_w-90.0_e0.0.tif"
            "gebco_2025_sub_ice_n90.0_s0.0_w0.0_e90.0.tif"
            "gebco_2025_sub_ice_n90.0_s0.0_w90.0_e180.0.tif"
          )
          mkdir -p /tmp/gebco
          echo "Downloading 8 GEBCO 2025 sub-ice topography tiles in parallel..."
          for tile in "${TILES[@]}"; do
            curl -L --retry 5 -o "/tmp/gebco/${tile}" "${BASE}/${tile}" &
          done
          wait
          echo "All downloads complete. Uploading to S3..."
          rclone copy /tmp/gebco/ nrp:public-high-seas/raw/gebco-2025/ --progress
          echo "Upload complete."
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 50Gi
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 50Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
