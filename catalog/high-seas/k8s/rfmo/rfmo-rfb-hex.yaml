apiVersion: batch/v1
kind: Job
metadata:
  name: rfmo-rfb-hex
  labels:
    k8s-app: rfmo-rfb-hex
spec:
  completions: 105
  parallelism: 50
  completionMode: Indexed
  # #325: CCAMLR (index for a valid, mid-size polygon) dropped because backoffLimit:0
  # never retried its transient chunk failure. Per-index retry fixes that.
  backoffLimitPerIndex: 3
  maxFailedIndexes: 10
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: rfmo-rfb-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-high-seas
        - name: DATASET
          value: rfmo-rfb
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector --input s3://public-high-seas/rfmo/rfb.parquet --output s3://public-high-seas/rfmo/rfb/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 1 --intermediate-chunk-size 10 --resolution 8 --parent-resolutions 0
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
          limits:
            cpu: '4'
            memory: 32Gi
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
