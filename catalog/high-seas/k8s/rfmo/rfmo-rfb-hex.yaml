apiVersion: batch/v1
kind: Job
metadata:
  name: rfmo-rfb-hex
  labels:
    k8s-app: rfmo-rfb-hex
spec:
  completions: 136   # 99 unchanged features + 37 antimeridian 45deg-band pieces
  parallelism: 50
  completionMode: Indexed
  # #325: CCAMLR (index for a valid, mid-size polygon) dropped because backoffLimit:0
  # never retried its transient chunk failure. Per-index retry fixes that.
  backoffLimitPerIndex: 3
  maxFailedIndexes: 10
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: rfmo-rfb-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-high-seas
        - name: DATASET
          value: rfmo-rfb
        command:
        - bash
        - -c
        - |-
          set -e
          # #520 rebuild: fold h7/h6 parents into the hex pass (--parent-resolutions 7,6,0)
          # so the buggy add-parents SELECT * rewrite (dropped _cng_fid from 22 partitions)
          # is eliminated. Write to a staging chunks prefix; repartition -> hex-staging.
          # INPUT is rfb-hexinput.parquet: the flat with the 6 antimeridian features
          # (lon bbox span >180deg) split into <=4 longitude-band pieces sharing their
          # original _cng_fid (datasets #167 fails fast on unsplit ones; retire once #98
          # adaptive-res polyfill lands). 136 rows = 99 unchanged + 37 45deg-band pieces.
          cng-datasets vector --input s3://public-high-seas/rfmo/rfb-hexinput.parquet --output s3://public-high-seas/rfmo/rfb/chunks-staging --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 1 --intermediate-chunk-size 10 --resolution 8 --parent-resolutions 7,6,0
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
          limits:
            cpu: '4'
            memory: 32Gi
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
