apiVersion: batch/v1
kind: Job
metadata:
  name: gfw-consolidate
  namespace: biodiversity
  labels:
    k8s-app: gfw-consolidate
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: gfw-consolidate
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: consolidate-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        command:
        - bash
        - -c
        - |
          set -e
          # Consolidate fragmented multi-writer hex output into standard h0-partitioned layout.
          # Current layout: hex/h0={cell}/year={year}_data{N}.parquet  (many tiny files per h0)
          # Target layout:  hex/h0={cell}/data_0.parquet               (one file per h0, all years)
          #
          # This matches the standard cng-datasets output layout used by all other datasets,
          # enabling h0 partition pruning in DuckDB joins with EEZ, RFMO, MEOW, etc.
          # Year remains as a column for filtering; it is NOT a partition directory.
          python3 - << 'PYEOF'
          import duckdb
          import os

          endpoint = os.environ['AWS_S3_ENDPOINT']
          key      = os.environ['AWS_ACCESS_KEY_ID']
          secret   = os.environ['AWS_SECRET_ACCESS_KEY']

          conn = duckdb.connect()
          conn.execute("INSTALL httpfs; LOAD httpfs;")
          conn.execute("INSTALL h3 FROM community; LOAD h3;")
          conn.execute("SET threads=1;")  # prevent multi-file fragmentation per h0

          conn.execute(f"""
            CREATE SECRET nrp_secret (
              TYPE S3,
              KEY_ID '{key}',
              SECRET '{secret}',
              ENDPOINT '{endpoint}',
              URL_STYLE 'path',
              USE_SSL false
            );
          """)

          input_glob = 's3://public-gfw/gfw-fishing-effort/hex/h0=*/*.parquet'
          output_dir = 's3://public-gfw/gfw-fishing-effort/hex-consolidated'

          print("Consolidating fragmented hex output to standard h0-partitioned layout...")
          conn.execute(f"""
            COPY (
              SELECT
                h6,
                h0,
                year,
                geartype,
                fishing_hours,
                ais_hours,
                vessel_month_count
              FROM read_parquet('{input_glob}', hive_partitioning = true)
              ORDER BY h0, year, geartype
            )
            TO '{output_dir}'
            WITH (
              FORMAT PARQUET,
              COMPRESSION ZSTD,
              ROW_GROUP_SIZE 100000,
              PARTITION_BY (h0),
              FILENAME_PATTERN 'data_0',
              OVERWRITE_OR_IGNORE true
            )
          """)
          print(f"Done: {output_dir}")
          PYEOF

          # Swap consolidated output into place
          echo "Swapping consolidated output into place..."
          rclone purge nrp:public-gfw/gfw-fishing-effort/hex/
          rclone move nrp:public-gfw/gfw-fishing-effort/hex-consolidated/ \
                      nrp:public-gfw/gfw-fishing-effort/hex/
          echo "Complete: s3://public-gfw/gfw-fishing-effort/hex/"

        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 50Gi
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 50Gi
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
