apiVersion: batch/v1
kind: Job
metadata:
  name: gfw-aggregate
  namespace: biodiversity
  labels:
    k8s-app: gfw-aggregate
spec:
  # One completion per year: index 0 = 2012, index 12 = 2024
  completions: 13
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: gfw-aggregate
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: aggregate-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        command:
        - bash
        - -c
        - |
          set -e

          YEAR=$((2012 + JOB_COMPLETION_INDEX))
          echo "Processing GFW fishing effort for year ${YEAR} (index ${JOB_COMPLETION_INDEX})"

          # Download monthly fleet CSV ZIP from Zenodo
          URL="https://zenodo.org/api/records/14982712/files/fleet-monthly-csvs-10-v3-${YEAR}.zip/content"
          echo "Downloading ${URL}..."
          curl -L --retry 5 --retry-delay 10 -o /tmp/fleet-${YEAR}.zip "${URL}"

          # Unzip
          mkdir -p /tmp/fleet-${YEAR}
          unzip -q /tmp/fleet-${YEAR}.zip -d /tmp/fleet-${YEAR}/
          echo "Unzipped: $(ls /tmp/fleet-${YEAR}/*.csv | wc -l) monthly files"

          # Also upload raw zip to S3 for reproducibility
          rclone copyto /tmp/fleet-${YEAR}.zip nrp:public-gfw/raw/fleet-monthly-csvs-10-v3-${YEAR}.zip
          echo "Raw zip uploaded to S3"

          # Aggregate to H3 resolution 5 using DuckDB + H3 community extension
          # H3 res 5 (~252 km²) is appropriate for 0.1° source data (~121 km² cells)
          # Each source cell center is assigned to its containing H3 res-5 cell.
          # Multiple source cells may map to the same H3 cell — their values are summed.
          python3 << 'PYEOF'
          import duckdb
          import os
          import sys

          year = 2012 + int(os.environ['JOB_COMPLETION_INDEX'])
          endpoint = os.environ['AWS_S3_ENDPOINT']
          key = os.environ['AWS_ACCESS_KEY_ID']
          secret = os.environ['AWS_SECRET_ACCESS_KEY']

          conn = duckdb.connect()

          # Install extensions
          conn.execute("INSTALL h3 FROM community; LOAD h3;")
          conn.execute("INSTALL httpfs; LOAD httpfs;")

          # Configure S3 (internal NRP endpoint)
          conn.execute(f"""
            CREATE SECRET nrp_secret (
              TYPE S3,
              KEY_ID '{key}',
              SECRET '{secret}',
              ENDPOINT '{endpoint}',
              URL_STYLE 'path',
              USE_SSL false
            );
          """)

          csv_glob = f'/tmp/fleet-{year}/*.csv'
          output_path = f's3://public-gfw/gfw-fishing-effort/year={year}/data.parquet'

          print(f"Aggregating {year} CSVs to H3 res-5 hex parquet...")
          conn.execute(f"""
            COPY (
              SELECT
                h3_latlng_to_cell(cell_ll_lat + 0.05, cell_ll_lon + 0.05, 5)::BIGINT AS h5,
                {year}::INTEGER AS year,
                geartype,
                SUM(fishing_hours)::FLOAT  AS fishing_hours,
                SUM(hours)::FLOAT          AS hours,
                SUM(mmsi_present)::INTEGER AS vessel_count
              FROM read_csv(
                '{csv_glob}',
                columns = {{
                  'date':         'DATE',
                  'year':         'INTEGER',
                  'month':        'INTEGER',
                  'cell_ll_lat':  'FLOAT',
                  'cell_ll_lon':  'FLOAT',
                  'flag':         'VARCHAR',
                  'geartype':     'VARCHAR',
                  'hours':        'FLOAT',
                  'fishing_hours':'FLOAT',
                  'mmsi_present': 'INTEGER'
                }},
                ignore_errors = true
              )
              GROUP BY ALL
              ORDER BY h5, geartype
            )
            TO '{output_path}'
            WITH (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)
          """)
          print(f"Done: {output_path}")
          PYEOF

          echo "Year ${YEAR} complete."
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 10Gi
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
