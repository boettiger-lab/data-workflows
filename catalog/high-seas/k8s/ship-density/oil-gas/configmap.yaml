# Auto-generated ConfigMap for raster workflow
# Generation command: cng-datasets raster-workflow --dataset ship-density/oil-gas --source-url "s3://public-high-seas/ship-density/oil-gas-cog.tif" --bucket public-high-seas --h3-resolution 8 --parent-resolutions "7,6,5,0"
apiVersion: v1
data:
  ship-density-oil-gas-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ship-density-oil-gas-hex
      labels:
        k8s-app: ship-density-oil-gas-hex
    spec:
      completions: 122
      parallelism: 61
      completionMode: Indexed
      backoffLimit: 0
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: ship-density-oil-gas-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: GDAL_DATA
              value: /usr/share/gdal
            - name: PYTHONPATH
              value: /usr/lib/python3/dist-packages
            - name: BUCKET
              value: public-high-seas
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |-
              set -e

              cng-datasets raster --input "s3://public-high-seas/ship-density/oil-gas-cog.tif" --output-parquet s3://public-high-seas/ship-density-oil-gas/hex/ --h0-index ${JOB_COMPLETION_INDEX} --resolution 8 --parent-resolutions 7,6,5,0 --value-column ais_positions --hex-resampling sum --nodata "2147483647"
            resources:
              requests:
                cpu: '4'
                memory: 64Gi
                ephemeral-storage: 40Gi
              limits:
                cpu: '4'
                memory: 64Gi
                ephemeral-storage: 40Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  ship-density-oil-gas-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ship-density-oil-gas-setup-bucket
      labels:
        k8s-app: ship-density-oil-gas-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: ship-density-oil-gas-setup-bucket
        spec:
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-high-seas
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Setting up bucket with public access and CORS..."
              cng-datasets storage setup-bucket \
                --bucket "${BUCKET}" \
                --remote nrp \
                --verify

              echo "Bucket setup complete!"
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
kind: ConfigMap
metadata:
  name: ship-density-oil-gas-yamls
  namespace: geo-workflows
