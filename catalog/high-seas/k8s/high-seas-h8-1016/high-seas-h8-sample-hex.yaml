# HAND-ROLLED: cng-datasets cannot split one feature across jobs, and the World
# High Seas source is one global multipolygon (~300M h8 cells), so its h8 hex
# OOMs in `cng-datasets vector`. hex_overlap.py (copied from #1000's WDPA
# recipe) cuts it into 20-degree lon/lat tiles, one pod each (#1016; tool
# feature request datasets#363).
#
# The script ships as a ConfigMap, rebuilt from this directory before applying:
#   kubectl -n geo-workflows create configmap high-seas-h8-1016-script \
#     --from-file=hex_overlap.py --from-file=stac_update.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Sample: five tiles (index -> tile below), output only to
# s3://public-high-seas/iho/high-seas/staging-1016/sample/chunks/.
#   91  x -160..-140, y 10..30   open Pacific around the Hawaii EEZ hole
#   71  x  160.. 180, y -30..-10 antimeridian, Fiji / Vanuatu / New Caledonia EEZs
#   144 x -180..-160, y 70..90   north pole, antimeridian (west side)
#   160 x  140.. 160, y 70..90   north pole
#   161 x  160.. 180, y 70..90   north pole, antimeridian (east side)
apiVersion: batch/v1
kind: Job
metadata:
  name: high-seas-h8-1016-sample-hex
  namespace: geo-workflows
  labels:
    k8s-app: high-seas-h8-1016-sample-hex
spec:
  completions: 5
  parallelism: 5
  completionMode: Indexed
  backoffLimitPerIndex: 1
  maxFailedIndexes: 5
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: high-seas-h8-1016-sample-hex
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3600
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: hex
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          TILES=(91 71 144 160 161)
          python3 /opt/script/hex_overlap.py hex \
            --source s3://public-high-seas/iho/high-seas.parquet --geom-col geom \
            --tile-deg 20 --chunk "${TILES[$JOB_COMPLETION_INDEX]}" \
            --out s3://public-high-seas/iho/high-seas/staging-1016/sample/chunks \
            --res 8 --parents 0 --threads 4 --memory-limit 6GB
          df -h /tmp | tail -1
        volumeMounts:
        - {name: script, mountPath: /opt/script, readOnly: true}
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        resources:
          requests: {cpu: '4', memory: 8Gi, ephemeral-storage: 20Gi}
          limits: {cpu: '4', memory: 8Gi, ephemeral-storage: 20Gi}
      volumes:
      - name: script
        configMap: {name: high-seas-h8-1016-script}
      - name: rclone-config
        secret: {secretName: rclone-config}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
