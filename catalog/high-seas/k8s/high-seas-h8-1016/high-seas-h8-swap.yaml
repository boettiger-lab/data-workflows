# HAND-ROLLED: cng-datasets cannot split one feature across jobs, so the h8 high
# seas hex is built in tiles by hex_overlap.py (#1016; ConfigMap: see
# high-seas-h8-sample-hex.yaml). This replaces the published resolution-4 hex.
#
# SWAP, NOT YET APPLIED: apply only when Carl says to swap, after the validation
# recorded in #1016. Apply high-seas-h8-publish-stac.yaml straight after it
# succeeds, so the STAC describes the data that is live.
#
# 1. Copies the live resolution-4 hex (iho/high-seas/hex/) to
#    staging-1016/old-hex/ as a rollback copy (server side).
# 2. Purges iho/high-seas/hex/ and moves staging-1016/full/hex/ into it. The
#    path is empty for the seconds of the move, never a mix of old and new
#    partitions (a sync would leave stale h4 partitions beside new ones).
# 3. Checks that the live hex now holds exactly the staged partition list,
#    that it has h8 and cover_frac, and that the row count matches.
# 4. Deletes the tile chunks and the sample run.
apiVersion: batch/v1
kind: Job
metadata:
  name: high-seas-h8-1016-swap
  namespace: geo-workflows
  labels:
    k8s-app: high-seas-h8-1016-swap
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: high-seas-h8-1016-swap
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3600
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: swap
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          S=nrp:public-high-seas/iho/high-seas/staging-1016
          NEW=$S/full/hex
          LIVE=nrp:public-high-seas/iho/high-seas/hex
          OLD=$S/old-hex
          rclone lsf -R --files-only "$NEW" | sort > /tmp/new.txt
          n=$(wc -l < /tmp/new.txt); echo "staged partitions: $n"
          [ "$n" -ge 90 ] || { echo "too few staged partitions"; exit 1; }
          rows() { python3 - "$1" <<'PY'
          import sys, duckdb
          from cng_datasets.storage.s3 import configure_s3_credentials
          c = duckdb.connect(); configure_s3_credentials(c)
          print(c.execute(f"SELECT count(*) FROM read_parquet('{sys.argv[1]}/h0=*/data_00.parquet')").fetchone()[0])
          PY
          }
          staged_rows=$(rows s3://public-high-seas/iho/high-seas/staging-1016/full/hex); echo "staged rows: $staged_rows"
          rclone copy "$LIVE" "$OLD" $R
          echo "old hex copied to $OLD: $(rclone lsf -R --files-only "$OLD" | wc -l) files"
          rclone purge "$LIVE" $R
          rclone move "$NEW" "$LIVE" $R --delete-empty-src-dirs
          rclone lsf -R --files-only "$LIVE" | sort > /tmp/live.txt
          diff /tmp/new.txt /tmp/live.txt && echo "partition list matches"
          live_rows=$(rows s3://public-high-seas/iho/high-seas/hex); echo "live rows: $live_rows"
          [ "$live_rows" = "$staged_rows" ] || { echo "row count mismatch"; exit 1; }
          python3 - <<'PY'
          import duckdb
          from cng_datasets.storage.s3 import configure_s3_credentials
          c = duckdb.connect(); configure_s3_credentials(c)
          cols = [r[0] for r in c.execute("DESCRIBE SELECT * FROM read_parquet('s3://public-high-seas/iho/high-seas/hex/h0=*/data_00.parquet')").fetchall()]
          assert 'cover_frac' in cols and 'h8' in cols and 'h4' not in cols, cols
          print('h8 + cover_frac present')
          PY
          rclone purge $S/full/chunks $R || true
          rclone purge $S/sample $R || true
          echo SWAPPED
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        resources:
          requests: {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
          limits: {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
