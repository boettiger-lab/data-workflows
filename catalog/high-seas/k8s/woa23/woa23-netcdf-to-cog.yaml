# WOA23 netCDF -> WGS84 COG (data-workflows #643). One indexed pod per variable;
# each emits 3 COGs (0 m / 200 m / 1000 m), so 8 pods produce all 24 layers.
apiVersion: batch/v1
kind: Job
metadata:
  name: woa23-netcdf-to-cog
  labels:
    k8s-app: woa23-netcdf-to-cog
spec:
  completions: 8
  parallelism: 8
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: woa23-netcdf-to-cog
    spec:
      restartPolicy: Never
      containers:
      - name: netcdf-to-cog
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: BUCKET
          value: public-high-seas
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: scripts
          mountPath: /opt/scripts
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          export IDX=${JOB_COMPLETION_INDEX}
          rm -rf /tmp/raw /tmp/cog && mkdir -p /tmp/raw /tmp/cog

          META=$(python3 /opt/scripts/woa23_netcdf_to_cog.py --list)
          RAW=$(echo "$META" | python3 -c "import json,sys,os; print(json.load(sys.stdin)[int(os.environ['IDX'])]['raw'])")
          echo "index ${IDX} -> ${RAW}"

          rclone copyto "nrp:${BUCKET}/raw/woa23/${RAW}" "/tmp/raw/${RAW}" \
            --retries 5 --low-level-retries 20 --retries-sleep 10s
          test -s "/tmp/raw/${RAW}"

          python3 /opt/scripts/woa23_netcdf_to_cog.py --index "${IDX}" \
            --raw-dir /tmp/raw --out-dir /tmp/cog

          # One COG per depth, each into its own dataset prefix so the hex step
          # and the STAC collection share a directory per layer.
          for f in /tmp/cog/woa23-*-cog.tif; do
            base=$(basename "$f")                 # woa23-<short>-<depth>m-cog.tif
            layer=${base#woa23-}; layer=${layer%-cog.tif}
            rclone copyto "$f" "nrp:${BUCKET}/woa23/${layer}/${base}" \
              --retries 5 --low-level-retries 20 --retries-sleep 10s
            echo "published woa23/${layer}/${base}"
          done
        resources:
          requests: {cpu: '2', memory: 8Gi, ephemeral-storage: 8Gi}
          limits:   {cpu: '2', memory: 8Gi, ephemeral-storage: 8Gi}
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: scripts
        configMap:
          name: woa23-scripts
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [hpc-nrp-g1.nmsu.edu, service-02.nrp.mghpcc.org]
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values: ['true']
