apiVersion: batch/v1
kind: Job
metadata:
  name: rfmo-vme-add-parents
  namespace: biodiversity
  labels:
    k8s-app: rfmo-vme-add-parents
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: rfmo-vme-add-parents
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: add-parents-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        command:
        - bash
        - -c
        - |
          set -e
          python3 << 'PYEOF'
          import duckdb
          import os

          endpoint = os.environ['AWS_S3_ENDPOINT']
          key = os.environ['AWS_ACCESS_KEY_ID']
          secret = os.environ['AWS_SECRET_ACCESS_KEY']

          conn = duckdb.connect()
          conn.execute("INSTALL h3 FROM community; LOAD h3;")
          conn.execute("INSTALL httpfs; LOAD httpfs;")

          conn.execute(f"""
            CREATE SECRET nrp_secret (
              TYPE S3,
              KEY_ID '{key}',
              SECRET '{secret}',
              ENDPOINT '{endpoint}',
              URL_STYLE 'path',
              USE_SSL false
            );
          """)

          input_glob  = 's3://public-high-seas/rfmo/vme/hex/h0=*/data_0.parquet'
          output_dir  = 's3://public-high-seas/rfmo/vme/hex'

          print("Reading existing hex parquet and adding h6, h7 parent columns...")
          conn.execute(f"""
            COPY (
              SELECT
                *,
                h3_cell_to_parent(h8, 7)::BIGINT AS h7,
                h3_cell_to_parent(h8, 6)::BIGINT AS h6
              FROM read_parquet('{input_glob}', hive_partitioning = true)
            )
            TO '{output_dir}'
            WITH (
              FORMAT PARQUET,
              COMPRESSION ZSTD,
              ROW_GROUP_SIZE 100000,
              PARTITION_BY (h0),
              FILENAME_PATTERN 'data_0',
              OVERWRITE_OR_IGNORE true
            )
          """)
          print(f"Done: {output_dir}")
          PYEOF
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 50Gi
          limits:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 50Gi
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
