apiVersion: batch/v1
kind: Job
metadata:
  name: rfmo-vme-fix-encoding
  namespace: biodiversity
  labels:
    k8s-app: rfmo-vme-fix-encoding
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: rfmo-vme-fix-encoding
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: fix-encoding
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          # Download raw VME zip
          curl -L --retry 5 -o /tmp/vme.zip \
            https://s3-west.nrp-nautilus.io/public-high-seas/raw/rfmo-vme-closures.zip

          # Re-convert with explicit latin-1 source encoding -> UTF-8 output
          mkdir -p /tmp/vme-fixed
          ogr2ogr \
            -f "ESRI Shapefile" \
            /tmp/vme-fixed/closures.shp \
            /vsizip//tmp/vme.zip \
            -oo ENCODING=ISO-8859-1 \
            -lco ENCODING=UTF-8

          # Convert fixed shapefile to parquet, overwriting the bad one
          cng-convert-to-parquet \
            /tmp/vme-fixed/closures.shp \
            s3://public-high-seas/rfmo/vme.parquet \
            --row-group-size 100000

          echo "Re-encoded parquet written successfully"
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
          limits:
            cpu: '2'
            memory: 8Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
