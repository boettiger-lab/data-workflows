apiVersion: batch/v1
kind: Job
metadata:
  name: ghs-pop-2020-cog
  labels:
    k8s-app: ghs-pop-2020-cog
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: ghs-pop-2020-cog
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: cog-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: CPL_VSIL_USE_TEMP_FILE_FOR_RANDOM_WRITE
          value: 'YES'
        - name: GDAL_CACHEMAX
          value: '8192'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          echo "Downloading raw GeoTIFF from S3 (~10.9 GB)..."
          rclone copyto nrp:public-high-seas/raw/GHS_POP_E2020_GLOBE_R2023A_4326_3ss_V1_0.tif \
            /tmp/ghs-pop-2020.tif --progress

          echo "Converting to COG..."
          gdal_translate /tmp/ghs-pop-2020.tif /tmp/ghs-pop-2020-cog.tif \
            -of COG \
            -co COMPRESS=ZSTD \
            -co BLOCKSIZE=512 \
            -co BIGTIFF=YES \
            -co OVERVIEWS=IGNORE_EXISTING \
            -co RESAMPLING=AVERAGE \
            --config GDAL_CACHEMAX 8192

          echo "Uploading COG to S3..."
          rclone copyto /tmp/ghs-pop-2020-cog.tif \
            nrp:public-high-seas/raw/ghs-pop-2020-cog.tif --progress

          echo "Done. Size:"
          ls -lh /tmp/ghs-pop-2020-cog.tif
        resources:
          requests:
            cpu: '8'
            memory: 32Gi
            ephemeral-storage: 50Gi
          limits:
            cpu: '8'
            memory: 32Gi
            ephemeral-storage: 50Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
