apiVersion: batch/v1
kind: Job
metadata:
  name: ghs-pop-2020-workflow
  namespace: biodiversity
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting ghs-pop-2020 raster workflow...\"\n\n# Step 0:\
          \ Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl apply -f\
          \ /yamls/ghs-pop-2020-setup-bucket.yaml -n biodiversity\nkubectl wait --for=condition=complete\
          \ --timeout=600s job/ghs-pop-2020-setup-bucket -n biodiversity\n\n# Step\
          \ 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal tiling...\"\nkubectl\
          \ apply -f /yamls/ghs-pop-2020-hex.yaml -n biodiversity\nkubectl wait --for=condition=complete\
          \ --timeout=7200s job/ghs-pop-2020-hex -n biodiversity\n\necho \"\u2713\
          \ Workflow complete!\"\necho \"Clean up with:\"\necho \"  kubectl delete\
          \ jobs ghs-pop-2020-setup-bucket ghs-pop-2020-hex ghs-pop-2020-workflow\
          \ -n biodiversity\"\necho \"  kubectl delete configmap ghs-pop-2020-yamls\
          \ -n biodiversity\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: ghs-pop-2020-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
