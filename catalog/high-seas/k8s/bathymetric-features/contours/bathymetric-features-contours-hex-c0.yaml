# HAND-ROLLED: the generated hex uses fixed 1,000-row chunks; this re-runs chunk 0 as 25-row slices (#766)
# Chunk 0 of the contours hex holds the 1,000 largest polygons (about 77M h8 cells) and ran
# for hours in one pod. This job re-hexes the same rows 0-999 as 40 slices of 25 rows into
# chunks-c0/; bathymetric-features-contours-c0-merge.yaml then copies them into chunks/.
apiVersion: batch/v1
kind: Job
metadata:
  name: bathymetric-features-contours-hex-c0
  namespace: geo-workflows
  labels:
    k8s-app: bathymetric-features-contours-hex-c0
spec:
  completions: 40
  parallelism: 40
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 40
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: bathymetric-features-contours-hex-c0
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-high-seas
        - name: DATASET
          value: bathymetric-features-contours
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector --input s3://public-high-seas/bathymetric-features/contours.parquet --output s3://public-high-seas/bathymetric-features/contours/chunks-c0 --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 25 --intermediate-chunk-size 10 --resolution 8 --parent-resolutions 0
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 10Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
