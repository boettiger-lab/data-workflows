# Auto-generated ConfigMap containing job definitions
# Generated from: wui-2020-setup-bucket.yaml, wui-2020-convert.yaml, wui-2020-pmtiles.yaml, wui-2020-hex.yaml, wui-2020-repartition.yaml
# Generation command: cng-datasets workflow --dataset wui-2020 --source-url s3://public-wui/raw/US_WUI_block_1990_2020_change_v4.gdb --bucket public-wui --h3-resolution 10 --parent-resolutions "9,8,0"
#
apiVersion: v1
data:
  wui-2020-convert.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: wui-2020-convert
      labels:
        k8s-app: wui-2020-convert
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: wui-2020-convert
        spec:
          restartPolicy: Never
          containers:
          - name: convert-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-wui
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              # GDAL/DuckDB ST_Read cannot open a multi-file .gdb *directory* over s3://
              # ("Could not open GDAL dataset"). Localize the GDB to local disk first,
              # then convert from the local path.
              mkdir -p /tmp/wui
              echo "Localizing GDB from s3 (~7 GB)..."
              rclone copy nrp:public-wui/raw/US_WUI_block_1990_2020_change_v4.gdb \
                /tmp/wui/US_WUI_block_1990_2020_change_v4.gdb -P
              echo "Converting..."
              # --row-group-size 2000: 11M national-scale features; keeps each geometry
              # column chunk well under the ~2.8 GB httpfs 'stoi' cliff (see AGENTS.md).
              cng-convert-to-parquet \
                /tmp/wui/US_WUI_block_1990_2020_change_v4.gdb \
                s3://public-wui/wui-2020.parquet \
                --row-group-size 2000 \
                --layer US_WUI_block_1990_2020_change_v4
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 50Gi
              limits:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 50Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  wui-2020-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: wui-2020-hex
      labels:
        k8s-app: wui-2020-hex
    spec:
      completions: 200
      parallelism: 100
      completionMode: Indexed
      # Per-index retry so a stuck/OOM/bad-node index is retried elsewhere instead
      # of silently leaving a coverage gap (not backoffLimit:0).
      backoffLimitPerIndex: 2
      maxFailedIndexes: 12
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: wui-2020-hex
        spec:
          restartPolicy: Never
          # 4h: chunks holding the largest features (huge Alaska/water blocks, ~1.6M
          # res-10 cells) legitimately run 1.5-3h; a tighter deadline kills them and
          # loops. Still bounds a true bad-node hang. The 8 biggest chunks (49,103,
          # 104,123,159,169,198,199) needed a 6h one-off rechunk on the first run.
          activeDeadlineSeconds: 14400
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-wui
            - name: DATASET
              value: wui-2020
            command:
            - bash
            - -c
            - |-
              set -e
              # chunk-size MUST cover all features: 200 completions x 46046 = 9,209,200 >= 9,209,091 rows.
              # (The generated default 1000 x 200 = 200,000 only hexed the first ~2% — the source
              # feature count was unknown at generation time during the S3 outage.)
              cng-datasets vector --input s3://public-wui/wui-2020.parquet --output s3://public-wui/wui-2020/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 46046 --intermediate-chunk-size 10 --resolution 10 --parent-resolutions 9,8,0
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 10Gi
              limits:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 10Gi
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - hpc-nrp-g1.nmsu.edu
                    - service-02.nrp.mghpcc.org
  wui-2020-pmtiles.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: wui-2020-pmtiles
      labels:
        k8s-app: wui-2020-pmtiles
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: wui-2020-pmtiles
        spec:
          restartPolicy: Never
          containers:
          - name: pmtiles-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-wui
            - name: DATASET
              value: wui-2020
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              # Use optimized GeoParquet (has ID column) from convert job
              # GDAL can read parquet via vsicurl
              ogr2ogr -wrapdateline -datelineoffset 15 -f GeoJSONSeq /tmp/$DATASET.geojsonl /vsicurl/https://s3-west.nrp-nautilus.io/public-wui/wui-2020.parquet -progress

              # Generate PMTiles from GeoJSONSeq
              # TIPPECANOE_MAX_THREADS must be a power of 2; Kubernetes nodes can expose
              # non-power-of-2 logical CPU counts which triggers an internal assertion
              # failure "N shards not a power of 2" (felt/tippecanoe#216).
              # Round detected CPU count down to nearest power of 2 to preserve I/O parallelism.
              # Must be `export`ed: tippecanoe is a child process and reads this from the
              # environment, not the shell. A plain assignment is invisible to it, so it
              # falls back to the raw (non-power-of-2) CPU count and crashes (issue #77).
              export TIPPECANOE_MAX_THREADS=$(python3 -c "import os; n=os.cpu_count() or 1; print(1<<(n.bit_length()-1))")
              tippecanoe -o /tmp/$DATASET.pmtiles -l $DATASET --coalesce-densest-as-needed --drop-densest-as-needed -z 13 --force /tmp/$DATASET.geojsonl

              # Upload to S3 using rclone
              rclone copy /tmp/$DATASET.pmtiles nrp:public-wui/
              rm /tmp/$DATASET.geojsonl /tmp/$DATASET.pmtiles
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
              limits:
                cpu: '4'
                memory: 16Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
