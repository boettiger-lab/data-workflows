# HAND-ROLLED: cng-datasets polyfills polygons by cell centre only and has no
# per-cell coverage fraction, so the coral reef h9 'overlap' + cover_frac hex is
# built by hex_overlap.py in this directory, copied from the WDPA (#1000) and
# high-seas (#1016) recipes (#1020; tool feature request datasets#363).
#
# The scripts ship as a ConfigMap, rebuilt from this directory before applying:
#   kubectl -n geo-workflows create configmap coral-h9-1020-script \
#     --from-file=hex_overlap.py --from-file=sample-reefs.sql --from-file=stac_update.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Sample hex: one index per chunk of the sample plan (completions = chunk count
# the plan logs), output to staging-1020/sample/chunks/.
apiVersion: batch/v1
kind: Job
metadata:
  name: coral-h9-1020-sample-hex
  namespace: geo-workflows
  labels:
    k8s-app: coral-h9-1020-sample-hex
spec:
  completions: 8
  parallelism: 8
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 8
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: coral-h9-1020-sample-hex
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3600
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: main
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 /opt/script/hex_overlap.py hex \
            --source s3://public-coral-reefs/unep-wcmc-coral-reefs/polygons.parquet --geom-col geom \
            --plan s3://public-coral-reefs/unep-wcmc-coral-reefs/polygons/staging-1020/sample/plan.parquet --chunk "$JOB_COMPLETION_INDEX" \
            --out s3://public-coral-reefs/unep-wcmc-coral-reefs/polygons/staging-1020/sample/chunks \
            --res 9 --parents 8,0 --threads 4 --memory-limit 6GB
          df -h /tmp | tail -1
        volumeMounts:
        - {name: script, mountPath: /opt/script, readOnly: true}
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        resources:
          requests: {cpu: '4', memory: 8Gi, ephemeral-storage: 10Gi}
          limits: {cpu: '4', memory: 8Gi, ephemeral-storage: 10Gi}
      volumes:
      - name: script
        configMap: {name: coral-h9-1020-script}
      - name: rclone-config
        secret: {secretName: rclone-config}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
