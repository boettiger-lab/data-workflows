apiVersion: batch/v1
kind: Job
metadata:
  name: census-2024-state-derive-hex
  namespace: geo-workflows
  labels:
    k8s-app: census-2024-state-derive-hex
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: census-2024-state-derive-hex
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: derive-hex
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        command:
        - bash
        - -c
        - |
          set -e
          python3 << 'PYEOF'
          import duckdb, os

          conn = duckdb.connect()
          conn.execute("INSTALL httpfs; LOAD httpfs;")
          conn.execute(f"""
            SET s3_access_key_id='{os.environ["AWS_ACCESS_KEY_ID"]}';
            SET s3_secret_access_key='{os.environ["AWS_SECRET_ACCESS_KEY"]}';
            SET s3_endpoint='{os.environ["AWS_S3_ENDPOINT"]}';
            SET s3_use_ssl=false;
            SET s3_url_style='path';
          """)

          # Load state attributes (56 rows — trivial). _cng_fid is carried from the
          # flat so the hex shares the flat's per-feature id by construction (#549).
          state = conn.execute("""
            SELECT _cng_fid,
                   REGION, DIVISION, STATEFP, STATENS, GEOID, GEOIDFQ,
                   STUSPS, NAME, LSAD, MTFCC, FUNCSTAT,
                   ALAND, AWATER, INTPTLAT, INTPTLON
            FROM read_parquet('s3://public-census/census-2024/state.parquet')
          """).fetchdf()
          conn.register("state", state)

          # Discover h0 partitions from county hex
          h0_dirs = conn.execute("""
            SELECT DISTINCT h0
            FROM read_parquet('s3://public-census/census-2024/county/hex/h0=*/data_0.parquet',
                              hive_partitioning=true, hive_types={'h0': BIGINT})
          """).fetchall()
          h0_values = sorted([r[0] for r in h0_dirs])
          print(f"Found {len(h0_values)} h0 partitions")

          total_rows = 0
          for h0 in h0_values:
              conn.execute(f"""
                COPY (
                  SELECT DISTINCT
                    t.h8,
                    s._cng_fid,
                    s.REGION, s.DIVISION, s.STATEFP, s.STATENS,
                    s.GEOID, s.GEOIDFQ, s.STUSPS, s.NAME,
                    s.LSAD, s.MTFCC, s.FUNCSTAT,
                    s.ALAND, s.AWATER, s.INTPTLAT, s.INTPTLON
                  FROM read_parquet('s3://public-census/census-2024/county/hex/h0={h0}/data_0.parquet') t
                  JOIN state s ON t.STATEFP = s.STATEFP
                ) TO 's3://public-census/census-2024/state/hex/h0={h0}/data_0.parquet'
                (FORMAT PARQUET, COMPRESSION ZSTD)
              """)
              n = conn.execute(f"""
                SELECT COUNT(DISTINCT h8)
                FROM read_parquet('s3://public-census/census-2024/county/hex/h0={h0}/data_0.parquet')
              """).fetchone()[0]
              total_rows += n
              print(f"  h0={h0}: ~{n:,} distinct h8 cells")

          print(f"✓ State hex complete — {total_rows:,} total h8 cells across {len(h0_values)} partitions")
          PYEOF
        resources:
          requests:
            cpu: '8'
            memory: 64Gi
          limits:
            cpu: '8'
            memory: 64Gi
            ephemeral-storage: 50Gi
