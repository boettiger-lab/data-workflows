apiVersion: batch/v1
kind: Job
metadata:
  name: overturemaps-reencode-hex
  namespace: biodiversity
  labels:
    k8s-app: overturemaps-reencode-hex
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: overturemaps-reencode-hex
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      containers:
      - name: reencode
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 16Gi
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |-
          set -e
          echo "=== Re-encoding overturemaps hex: VARCHAR H3 -> UBIGINT ==="

          python3 - <<'PYEOF'
          import duckdb, os

          con = duckdb.connect()
          con.execute("INSTALL h3 FROM community; LOAD h3")
          con.execute("INSTALL httpfs; LOAD httpfs")
          con.execute("SET http_retries=10; SET http_retry_wait_ms=3000")

          endpoint = os.environ.get("AWS_S3_ENDPOINT", "rook-ceph-rgw-nautiluss3.rook")
          key = os.environ["AWS_ACCESS_KEY_ID"]
          secret = os.environ["AWS_SECRET_ACCESS_KEY"]

          con.execute(f"""
              CREATE SECRET s3_secret (
                  TYPE S3, KEY_ID '{key}', SECRET '{secret}',
                  ENDPOINT '{endpoint}', URL_STYLE 'path', USE_SSL false
              )
          """)

          # 1) Re-encode countries.parquet (flat file)
          print("Converting countries.parquet...")
          con.execute("""
              COPY (
                  SELECT id, country, name,
                      h3_string_to_h3(h8) AS h8,
                      h3_string_to_h3(h0) AS h0
                  FROM read_parquet('s3://public-overturemaps/hex/countries.parquet')
              ) TO 's3://public-overturemaps/hex/countries-new.parquet'
              (FORMAT PARQUET, COMPRESSION ZSTD)
          """)
          print("  countries done.")

          # 2) Re-encode regions/hex/ (hive-partitioned)
          print("Converting regions/hex/...")
          con.execute("""
              COPY (
                  SELECT id, country, region, name,
                      h3_string_to_h3(h8) AS h8,
                      h3_string_to_h3(h0) AS h0
                  FROM read_parquet('s3://public-overturemaps/hex/regions/**/*.parquet')
              ) TO 's3://public-overturemaps/hex/regions-new/'
              (FORMAT PARQUET, COMPRESSION ZSTD, PARTITION_BY (h0))
          """)
          print("  regions done.")
          PYEOF

          # Verify outputs
          N=$(rclone ls nrp:public-overturemaps/hex/regions-new/ | wc -l)
          echo "  regions-new/ has ${N} files"
          if [ "$N" -lt 1 ]; then echo "ERROR: no regions output"; exit 1; fi

          rclone ls nrp:public-overturemaps/hex/countries-new.parquet | head -1
          if [ $? -ne 0 ]; then echo "ERROR: no countries output"; exit 1; fi

          # Swap countries
          echo "Swapping countries.parquet..."
          rclone delete nrp:public-overturemaps/hex/countries.parquet
          rclone moveto nrp:public-overturemaps/hex/countries-new.parquet nrp:public-overturemaps/hex/countries.parquet

          # Swap regions
          echo "Swapping regions/hex/..."
          rclone delete nrp:public-overturemaps/hex/regions/
          rclone move nrp:public-overturemaps/hex/regions-new/ nrp:public-overturemaps/hex/regions/

          echo "=== Complete ==="
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
