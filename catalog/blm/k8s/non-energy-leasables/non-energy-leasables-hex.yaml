apiVersion: batch/v1
kind: Job
metadata:
  name: non-energy-leasables-hex
  labels:
    k8s-app: non-energy-leasables-hex
spec:
  completions: 20
  parallelism: 20
  completionMode: Indexed
  # chunk-size 500 x 20 completions = 10,000 capacity for 7,106 features
  # (41% headroom for upstream drift). Estimated ~30M hex rows at res 10,
  # calibrated from #451 (2.92 hex rows per recorded acre). Per-index retries,
  # NOT backoffLimit:0, so a partial run fails loudly instead of publishing a
  # subset of h0 partitions (#409).
  backoffLimitPerIndex: 2
  maxFailedIndexes: 2
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: non-energy-leasables-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-blm
        - name: DATASET
          value: non-energy-leasables
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector --input s3://public-blm/non-energy-leasables.parquet --output s3://public-blm/non-energy-leasables/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 500 --intermediate-chunk-size 10 --resolution 10 --parent-resolutions 9,8,0
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 10Gi
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
