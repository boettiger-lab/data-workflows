apiVersion: batch/v1
kind: Job
metadata:
  name: coal-cases-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "\nset -e\n\necho \"Starting coal-cases workflow...\"\n\n# Step 0: Setup\
          \ bucket with public access and CORS\necho \"Step 0: Setting up bucket...\"\
          \nkubectl apply -f /yamls/coal-cases-setup-bucket.yaml -n geo-workflows\n\
          \necho \"Waiting for bucket setup to complete...\"\nkubectl wait --for=condition=complete\
          \ --timeout=600s job/coal-cases-setup-bucket -n geo-workflows\n\n# Step\
          \ 1: Convert to optimized GeoParquet (needed by both pmtiles and hex jobs)\n\
          echo \"Step 1: Converting to optimized GeoParquet...\"\nkubectl apply -f\
          \ /yamls/coal-cases-convert.yaml -n geo-workflows\n\necho \"Waiting for\
          \ GeoParquet conversion to complete...\"\nkubectl wait --for=condition=complete\
          \ --timeout=3600s job/coal-cases-convert -n geo-workflows\n\n# Step 2: Run\
          \ pmtiles and hex tiling in parallel (both use the converted geoparquet)\n\
          echo \"Step 2: H3 hexagonal tiling and PMTiles generation (parallel)...\"\
          \nkubectl apply -f /yamls/coal-cases-pmtiles.yaml -n geo-workflows\nkubectl\
          \ apply -f /yamls/coal-cases-hex.yaml -n geo-workflows\n\necho \"Waiting\
          \ for hex tiling to complete (PMTiles continues in background)...\"\necho\
          \ \"Timeout set to 48 hours (172800s)...\"\nkubectl wait --for=condition=complete\
          \ --timeout=172800s job/coal-cases-hex -n geo-workflows\n\necho \"Step 3:\
          \ Repartitioning by h0...\"\nkubectl apply -f /yamls/coal-cases-repartition.yaml\
          \ -n geo-workflows\n\necho \"Waiting for repartition to complete...\"\n\
          kubectl wait --for=condition=complete --timeout=3600s job/coal-cases-repartition\
          \ -n geo-workflows\n\necho \"\u2713 Workflow complete!\"\necho \"Note: PMTiles\
          \ job may still be running in the background\"\necho \"\"\necho \"Clean\
          \ up with:\"\necho \"  kubectl delete jobs coal-cases-setup-bucket coal-cases-convert\
          \ coal-cases-pmtiles coal-cases-hex coal-cases-repartition coal-cases-workflow\
          \ -n geo-workflows\"\necho \"  kubectl delete configmap coal-cases-yamls\
          \ -n geo-workflows\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: coal-cases-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
