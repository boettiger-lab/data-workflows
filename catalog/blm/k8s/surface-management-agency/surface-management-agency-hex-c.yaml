# DEVIATION from generated output (#561): derived from surface-management-agency-hex.yaml
# by split-k8s-hex.py. Armada submission is failing server-side, so the hex runs on k8s,
# split into <=200-completion Jobs; this one covers plan chunks 410..479.
# Adds activeDeadlineSeconds, known-bad-node exclusion, per-part memory
# (lower-48 chunks 0-9 get 48Gi), maxFailedIndexes ~5%.
apiVersion: batch/v1
kind: Job
metadata:
  name: surface-management-agency-hex-c
  namespace: geo-workflows
  labels:
    k8s-app: surface-management-agency-hex-c
spec:
  completions: 70
  parallelism: 50
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 3
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        k8s-app: surface-management-agency-hex-c
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-blm
        - name: DATASET
          value: surface-management-agency
        - name: DUCKDB_MEMORY_LIMIT
          value: 6963MiB
        command:
        - bash
        - -c
        - 'set -e

          cng-datasets vector --input s3://public-blm/surface-management-agency.parquet
          --output s3://public-blm/surface-management-agency/chunks --chunk-id $((
          JOB_COMPLETION_INDEX + 410 )) --chunk-size 1000 --intermediate-chunk-size
          10 --resolution 8 --parent-resolutions 0 --plan s3://public-blm/surface-management-agency/_hex_plan.parquet'
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 10Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hpc-nrp-g1.nmsu.edu
                - service-02.nrp.mghpcc.org
      activeDeadlineSeconds: 7200
