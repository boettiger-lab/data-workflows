apiVersion: batch/v1
kind: Job
metadata:
  name: special-tar-sand-areas-publish-stac
  namespace: geo-workflows
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          mkdir -p /tmp/s && cp -L /config/*.json /config/README.md /tmp/s/
          rclone copyto /tmp/s/stac-collection.json nrp:public-blm/special-tar-sand-areas/stac-collection.json
          rclone copyto /tmp/s/README.md nrp:public-blm/special-tar-sand-areas/README.md
          rclone copyto /tmp/s/parent.json nrp:public-blm/stac-collection.json
          rclone cat nrp:public-blm/stac-collection.json | python3 -c "import json,sys; print([l['id'] for l in json.load(sys.stdin)['links'] if l['rel']=='child'][-3:])"
        resources:
          requests: {cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi}
          limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: stac, mountPath: /config, readOnly: true}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
      - name: stac
        configMap: {name: special-tar-sand-areas-stac}
