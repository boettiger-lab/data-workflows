# Uploads the STAC and README written by gen_stac.py and registers the collection in the live
# public-blm parent (fetched and patched, never replaced):
#   python3 gen_stac.py /tmp/stsa
#   kubectl -n geo-workflows create configmap special-tar-sand-areas-stac --from-file=/tmp/stsa
#   kubectl apply -n geo-workflows -f special-tar-sand-areas-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: special-tar-sand-areas-publish-stac
  namespace: geo-workflows
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          keep_styles() {  # #881: replacing a live collection must not drop its default style assets or renders
            case "$2" in *.json) ;; *) return 0 ;; esac
            mkdir -p /tmp/keep-styles
            rclone cat "$2" > /tmp/keep-styles/live.json 2>/dev/null || return 0
            python3 -c '
          import json, sys
          try:
              new = json.load(open(sys.argv[1])); live = json.load(open(sys.argv[2]))
          except Exception:
              sys.exit(0)
          kept = {k: a for k, a in live.get("assets", {}).items()
                  if "style" in (a.get("roles") or []) and k not in new.setdefault("assets", {})}
          new["assets"].update(kept)
          renders = {k: v for k, v in live.get("renders", {}).items() if k not in new.get("renders", {})}
          if renders:
              new.setdefault("renders", {}).update(renders)
          for e in live.get("stac_extensions", []):
              if "/render/" in e and e not in new.setdefault("stac_extensions", []):
                  new["stac_extensions"].append(e)
          if kept or renders:
              json.dump(new, open(sys.argv[1], "w"), indent=2)
              print(f"  kept {len(kept)} style asset(s) and {len(renders)} render(s) from the live collection")
          ' "$1" /tmp/keep-styles/live.json
          }
          D=nrp:public-blm
          mkdir -p /tmp/s && cp -L /config/stac-collection.json /config/README.md /tmp/s/
          keep_styles /tmp/s/stac-collection.json $D/special-tar-sand-areas/stac-collection.json
          rclone copyto /tmp/s/stac-collection.json $D/special-tar-sand-areas/stac-collection.json
          rclone copyto /tmp/s/README.md $D/special-tar-sand-areas/README.md
          rclone copyto $D/stac-collection.json /tmp/s/parent.json
          python3 - <<'PY'
          import json
          p = json.load(open("/tmp/s/parent.json"))
          href = "https://s3-west.nrp-nautilus.io/public-blm/special-tar-sand-areas/stac-collection.json"
          if not any(l.get("href") == href for l in p["links"]):
              p["links"].append({"rel": "child", "href": href, "type": "application/json",
                                 "title": "BLM Special Tar Sand Areas (Utah)"})
              json.dump(p, open("/tmp/s/parent.json", "w"), indent=2)
              print("child link added")
          else:
              print("child link already present")
          PY
          keep_styles /tmp/s/parent.json $D/stac-collection.json
          rclone copyto /tmp/s/parent.json $D/stac-collection.json
        resources:
          requests: {cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi}
          limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: stac, mountPath: /config, readOnly: true}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
      - name: stac
        configMap: {name: special-tar-sand-areas-stac}
