apiVersion: v1
data:
  oil-gas-participating-areas-convert.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: oil-gas-participating-areas-convert
      labels:
        k8s-app: oil-gas-participating-areas-convert
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: oil-gas-participating-areas-convert
        spec:
          restartPolicy: Never
          containers:
          - name: convert-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-blm
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              cng-convert-to-parquet \
                s3://public-blm/raw/oil-gas-participating-areas.geojson \
                s3://public-blm/oil-gas-participating-areas.parquet \
                --row-group-size 100000
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
              limits:
                cpu: '4'
                memory: 32Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  oil-gas-participating-areas-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: oil-gas-participating-areas-hex
      labels:
        k8s-app: oil-gas-participating-areas-hex
    spec:
      completions: 10
      parallelism: 10
      completionMode: Indexed
      # chunk-size 400 x 10 completions = 4,000 capacity for 2,562 features
      # (56% headroom for upstream drift). Estimated ~21M hex rows at res 10,
      # calibrated from #451 (2.92 hex rows per recorded acre). Per-index retries,
      # NOT backoffLimit:0, so a partial run fails loudly instead of publishing a
      # subset of h0 partitions (#409).
      backoffLimitPerIndex: 2
      maxFailedIndexes: 2
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: oil-gas-participating-areas-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-blm
            - name: DATASET
              value: oil-gas-participating-areas
            command:
            - bash
            - -c
            - |-
              set -e
              cng-datasets vector --input s3://public-blm/oil-gas-participating-areas.parquet --output s3://public-blm/oil-gas-participating-areas/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 400 --intermediate-chunk-size 10 --resolution 10 --parent-resolutions 9,8,0
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 10Gi
              limits:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 10Gi
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  oil-gas-participating-areas-pmtiles.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: oil-gas-participating-areas-pmtiles
      labels:
        k8s-app: oil-gas-participating-areas-pmtiles
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: oil-gas-participating-areas-pmtiles
        spec:
          restartPolicy: Never
          containers:
          - name: pmtiles-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-blm
            - name: DATASET
              value: oil-gas-participating-areas
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              # Use optimized GeoParquet (has ID column) from convert job
              # GDAL can read parquet via vsicurl
              ogr2ogr -wrapdateline -datelineoffset 15 -f GeoJSONSeq /tmp/$DATASET.geojsonl /vsicurl/https://s3-west.nrp-nautilus.io/public-blm/oil-gas-participating-areas.parquet -progress

              # Generate PMTiles from GeoJSONSeq
              # TIPPECANOE_MAX_THREADS must be a power of 2; Kubernetes nodes can expose
              # non-power-of-2 logical CPU counts which triggers an internal assertion
              # failure "N shards not a power of 2" (felt/tippecanoe#216).
              # Round detected CPU count down to nearest power of 2 to preserve I/O parallelism.
              # Must be `export`ed: tippecanoe is a child process and reads this from the
              # environment, not the shell. A plain assignment is invisible to it, so it
              # falls back to the raw (non-power-of-2) CPU count and crashes (issue #77).
              export TIPPECANOE_MAX_THREADS=$(python3 -c "import os; n=os.cpu_count() or 1; print(1<<(n.bit_length()-1))")
              ulimit -n 65536 || true
              tippecanoe -o /tmp/$DATASET.pmtiles -l $DATASET --coalesce-densest-as-needed --drop-densest-as-needed -z 13 --force /tmp/$DATASET.geojsonl

              # Upload to S3 using rclone
              rclone copy /tmp/$DATASET.pmtiles nrp:public-blm/
              rm /tmp/$DATASET.geojsonl /tmp/$DATASET.pmtiles
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
              limits:
                cpu: '4'
                memory: 32Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
