# Stage raw BLM National MLRS Mining Claims from the ArcGIS FeatureServers to S3.
#
# Unions the TWO disposition service layers (Not-Closed = active-side, ~575,287 features;
# Closed = ~80,505 features) into a single GeoJSON, tagging each feature with a derived
# `status` (not_closed / closed) so active-vs-closed is filterable in one collection
# (mirrors the leases dataset holding all dispositions together, #451). Each layer is
# paginated (maxRecordCount 2000) with the same robustness as the leases scrape.
#
# ⚠️ Schema note (verified live against the FeatureServer, issue #477): unlike the leases
# service, the mining-claims service exposes NO claim location/recordation/staking date --
# only `Created`/`Modified`, which are MLRS *record-management* dates (all 2021-2026, the
# digital-migration window). So there is NO `claim_year`/year-slider column (would be
# misleading). `Created`/`Modified` are parsed to ISO YYYY-MM-DD and documented as
# record-entry dates. There is also no commodity field and no admin/geo-state field; state
# is derived from the BLM serial-number prefix (`CSE_NR[:2]`, e.g. NV/UT).
#
#   Sources:
#     https://gis.blm.gov/nlsdb/rest/services/HUB/BLM_Natl_MLRS_Mining_Claims_Not_Closed/FeatureServer/0
#     https://gis.blm.gov/nlsdb/rest/services/HUB/BLM_Natl_MLRS_Mining_Claims_Closed/FeatureServer/0
#   Issue:  https://github.com/boettiger-lab/data-workflows/issues/477
apiVersion: batch/v1
kind: Job
metadata:
  name: mining-claims-stage-raw
  labels:
    k8s-app: mining-claims-stage-raw
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: mining-claims-stage-raw
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 7200
      # Cluster DNS on some nodes intermittently fails to resolve external hosts
      # (gis.blm.gov). Append public resolvers as a fallback; cluster DNS is still tried
      # first so the internal rook-ceph-rgw-nautiluss3.rook rclone endpoint keeps resolving.
      dnsConfig:
        nameservers:
        - 8.8.8.8
        - 1.1.1.1
      containers:
      - name: stage-raw
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone

          LAYERS = [
              ("not_closed",
               "https://gis.blm.gov/nlsdb/rest/services/HUB/"
               "BLM_Natl_MLRS_Mining_Claims_Not_Closed/FeatureServer/0/query"),
              ("closed",
               "https://gis.blm.gov/nlsdb/rest/services/HUB/"
               "BLM_Natl_MLRS_Mining_Claims_Closed/FeatureServer/0/query"),
          ]
          PAGE = 2000
          EPOCH = datetime(1970, 1, 1, tzinfo=timezone.utc)
          # gis.blm.gov 403s the default python-urllib User-Agent -- send an explicit one
          UA = {"User-Agent": "data-workflows/1.0 (boettiger-lab; issue 477)"}

          # Attributes to keep (everything else is internal/GIS junk). BLM_PROD is the claim
          # type; CSE_DISP the disposition; RCRD_ACRS the case acres (per-feature total).
          KEEP = ("CSE_NR", "CSE_NAME", "BLM_PROD", "CSE_DISP", "RCRD_ACRS",
                  "Created", "Modified")

          def fetch_page(url, tries=6):
              # the FeatureServer intermittently returns 503/timeouts; retry each page with
              # exponential backoff so one transient blip does not lose the whole scrape.
              for attempt in range(1, tries + 1):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=180) as r:
                          return json.load(r)
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as e:
                      if attempt == tries:
                          raise
                      wait = min(60, 2 ** attempt)
                      print(f"  retry {attempt}/{tries} after {type(e).__name__} ({e}); sleep {wait}s", flush=True)
                      time.sleep(wait)

          def ms_to_iso(v):
              if v is None:
                  return None
              return (EPOCH + timedelta(milliseconds=v)).strftime("%Y-%m-%d")

          def clean(feat, status):
              p = feat.get("properties") or {}
              cse_nr = p.get("CSE_NR")
              out = {k: p.get(k) for k in KEEP}
              # normalize the claim-type field (source mixes 'LODE CLAIM' / 'Lode Claim')
              if out.get("BLM_PROD"):
                  out["BLM_PROD"] = str(out["BLM_PROD"]).strip().upper()
              # ISO dates (record-management dates, NOT staking dates)
              out["Created"] = ms_to_iso(out.get("Created"))
              out["Modified"] = ms_to_iso(out.get("Modified"))
              # derived: binary disposition group (which service layer) + state from serial prefix
              out["status"] = status
              pref = (cse_nr or "")[:2].upper()
              out["admin_state"] = pref if pref.isalpha() else None
              feat["properties"] = out
              return feat

          feats = []
          counts = {}
          for status, base in LAYERS:
              n0 = len(feats)
              offset = 0
              while True:
                  q = {
                      "where": "1=1",
                      "outFields": "*",
                      "outSR": "4326",              # WGS84 lon/lat (source is NAD83 / WKID 4269)
                      "f": "geojson",
                      "resultOffset": offset,
                      "resultRecordCount": PAGE,
                      "orderByFields": "OBJECTID",  # stable pagination order
                  }
                  url = base + "?" + urllib.parse.urlencode(q)
                  fc = fetch_page(url)
                  batch = fc.get("features", [])
                  for feat in batch:
                      feats.append(clean(feat, status))
                  print(f"[{status}] offset {offset}: +{len(batch)} (total {len(feats)})", flush=True)
                  more = fc.get("properties", {}).get("exceededTransferLimit") or fc.get("exceededTransferLimit")
                  if len(batch) < PAGE and not more:
                      break
                  if not batch:
                      break
                  offset += len(batch)
              counts[status] = len(feats) - n0
              print(f"[{status}] DONE: {counts[status]} features", flush=True)

          # log the derived-state set as a sanity check (should be valid 2-letter state codes)
          states = sorted({(f["properties"].get("admin_state") or "") for f in feats})
          print(f"distinct admin_state: {states}", flush=True)
          n_null_state = sum(1 for f in feats if not f["properties"].get("admin_state"))
          print(f"rows with null admin_state: {n_null_state}", flush=True)

          out = {"type": "FeatureCollection",
                 "crs": {"type": "name", "properties": {"name": "urn:ogc:def:crs:OGC:1.3:CRS84"}},
                 "features": feats}
          with open("/tmp/mining-claims.geojson", "w") as f:
              json.dump(out, f)
          print(f"WROTE {len(feats)} features ({counts})", flush=True)
          # fail loudly if the FeatureServers under-delivered vs the known counts
          # (~575,287 not-closed + ~80,505 closed ~= 655,792)
          assert len(feats) >= 640000, f"expected ~655,792 features, got {len(feats)}"
          PY
          ls -la /tmp/mining-claims.geojson
          rclone copyto /tmp/mining-claims.geojson nrp:public-blm/raw/mining-claims.geojson --s3-no-check-bucket
          echo "staged raw -> s3://public-blm/raw/mining-claims.geojson"
        resources:
          requests:
            cpu: '2'
            memory: 12Gi
          limits:
            cpu: '2'
            memory: 12Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
