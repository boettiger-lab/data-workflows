apiVersion: batch/v1
kind: Job
metadata:
  name: mining-claims-repartition
  labels:
    k8s-app: mining-claims-repartition
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: mining-claims-repartition
    spec:
      restartPolicy: Never
      containers:
      - name: repartition-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /scratch
        - name: BUCKET
          value: public-blm
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: scratch
          mountPath: /scratch
          subPath: mining-claims-repartition
        command:
        - bash
        - -c
        - |
          set -e
          # Merge ~1.9B hex cell rows (inflated by oversized source geometries) into 9 h0
          # partitions. The tool orders each h0 by _cng_fid; the largest h0 (~660M rows)
          # dwarfs a 32Gi pod, so give it a big node and put ALL scratch (the tool's local
          # /tmp/hex writes via TMPDIR, DuckDB's CWD-relative spill via `cd`) on the 2Ti
          # rechunk-scratch cephfs PVC — a few large sequential files, which cephfs handles
          # fine — instead of the 50Gi ephemeral cap.
          mkdir -p /scratch/hex && cd /scratch
          ln -s /scratch/hex /tmp/hex 2>/dev/null || true
          cng-datasets repartition --chunks-dir s3://public-blm/mining-claims/chunks --output-dir s3://public-blm/mining-claims/hex --source-parquet s3://public-blm/mining-claims.parquet --cleanup --memory-limit 320GiB
        resources:
          requests:
            cpu: '8'
            memory: 384Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: '8'
            memory: 384Gi
            ephemeral-storage: 20Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: scratch
        persistentVolumeClaim:
          claimName: rechunk-scratch
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
