apiVersion: batch/v1
kind: Job
metadata:
  name: oil-gas-leases-hex-rechunk
  labels:
    k8s-app: oil-gas-leases-hex-rechunk
# Reprocess the 6 dense chunks whose Pass-1 intermediate overflowed the 2 GB Parquet
# page limit on the main {--chunk-size 2500} hex run ("uncompressed page size out of
# range for type integer"). A cluster of BLM parcels have coarse/oversized polygons
# (large area vs recorded acreage) that generate huge H3 cell arrays at res 10, so a
# full 2,500-feature chunk packs >250M cell-ids into one column page. Resolution 10 is
# preserved (parcel accuracy); only the features-per-Pass-1-file is reduced to 50.
#
# Chunk-id math: repartition names outputs chunk_<id>.parquet and globs chunks/*.parquet,
# so a reprocess id MUST NOT collide with a main-run id (0..186). At --chunk-size 50 a
# size-2500 chunk C maps to ids 50*C .. 50*C+49; every dense chunk here is C>=5, so the
# smallest id is 250 -- safely clear of the main range. Output lands in the same chunks/
# dir; repartition inner-joins every cell back to the source parquet on _cng_fid, so as
# long as each feature appears exactly once (it does -- main run skips these 6, this job
# supplies them) the merge is exact.
#
# Dense chunk-ids (size 2500): [5, 46, 55, 56, 58, 115]
spec:
  completions: 300
  parallelism: 50
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 6
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: oil-gas-leases-hex-rechunk
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        command:
        - bash
        - -c
        - |-
          set -e
          CHUNK_MAP=(250 251 252 253 254 255 256 257 258 259 260 261 262 263 264 265 266 267 268 269 270 271 272 273 274 275 276 277 278 279 280 281 282 283 284 285 286 287 288 289 290 291 292 293 294 295 296 297 298 299 2300 2301 2302 2303 2304 2305 2306 2307 2308 2309 2310 2311 2312 2313 2314 2315 2316 2317 2318 2319 2320 2321 2322 2323 2324 2325 2326 2327 2328 2329 2330 2331 2332 2333 2334 2335 2336 2337 2338 2339 2340 2341 2342 2343 2344 2345 2346 2347 2348 2349 2750 2751 2752 2753 2754 2755 2756 2757 2758 2759 2760 2761 2762 2763 2764 2765 2766 2767 2768 2769 2770 2771 2772 2773 2774 2775 2776 2777 2778 2779 2780 2781 2782 2783 2784 2785 2786 2787 2788 2789 2790 2791 2792 2793 2794 2795 2796 2797 2798 2799 2800 2801 2802 2803 2804 2805 2806 2807 2808 2809 2810 2811 2812 2813 2814 2815 2816 2817 2818 2819 2820 2821 2822 2823 2824 2825 2826 2827 2828 2829 2830 2831 2832 2833 2834 2835 2836 2837 2838 2839 2840 2841 2842 2843 2844 2845 2846 2847 2848 2849 2900 2901 2902 2903 2904 2905 2906 2907 2908 2909 2910 2911 2912 2913 2914 2915 2916 2917 2918 2919 2920 2921 2922 2923 2924 2925 2926 2927 2928 2929 2930 2931 2932 2933 2934 2935 2936 2937 2938 2939 2940 2941 2942 2943 2944 2945 2946 2947 2948 2949 5750 5751 5752 5753 5754 5755 5756 5757 5758 5759 5760 5761 5762 5763 5764 5765 5766 5767 5768 5769 5770 5771 5772 5773 5774 5775 5776 5777 5778 5779 5780 5781 5782 5783 5784 5785 5786 5787 5788 5789 5790 5791 5792 5793 5794 5795 5796 5797 5798 5799)
          CHUNK_ID=${CHUNK_MAP[$JOB_COMPLETION_INDEX]}
          echo "Reprocessing sub-chunk-id ${CHUNK_ID} at res 10, --chunk-size 50"
          cng-datasets vector \
            --input s3://public-blm/oil-gas-leases.parquet \
            --output s3://public-blm/oil-gas-leases/chunks \
            --chunk-id ${CHUNK_ID} --chunk-size 50 --intermediate-chunk-size 10 \
            --resolution 10 --parent-resolutions 9,8,0
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 10Gi
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
