# Auto-generated ConfigMap containing job definitions
# Generated from: oil-gas-leases-setup-bucket.yaml, oil-gas-leases-convert.yaml, oil-gas-leases-pmtiles.yaml, oil-gas-leases-hex.yaml, oil-gas-leases-repartition.yaml
# Regenerated to reflect the big-RAM + PVC repartition (the default 32Gi OOMs on
# this dataset's 660M-row h0 partition). NOTE: the 6 dense chunks that overflow the
# 2GB Parquet page on the size-2500 hex are handled by oil-gas-leases-hex-rechunk.yaml,
# a manual step not embedded here (the orchestrator DAG has no rechunk stage).
apiVersion: v1
data:
  oil-gas-leases-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: oil-gas-leases-setup-bucket
      labels:
        k8s-app: oil-gas-leases-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: oil-gas-leases-setup-bucket
        spec:
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-blm
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Setting up bucket with public access and CORS..."
              cng-datasets storage setup-bucket \
                --bucket "${BUCKET}" \
                --remote nrp \
                --verify

              echo "Bucket setup complete!"
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  oil-gas-leases-convert.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: oil-gas-leases-convert
      labels:
        k8s-app: oil-gas-leases-convert
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: oil-gas-leases-convert
        spec:
          restartPolicy: Never
          containers:
          - name: convert-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-blm
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              cng-convert-to-parquet \
                s3://public-blm/raw/oil-gas-leases.geojson \
                s3://public-blm/oil-gas-leases.parquet \
                --row-group-size 100000
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
              limits:
                cpu: '4'
                memory: 32Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  oil-gas-leases-pmtiles.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: oil-gas-leases-pmtiles
      labels:
        k8s-app: oil-gas-leases-pmtiles
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: oil-gas-leases-pmtiles
        spec:
          restartPolicy: Never
          containers:
          - name: pmtiles-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-blm
            - name: DATASET
              value: oil-gas-leases
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              # Use optimized GeoParquet (has ID column) from convert job
              # GDAL can read parquet via vsicurl
              ogr2ogr -wrapdateline -datelineoffset 15 -f GeoJSONSeq /tmp/$DATASET.geojsonl /vsicurl/https://s3-west.nrp-nautilus.io/public-blm/oil-gas-leases.parquet -progress

              # Generate PMTiles from GeoJSONSeq
              # TIPPECANOE_MAX_THREADS must be a power of 2; Kubernetes nodes can expose
              # non-power-of-2 logical CPU counts which triggers an internal assertion
              # failure "N shards not a power of 2" (felt/tippecanoe#216).
              # Round detected CPU count down to nearest power of 2 to preserve I/O parallelism.
              # Must be `export`ed: tippecanoe is a child process and reads this from the
              # environment, not the shell. A plain assignment is invisible to it, so it
              # falls back to the raw (non-power-of-2) CPU count and crashes (issue #77).
              export TIPPECANOE_MAX_THREADS=$(python3 -c "import os; n=os.cpu_count() or 1; print(1<<(n.bit_length()-1))")

              # Raise the soft open-file limit before tippecanoe (issue #154). It opens many
              # temp files (per-thread x per-tile shards); on high-core nodes os.cpu_count()
              # reports the node's full core count, so the thread/shard count blows past the
              # container's default soft nofile limit (often 1024) and aborts with
              # "Too many open files". `|| true` keeps going if the limit can't be raised.
              ulimit -n 65536 || true
              tippecanoe -o /tmp/$DATASET.pmtiles -l $DATASET --coalesce-densest-as-needed --drop-densest-as-needed -z 13 --force /tmp/$DATASET.geojsonl

              # Upload to S3 using rclone
              rclone copy /tmp/$DATASET.pmtiles nrp:public-blm/
              rm /tmp/$DATASET.geojsonl /tmp/$DATASET.pmtiles
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
              limits:
                cpu: '4'
                memory: 32Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  oil-gas-leases-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: oil-gas-leases-hex
      labels:
        k8s-app: oil-gas-leases-hex
    spec:
      completions: 200
      parallelism: 50
      completionMode: Indexed
      # See configmap.yaml: chunk-size 2500 covers all 466,414 features; per-index retries
      # (not backoffLimit:0) so partial runs fail loudly rather than publishing a subset (#409).
      backoffLimitPerIndex: 2
      maxFailedIndexes: 10
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: oil-gas-leases-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-blm
            - name: DATASET
              value: oil-gas-leases
            command:
            - bash
            - -c
            - |-
              set -e
              cng-datasets vector --input s3://public-blm/oil-gas-leases.parquet --output s3://public-blm/oil-gas-leases/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 2500 --intermediate-chunk-size 10 --resolution 10 --parent-resolutions 9,8,0
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 10Gi
              limits:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 10Gi
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  oil-gas-leases-repartition.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: oil-gas-leases-repartition
      labels:
        k8s-app: oil-gas-leases-repartition
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: oil-gas-leases-repartition
        spec:
          restartPolicy: Never
          containers:
          - name: repartition-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /scratch
            - name: BUCKET
              value: public-blm
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            - name: scratch
              mountPath: /scratch
              subPath: oil-gas-leases-repartition
            command:
            - bash
            - -c
            - |
              set -e
              # Merge ~1.9B hex cell rows (inflated by oversized source geometries) into 9 h0
              # partitions. The tool orders each h0 by _cng_fid; the largest h0 (~660M rows)
              # dwarfs a 32Gi pod, so give it a big node and put ALL scratch (the tool's local
              # /tmp/hex writes via TMPDIR, DuckDB's CWD-relative spill via `cd`) on the 2Ti
              # rechunk-scratch cephfs PVC — a few large sequential files, which cephfs handles
              # fine — instead of the 50Gi ephemeral cap.
              mkdir -p /scratch/hex && cd /scratch
              ln -s /scratch/hex /tmp/hex 2>/dev/null || true
              cng-datasets repartition --chunks-dir s3://public-blm/oil-gas-leases/chunks --output-dir s3://public-blm/oil-gas-leases/hex --source-parquet s3://public-blm/oil-gas-leases.parquet --cleanup --memory-limit 320GiB
            resources:
              requests:
                cpu: '8'
                memory: 384Gi
                ephemeral-storage: 20Gi
              limits:
                cpu: '8'
                memory: 384Gi
                ephemeral-storage: 20Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          - name: scratch
            persistentVolumeClaim:
              claimName: rechunk-scratch
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
kind: ConfigMap
metadata:
  name: oil-gas-leases-yamls
  namespace: geo-workflows
