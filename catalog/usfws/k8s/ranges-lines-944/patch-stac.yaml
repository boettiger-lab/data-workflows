# HAND-ROLLED: the generator does not write STAC. Patches the LIVE final and proposed critical-habitat
# collections after their #944 rebuild with patch_crithab_944.py, through the publish guard.
#   kubectl create configmap usfws-944-stac -n geo-workflows \
#     --from-file=patch.py=catalog/usfws/k8s/ranges-lines-944/patch_crithab_944.py \
#     --from-file=guard.py=scripts/stac-publish-guard.py
#   kubectl create -f catalog/usfws/k8s/ranges-lines-944/patch-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: usfws-944-stac
  namespace: geo-workflows
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 900
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # Both stalled pulling images for 20+ minutes on 2026-11-17.
              - {key: kubernetes.io/hostname, operator: NotIn, values: [k8s-haosu-20.sdsc.optiputer.net, k8s-haosu-21.sdsc.optiputer.net]}
      containers:
      - name: patch
        image: ghcr.io/boettiger-lab/datasets@sha256:246dc706ea34728a75c0bf1bc8589fd8f5c2e6526876f6c7192660a272cec1b3
        resources:
          requests: {cpu: '1', memory: 1Gi}
          limits: {cpu: '1', memory: 1Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: in, mountPath: /in, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          for k in final proposed; do
            p=public-usfws/critical-habitat/$k/stac-collection.json
            rclone cat "nrp:$p" > /tmp/live.json
            cp /tmp/live.json /tmp/c.json
            python3 /in/patch.py $k /tmp/c.json
            python3 /in/guard.py /tmp/c.json /tmp/live.json
            rclone copyto /tmp/c.json "nrp:$p" --retries 6
          done
          echo DONE
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: in, configMap: {name: usfws-944-stac}}
