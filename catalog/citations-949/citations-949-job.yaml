# HAND-ROLLED: the generator does not write STAC. A metadata-only fix (#949): PAD-US 4.1
# citations, the roo-cjest CEJST version and the NCP source, edited in place on the LIVE files
# listed in paths.txt by fix949.py, each JSON file through the publish guard.
#   kubectl create configmap citations-949 -n geo-workflows \
#     --from-file=fix949.py=catalog/citations-949/fix949.py \
#     --from-file=paths.txt=catalog/citations-949/paths.txt \
#     --from-file=guard.py=scripts/stac-publish-guard.py
#   kubectl create -f catalog/citations-949/citations-949-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: citations-949
  namespace: geo-workflows
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: fix
        image: ghcr.io/boettiger-lab/datasets@sha256:246dc706ea34728a75c0bf1bc8589fd8f5c2e6526876f6c7192660a272cec1b3
        resources:
          requests: {cpu: '1', memory: 1Gi}
          limits: {cpu: '1', memory: 1Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: in, mountPath: /in, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          n=0
          while read -r p; do
            [ -n "$p" ] || continue
            rclone cat "nrp:$p" > /tmp/live
            cp /tmp/live /tmp/new
            python3 /in/fix949.py "$p" /tmp/new
            if cmp -s /tmp/live /tmp/new; then echo "unchanged $p"; continue; fi
            case "$p" in *.json) python3 /in/guard.py /tmp/new /tmp/live ;; esac
            rclone copyto /tmp/new "nrp:$p" $R
            echo "rewrote $p"; n=$((n+1))
          done < /in/paths.txt
          echo "DONE: $n files rewritten"
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: in, configMap: {name: citations-949}}
