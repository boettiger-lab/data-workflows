# Single source of truth for which NHDPlus HR units this build ingests.
# NATIONAL: all 266 units in VPU/Current/GDB (#205).
#
# ⛔ THREE naming forms, none derivable from the unit code — enumerate the bucket listing:
#   238 HU4 units (233 plain + 5 Great Lakes "i" units: 0418i 0419i 0424i 0426i 0428i), 50.1 GB
#    28 HU8 units, ALL in region 19 (Alaska), 2.0 GB — a *partial* Alaska set at HU8 granularity
#   43 of the 266 carry a YYYYMMDD stamp; the rest are undated. The stamp is the vintage STAC
#   records per unit, so it is carried here as a field.
#
# NOTE: Alaska is present but at HU8, not HU4 — which is why the build column is `vpu_unit`
# (4-digit HU4, 4-digit+i, or 8-digit HU8) plus `vpu_level`, NOT `hu4`. An earlier pass of this
# import wrongly concluded NHDPlus HR had no Alaska because its enumeration only matched _HU4_
# filenames; see #205.
#
# Source tree (StagedProducts/Hydrography/NHDPlusHR/):
#   VPU/Current/GDB/  <- USE THIS
#   Beta/GDB/         <- superseded
#   National/GDB/     <- REJECTED: NR2 has region-06 fallback + GridCode defects
