              set -e
              cng-datasets vector --input s3://public-usgs-nhd/nhdplus-hr/flowline.parquet --output s3://public-usgs-nhd/nhdplus-hr/flowline/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 127920 --intermediate-chunk-size 10 --resolution 8 --parent-resolutions 0 --plan s3://public-usgs-nhd/nhdplus-hr/flowline/_hex_plan.parquet
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 10Gi
              limits:
                cpu: '4'
                memory: 32Gi
                ephemeral-storage: 10Gi
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
