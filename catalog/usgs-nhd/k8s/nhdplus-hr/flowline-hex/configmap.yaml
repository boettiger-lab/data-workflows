      parallelism: 50
      completionMode: Indexed
      backoffLimitPerIndex: 2
      maxFailedIndexes: 1
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: nhdplus-hr-flowline-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
