apiVersion: batch/v1
kind: Job
metadata:
  name: sync-public-ecoregion
  namespace: boettiger-lab
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values: ["true"]
      containers:
        - name: sync
          image: ghcr.io/boettiger-lab/datasets:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              RCLONE_FLAGS="--transfers 2 --checkers 4 --bwlimit 50M --tpslimit 5 --retries 5 --stats 120s -v"
              rclone mkdir "minio:public-ecoregion"
              echo "Syncing: nrp:public-ecoregion -> minio:public-ecoregion"
              rclone sync $RCLONE_FLAGS "nrp:public-ecoregion" "minio:public-ecoregion"
              echo "Done: public-ecoregion"
      volumes:
        - name: rclone-config
          secret:
            secretName: rclone-backup
