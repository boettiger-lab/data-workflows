apiVersion: batch/v1
kind: Job
metadata:
  name: globio-msa-ssp5rcp85-2050-plants-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting globio-msa-ssp5rcp85-2050-plants raster workflow...\"\
          \n\n# Step 0: Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl\
          \ apply -f /yamls/globio-msa-ssp5rcp85-2050-plants-setup-bucket.yaml -n\
          \ geo-workflows\nkubectl wait --for=condition=complete --timeout=600s job/globio-msa-ssp5rcp85-2050-plants-setup-bucket\
          \ -n geo-workflows\n\n# Step 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal\
          \ tiling...\"\nkubectl apply -f /yamls/globio-msa-ssp5rcp85-2050-plants-hex.yaml\
          \ -n geo-workflows\nkubectl wait --for=condition=complete --timeout=7200s\
          \ job/globio-msa-ssp5rcp85-2050-plants-hex -n geo-workflows\n\necho \"\u2713\
          \ Workflow complete!\"\necho \"Clean up with:\"\necho \"  kubectl delete\
          \ jobs globio-msa-ssp5rcp85-2050-plants-setup-bucket globio-msa-ssp5rcp85-2050-plants-hex\
          \ globio-msa-ssp5rcp85-2050-plants-workflow -n geo-workflows\"\necho \"\
          \  kubectl delete configmap globio-msa-ssp5rcp85-2050-plants-yamls -n geo-workflows\"\
          \n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: globio-msa-ssp5rcp85-2050-plants-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
