        "ids-damage-1997-2025-hex": {
          "href": "https://s3-west.nrp-nautilus.io/public-usfs/ids-damage-1997-2025/hex/h0=*/data_0.parquet",
          "type": "application/x-parquet",
          "title": "USFS Insect and Disease Detection Survey damage polygons, 1997-2025 (national) - H3 hex parquet",
          "description": "H3 resolution 10 cells covering each damage polygon, with resolution 9, 8 and 0 parents, carrying every attribute of the GeoParquet except the geometry. 159,415,254 rows in 8 Hive partitions. Use this asset to join damage to other datasets in this catalog on h8, or to aggregate damage by area without handling polygon geometry.\n\nOne row is one (damage record, resolution 10 cell) pair, so every per-record value is repeated on every cell that record covers: ACRES, Shape_Area, Shape_Length, LEGACY_TPA, LEGACY_NO_TREES, PERCENT_MIN, PERCENT_MAX and PERCENT_MID are all repeated this way. Dedup on _cng_fid before summing any of them, and dedup on DAMAGE_AREA_ID as well when the quantity belongs to the mapped polygon rather than the damage record. Counting distinct cells, not rows, gives damaged area.\n\n```sql\n-- correct: distinct resolution 10 cells with damage in a year\nSELECT COUNT(DISTINCT h10) FROM read_parquet('https://s3-west.nrp-nautilus.io/public-usfs/ids-damage-1997-2025/hex/h0=*/data_0.parquet', hive_partitioning=true) WHERE SURVEY_YEAR = 2025\n-- wrong: COUNT(*) counts a cell once per damage record covering it\n```",
