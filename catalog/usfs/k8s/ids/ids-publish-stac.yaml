    {
      "stac_version": "1.0.0",
      "type": "Collection",
      "id": "ids-damage-1997-2025",
      "title": "USFS Insect and Disease Detection Survey damage polygons, 1997-2025 (national)",
      "description": "Polygons of insect and disease damage to forests, mapped by the USDA Forest Service Insect and Disease Detection Survey across the whole United States including Alaska, from 1997 to 2025. There are 4,533,015 damage records over 4,338,867 distinct mapped polygons, each carrying the damaging agent, the affected host species, the kind of damage and a severity class.\n\n**An area with no damage polygon was not necessarily undamaged.** Damage is recorded by observers sketch-mapping from aircraft along established flight routes, and those flights concentrate on accessible, road-adjacent forest, so remote and roadless terrain is systematically under-flown. Any rate or share computed from this dataset needs the area actually surveyed as its denominator, which is published beside it in this catalog as ids-survey-extent-1999-2025. Dividing damage by total land area, or by forest area, treats un-flown ground as undamaged and understates damage wherever survey coverage is thin.\n\n**Damage rates are not computable for 1997 and 1998.** Both years hold real damage, 131,013 polygons recorded across all nine Forest Service regions, but no survey-extent footprints were published for them, so there is no denominator. Counts and acreages of damage in those two years are valid; rates are not.\n\n**Damage polygons overlap across years by design.** The same stand is re-recorded in each year it shows damage, so an acreage total must be computed within a survey year. Summing across years counts persistent outbreaks once per year they persisted.\n\n**One row is one damage record, not one polygon.** A polygon carrying several damaging agents, hosts or damage types appears once for each, with the polygon's own ACRES copied onto every one of those rows. Summing ACRES over raw rows overstates the mapped area by a factor of 1.22 nationally.\n\n```sql\n-- correct: damaged acres per survey year, counting each mapped polygon once\nSELECT SURVEY_YEAR, SUM(ACRES) AS acres\nFROM (SELECT DISTINCT DAMAGE_AREA_ID, SURVEY_YEAR, ACRES\n      FROM read_parquet('https://s3-west.nrp-nautilus.io/public-usfs/ids-damage-1997-2025.parquet'))\nGROUP BY SURVEY_YEAR ORDER BY SURVEY_YEAR\n-- wrong: SUM(ACRES) over raw rows counts a polygon once per damaging agent (1.22x too high nationally)\n-- wrong: summing across survey years counts a persistent outbreak once per year it persisted\n```\n\n**Provenance.** Built from the nine per-region File Geodatabases published by Forest Health Protection, which together are the national set (there is no single national download). The archives were staged to `s3://public-usfs/raw/ids/` on 2026-09-16, totalling 1,743,267,480 bytes, each carrying an upstream Last-Modified of 2026-04-22 and a sha256 recomputed from the stored object; the per-file byte counts, checksums and access date are in `s3://public-usfs/raw/ids/source-manifest.tsv`. Forest Health Protection publishes no edition or version label for this product, so none is claimed here: the access date and those checksums identify the edition used.",
