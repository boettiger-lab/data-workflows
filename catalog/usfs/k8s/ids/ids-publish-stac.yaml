  ids-survey-extent-1999-2025.json: |
    {
      "stac_version": "1.0.0",
      "type": "Collection",
      "id": "ids-survey-extent-1999-2025",
      "title": "USFS Insect and Disease Detection Survey annual survey extent, 1999-2025 (national)",
      "description": "Annual footprints of the area actually flown by the USDA Forest Service Insect and Disease Detection Survey, covering the whole United States including Alaska. There are 73,730 polygons, one per surveyed area per year, with the flight dates, the surveying agency and the survey mode.\n\n**This is the denominator layer for the damage polygons** published beside it in this catalog as ids-damage-1997-2025. Detection survey coverage is not spatially random: flights follow established routes over accessible, road-adjacent forest, so remote and roadless terrain is systematically under-flown. A damage rate must be computed as damage divided by the area surveyed in the same year, never as damage divided by total land area or by forest area.\n\n**Substantive coverage runs from 1999 to 2025, but the file also holds three rows from earlier.** 1996, 1997 and 1998 carry exactly one row each, all in Region 6, against 1,258 rows across all nine regions in 1999. Those three rows are placeholders rather than surveyed years, which is why the dataset is named for 1999 to 2025 while its temporal extent is stated as 1996 to 2025: the extent describes what the file contains, and the name describes when the survey record becomes usable. Filter to SURVEY_YEAR >= 1999 for any coverage analysis.\n\n**Damage years 1997 and 1998 have no usable survey extent.** Damage was recorded in all nine regions in both years, so those years support damage counts and acreages but not damage rates.\n\n**One surveyed area can be stored as several polygon rows.** SURVEYED_AREA_ID has 57,575 distinct values over 73,730 rows and is blank on 1,157 of them, so it is not a row key; _cng_fid is. Surveyed area is best measured from the H3 footprint of the hex asset rather than by summing a per-row area column.\n\n**Provenance.** Built from the nine per-region File Geodatabases published by Forest Health Protection, which together are the national set (there is no single national download). The archives were staged to `s3://public-usfs/raw/ids/` on 2026-09-16, totalling 1,743,267,480 bytes, each carrying an upstream Last-Modified of 2026-04-22 and a sha256 recomputed from the stored object; the per-file byte counts, checksums and access date are in `s3://public-usfs/raw/ids/source-manifest.tsv`. Forest Health Protection publishes no edition or version label for this product, so none is claimed here: the access date and those checksums identify the edition used.",
