# data-workflows#591 — publish the two IDS STAC collections.
#
# In-cluster because STAC is canonical on NRP S3 (AGENTS.md Hard Boundary 1) and the workflow
# namespace holds the only rclone remote that writes there. Publishes:
#
#   ids-damage-1997-2025/stac-collection.json
#   ids-survey-extent-1999-2025/stac-collection.json
#   stac-collection.json            (both registered as children of the public-usfs sub-catalog)
#   README.md                       (bucket README gains an IDS section)
#
# Both collections pass `scripts/verify-stac.py --no-data` with 0 hard findings before publish.
# Idempotent: re-running re-uploads the two collections and leaves the parent and README alone.
apiVersion: v1
kind: ConfigMap
metadata: {name: ids-publish-stac, namespace: geo-workflows}
