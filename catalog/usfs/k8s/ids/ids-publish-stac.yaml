              "name": "Shape_Length",
              "type": "double",
              "description": "Perimeter of the source polygon in metres, computed in the source projected coordinate system before reprojection to WGS 84."
            },
            {
              "name": "Shape_Area",
              "type": "double",
              "description": "Area of the source polygon in square metres, computed in the source projected coordinate system before reprojection to WGS 84."
            },
            {
              "name": "h10",
              "type": "uint64",
              "description": "H3 cell identifier at resolution 10, the native resolution of this hex build (average cell area about 15,000 square metres)."
            },
            {
              "name": "h9",
              "type": "uint64",
              "description": "H3 cell identifier at resolution 9, the resolution 9 parent of the native cell."
            },
            {
              "name": "h8",
              "type": "uint64",
              "description": "H3 cell identifier at resolution 8, the resolution 8 parent of the native cell and the catalog's standard join key across datasets."
            },
            {
              "name": "h0",
              "type": "uint64",
              "description": "H3 cell identifier at resolution 0, used as the Hive partition key for partitioned reads."
            }
          ]
        }
      }
    }
  README-section.md: |
    ## Insect and disease damage: always divide by the area surveyed

    `ids-damage-1997-2025` holds 4,533,015 damage records mapped by the Forest Service Insect and
    Disease Detection Survey, nationally including Alaska. Observers sketch-map from aircraft along
    established routes, so **ground with no damage polygon may simply never have been flown.** Coverage
    concentrates on accessible, road-adjacent forest and systematically under-flies remote and roadless
    terrain, which is why the flight footprints ship as their own dataset,
    `ids-survey-extent-1999-2025`. A damage rate is damage divided by the area surveyed in the same
    year, never by total land area or by forest area.

    Two further traps, both measured on the published data:

    - **One row is one damage record, not one polygon.** A polygon carrying several damaging agents,
      hosts or damage types appears once for each, with the polygon's own `ACRES` copied onto every one
      of those rows. Summing `ACRES` over raw rows overstates the mapped area by 1.22x nationally
      (592,366,197 raw against 485,691,775 deduped).
    - **Damage polygons overlap across years by design**, because the same stand is re-recorded in each
      year it shows damage. Totals belong inside a survey year.

    1997 and 1998 damage has no published survey extent, so those two years support damage counts and
    acreages but not damage rates.

    ```sql
    -- damaged acres per survey year, counting each mapped polygon once
    SELECT SURVEY_YEAR, SUM(ACRES) AS acres
    FROM (SELECT DISTINCT DAMAGE_AREA_ID, SURVEY_YEAR, ACRES
          FROM read_parquet('https://s3-west.nrp-nautilus.io/public-usfs/ids-damage-1997-2025.parquet'))
    GROUP BY SURVEY_YEAR ORDER BY SURVEY_YEAR;

    -- share of the flown area showing damage in 2025, on the shared resolution 8 join key
    WITH flown AS (
      SELECT DISTINCT h8 FROM read_parquet(
        'https://s3-west.nrp-nautilus.io/public-usfs/ids-survey-extent-1999-2025/hex/h0=*/data_0.parquet',
        hive_partitioning=true) WHERE SURVEY_YEAR = 2025),
    damaged AS (
      SELECT DISTINCT h8 FROM read_parquet(
        'https://s3-west.nrp-nautilus.io/public-usfs/ids-damage-1997-2025/hex/h0=*/data_0.parquet',
        hive_partitioning=true) WHERE SURVEY_YEAR = 2025)
    SELECT (SELECT COUNT(*) FROM damaged SEMI JOIN flown USING (h8))::DOUBLE
         / (SELECT COUNT(*) FROM flown) AS damaged_share_of_flown;
    ```

    In MapLibre the `source-layer` for these two is the dataset name as well:
    `ids-damage-1997-2025` and `ids-survey-extent-1999-2025`.

  publish.py: |
    """Publish the two IDS STAC collections, register them in the public-usfs sub-catalog,
    and add them to the bucket README. Idempotent: re-running changes nothing."""
    import json, os, shutil, subprocess, sys

    BUCKET = "nrp:public-usfs"
    BASE = "https://s3-west.nrp-nautilus.io/public-usfs"
    COLLECTIONS = ["ids-damage-1997-2025", "ids-survey-extent-1999-2025"]
    TITLES = {
        "ids-damage-1997-2025":
            "USFS Insect and Disease Detection Survey damage polygons, 1997-2025 (national)",
        "ids-survey-extent-1999-2025":
            "USFS Insect and Disease Detection Survey annual survey extent, 1999-2025 (national)",
    }


    def pull(remote, local):
        subprocess.run(["rclone", "copyto", f"{BUCKET}/{remote}", local], check=True)


    def push(local, remote):
        # A ConfigMap mount is a symlink into ..data/, which rclone will not read
        # ("readdirent ...: not a directory"), so stage a real file first.
        if local.startswith("/config/"):
            staged = os.path.join("/tmp", os.path.basename(local))
            shutil.copyfile(local, staged)
            local = staged
        subprocess.run(["rclone", "copyto", local, f"{BUCKET}/{remote}"], check=True)
        print(f"  published {remote}", flush=True)


    # 1. the two collections
    for cid in COLLECTIONS:
        push(f"/config/{cid}.json", f"{cid}/stac-collection.json")

    # 2. register both as children of the bucket sub-catalog
    pull("stac-collection.json", "/tmp/parent.json")
    parent = json.load(open("/tmp/parent.json"))
    have = {l.get("href") for l in parent["links"]}
    added = 0
    for cid in COLLECTIONS:
        href = f"{BASE}/{cid}/stac-collection.json"
        if href in have:
            continue
        parent["links"].append({"rel": "child", "id": cid, "href": href,
                                "type": "application/json", "title": TITLES[cid]})
        added += 1
    if added:
        json.dump(parent, open("/tmp/parent.json", "w"), indent=2, ensure_ascii=False)
        push("/tmp/parent.json", "stac-collection.json")
        print(f"  registered {added} child link(s)", flush=True)
    else:
        print("  child links already registered, nothing to do", flush=True)

    # 3. bucket README
    pull("README.md", "/tmp/README.md")
    b = open("/tmp/README.md").read()
    if "ids-damage-1997-2025" in b:
        print("  README already covers IDS, nothing to do", flush=True)
    else:
        # rstrip/re-add so a YAML block scalar chomping the trailing blank line cannot
        # run the section straight into the following heading.
        new_readme = open("/config/README-section.md").read().rstrip("\n") + "\n\n"
        old_row = "| `ranger-district` | Ranger district boundaries | 237,098,674 |\n"
        rows = old_row + (
            "| `ids-damage-1997-2025` | Insect and disease damage polygons mapped from the air "
            "| per year, see below |\n"
            "| `ids-survey-extent-1999-2025` | Area actually flown each year, the denominator for "
            "damage | per year, see below |\n")
        if old_row not in b:
            sys.exit("README layout changed: the ranger-district row is gone, refusing to guess")
        b = b.replace(old_row, rows, 1)
        anchor = "## Query with DuckDB"
        if anchor not in b:
            sys.exit("README layout changed: no '## Query with DuckDB' heading, refusing to guess")
        b = b.replace(anchor, new_readme + anchor, 1)
        open("/tmp/README.md", "w").write(b)
        push("/tmp/README.md", "README.md")

    print("=== publish complete ===", flush=True)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ids-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: ids-publish-stac}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {k8s-app: ids-publish-stac}
    spec:
      restartPolicy: Never
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests: {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
          limits: {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
        command: [python3, /config/publish.py]
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
      volumes:
      - name: config
        configMap: {name: ids-publish-stac}
      - name: rclone-config
        secret: {secretName: rclone-config}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
