        "ids-survey-extent-1999-2025-hex": {
          "href": "https://s3-west.nrp-nautilus.io/public-usfs/ids-survey-extent-1999-2025/hex/h0=*/data_0.parquet",
          "type": "application/x-parquet",
          "title": "USFS Insect and Disease Detection Survey annual survey extent, 1999-2025 (national) - H3 hex parquet",
          "description": "H3 resolution 10 cells covering each surveyed-area polygon, with resolution 9, 8 and 0 parents, carrying every attribute of the GeoParquet except the geometry. This asset is large, 6,230,445,420 rows in 8 Hive partitions, because a single flight footprint can cover a whole region at resolution 10; filter on SURVEY_YEAR, and on h0 where the question is regional, before aggregating. This is the asset to use as the denominator for a damage rate: join it to the damage hex on h8 or h10 within the same SURVEY_YEAR.\n\nOne row is one (surveyed-area polygon, resolution 10 cell) pair, so BUFF_DIST, Shape_Area, Shape_Length and LEGACY_FLT_DAYS are repeated on every cell the polygon covers. Dedup on _cng_fid before summing any of them. Surveyed area for a year is the count of distinct cells, not the count of rows, because overlapping flight footprints in the same year cover many cells more than once.\n\n```sql\n-- correct: distinct resolution 10 cells flown in a year\nSELECT COUNT(DISTINCT h10) FROM read_parquet('https://s3-west.nrp-nautilus.io/public-usfs/ids-survey-extent-1999-2025/hex/h0=*/data_0.parquet', hive_partitioning=true) WHERE SURVEY_YEAR = 2025\n-- wrong: COUNT(*) counts a cell once per overlapping flight footprint\n```",
          "roles": [
            "data"
          ],
