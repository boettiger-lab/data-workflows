# Reprocess the 6 survey-extent hex chunks that exhausted their retries at 32Gi (#591).
# See the CHUNK_MAP comment in the command for why these 6 and what changed.
apiVersion: batch/v1
kind: Job
metadata:
  name: ids-survey-extent-1999-2025-hex-rechunk
  namespace: geo-workflows
  labels:
    k8s-app: ids-survey-extent-1999-2025-hex-rechunk
spec:
  completions: 6
  parallelism: 6
  completionMode: Indexed
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        k8s-app: ids-survey-extent-1999-2025-hex-rechunk
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-usfs
        - name: DATASET
          value: ids-survey-extent-1999-2025
        command:
        - bash
        - -c
        - 'set -e

          # Chunks 4,18,24,25,35,73 of the original 74 exhausted their retries at 32Gi: they hold the

          # largest survey footprints (the biggest single feature is ~77.8 deg2, ~47M H3 r10 cells).

          # maxFailedIndexes:1 then failed the whole job, stranding 68/74 chunks.

          #

          # chunk-size stays 1000 so each output keeps the filename the repartition expects

          # (chunk_0000NN.parquet). intermediate-chunk-size drops 10 -> 2, which the hex-tuning skill

          # says to try before raising memory, since peak RAM is the unnest of one feature''s cell array.

          CHUNK_MAP=(4 18 24 25 35 73)

          CHUNK_ID=${CHUNK_MAP[$JOB_COMPLETION_INDEX]}

          echo "reprocessing original chunk ${CHUNK_ID}"

          cng-datasets vector --input s3://public-usfs/ids-survey-extent-1999-2025.parquet --output s3://public-usfs/ids-survey-extent-1999-2025/chunks --chunk-id ${CHUNK_ID} --chunk-size 1000 --intermediate-chunk-size 2 --resolution 10 --parent-resolutions 9,8,0 --id-column _cng_fid'
        resources:
          requests:
            cpu: '4'
            memory: 64Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 64Gi
            ephemeral-storage: 10Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
  backoffLimit: 0
