queue: geo-workflows
jobSetId: administrative-forest-hex
jobs:
- namespace: geo-workflows
  priorityClassName: armada-preemptible
  podSpec:
    restartPolicy: Never
    containers:
    - name: hex-task
      image: ghcr.io/boettiger-lab/datasets:latest
      imagePullPolicy: Always
      env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: aws
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: aws
            key: AWS_SECRET_ACCESS_KEY
      - name: AWS_S3_ENDPOINT
        value: rook-ceph-rgw-nautiluss3.rook
      - name: AWS_PUBLIC_ENDPOINT
        value: s3-west.nrp-nautilus.io
      - name: AWS_HTTPS
        value: 'false'
      - name: AWS_VIRTUAL_HOSTING
        value: 'FALSE'
      - name: TMPDIR
        value: /tmp
      - name: BUCKET
        value: public-usfs
      - name: DATASET
        value: administrative-forest
      command:
      - bash
      - -c
      - |-
        set -e
        cng-datasets vector --input s3://public-usfs/administrative-forest.parquet --output s3://public-usfs/administrative-forest/chunks --chunk-id 0 --chunk-size 1 --intermediate-chunk-size 10 --resolution 10 --parent-resolutions 9,8,0
      resources:
        requests:
          cpu: '4'
          memory: 16Gi
          ephemeral-storage: 10Gi
        limits:
          cpu: '4'
          memory: 16Gi
          ephemeral-storage: 10Gi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: feature.node.kubernetes.io/pci-10de.present
              operator: NotIn
              values:
              - 'true'
