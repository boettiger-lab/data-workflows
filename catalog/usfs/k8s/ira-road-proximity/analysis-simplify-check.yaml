# #588 validation: does the 5 m centreline simplification move the answer?
#
# analysis-proximity.yaml applies ST_Simplify(geom, 5.0) before unioning roads, because
# buffering an unsimplified union OOM-killed a 36Gi pod on RoadCore alone. 5 m is below the
# positional accuracy of both inputs (EDW ~1:24,000 ≈ 12 m; TIGER rural centrelines tens of
# metres), a tenth of the finest ladder band and 1/160th of the 0.5-mile headline distance —
# but "should be negligible" is an argument, not evidence. This job measures it.
#
# Recomputes ONE shard's CONUS acreage ladder at SIMPLIFY_M = 5.0 and again at 0.0 (no
# simplification) and reports the per-distance deviation. Standard: if any deviation at or
# beyond the 0.5-mile distance exceeds a small fraction of a percent, the tolerance is wrong
# and the published figures should be recomputed.
#
# Runs on ONE shard, so it is cheap and concurrent with the main ladder. Memory is generous
# because the unsimplified arm is the one that OOMs — and if it OOMs here, that is itself a
# reportable result rather than a failure.
#
# Issue: boettiger-lab/data-workflows#588
apiVersion: batch/v1
kind: Job
metadata:
  name: ira-road-simplify-check
  labels:
    k8s-app: ira-road-simplify-check
spec:
  backoffLimit: 1
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        k8s-app: ira-road-simplify-check
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      containers:
      - name: simplify-check
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /scratch/tmp_588_simp
        resources:
          requests: {cpu: '8', memory: 64Gi, ephemeral-storage: 20Gi}
          limits:   {cpu: '8', memory: 64Gi, ephemeral-storage: 20Gi}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          mkdir -p /scratch/tmp_588_simp
          python3 - <<'PY'
          import os, duckdb

          WORK  = "s3://public-usfs/_work/588"
          M2_AC = 4046.8564224
          MAXD  = 3218.688 * 1.05
          SHARD, NSHARD = 0, 60
          LADDER = [50.0, 100.0, 200.0, 400.0, 804.672, 1000.0, 1609.344, 2414.016, 3218.688]

          con = duckdb.connect()
          con.execute("INSTALL spatial; LOAD spatial; INSTALL httpfs; LOAD httpfs;")
          con.execute("SET s3_endpoint='rook-ceph-rgw-nautiluss3.rook';")
          con.execute("SET s3_use_ssl=false; SET s3_url_style='path';")
          con.execute("SET s3_access_key_id='%s';" % os.environ["AWS_ACCESS_KEY_ID"])
          con.execute("SET s3_secret_access_key='%s';" % os.environ["AWS_SECRET_ACCESS_KEY"])
          con.execute("SET memory_limit='52GB'; SET threads=8;")
          con.execute("SET temp_directory='/scratch/tmp_588_simp';")
          con.execute("SET preserve_insertion_order=false;")

          con.execute(f"CREATE TABLE ira AS SELECT * FROM read_parquet('{WORK}/ira.parquet')")
          con.execute(f"CREATE TABLE rc  AS SELECT * FROM read_parquet('{WORK}/roads_rc.parquet')")
          # Sample ACROSS the road-density distribution rather than taking the densest N.
          # Taking the worst case sounds stricter but is both statistically worse and
          # computationally infeasible: the densest polygons are exactly the ones whose
          # exact (unsimplified) buffer cannot be computed in reasonable memory — that is
          # why simplification exists — so a worst-case-only sample either OOMs or never
          # finishes, and it tells you nothing about the typical error that actually moves
          # a national total. Deciles give a representative estimate AND include dense
          # polygons, with the densest handled by the per-polygon exception path below.
          NSAMPLE = 10
          con.execute(f"""
            CREATE TABLE i_all AS
            SELECT _cng_fid, g, ST_Buffer(g, {MAXD}) AS gb
            FROM ira
            WHERE crs_region = 'CONUS' AND (hash(_cng_fid) % {NSHARD}) = {SHARD}
          """)
          con.execute(f"""
            CREATE TABLE dens AS
            SELECT i2._cng_fid, COUNT(*) AS nr,
                   NTILE({NSAMPLE}) OVER (ORDER BY COUNT(*)) AS decile
            FROM i_all i2 JOIN rc r ON r.crs_region = 'CONUS'
                                   AND ST_Intersects(i2.gb, r.g)
            GROUP BY 1
          """)
          con.execute("""
            CREATE TABLE i_s AS
            SELECT i.* FROM i_all i
            JOIN (SELECT _cng_fid, nr,
                         ROW_NUMBER() OVER (PARTITION BY decile ORDER BY nr DESC) AS rn
                  FROM dens) t USING (_cng_fid)
            WHERE t.rn = 1
          """)
          n = con.execute("SELECT COUNT(*) FROM i_s").fetchone()[0]
          tot = con.execute("SELECT COUNT(*) FROM i_all").fetchone()[0]
          spread = con.execute("""
            SELECT MIN(nr), MAX(nr) FROM dens d
            JOIN i_s i USING (_cng_fid)
          """).fetchone()
          print(f"validating on {n} of shard {SHARD}'s {tot} CONUS polygons, one per "
                f"road-density decile ({spread[0]}-{spread[1]} road segments in range)\n",
                flush=True)

          # ⚠️ Process ONE polygon at a time, both arms, rather than all N at once.
          # The unsimplified arm OOM-killed a 32Gi pod on 25 polygons in aggregate while the
          # simplified arm ran the same 25 at ~13Gi — which is itself the finding that
          # simplification is what makes this computable, not a convenience. But it left the
          # accuracy question unanswered, and accuracy is the thing being validated. Per
          # polygon, peak memory is bounded by a single road union, so the exact arm fits.
          fids = [r[0] for r in con.execute("SELECT _cng_fid FROM i_s ORDER BY 1").fetchall()]
          tot = {5.0: dict.fromkeys(LADDER, 0.0), 0.0: dict.fromkeys(LADDER, 0.0)}
          vtx = {5.0: 0, 0.0: 0}
          skipped = []

          for k, fid in enumerate(fids, 1):
              for tol in (5.0, 0.0):
                  simp = f"ST_Simplify(r.g, {tol})" if tol > 0 else "r.g"
                  try:
                      con.execute("DROP TABLE IF EXISTS one")
                      con.execute(f"""
                        CREATE TEMP TABLE one AS
                        SELECT ST_Union_Agg({simp}) AS rg
                        FROM i_s i JOIN rc r ON r.crs_region = 'CONUS'
                                            AND ST_Intersects(i.gb, r.g)
                        WHERE i._cng_fid = {fid}
                      """)
                      vtx[tol] += con.execute(
                          "SELECT COALESCE(SUM(ST_NPoints(rg)),0) FROM one").fetchone()[0]
                      for d in LADDER:
                          v = con.execute(f"""
                            SELECT COALESCE(SUM(ST_Area(ST_Intersection(i.g,
                                     ST_Buffer(n.rg, {d}::DOUBLE))) / {M2_AC}), 0)
                            FROM i_s i, one n WHERE i._cng_fid = {fid}
                          """).fetchone()[0]
                          tot[tol][d] += v
                  except Exception as e:
                      skipped.append((fid, tol, type(e).__name__))
                      break
              if k % 5 == 0:
                  print(f"  {k}/{len(fids)} polygons", flush=True)

          if skipped:
              print(f"\n⚠️  {len(skipped)} polygon/arm pairs failed and are EXCLUDED "
                    f"from both totals: {skipped[:5]}", flush=True)

          print(f"\nvertices in road unions: exact {vtx[0.0]:,} -> simplified "
                f"{vtx[5.0]:,} ({100.0*(vtx[0.0]-vtx[5.0])/max(vtx[0.0],1):.1f}% fewer)\n",
                flush=True)
          print(f"{'d (m)':>10}{'exact acres':>16}{'simplified':>16}{'deviation':>12}")
          worst = 0.0
          for d in LADDER:
              a0, a5 = tot[0.0][d], tot[5.0][d]
              dev = 100.0 * (a5 - a0) / a0 if a0 else 0.0
              if d >= 804.672:
                  worst = max(worst, abs(dev))
              print(f"{d:>10.1f}{a0:>16,.1f}{a5:>16,.1f}{dev:>11.4f}%")
          print(f"\nworst absolute deviation at or beyond 0.5 mi: {worst:.4f}%")
          print("VERDICT:", "PASS - simplification does not move the answer"
                if worst < 0.1 else
                "FAIL - tolerance too coarse, recompute without simplification", flush=True)
          PY
          echo "✓ Complete"
      volumes:
      - {name: scratch, persistentVolumeClaim: {claimName: rechunk-scratch}}
      - {name: rclone-config, secret: {secretName: rclone-config}}
