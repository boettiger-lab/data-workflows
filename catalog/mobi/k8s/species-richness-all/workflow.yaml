apiVersion: batch/v1
kind: Job
metadata:
  name: mobi-species-richness-all-workflow
  namespace: biodiversity
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting mobi-species-richness-all raster workflow...\"\
          \n\n# Step 0: Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl\
          \ apply -f /yamls/mobi-species-richness-all-setup-bucket.yaml -n biodiversity\n\
          kubectl wait --for=condition=complete --timeout=600s job/mobi-species-richness-all-setup-bucket\
          \ -n biodiversity\n\n# Step 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal\
          \ tiling...\"\nkubectl apply -f /yamls/mobi-species-richness-all-hex.yaml\
          \ -n biodiversity\nkubectl wait --for=condition=complete --timeout=7200s\
          \ job/mobi-species-richness-all-hex -n biodiversity\n\necho \"\u2713 Workflow\
          \ complete!\"\necho \"Clean up with:\"\necho \"  kubectl delete jobs mobi-species-richness-all-setup-bucket\
          \ mobi-species-richness-all-hex mobi-species-richness-all-workflow -n biodiversity\"\
          \necho \"  kubectl delete configmap mobi-species-richness-all-yamls -n biodiversity\"\
          \n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: mobi-species-richness-all-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
