apiVersion: batch/v1
kind: Job
metadata:
  name: mobi-species-richness-all-cog
  namespace: biodiversity
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - "true"
      containers:
      - name: cog
        image: ghcr.io/boettiger-lab/datasets:latest
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
            ephemeral-storage: "20Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
            ephemeral-storage: "20Gi"
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_HTTPS
          value: "NO"
        - name: AWS_VIRTUAL_HOSTING
          value: "FALSE"
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |-
          set -e

          SOURCE="/vsicurl/https://minio.carlboettiger.info/public-biodiversity/mobi/species-richness-all/SpeciesRichness_All.tif"
          OUT=/tmp/mobi-species-richness-all-cog.tif

          echo "Reprojecting to WGS84 and creating COG..."
          gdalwarp \
            -t_srs EPSG:4326 \
            -r near \
            -of COG \
            -co COMPRESS=DEFLATE \
            -co PREDICTOR=2 \
            -co RESAMPLING=NEAREST \
            -co OVERVIEWS=IGNORE_EXISTING \
            -co NUM_THREADS=4 \
            -co BLOCKSIZE=512 \
            -wo NUM_THREADS=4 \
            $SOURCE \
            $OUT

          echo "Uploading to S3..."
          rclone copyto $OUT nrp:public-mobi/mobi-species-richness-all-cog.tif --progress

          echo "Done: s3://public-mobi/mobi-species-richness-all-cog.tif"
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config

