# HAND-ROLLED: the generator does not write STAC. A metadata-only fix (#886): every Bio-ORACLE
# child collection of s3://public-bio-oracle/ moves from `license: other` to the SPDX id
# GPL-1.0-or-later, with the terms stated in its description. set_licence.py (committed
# beside this file) edits each LIVE collection, so nothing else on it is touched.
#   kubectl create configmap bio-oracle-licence-script -n geo-workflows \
#     --from-file=set_licence.py=catalog/bio-oracle/k8s/licence-886/set_licence.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/bio-oracle/k8s/licence-886/bio-oracle-licence-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: bio-oracle-licence-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: bio-oracle-licence-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: bio-oracle-licence-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }

          # The children are whatever the bucket collection links, read at run time.
          rclone cat nrp:public-bio-oracle/stac-collection.json > /tmp/root.json
          python3 -c "import json; [print(l['href'].split('/public-bio-oracle/', 1)[1]) for l in json.load(open('/tmp/root.json'))['links'] if l['rel'] == 'child']" > /tmp/children.txt
          n=$(wc -l < /tmp/children.txt)
          echo "$n child collections"
          [ "$n" -eq 18 ] || { echo "expected 18 children"; exit 1; }

          while read -r p; do
            rclone cat "nrp:public-bio-oracle/$p" > /tmp/c.json
            python3 /script/set_licence.py /tmp/c.json
            guard_stac /tmp/c.json "nrp:public-bio-oracle/$p"
            rclone copyto /tmp/c.json "nrp:public-bio-oracle/$p" $R
          done < /tmp/children.txt
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: bio-oracle-licence-script}}
