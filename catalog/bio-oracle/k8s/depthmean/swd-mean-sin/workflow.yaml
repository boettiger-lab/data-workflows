apiVersion: batch/v1
kind: Job
metadata:
  name: depthmean-swd-mean-sin-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting depthmean-swd-mean-sin raster workflow...\"\n\
          \n# Step 0: Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl\
          \ apply -f /yamls/depthmean-swd-mean-sin-setup-bucket.yaml -n geo-workflows\n\
          kubectl wait --for=condition=complete --timeout=600s job/depthmean-swd-mean-sin-setup-bucket\
          \ -n geo-workflows\n\n# Step 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal\
          \ tiling...\"\nkubectl apply -f /yamls/depthmean-swd-mean-sin-hex.yaml -n\
          \ geo-workflows\nkubectl wait --for=condition=complete --timeout=7200s job/depthmean-swd-mean-sin-hex\
          \ -n geo-workflows\n\necho \"\u2713 Workflow complete!\"\necho \"Clean up\
          \ with:\"\necho \"  kubectl delete jobs depthmean-swd-mean-sin-setup-bucket\
          \ depthmean-swd-mean-sin-hex depthmean-swd-mean-sin-workflow -n geo-workflows\"\
          \necho \"  kubectl delete configmap depthmean-swd-mean-sin-yamls -n geo-workflows\"\
          \n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: depthmean-swd-mean-sin-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
