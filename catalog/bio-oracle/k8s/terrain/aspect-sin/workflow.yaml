apiVersion: batch/v1
kind: Job
metadata:
  name: terrain-aspect-sin-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting terrain-aspect-sin raster workflow...\"\n\n#\
          \ Step 0: Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl apply\
          \ -f /yamls/terrain-aspect-sin-setup-bucket.yaml -n geo-workflows\nkubectl\
          \ wait --for=condition=complete --timeout=600s job/terrain-aspect-sin-setup-bucket\
          \ -n geo-workflows\n\n# Step 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal\
          \ tiling...\"\nkubectl apply -f /yamls/terrain-aspect-sin-hex.yaml -n geo-workflows\n\
          kubectl wait --for=condition=complete --timeout=7200s job/terrain-aspect-sin-hex\
          \ -n geo-workflows\n\necho \"\u2713 Workflow complete!\"\necho \"Clean up\
          \ with:\"\necho \"  kubectl delete jobs terrain-aspect-sin-setup-bucket\
          \ terrain-aspect-sin-hex terrain-aspect-sin-workflow -n geo-workflows\"\n\
          echo \"  kubectl delete configmap terrain-aspect-sin-yamls -n geo-workflows\"\
          \n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: terrain-aspect-sin-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
