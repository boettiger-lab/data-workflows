apiVersion: batch/v1
kind: Job
metadata:
  name: terrain-tpi-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting terrain-tpi raster workflow...\"\n\n# Step 0:\
          \ Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl apply -f\
          \ /yamls/terrain-tpi-setup-bucket.yaml -n geo-workflows\nkubectl wait --for=condition=complete\
          \ --timeout=600s job/terrain-tpi-setup-bucket -n geo-workflows\n\n# Step\
          \ 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal tiling...\"\nkubectl\
          \ apply -f /yamls/terrain-tpi-hex.yaml -n geo-workflows\nkubectl wait --for=condition=complete\
          \ --timeout=7200s job/terrain-tpi-hex -n geo-workflows\n\necho \"\u2713\
          \ Workflow complete!\"\necho \"Clean up with:\"\necho \"  kubectl delete\
          \ jobs terrain-tpi-setup-bucket terrain-tpi-hex terrain-tpi-workflow -n\
          \ geo-workflows\"\necho \"  kubectl delete configmap terrain-tpi-yamls -n\
          \ geo-workflows\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: terrain-tpi-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
