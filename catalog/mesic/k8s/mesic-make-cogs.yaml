apiVersion: batch/v1
kind: Job
metadata:
  name: mesic-make-cogs
  namespace: geo-workflows
  labels:
    k8s-app: mesic-make-cogs
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: mesic-make-cogs
    spec:
      restartPolicy: Never
      containers:
      - name: make-cogs
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_CACHEMAX
          value: '2048'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          cd /tmp && mkdir -p work && cd work

          echo "=== Localising staged raw (rclone, internal endpoint -- never /vsis3 for GDAL) ==="
          rclone copy nrp:public-mesic/raw/BIOME_Mesic_Persistence_unmasked.tif . -P
          rclone copy nrp:public-mesic/raw/BIOME_Mesic_Persistence_masked.tif . -P
          ls -la

          # The source GeoTIFFs are paletted Byte (256-entry colour table ramping 1->42).
          # Overviews on a palette band MUST be NEAREST -- averaging palette indices would
          # invent colours that mean nothing. Full-resolution values are untouched either
          # way, so the hex step reads the same 1-42 counts regardless.
          for P in unmasked masked; do
            SRC="BIOME_Mesic_Persistence_${P}.tif"
            DST="mesic-persistence-${P}-2026-09-cog.tif"
            echo
            echo "=== COG: $SRC -> $DST ==="
            gdal_translate -of COG "$SRC" "$DST" \
              -co COMPRESS=LZW -co PREDICTOR=2 -co BLOCKSIZE=512 \
              -co OVERVIEW_RESAMPLING=NEAREST -co NUM_THREADS=ALL_CPUS \
              --config GDAL_NUM_THREADS ALL_CPUS
            gdalinfo "$DST" | grep -vE '^\s+[0-9]+: [0-9]+,' | grep -E 'Size is|Type=|NoData|COMPRESSION|LAYOUT|Pixel Size|Overviews'
          done

          # ---- Presence layer (issue #609, "What to do" step 2) ------------------------
          # Persistence is 1-42 with NoData=0, so "ever mesic" is exactly "has data".
          # Presence = 1 where the unmasked raster has any value, 0 elsewhere, and the
          # result carries NO NoData -- that is the whole point. exact_extract's `mean`
          # over a cell then returns the FRACTION of the cell's pixels that were ever
          # mesic, so  fraction x h3_cell_area  is a defensible mesic area. If we left
          # NoData=0 in place the mean would be 1.0 in every cell that touches any mesic
          # pixel, which is the error this layer exists to prevent.
          echo
          echo "=== Presence: derive 0/1 from the UNMASKED raster ==="
          gdal_calc.py -A BIOME_Mesic_Persistence_unmasked.tif --A_band=1 \
            --outfile=presence_raw.tif --calc="(A>0)*1" --type=Byte \
            --NoDataValue=none --overwrite --quiet \
            --co COMPRESS=LZW --co TILED=YES --co BLOCKXSIZE=512 --co BLOCKYSIZE=512 \
            --co NUM_THREADS=ALL_CPUS
          # gdal_calc writes a colour-interp-free band but can still stamp a NoData; make
          # certain there is none, or exact_extract will drop the zeros from the denominator.
          gdal_edit.py -unsetnodata presence_raw.tif || true
          gdalinfo presence_raw.tif | grep -E 'Type=|NoData|Size is' || true

          echo
          echo "=== COG: presence_raw.tif -> mesic-presence-2026-09-cog.tif ==="
          # AVERAGE overviews are correct here: the band is a 0/1 indicator, so an averaged
          # overview pixel IS the local mesic fraction -- the same quantity the hex reports.
          gdal_translate -of COG presence_raw.tif mesic-presence-2026-09-cog.tif \
            -co COMPRESS=LZW -co PREDICTOR=2 -co BLOCKSIZE=512 \
            -co OVERVIEW_RESAMPLING=AVERAGE -co NUM_THREADS=ALL_CPUS \
            --config GDAL_NUM_THREADS ALL_CPUS

          echo
          echo "=== Validation: presence must be exactly {0,1}, no NoData, and its 1-count"
          echo "=== must equal the unmasked raster's valid-pixel count ==="
          python3 - <<'PY'
          import numpy as np
          from osgeo import gdal
          gdal.UseExceptions()

          def tally(path):
              ds = gdal.Open(path)
              b = ds.GetRasterBand(1)
              counts = np.zeros(256, dtype=np.int64)
              rows = 4096
              for y in range(0, ds.RasterYSize, rows):
                  h = min(rows, ds.RasterYSize - y)
                  counts += np.bincount(b.ReadAsArray(0, y, ds.RasterXSize, h).ravel(),
                                        minlength=256)
              return counts, b.GetNoDataValue(), ds.RasterXSize * ds.RasterYSize

          src, src_nodata, src_total = tally('BIOME_Mesic_Persistence_unmasked.tif')
          pres, pres_nodata, pres_total = tally('mesic-presence-2026-09-cog.tif')

          src_valid = int(src[1:].sum())
          pres_one = int(pres[1])
          distinct = np.nonzero(pres)[0].tolist()

          print('unmasked : nodata=%s  valid(non-zero)=%d  grid=%d' % (src_nodata, src_valid, src_total))
          print('presence : nodata=%s  ones=%d  zeros=%d  grid=%d' % (pres_nodata, pres_one, int(pres[0]), pres_total))
          print('presence distinct values:', distinct)
          print('mesic share of grid: %.4f%%' % (100.0 * pres_one / pres_total))

          ok = True
          if pres_nodata is not None:
              print('FAIL: presence COG still carries a NoData value'); ok = False
          if distinct != [0, 1] and distinct != [1]:
              print('FAIL: presence is not a pure 0/1 indicator'); ok = False
          if pres_one != src_valid:
              print('FAIL: presence 1-count %d != unmasked valid count %d' % (pres_one, src_valid)); ok = False
          if pres_total != src_total:
              print('FAIL: grid size changed'); ok = False
          if not ok:
              raise SystemExit(1)
          print('PRESENCE VALIDATION OK')
          PY

          echo
          echo "=== Checksums + sizes (recorded in STAC) ==="
          for F in mesic-persistence-unmasked-2026-09-cog.tif \
                   mesic-persistence-masked-2026-09-cog.tif \
                   mesic-presence-2026-09-cog.tif; do
            echo "$F  $(stat -c%s $F) bytes  sha256=$(sha256sum $F | cut -d' ' -f1)"
          done

          echo
          echo "=== Upload COGs to s3://public-mesic/ ==="
          for F in mesic-persistence-unmasked-2026-09-cog.tif \
                   mesic-persistence-masked-2026-09-cog.tif \
                   mesic-presence-2026-09-cog.tif; do
            rclone copyto "$F" "nrp:public-mesic/$F" -P
          done
          rclone lsl nrp:public-mesic/ | grep cog.tif
          echo "ALL DONE"
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 30Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 30Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hpc-nrp-g1.nmsu.edu
                - service-02.nrp.mghpcc.org
