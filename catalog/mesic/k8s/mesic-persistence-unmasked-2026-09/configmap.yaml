              set -e

              cng-datasets raster --input "s3://public-mesic/mesic-persistence-unmasked-2026-09-cog.tif" --output-parquet s3://public-mesic/mesic-persistence-unmasked-2026-09/hex-chunks/ --chunk-resolution 1 --chunk-index ${JOB_COMPLETION_INDEX} --h0-subset "12,14,20,50,71" --resolution 10 --parent-resolutions 9,8,0 --value-column persistence --hex-resampling mean --nodata "0"
