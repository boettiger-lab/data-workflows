apiVersion: batch/v1
kind: Job
metadata:
  name: mesic-valley-bottoms-2026-09-convert
  namespace: geo-workflows
  labels:
    k8s-app: mesic-valley-bottoms-2026-09-convert
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: mesic-valley-bottoms-2026-09-convert
    spec:
      restartPolicy: Never
      containers:
      - name: convert-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-mesic
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          cng-convert-to-parquet \
            https://s3-west.nrp-nautilus.io/public-mesic/raw/BIOME_Mesic_Valley_Bottom_Layers_Table.gpkg \
            s3://public-mesic/mesic-valley-bottoms-2026-09.parquet \
            --row-group-size 2000 \
            --layer biome_Mesic_Valley_Bottom_Layers_Table \
            --expect-features 24690182
        # DEVIATION from generated output (#609): 24.7M polygons from a 16.9 GB GeoPackage; the generated job sets no ephemeral, so it
        # would get the 50Gi default, below the localized source plus the output parquet.
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 80Gi
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 80Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
