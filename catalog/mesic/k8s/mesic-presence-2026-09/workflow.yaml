apiVersion: batch/v1
kind: Job
metadata:
  name: mesic-presence-2026-09-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting mesic-presence-2026-09 raster workflow...\"\n\
          \n# Step 0: Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl\
          \ apply -f /yamls/mesic-presence-2026-09-setup-bucket.yaml -n geo-workflows\n\
          kubectl wait --for=condition=complete --timeout=600s job/mesic-presence-2026-09-setup-bucket\
          \ -n geo-workflows\n\n# Step 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal\
          \ tiling...\"\nkubectl apply -f /yamls/mesic-presence-2026-09-hex.yaml -n\
          \ geo-workflows\nkubectl wait --for=condition=complete --timeout=7200s job/mesic-presence-2026-09-hex\
          \ -n geo-workflows\n\n# Step 2: Merge sub-h0 chunks into one file per h0\
          \ partition\necho \"Step 2: Merging hex chunks...\"\nkubectl apply -f /yamls/mesic-presence-2026-09-merge.yaml\
          \ -n geo-workflows\nkubectl wait --for=condition=complete --timeout=7200s\
          \ job/mesic-presence-2026-09-merge -n geo-workflows\n\necho \"\u2713 Workflow\
          \ complete!\"\necho \"Clean up with:\"\necho \"  kubectl delete jobs mesic-presence-2026-09-setup-bucket\
          \ mesic-presence-2026-09-hex mesic-presence-2026-09-merge mesic-presence-2026-09-workflow\
          \ -n geo-workflows\"\necho \"  kubectl delete configmap mesic-presence-2026-09-yamls\
          \ -n geo-workflows\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: mesic-presence-2026-09-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
