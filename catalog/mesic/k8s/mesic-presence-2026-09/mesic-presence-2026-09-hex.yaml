apiVersion: batch/v1
kind: Job
metadata:
  name: mesic-presence-2026-09-hex
  namespace: geo-workflows
  labels:
    k8s-app: mesic-presence-2026-09-hex
spec:
  completions: 35
  parallelism: 35
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 1
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: mesic-presence-2026-09-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: BUCKET
          value: public-mesic
        - name: CNG_HEX_WORKERS
          value: '2'
        - name: CNG_HEX_CHUNK_SIZE
          value: '100000'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |-
          set -e

          cng-datasets raster --input "s3://public-mesic/mesic-presence-2026-09-cog.tif" --output-parquet s3://public-mesic/mesic-presence-2026-09/hex-chunks/ --chunk-resolution 1 --chunk-index ${JOB_COMPLETION_INDEX} --h0-subset "12,14,20,50,71" --resolution 8 --parent-resolutions 0 --value-column mesic_fraction --hex-resampling mean
        resources:
          requests:
            cpu: '2'
            memory: 12Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '2'
            memory: 12Gi
            ephemeral-storage: 10Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
