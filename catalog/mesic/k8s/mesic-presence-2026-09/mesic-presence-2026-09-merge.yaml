apiVersion: batch/v1
kind: Job
metadata:
  name: mesic-presence-2026-09-merge
  namespace: geo-workflows
  labels:
    k8s-app: mesic-presence-2026-09-merge
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: mesic-presence-2026-09-merge
    spec:
      restartPolicy: Never
      containers:
      - name: merge-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: BUCKET
          value: public-mesic
        - name: DUCKDB_MEMORY_LIMIT
          value: 8Gi
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e

          cng-datasets merge-chunks \
            --chunks-dir s3://public-mesic/mesic-presence-2026-09/hex-chunks \
            --output-dir s3://public-mesic/mesic-presence-2026-09/hex \
            --expect-chunks 34
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 100Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 100Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
