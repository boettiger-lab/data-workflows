apiVersion: batch/v1
kind: Job
metadata:
  name: calflora-ranges-hex
  namespace: geo-workflows
  labels: {k8s-app: calflora-ranges-hex}
spec:
  completions: 109           # one species per pod
  parallelism: 16
  completionMode: Indexed
  backoffLimitPerIndex: 3    # opportunistic pods get preempted; retry the index, not the job
  maxFailedIndexes: 0        # every species must land: a gap is a species missing from the app
  ttlSecondsAfterFinished: 172800
  activeDeadlineSeconds: 28800
  template:
    metadata: {labels: {k8s-app: calflora-ranges-hex}}
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: hex
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID,     valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: TMPDIR, value: /tmp}
        # The tool cannot read the pod's cgroup CPU quota and otherwise fans out to the
        # NODE's core count (256 on these machines), which oversubscribes a shared node 16x
        # per pod once 25 of them are running.  64 is a compromise: the work is dominated by
        # a 5.7M-cell polyfill that parallelises well, and pinning to the 16-core limit made a
        # single species take over 13 minutes.
        - {name: CNG_HEX_WORKERS, value: '64'}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          # One species per pod.  Issue #668.
          #
          # Why a fan-out rather than one pod looping over 109 rasters: `cng-datasets raster`
          # polyfills the whole h0 base cell at the target resolution before intersecting with
          # the source (5,764,801 cells at resolution 8), so the cost per species is set by the
          # base cell, not by the raster -- minutes even for a raster of 33,000 pixels.  Spread
          # across pods that is fine; serially it is nine hours.
          #
          # Reducer `max` over non-NaN pixels.  A NaN pixel yields no row, so ROW PRESENCE is the
          # range mask and the reducer only sets the observation count for a cell already in
          # range.  `mean` would manufacture fractional counts; `sum` would make the count depend
          # on how many source pixels happen to land in a cell.  Zero rows are kept: a 0 means
          # "climate suitable, not observed here", which is in range and is 97.8% of the range.
          cd /tmp
          rclone lsf nrp:public-ca-ccca5/calflora-ranges/cog/ --include '*.tif' | sed 's/\.tif$//' | sort > /tmp/species.txt
          N=$(wc -l < /tmp/species.txt)
          test "$N" -eq 109 || { echo "expected 109 species, found $N"; exit 1; }
          CODE=$(sed -n "$((JOB_COMPLETION_INDEX + 1))p" /tmp/species.txt)
          test -n "$CODE" || { echo "no species for index $JOB_COMPLETION_INDEX"; exit 1; }
          echo "=== [$JOB_COMPLETION_INDEX] $CODE ==="

          rclone copyto "nrp:public-ca-ccca5/calflora-ranges/cog/${CODE}.tif" /tmp/src.tif --retries 5

          t0=$SECONDS
          cng-datasets raster \
            --input /tmp/src.tif \
            --output-parquet "/tmp/hex" \
            --resolution 8 --parent-resolutions 7,0 \
            --value-column n_observations \
            --hex-resampling max \
            --local-cache-dir /tmp/cache
          echo "hexed in $((SECONDS - t0))s"

          # Tag with the species code and republish as one file per h0, so the consolidate step
          # reads 109 small trees rather than a directory of anonymous parts.
          python3 - "$CODE" <<'PY'
          import glob, os, sys, duckdb
          code = sys.argv[1]
          src = glob.glob('/tmp/hex/**/*.parquet', recursive=True)
          assert src, f'{code}: hex produced no parquet'
          con = duckdb.connect()
          rel = ("read_parquet('/tmp/hex/**/*.parquet', hive_partitioning=true, union_by_name=true)")
          cols = [r[0] for r in con.execute(f'DESCRIBE SELECT * FROM {rel}').fetchall()]
          for need in ('h8', 'h7', 'h0', 'n_observations'):
              assert need in cols, f'{code}: missing {need}; got {cols}'
          os.makedirs('/tmp/out', exist_ok=True)
          con.execute(f"""
            COPY (SELECT '{code}' AS species_code, h0, h7, h8,
                         CAST(n_observations AS TINYINT) AS n_observations
                  FROM {rel} ORDER BY h8)
            TO '/tmp/out' (FORMAT PARQUET, PARTITION_BY h0, COMPRESSION zstd,
                           ROW_GROUP_SIZE 2000, OVERWRITE_OR_IGNORE true)
          """)
          n, nz, mx = con.execute(f"""
            SELECT count(*), sum(CASE WHEN n_observations = 0 THEN 1 ELSE 0 END),
                   max(n_observations) FROM {rel}""").fetchone()
          print(f'{code}: {n:,} cells, {nz:,} zero, max {mx}')
          assert n > 0, f'{code}: no cells'
          assert mx is None or mx <= 9, f'{code}: max {mx} exceeds the saturating bin'
          PY

          rclone copy /tmp/out/ "nrp:public-ca-ccca5/calflora-ranges/hex-parts/species_code=${CODE}/" \
            --transfers 8 --retries 5
          echo "DONE ${CODE}"
        resources:
          requests: {cpu: '16', memory: 24Gi, ephemeral-storage: 20Gi}
          limits:   {cpu: '16', memory: 24Gi, ephemeral-storage: 20Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
