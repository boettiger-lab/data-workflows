apiVersion: batch/v1
kind: Job
metadata:
  name: calflora-ranges-stac
  namespace: geo-workflows
  labels: {k8s-app: calflora-ranges-stac}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 172800
  activeDeadlineSeconds: 3600
  template:
    metadata: {labels: {k8s-app: calflora-ranges-stac}}
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: stac
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID,     valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: TMPDIR, value: /tmp}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          cd /tmp
          rclone copyto nrp:public-ca-ccca5/calflora-ranges/cog-stats.json /tmp/cog-stats.json --retries 5
          rclone copyto nrp:public-ca-ccca5/calflora-ranges/species.parquet /tmp/species.parquet --retries 5
          rclone copy nrp:public-ca-ccca5/calflora-ranges/hex/ /tmp/hex/ --transfers 16 --retries 5
          ZIPSIZE=$(rclone size nrp:public-ca-ccca5/raw/2026-09-15/SppRange_Project-20260915T185722Z-1-001.zip --json | python3 -c 'import json,sys;print(json.load(sys.stdin)["bytes"])')

          python3 - "$ZIPSIZE" <<'PY'
          import json, sys, datetime, duckdb

          B = 'https://s3-west.nrp-nautilus.io/public-ca-ccca5'
          zipsize = int(sys.argv[1])
          stats = {r['code']: r for r in json.load(open('/tmp/cog-stats.json'))}
          con = duckdb.connect()
          names = dict(con.execute(
              "SELECT species_code, scientific_name FROM read_parquet('/tmp/species.parquet')").fetchall())

          hx = "read_parquet('/tmp/hex/**/*.parquet', hive_partitioning=true)"
          nrow, nsp, nz, npos, mx = con.execute(
              f"""SELECT count(*), count(DISTINCT species_code),
                         sum(CASE WHEN n_observations = 0 THEN 1 ELSE 0 END),
                         sum(CASE WHEN n_observations > 0 THEN 1 ELSE 0 END),
                         max(n_observations) FROM {hx}""").fetchone()

          lon_min = min(r['lon_min'] for r in stats.values())
          lon_max = max(r['lon_max'] for r in stats.values())
          lat_min = min(r['lat_min'] for r in stats.values())
          lat_max = max(r['lat_max'] for r in stats.values())
          total_valid = sum(r['valid'] for r in stats.values())
          total_pos = sum(r['positive'] for r in stats.values())
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          VALUES_NOTE = (
              "A cell's value is the number of times the species has been observed there. A cell whose "
              "climate falls within the species' modelled tolerances but where the species has not been "
              "recorded carries 0, and is still inside the range. A cell outside those tolerances carries "
              "no value at all and is absent from the data."
          )
          CENSORED = (
              "The count saturates at 9: no cell anywhere in this collection exceeds 9, so the top class "
              "means nine or more observations rather than exactly nine."
          )
          EFFORT = (
              "Observation counts record where people have botanised, not how much of the plant is present, "
              "so they should not be read as abundance, cover or population size."
          )

          description = f"""Modelled current distributions for {len(stats)} California plant species, exported from Calflora's
"Plant Range - by Climate Model" tool by the research team behind California's Fifth Climate Change
Assessment study of plant photosynthetic heat tolerance (G. G. Hernandez, G. Bucciarelli, J. L. Funk,
J. M. Valliere). One cloud-optimized GeoTIFF per species at approximately 30 arc-seconds (0.00833
degrees, roughly 900 m), plus a single hex table covering all species. Each raster is clipped to its
own footprint rather than sharing a common grid.

WHAT THE VALUES MEAN. {VALUES_NOTE} So a species' range is every cell present in the data, including
the zeros, and the zeros are most of it: across all species {total_valid:,} cells are in range and
{total_pos:,} of them ({100.0 * total_pos / total_valid:.1f} percent) have ever been observed in.
Any area or percentage computed from this collection should use the full in-range cell count as its
denominator. {CENSORED} {EFFORT}

FOOTPRINT. The collection spans California and adjacent Nevada, Oregon, Arizona and Utah, and reaches
into Baja California and Sonora for the desert species. It is a set of per-species model footprints,
not a California extent, and it is not clipped to any political boundary. Observations outside
California are part of the source data and are retained: {sum(1 for r in stats.values() if r['lat_min'] < 32.5)}
species have records south of the state line, including a white fir population in the Sierra San
Pedro Martir.

PROVENANCE. Each file was downloaded by hand from Calflora following the team's written protocol
(staged alongside the raw data), then renamed to the species code. Calflora exports are per-user and
per-session: there is no stable download URL that resolves to these files, so the staged raw copies
are the provenance. This is the corrected edition received 2026-09-15, which replaced an earlier
download in which three pairs of species shared a single raster and four species were missing. The
delivered archive is staged at raw/2026-09-15/SppRange_Project-20260915T185722Z-1-001.zip
({zipsize:,} bytes, sha256
3da13b2afc993be9dbe7325ca7f7369cb93e3d41cddda5e28cdbe6eeaf8fe775); the superseded download is kept at
raw/2025-07-01/. The vintage of Calflora's underlying climate model is not published at the export and
we have not established it.

PROCESSING. Source exports were cleaned only in ways that do not alter modelled values. One stray
pixel at latitude 0.0042 N was removed from 20 files, an artifact of the Calflora export in which a
record's latitude decoded to zero (in three files the longitude was zeroed as well, stretching the
raster from California to the prime meridian). Each raster was then clipped to its remaining
valid-data window, and nodata was set explicitly to NaN, which the source exports do not declare.
Overviews were built with nearest-neighbour resampling so that isolated observations survive at
reduced zoom. Two filenames that used a seven-letter code were renamed to the six-letter form the
rest of the study uses."""

          col_species = {"name": "species_code", "type": "string",
                         "description": "Six-letter species code, three letters of genus and three of species. Joins to species.parquet for the scientific name."}
          col_nobs = {"name": "n_observations", "type": "int8",
                      "description": f"Number of Calflora records of this species in this cell. {VALUES_NOTE} {CENSORED} {EFFORT}"}
          col_h = lambda r, extra: {"name": f"h{r}", "type": "uint64",
                                    "description": f"H3 resolution {r} cell index. {extra}"}

          hex_cols = [col_species,
                      col_h(0, "Partition key for this table."),
                      col_h(7, "Rollup resolution, and the resolution at which this collection joins the LOCA2 downscaled temperature collection."),
                      col_h(8, "Native resolution: one row per species and resolution 8 cell."),
                      col_nobs]

          assets = {
              "calflora-ranges-hex": {
                  "href": f"{B}/calflora-ranges/hex/h0=*/data_0.parquet",
                  "type": "application/vnd.apache.parquet",
                  "title": "Species ranges, H3 hex (all species, long form)",
                  "roles": ["data"],
                  "description": (
                      f"All {nsp} species in one long-form table at H3 resolution 8: one row per species "
                      f"and cell, {nrow:,} rows in total. Filter by species_code rather than loading the "
                      f"whole table. Row presence is the range: a cell absent for a species is outside that "
                      f"species' modelled climatic tolerance, while a row with n_observations of 0 is inside "
                      f"the range and simply has no record. {nz:,} rows carry a zero and {npos:,} carry an "
                      f"observation count, so dropping the zeros would discard most of the range. "
                      f"Resolution 8 is the native resolution and matches the source pixel closely; "
                      f"resolution 7 is provided for joining to coarser climate data."
                  ),
                  "created": now,
                  "h3:native_resolution": 8,
                  "h3:parent_resolutions": [7, 0],
                  "table:columns": hex_cols,
              },
              "calflora-ranges-species": {
                  "href": f"{B}/calflora-ranges/species.parquet",
                  "type": "application/vnd.apache.parquet",
                  "title": "Species code to scientific name lookup",
                  "roles": ["data"],
                  "description": f"Scientific name for each of the {len(names)} species codes in this collection, with the Calflora list the study drew from.",
                  "created": now,
                  "table:columns": [
                      col_species,
                      {"name": "scientific_name", "type": "string", "description": "Scientific binomial as recorded by the study team."},
                      {"name": "source_code", "type": "string", "description": "Code as it appeared in the team's download sheet, where three species used a seven-letter form."},
                      {"name": "calflora_list_url", "type": "string", "description": "The Calflora species list the study drew from."},
                  ],
              },
          }

          for code in sorted(stats):
              r = stats[code]
              nm = names.get(code, code)
              assets[f"{code.lower()}-cog"] = {
                  "href": f"{B}/calflora-ranges/cog/{code}.tif",
                  "type": "image/tiff; application=geotiff; profile=cloud-optimized",
                  "title": f"{nm} ({code})",
                  "roles": ["data", "visual"],
                  "description": (
                      f"Calflora climate-model distribution for {nm}. {r['valid']:,} cells are in range, "
                      f"of which {r['positive']:,} have a recorded observation. {VALUES_NOTE}"
                  ),
                  "created": now,
                  "proj:epsg": 4326,
                  "proj:shape": [r['h'], r['w']],
                  "proj:bbox": [r['lon_min'], r['lat_min'], r['lon_max'], r['lat_max']],
                  "raster:bands": [{"name": "n_observations", "data_type": "float32", "nodata": "nan",
                                    "unit": "count of observations"}],
                  "species:code": code,
                  "species:scientific_name": nm,
              }

          coll = {
              "type": "Collection",
              "stac_version": "1.0.0",
              "stac_extensions": [
                  "https://stac-extensions.github.io/projection/v1.1.0/schema.json",
                  "https://stac-extensions.github.io/raster/v1.1.0/schema.json",
                  "https://stac-extensions.github.io/table/v1.2.0/schema.json",
                  "https://stac-extensions.github.io/scientific/v1.0.0/schema.json",
              ],
              "id": "calflora-ranges",
              "title": "Calflora climate-model species range rasters (CCCA5 plant heat-tolerance study, 109 species)",
              "description": description,
              "license": "other",
              "created": now,
              "updated": now,
              "sci:citation": (
                  "Calflora climate-model plant range exports, downloaded by the California's Fifth Climate "
                  "Change Assessment plant heat-tolerance study team (Hernandez, Bucciarelli, Funk & Valliere). "
                  "Corrected edition accessed 2026-09-15; superseded edition accessed 2025-06-30/2025-07-01."
              ),
              "extent": {
                  "spatial": {"bbox": [[lon_min, lat_min, lon_max, lat_max]]},
                  "temporal": {"interval": [[None, "2026-09-15T00:00:00Z"]]},
              },
              "providers": [
                  {"name": "Calflora", "roles": ["producer"], "url": "https://www.calflora.org/"},
                  {"name": "Hernandez, Bucciarelli, Funk & Valliere (California's Fifth Climate Change Assessment)",
                   "roles": ["producer"], "url": "https://climateassessment.ca.gov/"},
                  {"name": "Boettiger Lab", "roles": ["processor", "host"], "url": "https://github.com/boettiger-lab"},
              ],
              "links": [
                  {"rel": "self", "href": f"{B}/calflora-ranges/stac-collection.json", "type": "application/json"},
                  {"rel": "root", "href": "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json", "type": "application/json"},
                  {"rel": "parent", "href": "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json", "type": "application/json"},
                  {"rel": "describedby", "href": f"{B}/calflora-ranges/README.md", "type": "text/markdown"},
                  {"rel": "about", "href": "https://www.calflora.org/app/ipl?list_id=px4593", "type": "text/html"},
              ],
              "assets": assets,
          }
          json.dump(coll, open('/tmp/stac-collection.json', 'w'), indent=2)
          print(f'wrote STAC: {len(assets)} assets, bbox {lon_min},{lat_min},{lon_max},{lat_max}')
          print(f'hex: {nrow:,} rows, {nsp} species, {nz:,} zero / {npos:,} positive, max {mx}')

          readme = f"""# Calflora climate-model species range rasters

Modelled current distributions for {len(stats)} California plant species, for the California's Fifth
Climate Change Assessment study of plant photosynthetic heat tolerance.

{VALUES_NOTE}

A species' range is every cell present in the data, zeros included. {CENSORED} {EFFORT}

## Query the hex table with DuckDB

```sql
INSTALL httpfs; LOAD httpfs;

-- How large is coast redwood's modelled range, and how much of it has it been observed in?
SELECT count(*) AS cells_in_range,
       sum(CASE WHEN n_observations > 0 THEN 1 ELSE 0 END) AS cells_observed
FROM read_parquet('{B}/calflora-ranges/hex/h0=*/data_0.parquet', hive_partitioning = true)
WHERE species_code = 'SEQSEM';

-- Join to the scientific names
SELECT s.scientific_name, count(*) AS cells_in_range
FROM read_parquet('{B}/calflora-ranges/hex/h0=*/data_0.parquet', hive_partitioning = true) r
JOIN read_parquet('{B}/calflora-ranges/species.parquet') s USING (species_code)
GROUP BY 1 ORDER BY 2 DESC LIMIT 10;
```

Roll up to resolution 7 with `GROUP BY h7` to join against coarser climate grids.

## Display one species with MapLibre GL JS

Each species is a separate cloud-optimized GeoTIFF, served through titiler:

```js
map.addSource('seqsem', {{
  type: 'raster',
  tiles: ['https://titiler.nrp-nautilus.io/cog/tiles/WebMercatorQuad/{{z}}/{{x}}/{{y}}.png'
        + '?url={B}/calflora-ranges/cog/SEQSEM.tif'
        + '&colormap_name=reds&rescale=0,3'],
  tileSize: 256,
}});
map.addLayer({{id: 'seqsem', type: 'raster', source: 'seqsem'}});
```

Cells with no observation render at the pale end of the ramp; they are in range, not absent.
"""
          open('/tmp/README.md', 'w').write(readme)
          print('wrote README')
          PY

          echo "=== publish ==="
          rclone copyto /tmp/stac-collection.json nrp:public-ca-ccca5/calflora-ranges/stac-collection.json --retries 5
          rclone copyto /tmp/README.md nrp:public-ca-ccca5/calflora-ranges/README.md --retries 5
          echo "STAC STEP COMPLETE"
        resources:
          requests: {cpu: '4', memory: 16Gi, ephemeral-storage: 20Gi}
          limits:   {cpu: '4', memory: 16Gi, ephemeral-storage: 20Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
