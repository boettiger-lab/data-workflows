apiVersion: batch/v1
kind: Job
metadata:
  name: sierra-nevada-atlas-map-unit-polys-pmtiles
  labels:
    k8s-app: sierra-nevada-atlas-map-unit-polys-pmtiles
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: sierra-nevada-atlas-map-unit-polys-pmtiles
    spec:
      restartPolicy: Never
      containers:
      - name: pmtiles-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-cgs
        - name: DATASET
          value: map-unit-polys
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e

          # Join descriptions onto polygons so PMTiles tooltips/styling can read
          # FullName/Age/GeoMaterial/Description directly without a client-side join.
          python3 <<'PYEOF'
          import duckdb
          c = duckdb.connect()
          c.execute("LOAD spatial; LOAD httpfs;")
          c.execute("""
            COPY (
              SELECT
                p.MapUnit,
                p.IdentityConfidence,
                d.FullName,
                d.Age,
                d.GeoMaterial,
                d.Description,
                p.Shape
              FROM read_parquet('https://s3-west.nrp-nautilus.io/public-cgs/sierra-nevada-atlas/map-unit-polys.parquet') p
              LEFT JOIN read_parquet('https://s3-west.nrp-nautilus.io/public-cgs/sierra-nevada-atlas/description-of-map-units.parquet') d
              USING (MapUnit)
            ) TO '/tmp/enriched.parquet' (FORMAT PARQUET);
          """)
          PYEOF

          ogr2ogr -wrapdateline -datelineoffset 15 -f GeoJSONSeq /tmp/$DATASET.geojsonl /tmp/enriched.parquet -progress

          # Generate PMTiles from GeoJSONSeq
          # TIPPECANOE_MAX_THREADS must be a power of 2; Kubernetes nodes can expose
          # non-power-of-2 logical CPU counts which triggers an internal assertion
          # failure "N shards not a power of 2" (felt/tippecanoe#216).
          # Round detected CPU count down to nearest power of 2 to preserve I/O parallelism.
          TIPPECANOE_MAX_THREADS=$(python3 -c "import os; n=os.cpu_count() or 1; print(1<<(n.bit_length()-1))")
          tippecanoe -o /tmp/$DATASET.pmtiles -l $DATASET --drop-densest-as-needed --extend-zooms-if-still-dropping --force /tmp/$DATASET.geojsonl

          # Upload to S3 using rclone
          rclone copy /tmp/$DATASET.pmtiles nrp:public-cgs/sierra-nevada-atlas/
          rm /tmp/$DATASET.geojsonl /tmp/$DATASET.pmtiles /tmp/enriched.parquet
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
          limits:
            cpu: '4'
            memory: 16Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
