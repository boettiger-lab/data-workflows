# HAND-ROLLED: the generator writes one value column per hex build and has no step that joins two
# builds of the same grid (#634). For each h0 partition this joins the recoded-exposure hex and the
# non-analog hex (both generated, in exposure/ and nonanalog/) on h9 into the published layout,
# staged at s3://public-hazard/staging-mche-634/final/hex/. It refuses unless every h9 cell
# matches one-to-one. Nothing published is touched; mche-634-swap.yaml does that after validation.
#   kubectl apply -n geo-workflows -f catalog/hazard/k8s/mid-century-habitat-climate-exposure/rehex-634/mche-634-merge.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: mche-634-merge
  namespace: geo-workflows
  labels: {k8s-app: mche-634-merge}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: mche-634-merge}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3600
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: merge
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          mkdir -p /tmp/out
          python3 - <<'PY'
          import duckdb, os, sys
          con = duckdb.connect()
          con.execute("INSTALL httpfs; LOAD httpfs;")
          con.execute("SET s3_endpoint='rook-ceph-rgw-nautiluss3.rook'; SET s3_use_ssl=false; SET s3_url_style='path';")
          con.execute(f"SET s3_access_key_id='{os.environ['AWS_ACCESS_KEY_ID']}';")
          con.execute(f"SET s3_secret_access_key='{os.environ['AWS_SECRET_ACCESS_KEY']}';")
          con.execute("SET memory_limit='6GB'; SET temp_directory='/tmp/spill';")
          S = "s3://public-hazard/staging-mche-634"
          total = 0
          for h0 in (577199624117288959, 577762574070710271):
              e = f"{S}/exposure/hex/h0={h0}/data_0.parquet"
              n = f"{S}/nonanalog/hex/h0={h0}/data_0.parquet"
              rd = lambda p: f"read_parquet('{p}', hive_partitioning=false)"
              ne, nn = (con.execute(f"SELECT count(*), count(DISTINCT h9) FROM {rd(p)}").fetchone() for p in (e, n))
              unmatched = con.execute(f"""SELECT count(*) FROM {rd(e)} a FULL JOIN {rd(n)} b USING (h9)
                                          WHERE a.h9 IS NULL OR b.h9 IS NULL""").fetchone()[0]
              print(h0, "exposure rows/distinct", ne, "nonanalog rows/distinct", nn, "unmatched", unmatched)
              if ne[0] != ne[1] or nn != ne or unmatched:
                  sys.exit("FATAL: the two hex builds do not cover the same h9 cells one-to-one")
              kv = con.execute(f"SELECT key::VARCHAR, value::VARCHAR FROM parquet_kv_metadata('{e}')").fetchall()
              kv = {k: v for k, v in kv if k not in ("ARROW:schema",)}
              kvopt = (", KV_METADATA {" + ", ".join(f"'{k}': '{v.replace(chr(39), chr(39)*2)}'" for k, v in kv.items()) + "}") if kv else ""
              os.makedirs(f"/tmp/out/h0={h0}", exist_ok=True)
              con.execute(f"""COPY (SELECT a.exposure, b.non_analog_frac, a.* EXCLUDE (exposure)
                                    FROM {rd(e)} a JOIN {rd(n)} b USING (h9) ORDER BY a.h9)
                              TO '/tmp/out/h0={h0}/data_0.parquet'
                              (FORMAT parquet, COMPRESSION zstd{kvopt})""")
              total += ne[0]
          print("total rows", total)
          print(con.execute("DESCRIBE SELECT * FROM read_parquet('/tmp/out/*/data_0.parquet', hive_partitioning=false)").fetchall())
          PY
          rclone copy /tmp/out nrp:public-hazard/staging-mche-634/final/hex $R
          rclone ls nrp:public-hazard/staging-mche-634/final/hex
          echo OK
        resources:
          requests: {cpu: '2', memory: 8Gi, ephemeral-storage: 10Gi}
          limits:   {cpu: '2', memory: 8Gi, ephemeral-storage: 10Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
