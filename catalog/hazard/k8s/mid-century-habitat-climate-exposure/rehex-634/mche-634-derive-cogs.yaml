# HAND-ROLLED: the generator hexes one raster value as-is; it has no recode step and cannot emit
# a second column from the same pixels (#634). This job derives two COGs from the published
# cnrm-cog.tif, on its exact grid and nodata, into a staging prefix that the generated hex
# recipes in exposure/ and nonanalog/ read:
#   exposure-cog.tif  : -1 (non-analog) recoded to 1, every other value unchanged
#   nonanalog-cog.tif : 1 where the source is -1, 0 elsewhere (mean over a cell = non-analog share)
# The published cnrm-cog.tif is not modified.
#   kubectl apply -n geo-workflows -f catalog/hazard/k8s/mid-century-habitat-climate-exposure/rehex-634/mche-634-derive-cogs.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: mche-634-derive-cogs
  namespace: geo-workflows
  labels: {k8s-app: mche-634-derive-cogs}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: mche-634-derive-cogs}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3600
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: derive
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: PYTHONPATH, value: /usr/lib/python3/dist-packages}
        - {name: GDAL_DATA, value: /usr/share/gdal}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          mkdir -p /tmp/w && cd /tmp/w
          rclone copyto nrp:public-hazard/mid-century-habitat-climate-exposure/cnrm-cog.tif src.tif $R
          python3 - <<'PY'
          import numpy as np
          from osgeo import gdal
          gdal.UseExceptions()
          src = gdal.Open("src.tif")
          b = src.GetRasterBand(1)
          nd = b.GetNoDataValue()
          a = b.ReadAsArray()
          valid = a != np.float32(nd)
          na = valid & (a == -1)
          print("nodata", nd, "valid px", int(valid.sum()), "non-analog px", int(na.sum()))
          assert na.sum() == 17178, "unexpected non-analog pixel count"
          exp = np.where(na, np.float32(1), a).astype(np.float32)
          non = np.where(valid, na.astype(np.float32), np.float32(nd)).astype(np.float32)
          v = exp[valid]
          print("recoded exposure min/max", float(v.min()), float(v.max()))
          assert v.min() >= 0.05 - 1e-6 and v.max() <= 1 + 1e-6
          assert float(non[valid].sum()) == 17178.0
          # unchanged everywhere else, nodata untouched
          assert np.array_equal(exp[~na], a[~na])
          drv = gdal.GetDriverByName("GTiff")
          for name, arr in (("exposure", exp), ("nonanalog", non)):
              d = drv.Create(f"{name}.tif", src.RasterXSize, src.RasterYSize, 1, gdal.GDT_Float32,
                             ["TILED=YES", "COMPRESS=DEFLATE"])
              d.SetGeoTransform(src.GetGeoTransform())
              d.SetProjection(src.GetProjection())
              ob = d.GetRasterBand(1)
              ob.SetNoDataValue(nd)
              ob.WriteArray(arr)
              d.FlushCache()
              d = None
              gdal.Translate(f"{name}-cog.tif", f"{name}.tif", format="COG",
                             creationOptions=["COMPRESS=DEFLATE", "BLOCKSIZE=512",
                                              "RESAMPLING=NEAREST", "STATISTICS=YES"])
          PY
          gdalinfo -stats exposure-cog.tif | grep -E "Size is|NoData|STATISTICS_M"
          gdalinfo -stats nonanalog-cog.tif | grep -E "Size is|NoData|STATISTICS_M"
          rclone copyto exposure-cog.tif nrp:public-hazard/staging-mche-634/exposure-cog.tif $R
          rclone copyto nonanalog-cog.tif nrp:public-hazard/staging-mche-634/nonanalog-cog.tif $R
          echo OK
        resources:
          requests: {cpu: '1', memory: 6Gi, ephemeral-storage: 4Gi}
          limits:   {cpu: '1', memory: 6Gi, ephemeral-storage: 4Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
