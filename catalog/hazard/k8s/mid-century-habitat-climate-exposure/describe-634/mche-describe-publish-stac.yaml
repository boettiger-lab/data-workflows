# HAND-ROLLED: the generator does not write STAC. A metadata-only fix (#634): the exposure
# index is not monotonic (-1 = non-analog climate, among the most exposed), and MIROC5 has no
# negative values. set_descriptions.py (committed beside this file) edits the LIVE collection
# and README in place, touching only the fields it names.
#   kubectl create configmap mche-describe-script -n geo-workflows \
#     --from-file=set_descriptions.py=catalog/hazard/k8s/mid-century-habitat-climate-exposure/describe-634/set_descriptions.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/hazard/k8s/mid-century-habitat-climate-exposure/describe-634/mche-describe-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: mche-describe-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: mche-describe-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: mche-describe-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          D=nrp:public-hazard/mid-century-habitat-climate-exposure
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }

          rclone cat "$D/stac-collection.json" > /tmp/c.json
          rclone cat "$D/README.md" > /tmp/README.md
          python3 /script/set_descriptions.py stac /tmp/c.json
          python3 /script/set_descriptions.py readme /tmp/README.md
          guard_stac /tmp/c.json "$D/stac-collection.json"
          rclone copyto /tmp/c.json "$D/stac-collection.json" $R
          rclone copyto /tmp/README.md "$D/README.md" $R
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: mche-describe-script}}
