# HAND-ROLLED: the generator does not write STAC. Column-description fixes from the GLEN
# accuracy sweep (#1070): set_columns.py (committed beside this file) edits four LIVE
# collections, so nothing else on them is touched. Each text was written against measured values.
#   kubectl create configmap stac-fixes-1070-script -n geo-workflows \
#     --from-file=set_columns.py=catalog/stac-fixes-1070/set_columns.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/stac-fixes-1070/stac-fixes-1070-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: stac-fixes-1070-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: stac-fixes-1070-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {k8s-app: stac-fixes-1070-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }
          for spec in gfw-fishing-effort:public-gfw census-2025-sldu:public-census/census-2025/sldu \
                      census-2025-sldl:public-census/census-2025/sldl irrecoverable-carbon:public-carbon; do
            id=${spec%%:*}; p="nrp:${spec#*:}/stac-collection.json"
            rclone cat "$p" > /tmp/c.json
            python3 /script/set_columns.py /tmp/c.json "$id"
            guard_stac /tmp/c.json "$p"
            rclone copyto /tmp/c.json "$p" $R
          done
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: stac-fixes-1070-script}}
