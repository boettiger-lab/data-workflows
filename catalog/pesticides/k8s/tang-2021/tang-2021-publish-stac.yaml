# HAND-ROLLED: the generator does not write STAC; this follows the publish-stac pattern of
# catalog/ecoregion/k8s/epa-ecoregions/publish-stac.yaml (#865).
#
# Steps 5-6: publish the tang-2021 collection, the new public-pesticides bucket collection,
# their READMEs, and one child link on the root catalog. Runs gen_stac.py (committed beside
# this file) from a ConfigMap, so the committed script is the single source:
#   kubectl create configmap tang-2021-stac-script -n geo-workflows \
#     --from-file=gen_stac.py=catalog/pesticides/k8s/tang-2021/gen_stac.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/pesticides/k8s/tang-2021/tang-2021-publish-stac.yaml
#
# Metadata.pdf is copied out of raw/ to tang-2021/Metadata.pdf, so the documentation asset never
# points under raw/ (the raw/ prefix is excluded from mirrors by asset href).
#
# The root catalog is patched, not rewritten: the gate asserts every existing root link survives
# and at most one is added, and the children are uploaded before the root links to them.
apiVersion: batch/v1
kind: Job
metadata:
  name: tang-2021-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: tang-2021-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: tang-2021-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        # Date the upstream files were retrieved from Figshare into s3://public-pesticides/raw/.
        - {name: ACCESS_DATE, value: "2026-11-05"}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          # stac-publish-guard.py (#890): keep the live styles, renders and rel pmtiles links; refuse a
          # file that would drop the live column dictionary or revert an asset-key rename.
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }

          rclone copyto nrp:public-pesticides/raw/Metadata.pdf nrp:public-pesticides/tang-2021/Metadata.pdf $R

          # Sizes, MD5s and created times are read from the objects (#417).
          rclone lsjson --hash -R nrp:public-pesticides/ > /tmp/objects.json
          rclone copyto nrp:public-data/stac/catalog.json /tmp/root.json $R

          python3 /script/gen_stac.py /tmp/stac /tmp/objects.json /tmp/root.json "${ACCESS_DATE}"
          find /tmp/stac -type f | sort

          python3 - <<'PY'
          import json
          old = json.load(open("/tmp/root.json"))
          new = json.load(open("/tmp/stac/catalog.json"))
          assert {k: v for k, v in old.items() if k != "links"} == \
                 {k: v for k, v in new.items() if k != "links"}, "root fields changed"
          assert new["links"][:len(old["links"])] == old["links"], "existing root links changed"
          assert len(new["links"]) - len(old["links"]) in (0, 1), "more than one link added"
          c = json.load(open("/tmp/stac/tang-2021/stac-collection.json"))
          assert c["license"] == "CC-BY-4.0" and len(c["assets"]) == 11, (c["license"], len(c["assets"]))
          assert len(c["renders"]) == 5 and len(c["table:columns"]) == 7, (len(c["renders"]), len(c["table:columns"]))
          print("gate OK:", len(old["links"]), "->", len(new["links"]), "root links")
          PY

          guard_stac /tmp/stac/tang-2021/stac-collection.json nrp:public-pesticides/tang-2021/stac-collection.json
          rclone copyto /tmp/stac/tang-2021/stac-collection.json nrp:public-pesticides/tang-2021/stac-collection.json $R
          rclone copyto /tmp/stac/tang-2021/README.md nrp:public-pesticides/tang-2021/README.md $R
          guard_stac /tmp/stac/stac-collection.json nrp:public-pesticides/stac-collection.json
          rclone copyto /tmp/stac/stac-collection.json nrp:public-pesticides/stac-collection.json $R
          rclone copyto /tmp/stac/README.md nrp:public-pesticides/README.md $R
          rclone copyto /tmp/stac/catalog.json nrp:public-data/stac/catalog.json $R
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: tang-2021-stac-script}}
