            ),
            "license": "CC0-1.0",
            "keywords": ["climate", "bioclimate", "CMIP6", "CHELSA", "temperature", "precipitation",
                         "projection", "H3", label],
            "providers": [
                {"name": "CHELSA (Swiss Federal Institute for Forest, Snow and Landscape Research WSL)",
                 "roles": ["producer", "licensor"], "url": "https://chelsa-climate.org/"},
