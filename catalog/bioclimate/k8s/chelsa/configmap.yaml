  armada_gapfill.py: |
    """Enumerate missing staged slices for a combination and emit an Armada job set to fill them.

    Armada exposes no retry service on NRP (`armadactl get retry-policies` -> Unimplemented) and, per
    the NRP docs, preempted jobs are not rescheduled. So **any** transient failure leaves a
    permanently missing slice, and gap-fill is a required pipeline stage rather than an exception.

    Measured failure rate: 1-4 slices per 3,780 (~0.1%), and the one reason readable from the event
    stream was `Pod unexpectedly started up after delete was called` — a scheduler race, unrelated to
    the job's resources. Failures are roughly uniform across variables, not concentrated in the dense
    ones, so this is about retry semantics, not sizing.

    ⛔ Find gaps by ENUMERATING the expected set, never by counting. 3,779 of 3,780 reads as complete
    at a glance, and a count cannot tell you which slice is absent.
    """
    import argparse
    import re
    import sys
    import urllib.parse
    import urllib.request

    VARS = ["bio1", "bio4", "bio5", "bio6", "bio12", "bio15", "bio17"]
    MEMBERS = ["gfdl_esm4", "ipsl_cm6a_lr", "mpi_esm1_2_hr", "mri_esm2_0", "ukesm1_0_ll"]
    BASE = "https://s3-west.nrp-nautilus.io/public-bioclimate"


    def keys(prefix):
        tok, out = None, []
        while True:
            u = f"{BASE}?list-type=2&prefix={urllib.parse.quote(prefix)}&max-keys=1000"
            if tok:
                u += "&continuation-token=" + urllib.parse.quote(tok)
            x = urllib.request.urlopen(u, timeout=90).read().decode()
            out += re.findall(r"<Key>([^<]*)</Key>", x)
            m = re.search(r"<NextContinuationToken>([^<]*)</NextContinuationToken>", x)
            if not m:
                break
            tok = m.group(1)
        return out


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--combo", required=True, help="e.g. ssp126-2041-2070")
        ap.add_argument("--staging", default="staging")
        ap.add_argument("--reference", default="chelsa-2-1/ssp370-2041-2070/hex/",
                        help="a published hex whose h0 set defines the land partitions")
        ap.add_argument("--grid", default="s3://public-grids/hex/h0-valid.parquet")
        args = ap.parse_args()

        land_cells = sorted(set(re.findall(r"hex/h0=(\d+)/", "".join(keys(args.reference)))))
        if not land_cells:
            print(f"ERROR: no land h0 found under {args.reference}", file=sys.stderr)
            return 1

        got = set()
        for k in keys(f"{args.staging}/{args.combo}/"):
            m = re.search(rf"{re.escape(args.staging)}/{re.escape(args.combo)}/([^/]+)/h0=(\d+)/", k)
            if m:
                got.add((m.group(1), m.group(2)))

        expected = len(land_cells) * len(VARS) * len(MEMBERS)
        missing = [(v, m, h) for h in land_cells for v in VARS for m in MEMBERS
                   if (f"{v}_{m}", h) not in got]

        print(f"{args.combo}: {expected - len(missing)}/{expected} staged, {len(missing)} missing")
        for v, m, h in missing:
            print(f"  MISSING {v}_{m} h0cell={h}")

        # Emit the h0 CELL ids; the caller maps them back to --h0-indexes for the generator.
        if missing:
            cells = sorted({h for _, _, h in missing})
            vars_ = sorted({v for v, _, _ in missing})
            print(f"\nGAPFILL_CELLS={','.join(cells)}")
            print(f"GAPFILL_VARS={','.join(vars_)}")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  chelsa_cast_float32.py: |
    """Rewrite a published CHELSA hex partition with float32 value columns (data-workflows #564).

    The first (ssp, period) combination was written with DOUBLE value columns before the type was
    settled. The source is UInt16 quantised to 0.1 units, so float32 carries far more precision than
    the data has, at half the size — and leaving one combination as DOUBLE while the rest are FLOAT
    would hand consumers a mixed-type union when they compare scenarios.

    Rewriting is far cheaper than re-hexing: it re-reads one partition and casts, rather than
    repeating 35 exact_extract passes.

    Verifies row count and value equality (within float32 precision) before replacing anything.
    """
    import argparse
    import sys

    import duckdb

    H3_COLS = ("h8", "h5", "h4", "h0")


    def main() -> int:
        ap = argparse.ArgumentParser()
        ap.add_argument("--src", required=True, help="local source parquet")
        ap.add_argument("--out", required=True, help="local output parquet")
        args = ap.parse_args()

        con = duckdb.connect()
        # DuckDB's DESCRIBE yields column_name/column_type -- not name/type.
        cols = con.execute(
            "SELECT column_name, column_type FROM (DESCRIBE SELECT * FROM read_parquet(?))",
            [args.src],
        ).fetchall()

        select_parts, value_cols = [], []
        for name, typ in cols:
            if name in H3_COLS:
                select_parts.append(name)
            elif typ.upper() in ("DOUBLE", "FLOAT"):
                select_parts.append(f"CAST({name} AS FLOAT) AS {name}")
                value_cols.append(name)
            else:
                select_parts.append(name)

        if not value_cols:
            print("ERROR: no float/double value columns found", file=sys.stderr)
            return 1

        con.execute(f"""
            COPY (SELECT {", ".join(select_parts)} FROM read_parquet('{args.src}'))
            TO '{args.out}' (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)
        """)

        n_src = con.execute(f"SELECT COUNT(*) FROM read_parquet('{args.src}')").fetchone()[0]
        n_out = con.execute(f"SELECT COUNT(*) FROM read_parquet('{args.out}')").fetchone()[0]
        print(f"rows src={n_src} out={n_out} value_columns={len(value_cols)}")
        if n_src != n_out:
            print(f"ERROR: row count changed {n_src} -> {n_out}", file=sys.stderr)
            return 1

        # Compare per-column aggregates rather than joining the two files. A 60-column join over
        # millions of rows needs far more memory than the cast itself, and aggregates catch the
        # failure modes that matter: a shifted value, a lost row, a nulled column.
        aggs = ", ".join(
            f"MIN({c}) AS mn_{i}, MAX({c}) AS mx_{i}, COUNT({c}) AS n_{i}"
            for i, c in enumerate(value_cols)
        )
        src_stats = con.execute(f"SELECT {aggs} FROM read_parquet('{args.src}')").fetchone()
        out_stats = con.execute(f"SELECT {aggs} FROM read_parquet('{args.out}')").fetchone()

        worst = 0.0
        for i, c in enumerate(value_cols):
            s_mn, s_mx, s_n = src_stats[i * 3], src_stats[i * 3 + 1], src_stats[i * 3 + 2]
            o_mn, o_mx, o_n = out_stats[i * 3], out_stats[i * 3 + 1], out_stats[i * 3 + 2]
            if s_n != o_n:
                print(f"ERROR: {c} non-null count changed {s_n} -> {o_n}", file=sys.stderr)
                return 1
            for a, b, what in ((s_mn, o_mn, "min"), (s_mx, o_mx, "max")):
                if a is None and b is None:
                    continue
                if a is None or b is None:
                    print(f"ERROR: {c} {what} became NULL", file=sys.stderr)
                    return 1
                worst = max(worst, abs(float(a) - float(b)))

        # float32 carries ~7 significant digits; these values are at most ~10^4 at 0.1 resolution,
        # so anything beyond 0.01 is not rounding.
        print(f"max absolute change across {len(value_cols)} value columns: {worst}")
        if worst > 0.01:
            print(f"ERROR: cast changed a value by {worst}, beyond float32 rounding", file=sys.stderr)
            return 1
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  chelsa_ensemble.py: |
    """CHELSA v2.1 GCM-ensemble reduction -> physical-unit float32 COG (data-workflows #564).

    Reads the N per-GCM rasters for one (variable, ssp, period) triple and writes one COG per
    requested ensemble quantile, in physical units.

    Design notes (all driven by the measured preflight on #564):
      * scale/offset and nodata are read FROM EACH FILE (`GetScale`/`GetOffset`/`GetNoDataValue`),
        never hardcoded -- CHELSA declares different sentinels per variable (bio1/bio4/bio12 use 0,
        bio15 uses 65535), so a single batch-wide constant would corrupt the output.
      * a pixel is nodata in the output if it is nodata in ANY member -- the ensemble is only
        defined where every GCM has a value.
      * bio12 saturates at the UInt16 ceiling (65535); those pixels are flagged, counted, and
        reported so the clipping is visible rather than silently averaged.
      * processed in row blocks so a 43200x20880 x N-member stack never has to fit in RAM.
    """
    import argparse
    import os
    import sys

    import numpy as np
    from osgeo import gdal

    gdal.UseExceptions()

    UINT16_CEIL = 65535
    OUT_NODATA = -9999.0


    def main() -> int:
        ap = argparse.ArgumentParser()
        ap.add_argument("--input", action="append", required=True, help="per-GCM source raster (repeat)")
        ap.add_argument("--out-prefix", required=True, help="output path prefix; quantile is appended")
        ap.add_argument("--quantiles", default="10,50,90")
        ap.add_argument("--block-rows", type=int, default=512)
        args = ap.parse_args()

        qs = [float(q) for q in args.quantiles.split(",")]
        srcs = [gdal.Open(p) for p in args.input]
        n = len(srcs)
        if n < 2:
            print("ERROR: need at least 2 members for an ensemble", file=sys.stderr)
            return 1

        b0 = srcs[0].GetRasterBand(1)
        xsize, ysize = srcs[0].RasterXSize, srcs[0].RasterYSize
        scale = b0.GetScale() if b0.GetScale() is not None else 1.0
        offset = b0.GetOffset() if b0.GetOffset() is not None else 0.0
        nodata = b0.GetNoDataValue()

        # Every member must share grid, scale/offset and sentinel, or the ensemble is meaningless.
        for p, ds in zip(args.input, srcs):
            b = ds.GetRasterBand(1)
            if (ds.RasterXSize, ds.RasterYSize) != (xsize, ysize):
                print(f"ERROR: grid mismatch in {p}", file=sys.stderr)
                return 1
            s = b.GetScale() if b.GetScale() is not None else 1.0
            o = b.GetOffset() if b.GetOffset() is not None else 0.0
            if (s, o) != (scale, offset) or b.GetNoDataValue() != nodata:
                print(f"ERROR: scale/offset/nodata mismatch in {p}: "
                      f"{(s, o, b.GetNoDataValue())} != {(scale, offset, nodata)}", file=sys.stderr)
                return 1

        print(f"members={n} grid={xsize}x{ysize} scale={scale} offset={offset} nodata={nodata}")

        drv = gdal.GetDriverByName("GTiff")
        opts = ["COMPRESS=ZSTD", "PREDICTOR=3", "TILED=YES", "BIGTIFF=YES"]
        tmp_paths, outs = [], []
        for q in qs:
            tp = f"{args.out_prefix}_p{int(q)}.tmp.tif"
            ds = drv.Create(tp, xsize, ysize, 1, gdal.GDT_Float32, options=opts)
            ds.SetGeoTransform(srcs[0].GetGeoTransform())
            ds.SetProjection(srcs[0].GetProjection())
            ds.GetRasterBand(1).SetNoDataValue(OUT_NODATA)
            tmp_paths.append(tp)
            outs.append(ds)

        n_valid = n_nodata = n_saturated = 0
        vmin, vmax = np.inf, -np.inf

        for y in range(0, ysize, args.block_rows):
            rows = min(args.block_rows, ysize - y)
            stack = np.empty((n, rows, xsize), dtype=np.float64)
            bad = np.zeros((rows, xsize), dtype=bool)
            for i, ds in enumerate(srcs):
                a = ds.GetRasterBand(1).ReadAsArray(0, y, xsize, rows)
                if nodata is not None:
                    bad |= (a == nodata)
                n_saturated += int((a == UINT16_CEIL).sum())
                stack[i] = a

            vals = np.percentile(stack, qs, axis=0)          # (len(qs), rows, xsize)
            vals = vals * scale + offset                      # -> physical units

            n_valid += int((~bad).sum())
            n_nodata += int(bad.sum())
            if (~bad).any():
                vmin = min(vmin, float(vals[:, ~bad].min()))
                vmax = max(vmax, float(vals[:, ~bad].max()))

            for k, ds in enumerate(outs):
                band = vals[k]
                band[bad] = OUT_NODATA
                ds.GetRasterBand(1).WriteArray(band.astype(np.float32), 0, y)
            print(f"  rows {y}-{y + rows} done", flush=True)

        for ds in outs:
            ds.FlushCache()
        outs = None

        # Rewrite as proper COGs.
        for tp, q in zip(tmp_paths, qs):
            final = f"{args.out_prefix}_p{int(q)}.tif"
            print(f"COG -> {final}")
            gdal.Translate(final, tp, format="COG",
                           creationOptions=["COMPRESS=ZSTD", "PREDICTOR=3",
                                            "OVERVIEWS=IGNORE_EXISTING", "BIGTIFF=YES"])
            os.remove(tp)

        total = n_valid + n_nodata
        print(f"MEASURED valid={n_valid} nodata={n_nodata} "
              f"({100.0 * n_valid / total:.4f}% valid)")
        print(f"MEASURED physical range: min={vmin:.4f} max={vmax:.4f}")
        print(f"MEASURED source pixels at UInt16 ceiling ({UINT16_CEIL}) across all members: {n_saturated}")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  chelsa_h0_for_index.py: |
    """Resolve a cng-datasets h0 *index* (0-121) to its h0 *cell id* (data-workflows #564).

    `cng-datasets raster --h0-index N` looks N up in the h0 grid parquet by its `i` column. Doing
    the same lookup up front lets a job decide whether an h0 holds any land *before* paying to hex
    it: only 108 of the 122 h0 cells intersect the WWF ecoregions land mask, so the remaining 14
    would otherwise hex every ensemble member and then discard the result.
    """
    import argparse
    import sys

    import duckdb

    ap = argparse.ArgumentParser()
    ap.add_argument("--grid", required=True, help="local path to the h0 grid parquet")
    ap.add_argument("--index", type=int, required=True)
    args = ap.parse_args()

    row = duckdb.connect().execute(
        "SELECT h0 FROM read_parquet(?) WHERE i = ?", [args.grid, args.index]
    ).fetchone()

    if row is None:
        print(f"ERROR: no h0 cell for index {args.index}", file=sys.stderr)
        sys.exit(1)

    print(row[0])
  chelsa_join_baseline.py: |
    """Join the per-variable baseline hex partitions for one h0 (data-workflows #448).

    The present-day baseline is an observational climatology, not an ensemble: one raster per
    variable, no GCM members. So the output is one plain column per variable rather than the futures'
    five members plus median/min/max, and a delta against a future collection reads directly:

        SELECT AVG(f.bio1_median - b.bio1) FROM <future> f JOIN <baseline> b USING (h8)

    Values arrive already in physical units — cng-datasets hands the raster path to exactextract,
    whose GDAL source applies the band scale/offset. No transform here.

    Exit 3 means nothing survived the land mask, which the caller treats as a skip.
    """
    import argparse
    import glob
    import json
    import sys

    import duckdb


    def part(root, var, h0):
        hits = glob.glob(f"{root}/{var}/h0={h0}/data_0.parquet")
        if not hits:
            raise SystemExit(f"ERROR: missing partition for {var} h0={h0}")
        return hits[0]


    def main() -> int:
        ap = argparse.ArgumentParser()
        ap.add_argument("--h0", required=True)
        ap.add_argument("--vars", required=True)
        ap.add_argument("--hex-root", required=True)
        ap.add_argument("--mask", required=True)
        ap.add_argument("--out", required=True)
        ap.add_argument("--bounds", required=True)
        args = ap.parse_args()

        variables = [v.strip() for v in args.vars.split(",") if v.strip()]
        bounds = json.loads(args.bounds)
        con = duckdb.connect()
        paths = {v: part(args.hex_root, v, args.h0) for v in variables}
        base = variables[0]

        sel = ", ".join(f"CAST({v}t.{v} AS FLOAT) AS {v}" for v in variables)
        joins = " ".join(f"JOIN read_parquet('{paths[v]}') {v}t ON {v}t.h8 = {base}t.h8"
                         for v in variables if v != base)

        con.execute(f"""
            COPY (
                SELECT {base}t.h8, {base}t.h5, {base}t.h4, {base}t.h0, {sel}
                FROM read_parquet('{paths[base]}') {base}t
                {joins}
                SEMI JOIN (SELECT DISTINCT h8 FROM read_parquet('{args.mask}')) msk
                  ON {base}t.h8 = msk.h8
            ) TO '{args.out}' (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)
        """)

        before = con.execute(f"SELECT COUNT(*) FROM read_parquet('{paths[base]}')").fetchone()[0]
        after = con.execute(f"SELECT COUNT(*) FROM read_parquet('{args.out}')").fetchone()[0]
        print(f"MASK h0={args.h0} rows_before={before} rows_after={after}")
        if after == 0:
            print("EMPTY after land mask")
            return 3

        failures = 0
        for v in variables:
            lo, hi, nulls = con.execute(
                f"SELECT MIN({v}), MAX({v}), COUNT(*) FILTER (WHERE {v} IS NULL) "
                f"FROM read_parquet('{args.out}')").fetchone()
            print(f"MEASURED {v}: min={lo} max={hi} nulls={nulls}")
            blo, bhi = bounds[v]
            # A wrong scale/offset or a leaked nodata sentinel survives every structural check,
            # because a linear transform preserves ordering and cardinality. Only a physical
            # bound catches it.
            if lo is not None and lo < blo:
                print(f"ERROR: {v} min {lo} below bound {blo}", file=sys.stderr); failures += 1
            if hi is not None and hi > bhi:
                print(f"ERROR: {v} max {hi} above bound {bhi}", file=sys.stderr); failures += 1
        return 5 if failures else 0


    if __name__ == "__main__":
        sys.exit(main())
  chelsa_join_mask.py: |
    """Join the per-GCM hex partitions for one h0, apply units + land mask (data-workflows #564).

    Each ensemble member is hexed separately by `cng-datasets raster` into
    `<hex-root>/<member>/h0=<cell>/data_0.parquet`. They share a grid, resolution and h0, so they
    share an h8 key -- this joins them into one wide row per cell.

    Three things happen here that cannot happen earlier:

    1. **Units are ALREADY PHYSICAL -- do not transform them here.** `cng-datasets` hands the raster
       *path* to `exactextract`, whose GDAL source applies the GeoTIFF scale/offset, so hex values
       arrive in degrees C / mm, not raw integers. Measured on the Amazon h0: min 1.51, max 30.15,
       mean 27.32 (degrees C). Applying the transform again yielded ~-273, which the plausibility
       bound below caught.

       Note the contrast with `chelsa_ensemble.py`, which reads via `gdal.Band.ReadAsArray` --
       that path does NOT apply scale/offset, so the explicit transform there is correct. The two
       files legitimately differ; do not "fix" one to match the other.

    2. **Ensemble statistics.** All five member values are kept as columns; the upstream product
       ships per-GCM files and no ensemble product, so the members are the faithful representation.
       `median`/`min`/`max` are materialised alongside them because a five-member ensemble is
       summarised by its median and full range (percentiles need a larger ensemble), and because
       these are the expressions a consumer is most likely to get wrong across five columns.

    3. **Land mask.** WWF Terrestrial Ecoregions h8 hex -- chosen over Overture countries, which is
       a sovereignty boundary that includes territorial and archipelagic waters and omits Antarctica.

    Exit 3 means "nothing survived the mask" -- the caller treats that as a skip, not a failure.
    """
    import argparse
    import glob
    import sys

    import duckdb


    def part(hex_root: str, member_col: str, h0: str) -> str:
        hits = glob.glob(f"{hex_root}/{member_col}/h0={h0}/data_0.parquet")
        if not hits:
            raise SystemExit(f"ERROR: missing hex partition for member {member_col} h0={h0}")
        return hits[0]


    def main() -> int:
        ap = argparse.ArgumentParser()
        ap.add_argument("--h0", required=True)
        ap.add_argument("--var", required=True, help="variable prefix, e.g. bio1")
        ap.add_argument("--members", required=True,
                        help="comma-separated member column suffixes, e.g. gfdl_esm4,ipsl_cm6a_lr,...")
        ap.add_argument("--hex-root", required=True)
        ap.add_argument("--mask", required=True)
        ap.add_argument("--out", required=True)
        ap.add_argument("--sane-min", type=float, default=None,
                        help="fail if any physical value falls below this")
        ap.add_argument("--sane-max", type=float, default=None,
                        help="fail if any physical value rises above this")
        args = ap.parse_args()

        members = [m.strip() for m in args.members.split(",") if m.strip()]
        if len(members) < 2:
            print("ERROR: need at least 2 ensemble members", file=sys.stderr)
            return 1

        var = args.var
        con = duckdb.connect()
        paths = {m: part(args.hex_root, f"{var}_{m}", args.h0) for m in members}

        counts = {m: con.execute(f"SELECT COUNT(*) FROM read_parquet('{p}')").fetchone()[0]
                  for m, p in paths.items()}
        print(f"rows per member: {counts}")
        if len(set(counts.values())) != 1:
            print("WARNING: member partitions differ in row count; join keeps the intersection")

        base = members[0]
        # Values are already in physical units (see module docstring) -- pass them straight through.
        phys = [f"{m}t.{var}_{m}" for m in members]
        sel_members = ", ".join(f"{e} AS {var}_{m}" for e, m in zip(phys, members))
        arr = "[" + ", ".join(phys) + "]"

        joins = " ".join(
            f"JOIN read_parquet('{paths[m]}') {m}t ON {m}t.h8 = {base}t.h8"
            for m in members if m != base
        )

        con.execute(f"""
            COPY (
                SELECT {base}t.h8, {base}t.h5, {base}t.h4, {base}t.h0,
                       {sel_members},
                       list_sort({arr})[{(len(members) + 1) // 2}] AS {var}_median,
                       list_min({arr})  AS {var}_min,
                       list_max({arr})  AS {var}_max
                FROM read_parquet('{paths[base]}') {base}t
                {joins}
                SEMI JOIN (SELECT DISTINCT h8 FROM read_parquet('{args.mask}')) msk
                  ON {base}t.h8 = msk.h8
            ) TO '{args.out}'
            (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)
        """)

        after = con.execute(f"SELECT COUNT(*) FROM read_parquet('{args.out}')").fetchone()[0]
        before = counts[base]
        print(f"MASK h0={args.h0} rows_before={before} rows_after={after} "
              f"kept={100.0 * after / before if before else 0:.2f}%")
        if after == 0:
            print("EMPTY after land mask")
            return 3

        lo, hi, nulls = con.execute(f"""
            SELECT MIN({var}_min), MAX({var}_max),
                   COUNT(*) FILTER (WHERE {var}_median IS NULL)
            FROM read_parquet('{args.out}')
        """).fetchone()
        print(f"MEASURED {var} physical range: min={lo} max={hi} median_nulls={nulls}")

        # median must lie within [min, max] for every cell -- catches a broken ensemble reduce.
        bad = con.execute(f"""
            SELECT COUNT(*) FROM read_parquet('{args.out}')
            WHERE {var}_median < {var}_min OR {var}_median > {var}_max
        """).fetchone()[0]
        print(f"CHECK median-outside-range violations: {bad}")
        if bad:
            print("ERROR: ensemble median falls outside the member range", file=sys.stderr)
            return 4

        # Plausibility bound -- catches a wrong scale/offset, which is otherwise invisible.
        if args.sane_min is not None and lo is not None and lo < args.sane_min:
            print(f"ERROR: min {lo} below sane bound {args.sane_min}", file=sys.stderr)
            return 5
        if args.sane_max is not None and hi is not None and hi > args.sane_max:
            print(f"ERROR: max {hi} above sane bound {args.sane_max}", file=sys.stderr)
            return 5
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  chelsa_join_vars.py: |
    """Join all variables x ensemble members for one h0 into one wide, land-masked row per cell.

    Layout produced by the hex step:  <hex-root>/<var>_<member>/h0=<cell>/data_0.parquet

    For each variable the five member columns are carried through unchanged and joined on `h8`,
    then `median` / `min` / `max` are materialised alongside them. The members are the
    upstream-faithful representation -- CHELSA ships per-GCM files and no ensemble product -- and
    median plus full range is the conventional summary for an ensemble this small (percentiles need
    more members to mean anything). Keeping every member means any other summary is a query rather
    than a rebuild.

    Value columns are written as FLOAT (float32): the source is UInt16 quantised to 0.1 units, so
    float32 carries far more precision than the data has, at half the size of DOUBLE.

    Values arrive **already in physical units**: cng-datasets hands the raster path to exactextract,
    whose GDAL source applies the band scale/offset. No transform is applied here. See BUILD.md.

    The land mask is the WWF Terrestrial Ecoregions h8 hex. Exit 3 means nothing survived it, which
    the caller treats as a skip rather than a failure.
    """
    import argparse
    import glob
    import json
    import sys

    import duckdb


    def part(hex_root: str, var: str, member: str, h0: str) -> str:
        hits = glob.glob(f"{hex_root}/{var}_{member}/h0={h0}/data_0.parquet")
        if not hits:
            raise SystemExit(f"ERROR: missing hex partition for {var}_{member} h0={h0}")
        return hits[0]


    def main() -> int:
        ap = argparse.ArgumentParser()
        ap.add_argument("--h0", required=True)
        ap.add_argument("--vars", required=True, help="comma-separated variables, e.g. bio1,bio12")
        ap.add_argument("--members", required=True, help="comma-separated member column suffixes")
        ap.add_argument("--bounds", required=True,
                        help='JSON {"bio1": [-100, 60], ...} physical plausibility bounds per variable')
        ap.add_argument("--hex-root", required=True)
        ap.add_argument("--mask", required=True)
        ap.add_argument("--out", required=True)
        args = ap.parse_args()

        variables = [v.strip() for v in args.vars.split(",") if v.strip()]
        members = [m.strip() for m in args.members.split(",") if m.strip()]
        bounds = json.loads(args.bounds)
        if len(members) < 2:
            print("ERROR: need at least 2 ensemble members", file=sys.stderr)
            return 1

        con = duckdb.connect()
        base_var, base_member = variables[0], members[0]
        base_path = part(args.hex_root, base_var, base_member, args.h0)
        base_alias = f"{base_var}_{base_member}"

        select_parts, join_parts = [], []
        for var in variables:
            # FLOAT (float32) rather than DOUBLE: the source is UInt16 quantised to 0.1 units, so
            # float32's ~7 significant digits are far more than the data carries, and it halves the
            # published size. Cast the members first so the derived statistics inherit the type.
            cols = [f"CAST({var}_{m}t.{var}_{m} AS FLOAT)" for m in members]
            arr = "[" + ", ".join(cols) + "]"
            for m, col in zip(members, cols):
                select_parts.append(f"{col} AS {var}_{m}")
            select_parts += [
                f"list_sort({arr})[{(len(members) + 1) // 2}] AS {var}_median",
                f"list_min({arr}) AS {var}_min",
                f"list_max({arr}) AS {var}_max",
            ]
            for m in members:
                alias = f"{var}_{m}t"
                if alias == f"{base_alias}t":
                    continue
                join_parts.append(
                    f"JOIN read_parquet('{part(args.hex_root, var, m, args.h0)}') {alias} "
                    f"ON {alias}.h8 = {base_alias}t.h8"
                )

        con.execute(f"""
            COPY (
                SELECT {base_alias}t.h8, {base_alias}t.h5, {base_alias}t.h4, {base_alias}t.h0,
                       {", ".join(select_parts)}
                FROM read_parquet('{base_path}') {base_alias}t
                {" ".join(join_parts)}
                SEMI JOIN (SELECT DISTINCT h8 FROM read_parquet('{args.mask}')) msk
                  ON {base_alias}t.h8 = msk.h8
            ) TO '{args.out}'
            (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)
        """)

        before = con.execute(f"SELECT COUNT(*) FROM read_parquet('{base_path}')").fetchone()[0]
        after = con.execute(f"SELECT COUNT(*) FROM read_parquet('{args.out}')").fetchone()[0]
        print(f"MASK h0={args.h0} rows_before={before} rows_after={after} "
              f"kept={100.0 * after / before if before else 0:.2f}%")
        if after == 0:
            print("EMPTY after land mask")
            return 3

        failures = 0
        for var in variables:
            lo, hi, nulls, bad = con.execute(f"""
                SELECT MIN({var}_min), MAX({var}_max),
                       COUNT(*) FILTER (WHERE {var}_median IS NULL),
                       COUNT(*) FILTER (WHERE {var}_median < {var}_min OR {var}_median > {var}_max)
                FROM read_parquet('{args.out}')
            """).fetchone()
            print(f"MEASURED {var}: min={lo} max={hi} median_nulls={nulls} ordering_violations={bad}")
            if bad:
                print(f"ERROR: {var} median outside member range in {bad} rows", file=sys.stderr)
                failures += 1
            blo, bhi = bounds[var]
            # A wrong scale/offset or a leaked nodata sentinel is invisible to every structural
            # check -- ordering and cardinality survive a linear transform -- so bound the physical
            # value against what the quantity can actually be.
            if lo is not None and lo < blo:
                print(f"ERROR: {var} min {lo} below plausibility bound {blo}", file=sys.stderr)
                failures += 1
            if hi is not None and hi > bhi:
                print(f"ERROR: {var} max {hi} above plausibility bound {bhi}", file=sys.stderr)
                failures += 1

        return 5 if failures else 0


    if __name__ == "__main__":
        sys.exit(main())
  chelsa_mask_one.py: |
    """Mask one hexed raster partition to land and write it (data-workflows #564).

    Used by the Armada microsliced path, where each job handles a single
    (h0, variable, member). Masking here rather than at join time keeps the staged
    intermediate to the land subset instead of all 5,764,801 cells of the h0.

    A separate script rather than inline SQL on purpose: the same statement embedded in a shell
    command inside a YAML pod spec has to survive three layers of quoting, and the escaping
    collapses in ways that only show up at runtime.

    Exit 3 means nothing survived the mask, which the caller treats as a skip rather than a failure.
    """
    import argparse
    import sys

    import duckdb

    ap = argparse.ArgumentParser()
    ap.add_argument("--src", required=True)
    ap.add_argument("--mask", required=True)
    ap.add_argument("--out", required=True)
    args = ap.parse_args()

    con = duckdb.connect()
    con.execute(
        """
        COPY (
            SELECT r.* FROM read_parquet(?) r
            SEMI JOIN (SELECT DISTINCT h8 FROM read_parquet(?)) m ON r.h8 = m.h8
        ) TO '""" + args.out + """' (FORMAT PARQUET, COMPRESSION ZSTD, ROW_GROUP_SIZE 100000)
        """,
        [args.src, args.mask],
    )

    n = con.execute("SELECT COUNT(*) FROM read_parquet(?)", [args.out]).fetchone()[0]
    print(f"masked rows: {n}")
    sys.exit(3 if n == 0 else 0)
  chelsa_read_meta.py: |
    """Print scale, offset and nodata for a CHELSA raster (data-workflows #564).

    CHELSA declares these per file and they differ per variable -- bio1/bio4/bio12 use nodata 0
    while bio15 uses 65535, and bio1 carries offset -273.15 where the others carry 0. The build
    reads them from the file rather than carrying a table, so a new variable cannot silently
    inherit the wrong sentinel.

    Emits one shell-eval-able line: SCALE=<f> OFFSET=<f> NODATA=<v>
    (NODATA is empty when the source declares none.)
    """
    import argparse
    import sys

    from osgeo import gdal

    gdal.UseExceptions()


    def fmt_nodata(v):
        if v is None:
            return ""
        # GDAL returns a float; emit an integer when the sentinel is integral so the value
        # round-trips into `cng-datasets --nodata` as e.g. "0", never "0.0".
        return str(int(v)) if float(v).is_integer() else repr(v)


    def main() -> int:
        ap = argparse.ArgumentParser()
        ap.add_argument("--input", required=True)
        args = ap.parse_args()

        # Hold the Dataset for the lifetime of the band: chaining
        # `gdal.Open(p).GetRasterBand(1)` lets the Dataset be garbage-collected and leaves the
        # band dangling, which surfaces as a TypeError inside the SWIG shim rather than as a
        # clean failure.
        ds = gdal.Open(args.input)
        if ds is None:
            print(f"ERROR: could not open {args.input}", file=sys.stderr)
            return 1
        band = ds.GetRasterBand(1)
        if band is None:
            print(f"ERROR: no band 1 in {args.input}", file=sys.stderr)
            return 1

        scale = band.GetScale()
        offset = band.GetOffset()
        nodata = band.GetNoDataValue()

        print(f"SCALE={1.0 if scale is None else scale} "
              f"OFFSET={0.0 if offset is None else offset} "
              f"NODATA={fmt_nodata(nodata)}")
        del band
        del ds
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  gen_armada_baseline.py: |
    """Generate the Armada job sets for the CHELSA v2.1 present-day baseline (data-workflows #448).

    The baseline is an observational climatology, not an ensemble: one raster per variable, no GCM
    members. So the schema is plain `bio1`, `bio4`, ... rather than the futures' `bio1_<member>` plus
    median/min/max, and a delta against a future collection reads naturally:

        SELECT AVG(f.bio1_median - b.bio1) AS warming_c
        FROM   <future>/hex/... f JOIN <baseline>/hex/... b USING (h8)

    Same shape as the futures build otherwise: one hex job per (h0, variable), masked to land before
    staging, then one join per h0. Sizing is the measured 8 Gi / 4 cores, and Armada has no retry, so
    the caller must still run armada_gapfill.py before joining.
    """
    import argparse
    import sys

    import yaml

    VARS = ["bio1", "bio4", "bio5", "bio6", "bio12", "bio15", "bio17"]
    BASE = "https://s3-west.nrp-nautilus.io/public-bioclimate"

    HEX = r"""set -euo pipefail
    H0IDX=__H0IDX__ ; V=__VAR__ ; PERIOD=__PERIOD__ ; STAGING=__STAGING__
    RAW="public-bioclimate/raw/chelsa-2-1/${PERIOD}"
    F="CHELSA_${V}_${PERIOD}_V.2.1.tif"
    rm -rf /tmp/hex /tmp/mask /tmp/cache && mkdir -p /tmp/hex /tmp/mask /tmp/cache

    rclone copyto nrp:public-grids/hex/h0-valid.parquet /tmp/h0grid.parquet \
      --retries 5 --low-level-retries 20 --retries-sleep 10s
    H0=$(python3 /opt/scripts/chelsa_h0_for_index.py --grid /tmp/h0grid.parquet --index ${H0IDX})
    echo "h0-index ${H0IDX} -> ${H0} | ${V} baseline ${PERIOD}"

    # rclone copyto exits 0 when the source is absent, so test for the file itself
    rclone copyto "nrp:public-ecoregion/ecoregion/hex/h0=${H0}/data_0.parquet" /tmp/mask/eco.parquet \
      --retries 5 --low-level-retries 20 --retries-sleep 10s 2>/dev/null || true
    if [ ! -s /tmp/mask/eco.parquet ]; then echo "no land in h0=${H0} — nothing to do"; exit 0; fi

    META=$(python3 /opt/scripts/chelsa_read_meta.py --input "/vsicurl/https://${AWS_PUBLIC_ENDPOINT}/${RAW}/${F}")
    echo "${V} metadata: ${META}"
    eval "$META"
    NODATA_ARG=""; if [ -n "${NODATA:-}" ]; then NODATA_ARG="--nodata ${NODATA}"; fi

    cng-datasets raster \
      --input "s3://${RAW}/${F}" \
      --output-parquet /tmp/hex/out \
      --h0-index ${H0IDX} \
      --resolution 8 --parent-resolutions 5,4,0 \
      --value-column "${V}" \
      --hex-resampling mean ${NODATA_ARG} \
      --local-cache-dir /tmp/cache

    SRC=$(ls /tmp/hex/out/h0=*/data_0.parquet | head -1)
    set +e
    python3 /opt/scripts/chelsa_mask_one.py --src "${SRC}" --mask /tmp/mask/eco.parquet --out /tmp/masked.parquet
    rc=$?; set -e
    if [ "$rc" -eq 3 ]; then echo "empty after mask"; exit 0; fi
    if [ "$rc" -ne 0 ]; then echo "mask failed rc=${rc}"; exit "$rc"; fi

    rclone copyto /tmp/masked.parquet \
      "nrp:public-bioclimate/${STAGING}/${PERIOD}/${V}/h0=${H0}/data_0.parquet" \
      --retries 5 --low-level-retries 20 --retries-sleep 10s
    echo "staged ${V} h0=${H0}"
    """

    JOIN = r"""set -euo pipefail
    H0IDX=__H0IDX__ ; PERIOD=__PERIOD__ ; STAGING=__STAGING__ ; VARS=__VARS__ ; OUTPREFIX=__OUTPREFIX__
    rm -rf /tmp/hex /tmp/mask && mkdir -p /tmp/hex /tmp/mask

    rclone copyto nrp:public-grids/hex/h0-valid.parquet /tmp/h0grid.parquet \
      --retries 5 --low-level-retries 20 --retries-sleep 10s
    H0=$(python3 /opt/scripts/chelsa_h0_for_index.py --grid /tmp/h0grid.parquet --index ${H0IDX})
    rclone copyto "nrp:public-ecoregion/ecoregion/hex/h0=${H0}/data_0.parquet" /tmp/mask/eco.parquet \
      --retries 5 --low-level-retries 20 --retries-sleep 10s 2>/dev/null || true
    if [ ! -s /tmp/mask/eco.parquet ]; then echo "no land in h0=${H0}"; exit 0; fi

    missing=0
    for V in ${VARS//,/ }; do
      D="/tmp/hex/${V}/h0=${H0}"; mkdir -p "$D"
      rclone copyto "nrp:public-bioclimate/${STAGING}/${PERIOD}/${V}/h0=${H0}/data_0.parquet" \
        "${D}/data_0.parquet" --retries 5 --low-level-retries 20 --retries-sleep 10s 2>/dev/null || true
      [ -s "${D}/data_0.parquet" ] || { echo "MISSING ${V} h0=${H0}" >&2; missing=$((missing+1)); }
    done
    # refuse a partial join: it would write a partition that looks complete but lacks variables
    if [ "$missing" -ne 0 ]; then echo "ERROR: ${missing} pieces missing for h0=${H0}" >&2; exit 1; fi

    set +e
    python3 /opt/scripts/chelsa_join_baseline.py --h0 "${H0}" --vars "${VARS}" \
      --hex-root /tmp/hex --mask /tmp/mask/eco.parquet --out /tmp/final.parquet --bounds "${BOUNDS}"
    rc=$?; set -e
    if [ "$rc" -eq 3 ]; then echo "empty after mask"; exit 0; fi
    if [ "$rc" -ne 0 ]; then echo "join failed rc=${rc}"; exit "$rc"; fi

    rclone copyto /tmp/final.parquet \
      "nrp:public-bioclimate/${OUTPREFIX}/${PERIOD}/hex/h0=${H0}/data_0.parquet" \
      --retries 5 --low-level-retries 20 --retries-sleep 10s
    echo "h0=${H0} joined"
    """

    BOUNDS = ('{"bio1":[-100,60],"bio4":[0,5000],"bio5":[-70,65],"bio6":[-100,45],'
              '"bio12":[0,12000],"bio15":[0,400],"bio17":[0,6000]}')


    def pod(script, memory, cpu, ephemeral, extra_env=None):
        env = [
            {"name": "AWS_ACCESS_KEY_ID", "valueFrom": {"secretKeyRef": {"name": "aws", "key": "AWS_ACCESS_KEY_ID"}}},
            {"name": "AWS_SECRET_ACCESS_KEY", "valueFrom": {"secretKeyRef": {"name": "aws", "key": "AWS_SECRET_ACCESS_KEY"}}},
            {"name": "AWS_S3_ENDPOINT", "value": "rook-ceph-rgw-nautiluss3.rook"},
            {"name": "AWS_PUBLIC_ENDPOINT", "value": "s3-west.nrp-nautilus.io"},
            {"name": "AWS_HTTPS", "value": "false"},
            {"name": "AWS_VIRTUAL_HOSTING", "value": "FALSE"},
            {"name": "GDAL_DATA", "value": "/usr/share/gdal"},
            {"name": "PYTHONPATH", "value": "/usr/lib/python3/dist-packages"},
            {"name": "CNG_HEX_WORKERS", "value": str(cpu)},
        ] + (extra_env or [])
        return {
            "restartPolicy": "Never", "terminationGracePeriodSeconds": 30,
            "containers": [{
                "name": "task", "image": "ghcr.io/boettiger-lab/datasets:latest",
                "imagePullPolicy": "Always", "env": env, "command": ["bash", "-c", script],
                "volumeMounts": [
                    {"name": "rclone-config", "mountPath": "/root/.config/rclone", "readOnly": True},
                    {"name": "scripts", "mountPath": "/opt/scripts", "readOnly": True}],
                "resources": {
                    "requests": {"cpu": str(cpu), "memory": memory, "ephemeral-storage": ephemeral},
                    "limits": {"cpu": str(cpu), "memory": memory, "ephemeral-storage": ephemeral}},
            }],
            "volumes": [
                {"name": "rclone-config", "secret": {"secretName": "rclone-config"}},
                {"name": "scripts", "configMap": {"name": "chelsa-scripts"}}],
        }


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--phase", choices=["hex", "join"], required=True)
        ap.add_argument("--period", default="1981-2010")
        ap.add_argument("--queue", default="geo-workflows")
        ap.add_argument("--namespace", default="geo-workflows")
        ap.add_argument("--job-set-id", required=True)
        ap.add_argument("--staging", default="staging-baseline")
        ap.add_argument("--output-prefix", default="chelsa-2-1/baseline")
        ap.add_argument("--h0-indexes", default="0-121")
        ap.add_argument("--vars", default=",".join(VARS))
        ap.add_argument("--memory", default="8Gi")
        ap.add_argument("--cpu", type=int, default=4)
        ap.add_argument("--priority-class", default="armada-preemptible")
        ap.add_argument("--out", required=True)
        args = ap.parse_args()

        if "-" in args.h0_indexes and "," not in args.h0_indexes:
            lo, hi = args.h0_indexes.split("-")
            idxs = list(range(int(lo), int(hi) + 1))
        else:
            idxs = [int(i) for i in args.h0_indexes.split(",")]
        variables = [v.strip() for v in args.vars.split(",") if v.strip()]

        jobs = []
        for h0idx in idxs:
            if args.phase == "hex":
                for v in variables:
                    s = (HEX.replace("__H0IDX__", str(h0idx)).replace("__VAR__", v)
                            .replace("__PERIOD__", args.period).replace("__STAGING__", args.staging))
                    jobs.append({"namespace": args.namespace, "priorityClassName": args.priority_class,
                                 "podSpec": pod(s, args.memory, args.cpu, "8Gi")})
            else:
                s = (JOIN.replace("__H0IDX__", str(h0idx)).replace("__PERIOD__", args.period)
                         .replace("__STAGING__", args.staging).replace("__VARS__", ",".join(variables))
                         .replace("__OUTPREFIX__", args.output_prefix))
                jobs.append({"namespace": args.namespace, "priorityClassName": args.priority_class,
                             "podSpec": pod(s, "8Gi", 4, "40Gi", [{"name": "BOUNDS", "value": BOUNDS}])})

        with open(args.out, "w") as f:
            yaml.safe_dump({"queue": args.queue, "jobSetId": args.job_set_id, "jobs": jobs}, f, sort_keys=False)
        print(f"{len(jobs)} {args.phase} jobs -> {args.out}")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
  gen_armada_hex.py: |
    """Generate an Armada job set for microsliced CHELSA hexing (data-workflows #564).

    One Armada job per (h0, variable, GCM member) — 122 x 7 x 5 = 4,270 units for a full
    (ssp, period) combination, each roughly five minutes, against 122 jobs of ~3.5 hours on the
    k8s path. Armada is not bound by the k8s indexed-Job completion cap (~200, an etcd pressure
    limit), which is what makes this shape possible.

    Why microslice, beyond preemption:
      * the unit of loss on preemption drops from hours to minutes
      * each job requests what one raster needs, not the peak of a 35-step chain
      * small pods pack into free scraps instead of waiting for large contiguous slots, so realised
        parallelism is far closer to requested
      * a straggler retries invisibly instead of holding up a batch and leaving stale output

    Each job masks to land before staging, so the intermediate is the land subset rather than all
    5,764,801 cells of the h0.
    """
    import argparse
    import json
    import sys

    import yaml

    VARS = ["bio1", "bio4", "bio5", "bio6", "bio12", "bio15", "bio17"]
    GCMS = [
        ("GFDL-ESM4", "gfdl_esm4"),
        ("IPSL-CM6A-LR", "ipsl_cm6a_lr"),
        ("MPI-ESM1-2-HR", "mpi_esm1_2_hr"),
        ("MRI-ESM2-0", "mri_esm2_0"),
        ("UKESM1-0-LL", "ukesm1_0_ll"),
    ]

    SCRIPT = r"""set -euo pipefail
    H0IDX=__H0IDX__ ; V=__VAR__ ; G=__GCM__ ; C=__COL__
    SSP=__SSP__ ; PERIOD=__PERIOD__
    RAW="public-bioclimate/raw/chelsa-2-1/${PERIOD}"
    GL=$(echo "$G" | tr 'A-Z' 'a-z')
    rm -rf /tmp/hex /tmp/mask /tmp/cache && mkdir -p /tmp/hex /tmp/mask /tmp/cache

    rclone copyto nrp:public-grids/hex/h0-valid.parquet /tmp/h0grid.parquet \
      --retries 5 --low-level-retries 20 --retries-sleep 10s
    H0=$(python3 /opt/scripts/chelsa_h0_for_index.py --grid /tmp/h0grid.parquet --index ${H0IDX})
    echo "h0-index ${H0IDX} -> ${H0} | ${V} / ${G}"

    # rclone copyto exits 0 when the source is absent, so test for the file itself.
    rclone copyto "nrp:public-ecoregion/ecoregion/hex/h0=${H0}/data_0.parquet" /tmp/mask/eco.parquet \
      --retries 5 --low-level-retries 20 --retries-sleep 10s 2>/dev/null || true
    if [ ! -s /tmp/mask/eco.parquet ]; then
      echo "no land in h0=${H0} — nothing to do"; exit 0
    fi

    META=$(python3 /opt/scripts/chelsa_read_meta.py \
      --input "/vsicurl/https://${AWS_PUBLIC_ENDPOINT}/${RAW}/${G}/${SSP}/CHELSA_${V}_${PERIOD}_${GL}_${SSP}_V.2.1.tif")
    echo "${V} metadata: ${META}"
    eval "$META"
    NODATA_ARG=""; if [ -n "${NODATA:-}" ]; then NODATA_ARG="--nodata ${NODATA}"; fi

    cng-datasets raster \
      --input "s3://${RAW}/${G}/${SSP}/CHELSA_${V}_${PERIOD}_${GL}_${SSP}_V.2.1.tif" \
      --output-parquet "/tmp/hex/out" \
      --h0-index ${H0IDX} \
      --resolution 8 --parent-resolutions 5,4,0 \
      --value-column "${V}_${C}" \
      --hex-resampling mean ${NODATA_ARG} \
      --local-cache-dir /tmp/cache

    SRC=$(ls /tmp/hex/out/h0=*/data_0.parquet | head -1)
    # Mask to land before staging: the intermediate becomes the land subset rather than all
    # 5,764,801 cells of the h0, which is most of the staging volume for a mostly-ocean cell.
    # A script, not inline SQL -- the statement would otherwise have to survive shell, YAML and
    # Python quoting, and that escaping collapses at runtime rather than at generation time.
    set +e
    python3 /opt/scripts/chelsa_mask_one.py \
      --src "${SRC}" --mask /tmp/mask/eco.parquet --out /tmp/masked.parquet
    rc=$?
    set -e
    if [ "$rc" -eq 3 ]; then echo "empty after mask"; exit 0; fi
    if [ "$rc" -ne 0 ]; then echo "mask failed rc=${rc}"; exit "$rc"; fi

    rclone copyto /tmp/masked.parquet \
      "nrp:public-bioclimate/__STAGING__/${SSP}-${PERIOD}/${V}_${C}/h0=${H0}/data_0.parquet" \
      --retries 5 --low-level-retries 20 --retries-sleep 10s
    echo "staged ${V}_${C} h0=${H0}"
    """


    def make_pod(h0idx, var, gcm, col, ssp, period, staging, memory, cpu):
        script = (SCRIPT
                  .replace("__H0IDX__", str(h0idx)).replace("__VAR__", var)
                  .replace("__GCM__", gcm).replace("__COL__", col)
                  .replace("__SSP__", ssp).replace("__PERIOD__", period)
                  .replace("__STAGING__", staging))
