              cng-datasets merge-chunks \
                --chunks-dir s3://public-usgs-sagebrush/sagebrush-conservation-design/hex-chunks/period=2003-2006/ \
                --output-dir s3://public-usgs-sagebrush/sagebrush-conservation-design/hex/period=2003-2006 \
                --expect-chunks 196
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 50Gi
              limits:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 50Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  sagebrush-conservation-design-2003-2006-preprocess-cog.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: sagebrush-conservation-design-2003-2006-preprocess-cog
      namespace: geo-workflows
      labels:
        k8s-app: sagebrush-conservation-design-2003-2006-preprocess-cog
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            k8s-app: sagebrush-conservation-design-2003-2006-preprocess-cog
        spec:
          restartPolicy: Never
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          containers:
          - name: preprocess-cog
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: GDAL_CACHEMAX
              value: '4096'
            - name: GDAL_HTTP_TIMEOUT
              value: '60'
            - name: GDAL_HTTP_MAX_RETRY
              value: '5'
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - "set -e\n\necho \"Mosaicking 1 tiles \u2192 s3://public-usgs-sagebrush/sagebrush-conservation-design/sagebrush-conservation-design-2003-2006-cog.tif\"\
              \n\ncng-datasets raster \\\n  --input \"s3://public-usgs-sagebrush/raw/sei/SEI_2003_2006_30_Current.tif\"\
              \ \\\n  --output-cog \"s3://public-usgs-sagebrush/sagebrush-conservation-design/sagebrush-conservation-design-2003-2006-cog.tif\"\
              \ \\\n  --target-crs EPSG:4326 \\\n  --resampling nearest \\\n  --band\
              \ 1 \\\n  --nodata \"0\" \\\n  --hex-resampling mode\n\necho \"\u2713 Preprocess\
              \ COG complete: s3://public-usgs-sagebrush/sagebrush-conservation-design/sagebrush-conservation-design-2003-2006-cog.tif\"\
              \n"
            resources:
              requests:
                cpu: '8'
                memory: 32Gi
                ephemeral-storage: 30Gi
              limits:
                cpu: '8'
                memory: 32Gi
                ephemeral-storage: 30Gi
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  sagebrush-conservation-design-2003-2006-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: sagebrush-conservation-design-2003-2006-setup-bucket
      namespace: geo-workflows
      labels:
        k8s-app: sagebrush-conservation-design-2003-2006-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: sagebrush-conservation-design-2003-2006-setup-bucket
        spec:
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-usgs-sagebrush
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Setting up bucket with public access and CORS..."
              cng-datasets storage setup-bucket \
                --bucket "${BUCKET}" \
                --remote nrp \
                --verify

              echo "Bucket setup complete!"
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
