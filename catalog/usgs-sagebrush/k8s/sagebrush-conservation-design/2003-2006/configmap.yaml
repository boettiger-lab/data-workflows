# Auto-generated ConfigMap for raster workflow
# Generation command: cng-datasets raster-workflow --dataset sagebrush-conservation-design-2003-2006 --source-url "s3://public-usgs-sagebrush/raw/sei/SEI_2003_2006_30_Current.tif" --bucket public-usgs-sagebrush --h3-resolution 10 --parent-resolutions "9,8,0"
apiVersion: v1
data:
  sagebrush-conservation-design-2003-2006-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: sagebrush-conservation-design-2003-2006-hex
      namespace: geo-workflows
      labels:
        k8s-app: sagebrush-conservation-design-2003-2006-hex
    spec:
      completions: 196
      parallelism: 40
      completionMode: Indexed
      backoffLimitPerIndex: 2
      maxFailedIndexes: 1
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: sagebrush-conservation-design-2003-2006-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: GDAL_DATA
              value: /usr/share/gdal
            - name: PYTHONPATH
              value: /usr/lib/python3/dist-packages
            - name: BUCKET
              value: public-usgs-sagebrush
            - name: CNG_HEX_WORKERS
              value: '4'
            - name: CNG_HEX_CHUNK_SIZE
              value: '100000'
            - name: DUCKDB_MEMORY_LIMIT
              value: 6963MiB
            - name: GDAL_CACHEMAX
              value: '512'
            command:
            - bash
            - -c
            - |-
              set -e

              cng-datasets raster --input "s3://public-usgs-sagebrush/sagebrush-conservation-design/sagebrush-conservation-design-2003-2006-cog.tif" --output-parquet s3://public-usgs-sagebrush/sagebrush-conservation-design/hex-chunks/period=2003-2006/ --chunk-resolution 2 --chunk-index ${JOB_COMPLETION_INDEX} --h0-subset "12,20,50,71" --resolution 10 --parent-resolutions 9,8,0 --value-column sei_class --hex-resampling mode --nodata "0"
            resources:
              requests:
                cpu: '4'
                memory: 8Gi
                ephemeral-storage: 20Gi
              limits:
                cpu: '4'
                memory: 8Gi
                ephemeral-storage: 20Gi
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  sagebrush-conservation-design-2003-2006-merge.yaml: |
