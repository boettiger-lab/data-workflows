# DEVIATION from generated output (#770): applied by ../generate.sh -- preprocess-cog
# resampling bilinear -> nearest (boettiger-lab/datasets#272); hex/merge paths moved under
# sagebrush-conservation-design/hex{,-chunks}/period=<period>/ (boettiger-lab/datasets#172).
apiVersion: batch/v1
kind: Job
metadata:
  name: sagebrush-conservation-design-2008-2011-preprocess-cog
  namespace: geo-workflows
  labels:
    k8s-app: sagebrush-conservation-design-2008-2011-preprocess-cog
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: sagebrush-conservation-design-2008-2011-preprocess-cog
    spec:
      restartPolicy: Never
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      containers:
      - name: preprocess-cog
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_CACHEMAX
          value: '4096'
        - name: GDAL_HTTP_TIMEOUT
          value: '60'
        - name: GDAL_HTTP_MAX_RETRY
          value: '5'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - "set -e\n\necho \"Mosaicking 1 tiles \u2192 s3://public-usgs-sagebrush/sagebrush-conservation-design/sagebrush-conservation-design-2008-2011-cog.tif\"\
          \n\ncng-datasets raster \\\n  --input \"s3://public-usgs-sagebrush/raw/sei/SEI_2008_2011_30_Current.tif\"\
          \ \\\n  --output-cog \"s3://public-usgs-sagebrush/sagebrush-conservation-design/sagebrush-conservation-design-2008-2011-cog.tif\"\
          \ \\\n  --target-crs EPSG:4326 \\\n  --resampling nearest \\\n  --band\
          \ 1 \\\n  --nodata \"0\" \\\n  --hex-resampling mode\n\necho \"\u2713 Preprocess\
          \ COG complete: s3://public-usgs-sagebrush/sagebrush-conservation-design/sagebrush-conservation-design-2008-2011-cog.tif\"\
          \n"
        resources:
          requests:
            cpu: '8'
            memory: 32Gi
            ephemeral-storage: 30Gi
          limits:
            cpu: '8'
            memory: 32Gi
            ephemeral-storage: 30Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
