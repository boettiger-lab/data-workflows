apiVersion: batch/v1
kind: Job
metadata:
  name: ghm-workflow
  namespace: biodiversity
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting ghm raster workflow...\"\n\n# Step 0: Setup bucket\n\
          echo \"Step 0: Setting up bucket...\"\nkubectl apply -f /yamls/ghm-setup-bucket.yaml\
          \ -n biodiversity\nkubectl wait --for=condition=complete --timeout=600s\
          \ job/ghm-setup-bucket -n biodiversity\n\n# Step 1: WGS84 COG (warp raw Mollweide -> EPSG:4326)\n\
          echo \"Step 1: Creating WGS84 COG...\"\nkubectl apply -f /yamls/ghm-cog.yaml\
          \ -n biodiversity\nkubectl wait --for=condition=complete --timeout=3600s\
          \ job/ghm-cog -n biodiversity\n\n# Step 2: H3 hexagonal tiling (from the COG)\n\
          echo \"Step 2: H3 hexagonal tiling...\"\nkubectl apply -f /yamls/ghm-hex.yaml\
          \ -n biodiversity\nkubectl wait --for=condition=complete --timeout=7200s\
          \ job/ghm-hex -n biodiversity\n\necho \"\u2713 Workflow complete!\"\necho\
          \ \"Clean up with:\"\necho \"  kubectl delete jobs ghm-setup-bucket ghm-cog ghm-hex\
          \ ghm-workflow -n biodiversity\"\necho \"  kubectl delete configmap ghm-yamls\
          \ -n biodiversity\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: ghm-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
