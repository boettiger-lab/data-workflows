apiVersion: batch/v1
kind: Job
metadata:
  name: tran-cost-grazing-expansion-workflow
  namespace: biodiversity
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting tran-cost-grazing-expansion raster workflow...\"\
          \n\n# Step 0: Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl\
          \ apply -f /yamls/tran-cost-grazing-expansion-setup-bucket.yaml -n biodiversity\n\
          kubectl wait --for=condition=complete --timeout=600s job/tran-cost-grazing-expansion-setup-bucket\
          \ -n biodiversity\n\n# Step 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal\
          \ tiling...\"\nkubectl apply -f /yamls/tran-cost-grazing-expansion-hex.yaml\
          \ -n biodiversity\nkubectl wait --for=condition=complete --timeout=7200s\
          \ job/tran-cost-grazing-expansion-hex -n biodiversity\n\necho \"\u2713 Workflow\
          \ complete!\"\necho \"Clean up with:\"\necho \"  kubectl delete jobs tran-cost-grazing-expansion-setup-bucket\
          \ tran-cost-grazing-expansion-hex tran-cost-grazing-expansion-workflow -n\
          \ biodiversity\"\necho \"  kubectl delete configmap tran-cost-grazing-expansion-yamls\
          \ -n biodiversity\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: tran-cost-grazing-expansion-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
