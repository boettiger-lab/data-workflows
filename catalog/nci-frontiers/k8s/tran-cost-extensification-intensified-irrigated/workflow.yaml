apiVersion: batch/v1
kind: Job
metadata:
  name: tran-cost-extensification-intensified-irrigated-workflow
  namespace: biodiversity
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting tran-cost-extensification-intensified-irrigated\
          \ raster workflow...\"\n\n# Step 0: Setup bucket\necho \"Step 0: Setting\
          \ up bucket...\"\nkubectl apply -f /yamls/tran-cost-extensification-intensified-irrigated-setup-bucket.yaml\
          \ -n biodiversity\nkubectl wait --for=condition=complete --timeout=600s\
          \ job/tran-cost-extensification-intensified-irrigated-setup-bucket -n biodiversity\n\
          \n# Step 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal tiling...\"\
          \nkubectl apply -f /yamls/tran-cost-extensification-intensified-irrigated-hex.yaml\
          \ -n biodiversity\nkubectl wait --for=condition=complete --timeout=7200s\
          \ job/tran-cost-extensification-intensified-irrigated-hex -n biodiversity\n\
          \necho \"\u2713 Workflow complete!\"\necho \"Clean up with:\"\necho \" \
          \ kubectl delete jobs tran-cost-extensification-intensified-irrigated-setup-bucket\
          \ tran-cost-extensification-intensified-irrigated-hex tran-cost-extensification-intensified-irrigated-workflow\
          \ -n biodiversity\"\necho \"  kubectl delete configmap tran-cost-extensification-intensified-irrigated-yamls\
          \ -n biodiversity\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: tran-cost-extensification-intensified-irrigated-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
