apiVersion: batch/v1
kind: Job
metadata:
  name: esa-lc-2025-workflow
  namespace: biodiversity
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting esa-lc-2025 raster workflow...\"\n\n# Step 0:\
          \ Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl apply -f\
          \ /yamls/esa-lc-2025-setup-bucket.yaml -n biodiversity\nkubectl wait --for=condition=complete\
          \ --timeout=600s job/esa-lc-2025-setup-bucket -n biodiversity\n\n# Step\
          \ 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal tiling...\"\nkubectl\
          \ apply -f /yamls/esa-lc-2025-hex.yaml -n biodiversity\nkubectl wait --for=condition=complete\
          \ --timeout=7200s job/esa-lc-2025-hex -n biodiversity\n\necho \"\u2713 Workflow\
          \ complete!\"\necho \"Clean up with:\"\necho \"  kubectl delete jobs esa-lc-2025-setup-bucket\
          \ esa-lc-2025-hex esa-lc-2025-workflow -n biodiversity\"\necho \"  kubectl\
          \ delete configmap esa-lc-2025-yamls -n biodiversity\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: esa-lc-2025-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
