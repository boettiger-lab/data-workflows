# HAND-ROLLED: the generator does not write STAC. A metadata-only fix (#881): 70 COG renders get
# a rescale that matches the data (fixes.json; why in apply.py). apply.py edits each LIVE
# collection in collections.txt, touching only the listed renders' rescale and colormap_name.
#   kubectl create configmap render-rescale-881 -n geo-workflows \
#     --from-file=apply.py=catalog/render-rescale-881/apply.py \
#     --from-file=fixes.json=catalog/render-rescale-881/fixes.json \
#     --from-file=guard.py=scripts/stac-publish-guard.py \
#     --from-file=collections.txt=catalog/render-rescale-881/collections.txt
#   kubectl create -f catalog/render-rescale-881/render-rescale-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: render-rescale-881
  namespace: geo-workflows
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: rescale
        image: ghcr.io/boettiger-lab/datasets@sha256:246dc706ea34728a75c0bf1bc8589fd8f5c2e6526876f6c7192660a272cec1b3
        resources:
          requests: {cpu: '1', memory: 1Gi}
          limits: {cpu: '1', memory: 1Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: in, mountPath: /in, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          n=0
          while read -r p; do
            [ -n "$p" ] || continue
            rclone cat "nrp:$p" > /tmp/live.json
            cp /tmp/live.json /tmp/c.json
            python3 /in/apply.py /in/fixes.json "$p" /tmp/c.json
            python3 -c "import json,sys; sys.exit(json.load(open('/tmp/c.json')) == json.load(open('/tmp/live.json')))" || { echo "unchanged $p"; continue; }
            python3 /in/guard.py /tmp/c.json /tmp/live.json
            rclone copyto /tmp/c.json "nrp:$p" $R
            n=$((n+1))
          done < /in/collections.txt
          echo "DONE: $n collections rewritten"
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: in, configMap: {name: render-rescale-881}}
