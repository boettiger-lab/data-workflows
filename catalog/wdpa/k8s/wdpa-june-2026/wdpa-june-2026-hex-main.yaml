apiVersion: batch/v1
kind: Job
metadata:
  name: wdpa-june-2026-hex-main
  labels:
    k8s-app: wdpa-june-2026-hex-main
spec:
  # 305,688 features < 5,000 km2 (the fast tier). 200 x 1529 = 305,800 >= 305,688.
  completions: 200
  parallelism: 25
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 200
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: wdpa-june-2026-hex-main
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: DUCKDB_MEMORY_LIMIT
          value: 40GiB
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector \
            --input s3://public-wdpa/wdpa-june-2026/tiers/tier_main.parquet \
            --output s3://public-wdpa/wdpa-june-2026/chunks \
            --chunk-id ${JOB_COMPLETION_INDEX} \
            --chunk-size 1529 \
            --intermediate-chunk-size 5 \
            --resolution 9 \
            --parent-resolutions 8,0
        resources:
          requests: {cpu: '4', memory: 48Gi, ephemeral-storage: 40Gi}
          limits: {cpu: '4', memory: 48Gi, ephemeral-storage: 40Gi}
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
