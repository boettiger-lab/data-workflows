apiVersion: batch/v1
kind: Job
metadata:
  name: wdpa-june-2026-hex
  labels:
    k8s-app: wdpa-june-2026-hex
spec:
  # 306,985 features. 200 x 1540 = 308,000 >= 306,985.
  # Adaptive resolution: GIS_AREA < 5000 km2 -> native h9; >= 5000 km2 -> native h8
  # (giant ocean EEZs would be ~43M h9 cells; at h8 ~6M, tractable as in Dec2025).
  # Representative-point (ST_PointOnSurface) fallback guarantees >=1 cell per feature.
  completions: 200
  parallelism: 25
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 200
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: wdpa-june-2026-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: CHUNK_SIZE
          value: '1540'
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          IDX=${JOB_COMPLETION_INDEX}
          python3 - "$IDX" "$CHUNK_SIZE" <<'PY'
          import sys, duckdb
          from cng_datasets.storage.s3 import configure_s3_credentials
          idx = int(sys.argv[1]); chunk = int(sys.argv[2]); offset = idx * chunk
          SRC = "s3://public-wdpa/wdpa-june-2026.parquet"
          OUT = f"/tmp/chunk_{idx:06d}.parquet"

          con = duckdb.connect()
          con.execute("INSTALL spatial; LOAD spatial")
          con.execute("INSTALL h3 FROM community; LOAD h3")
          con.execute("SET memory_limit='56GiB'")
          con.execute("SET temp_directory='/tmp'")
          con.execute("SET preserve_insertion_order=false")
          con.execute("SET http_timeout=3600000"); con.execute("SET http_retries=30"); con.execute("SET http_retry_wait_ms=5000")
          con.execute("SET arrow_large_buffer_size=true")
          configure_s3_credentials(con)

          # One adaptive-resolution pass. ST_Dump explodes multipolygons so each part
          # is polyfilled independently (parts already split at the antimeridian by the
          # source are handled correctly). Empty polyfill (polygon smaller than one cell)
          # falls back to the H3 cell at a guaranteed-interior point.
          con.execute(f"""
            COPY (
              WITH src AS (
                SELECT _cng_fid,
                       CASE WHEN COALESCE(GIS_AREA,0) < 5000 THEN 9 ELSE 8 END AS res,
                       ST_Multi(SHAPE) AS geom
                FROM read_parquet('{SRC}')
                LIMIT {chunk} OFFSET {offset}
              ),
              parts AS (
                SELECT _cng_fid, res, UNNEST(ST_Dump(geom)).geom AS g FROM src
              ),
              polled AS (
                SELECT _cng_fid, res,
                       h3_polygon_wkt_to_cells(ST_AsText(ST_Force2D(g)), res) AS ids,
                       ST_PointOnSurface(g) AS pos
                FROM parts
              ),
              filled AS (
                SELECT _cng_fid, res,
                       CASE WHEN len(ids) > 0 THEN ids
                            ELSE [h3_latlng_to_cell(ST_Y(pos), ST_X(pos), res)] END AS ids
                FROM polled
              ),
              cells AS (
                SELECT _cng_fid, res, UNNEST(ids) AS cell FROM filled
              )
              SELECT DISTINCT
                _cng_fid,
                CASE WHEN res = 9 THEN cell ELSE NULL END                 AS h9,
                CASE WHEN res = 9 THEN h3_cell_to_parent(cell, 8) ELSE cell END AS h8,
                h3_cell_to_parent(cell, 0)                                 AS h0
              FROM cells
            ) TO '{OUT}' (FORMAT PARQUET, COMPRESSION ZSTD)
          """)
          n = con.execute(f"SELECT COUNT(*) FROM read_parquet('{OUT}')").fetchone()[0]
          print(f"chunk {idx}: offset {offset}, {n:,} (feature,cell) rows", flush=True)
          PY
          if [ -s "/tmp/chunk_$(printf '%06d' "$IDX").parquet" ]; then
            timeout 1200 rclone copyto "/tmp/chunk_$(printf '%06d' "$IDX").parquet" \
              "nrp:public-wdpa/wdpa-june-2026/chunks/chunk_$(printf '%06d' "$IDX").parquet" \
              --retries 10 --low-level-retries 20 --contimeout 60s --timeout 600s
            echo "chunk $IDX uploaded"
          else
            echo "chunk $IDX empty (offset beyond data) — ok"
          fi
        resources:
          requests: {cpu: '4', memory: 64Gi, ephemeral-storage: 50Gi}
          limits: {cpu: '4', memory: 64Gi, ephemeral-storage: 50Gi}
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
