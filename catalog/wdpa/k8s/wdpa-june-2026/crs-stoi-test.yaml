apiVersion: batch/v1
kind: Job
metadata:
  name: crs-stoi-test
  labels:
    k8s-app: crs-stoi-test
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: crs-stoi-test
    spec:
      restartPolicy: Never
      containers:
      - name: crs-test
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - <<'PY'
          import duckdb, pyarrow.parquet as pq, pyarrow as pa, json
          from cng_datasets.storage.s3 import configure_s3_credentials

          SRC = "s3://public-wdpa/wdpa-june-2026.parquet"
          con = duckdb.connect()
          con.execute("INSTALL spatial; LOAD spatial")
          con.execute("SET memory_limit='28GiB'")
          configure_s3_credentials(con)
          # Pull 5 features locally (cheap: plain LIMIT reads only the first rows).
          # WKB + EPSG:4326 exactly as produced by cng-convert-to-parquet.
          con.execute(f"""
            COPY (SELECT _cng_fid, SHAPE FROM read_parquet('{SRC}') LIMIT 5)
            TO '/tmp/wkb4326.parquet' (FORMAT PARQUET)
          """)
          print("wrote /tmp/wkb4326.parquet (WKB + EPSG:4326)", flush=True)

          # Variant A: metadata-only retag of the 'geo' key to OGC:CRS84 (WKB bytes untouched).
          t = pq.read_table('/tmp/wkb4326.parquet')
          md = {k.decode() if isinstance(k,bytes) else k:(v.decode() if isinstance(v,bytes) else v)
                for k,v in (t.schema.metadata or {}).items()}
          geo = json.loads(md['geo'])
          geo['columns']['SHAPE']['crs'] = "OGC:CRS84"
          md['geo'] = json.dumps(geo)
          t2 = t.replace_schema_metadata(md)
          pq.write_table(t2, '/tmp/wkb_crs84_str.parquet')
          print("wrote /tmp/wkb_crs84_str.parquet (WKB, geo.crs='OGC:CRS84' string)", flush=True)

          # Variant B: drop crs entirely (GeoParquet default == OGC:CRS84).
          geo2 = json.loads(md['geo']); geo2['columns']['SHAPE'].pop('crs', None)
          md2 = dict(md); md2['geo'] = json.dumps(geo2)
          pq.write_table(t.replace_schema_metadata(md2), '/tmp/wkb_crs_null.parquet')
          print("wrote /tmp/wkb_crs_null.parquet (WKB, no crs key)", flush=True)

          # Variant C (the hypothesized culprit): geopandas → geoarrow.
          try:
              import geopandas as gpd
              g = gpd.read_parquet('/tmp/wkb4326.parquet')
              g = g.set_crs("OGC:CRS84", allow_override=True)
              g.to_parquet('/tmp/geoarrow_crs84.parquet')  # geopandas default geoarrow encoding
              gt = pq.read_table('/tmp/geoarrow_crs84.parquet')
              gmd = json.loads({k.decode():v.decode() for k,v in gt.schema.metadata.items()}['geo'])
              print("geopandas geo encoding:", gmd['columns'][list(gmd['columns'])[0]].get('encoding'), flush=True)
          except Exception as e:
              print("geopandas variant failed:", e, flush=True)

          # Self-test ST_ on each fixture with the image's duckdb (separate connection).
          print("\n=== image-duckdb ST_ self-test ===", flush=True)
          for f in ["wkb4326","wkb_crs84_str","wkb_crs_null","geoarrow_crs84"]:
              p = f"/tmp/{f}.parquet"
              try:
                  c2 = duckdb.connect(); c2.execute("INSTALL spatial; LOAD spatial")
                  gt = c2.execute(f"SELECT typeof(SHAPE) FROM read_parquet('{p}') LIMIT 1").fetchone()[0]
                  a  = c2.execute(f"SELECT round(sum(ST_Area(SHAPE)),4) FROM read_parquet('{p}')").fetchone()[0]
                  print(f"  {f}: typeof={gt}  sum(ST_Area)={a}  OK", flush=True)
              except Exception as e:
                  print(f"  {f}: ST_ FAILED -> {type(e).__name__}: {e}", flush=True)
          PY
          echo "--- uploading fixtures to public-test ---"
          for f in wkb4326 wkb_crs84_str wkb_crs_null geoarrow_crs84; do
            [ -f /tmp/$f.parquet ] && rclone copyto /tmp/$f.parquet nrp:public-test/crs-stoi/$f.parquet && echo "uploaded $f"
          done
          echo "DONE"
        resources:
          requests: {cpu: "2", memory: 32Gi, ephemeral-storage: 10Gi}
          limits: {cpu: "2", memory: 32Gi, ephemeral-storage: 10Gi}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
