# HAND-ROLLED: cng-datasets polyfills polygons by cell centre only and has no
# per-cell coverage fraction, so the 'overlap' + cover_frac hex is built by
# hex_overlap.py in this directory, copied from the WDPA build (#1000, #879;
# tool feature request datasets#363).
#
# Full plan, within the scope agreed on #879 (2026-11-23): every parcel of
# wdoecm-may-2026.parquet assigned to a chunk of at most ~2M estimated h9 cells
# plus ~1M vertices in weight (heavier parcels get a chunk each). Set the hex
# job's completions to the chunk count it logs. Writes only the plan file.
#
# The scripts ship as a ConfigMap, rebuilt from this directory before applying:
#   kubectl -n geo-workflows create configmap wdoecm-overlap-879-script \
#     --from-file=hex_overlap.py --from-file=validate_full.py --from-file=stac_update.py \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: wdoecm-overlap-879-plan
  namespace: geo-workflows
  labels:
    k8s-app: wdoecm-overlap-879-plan
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: wdoecm-overlap-879-plan
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: main
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 /opt/script/hex_overlap.py plan \
            --source s3://public-wdpa/wdoecm-may-2026/wdoecm-may-2026.parquet \
            --plan-out s3://public-wdpa/wdoecm-may-2026/staging-879/full/plan.parquet \
            --target-cells 2000000 --target-vertices 1000000
        volumeMounts:
        - {name: script, mountPath: /opt/script, readOnly: true}
        resources:
          requests: {cpu: '2', memory: 4Gi, ephemeral-storage: 10Gi}
          limits: {cpu: '2', memory: 4Gi, ephemeral-storage: 10Gi}
      volumes:
      - name: script
        configMap: {name: wdoecm-overlap-879-script}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
