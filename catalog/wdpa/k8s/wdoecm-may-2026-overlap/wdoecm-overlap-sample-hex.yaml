# HAND-ROLLED: cng-datasets polyfills polygons by cell centre only and has no
# per-cell coverage fraction, so the 'overlap' + cover_frac hex is built by
# hex_overlap.py in this directory, copied from the WDPA build (#1000, #879;
# tool feature request datasets#363).
#
# Sample hex: one index per chunk of plan-sample.parquet (written by
# wdoecm-overlap-sample-plan.yaml); set completions to its chunk count. Output
# goes only to staging-879/sample/chunks/. Sized as the WDPA sample (#1000);
# the full hex job is sized from this run's measured peak.
# Plan logged 12 chunks, 319 features (307 stratified + 12 largest), est 20.8M cells.
#
# The scripts ship as a ConfigMap, rebuilt from this directory before applying:
#   kubectl -n geo-workflows create configmap wdoecm-overlap-879-script \
#     --from-file=hex_overlap.py --from-file=validate_full.py --from-file=stac_update.py \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: batch/v1
kind: Job
metadata:
  name: wdoecm-overlap-879-sample-hex
  namespace: geo-workflows
  labels:
    k8s-app: wdoecm-overlap-879-sample-hex
spec:
  completions: 12
  parallelism: 12
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 12
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: wdoecm-overlap-879-sample-hex
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: main
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: PLAN, value: s3://public-wdpa/wdoecm-may-2026/staging-879/plan-sample.parquet}
        - {name: OUT, value: s3://public-wdpa/wdoecm-may-2026/staging-879/sample/chunks}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 /opt/script/hex_overlap.py hex \
            --source s3://public-wdpa/wdoecm-may-2026/wdoecm-may-2026.parquet --plan "$PLAN" \
            --chunk "$JOB_COMPLETION_INDEX" --out "$OUT" \
            --res 9 --parents 8,0 --threads 4 --memory-limit 6GB
          df -h /tmp | tail -1
        volumeMounts:
        - {name: script, mountPath: /opt/script, readOnly: true}
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        resources:
          requests: {cpu: '4', memory: 8Gi, ephemeral-storage: 20Gi}
          limits: {cpu: '4', memory: 8Gi, ephemeral-storage: 20Gi}
      volumes:
      - name: script
        configMap: {name: wdoecm-overlap-879-script}
      - name: rclone-config
        secret: {secretName: rclone-config}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
