# HAND-ROLLED: cng-datasets polyfills polygons by cell centre only and has no
# per-cell coverage fraction, so the 'overlap' + cover_frac hex is built by
# hex_overlap.py in this directory (#1000; tool feature request datasets#363).
#
# PHASE 2 SWAP, NOT YET APPLIED: apply only when the coordinator / Carl says to
# swap, after the validation (wdpa-overlap-validate.yaml) has been checked.
# Apply wdpa-overlap-publish-stac.yaml straight after it succeeds, so the STAC
# describes the data that is live.
#
# 1. Copies the live centre-mode hex (wdpa/hex/) to staging-1000/old-hex/ as a
#    rollback copy (server side).
# 2. Purges wdpa/hex/ and moves staging-1000/full-r2/hex/ into it. The path is empty
#    for the minutes of the move, never a mix of old and new partitions (a
#    sync would leave stale old partitions readable beside new ones).
# 3. Checks that wdpa/hex/ now holds exactly the staged partition list, that a
#    partition has cover_frac, and that the row count matches.
# 4. Deletes the superseded first sample run (staging-1000/chunks/) and the
#    superseded first full build without the repair step (staging-1000/full/hex/).
apiVersion: batch/v1
kind: Job
metadata:
  name: wdpa-overlap-1000-swap
  namespace: geo-workflows
  labels:
    k8s-app: wdpa-overlap-1000-swap
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: wdpa-overlap-1000-swap
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3600
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: plan
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          NEW=nrp:public-wdpa/wdpa/staging-1000/full-r2/hex
          LIVE=nrp:public-wdpa/wdpa/hex
          OLD=nrp:public-wdpa/wdpa/staging-1000/old-hex
          rclone lsf -R --files-only "$NEW" | sort > /tmp/new.txt
          n=$(wc -l < /tmp/new.txt); echo "staged partitions: $n"
          [ "$n" -ge 90 ] || { echo "too few staged partitions"; exit 1; }
          rows() { python3 - "$1" <<'PY'
          import sys, duckdb
          from cng_datasets.storage.s3 import configure_s3_credentials
          c = duckdb.connect(); configure_s3_credentials(c)
          print(c.execute(f"SELECT count(*) FROM read_parquet('{sys.argv[1]}/h0=*/data_0.parquet')").fetchone()[0])
          PY
          }
          staged_rows=$(rows s3://public-wdpa/wdpa/staging-1000/full-r2/hex); echo "staged rows: $staged_rows"
          rclone copy "$LIVE" "$OLD" $R
          echo "old hex copied to $OLD: $(rclone lsf -R --files-only "$OLD" | wc -l) files"
          rclone purge "$LIVE" $R
          rclone move "$NEW" "$LIVE" $R --delete-empty-src-dirs
          rclone lsf -R --files-only "$LIVE" | sort > /tmp/live.txt
          diff /tmp/new.txt /tmp/live.txt && echo "partition list matches"
          live_rows=$(rows s3://public-wdpa/wdpa/hex); echo "live rows: $live_rows"
          [ "$live_rows" = "$staged_rows" ] || { echo "row count mismatch"; exit 1; }
          python3 - <<'PY'
          import duckdb
          from cng_datasets.storage.s3 import configure_s3_credentials
          c = duckdb.connect(); configure_s3_credentials(c)
          cols = [r[0] for r in c.execute("DESCRIBE SELECT * FROM read_parquet('s3://public-wdpa/wdpa/hex/h0=*/data_0.parquet')").fetchall()]
          assert 'cover_frac' in cols, cols
          print('cover_frac present')
          PY
          rclone purge nrp:public-wdpa/wdpa/staging-1000/chunks $R || true
          rclone purge nrp:public-wdpa/wdpa/staging-1000/full/hex $R || true
          echo SWAPPED
        volumeMounts:
        - {name: script, mountPath: /opt/script, readOnly: true}
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        resources:
          requests: {cpu: '2', memory: 4Gi, ephemeral-storage: 2Gi}
          limits: {cpu: '2', memory: 4Gi, ephemeral-storage: 2Gi}
      volumes:
      - name: script
        configMap: {name: wdpa-overlap-1000-script}
      - name: rclone-config
        secret: {secretName: rclone-config}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
