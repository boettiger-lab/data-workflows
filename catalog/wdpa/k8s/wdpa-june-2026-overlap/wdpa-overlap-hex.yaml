# HAND-ROLLED: cng-datasets polyfills polygons by cell centre only and has no
# per-cell coverage fraction, so the 'overlap' + cover_frac hex is built by
# hex_overlap.py in this directory (#1000; tool feature request drafted there).
#
# PHASE 2, NOT YET RUN: apply only after Carl approves the full-run cost in #1000.
# Full hex: one index per chunk of full/plan.parquet (165 chunks as planned
# 2026-11-20; re-plan if wdpa.parquet changes and set completions to the
# count the plan job logs). Chunks go to the staging prefix, then
# wdpa-overlap-repartition.yaml builds wdpa/hex/.
#
# Sizing measured in Phase 1 (#1000, wdpa-overlap-probe.yaml): the three
# heaviest planned chunks took 4.3-7.3 min on 4 cores at peak RSS <= 2.7 GiB
# with --piece-work 2e7; chunk 80 at the current default (2e6) took 4.5 min at
# 4.2 GiB. The largest parcel (41M rows) took 40 s at 3.5 GiB. Pods stay under ~10 min, so opportunistic priority.
apiVersion: batch/v1
kind: Job
metadata:
  name: wdpa-overlap-1000-hex
  namespace: geo-workflows
  labels:
    k8s-app: wdpa-overlap-1000-hex
spec:
  completions: 165
  parallelism: 50
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 165
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: wdpa-overlap-1000-hex
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: hex
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: PLAN, value: s3://public-wdpa/wdpa/staging-1000/full/plan.parquet}
        - {name: OUT, value: s3://public-wdpa/wdpa/staging-1000/full/chunks}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 /opt/script/hex_overlap.py hex \
            --source s3://public-wdpa/wdpa.parquet --plan "$PLAN" \
            --chunk "$JOB_COMPLETION_INDEX" --out "$OUT" \
            --res 9 --parents 8,0 --threads 4 --memory-limit 6GB
          df -h /tmp | tail -1
        volumeMounts:
        - {name: script, mountPath: /opt/script, readOnly: true}
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        resources:
          requests: {cpu: '4', memory: 8Gi, ephemeral-storage: 20Gi}
          limits: {cpu: '4', memory: 8Gi, ephemeral-storage: 20Gi}
      volumes:
      - name: script
        configMap: {name: wdpa-overlap-1000-script}
      - name: rclone-config
        secret: {secretName: rclone-config}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
