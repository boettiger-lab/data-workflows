# HAND-ROLLED: cng-datasets polyfills polygons by cell centre only and has no
# per-cell coverage fraction, so the 'overlap' + cover_frac hex is built by
# hex_overlap.py in this directory (#1000; tool feature request drafted there).
#
# PHASE 2 (plan only is run in Phase 1, to size the hex job; it writes only the plan file).
# Full plan: every parcel of wdpa.parquet assigned to a chunk of ~8M
# estimated h9 cells (larger parcels get a chunk each). Set the hex job's
# completions to the chunk count it logs. ConfigMap: see
# wdpa-overlap-sample-plan.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: wdpa-overlap-1000-plan
  namespace: geo-workflows
  labels:
    k8s-app: wdpa-overlap-1000-plan
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: wdpa-overlap-1000-plan
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: plan
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 /opt/script/hex_overlap.py plan \
            --source s3://public-wdpa/wdpa.parquet \
            --plan-out s3://public-wdpa/wdpa/staging-1000/full/plan.parquet --target-cells 8000000
        volumeMounts:
        - {name: script, mountPath: /opt/script, readOnly: true}
        resources:
          requests: {cpu: '4', memory: 20Gi, ephemeral-storage: 30Gi}
          limits: {cpu: '4', memory: 20Gi, ephemeral-storage: 30Gi}
      volumes:
      - name: script
        configMap: {name: wdpa-overlap-1000-script}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
