# HAND-ROLLED: cng-datasets polyfills polygons by cell centre only and has no
# per-cell coverage fraction, so the 'overlap' + cover_frac hex is built by
# hex_overlap.py in this directory (#1000; tool feature request datasets#363).
#
# PHASE 2: approved by Carl on 2026-11-21, option (a) (#1000, comment 7053766663).
# Validates the repartitioned full hex in staging (validate_full.py): every
# parcel present, cover_frac in (0, 1], no NULLs or duplicate (parcel, h9),
# schema = published hex + cover_frac, area per decade of GIS_AREA. Writes
# per-feature.parquet under staging-1000/full-r4/validation/.
apiVersion: batch/v1
kind: Job
metadata:
  name: wdpa-overlap-1000-validate-r6
  namespace: geo-workflows
  labels:
    k8s-app: wdpa-overlap-1000-validate-r6
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: wdpa-overlap-1000-validate-r6
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: plan
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: CNG_POD_CPU, value: '8'}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          mkdir -p /tmp/duckdb_tmp
          python3 /opt/script/validate_full.py --source s3://public-wdpa/wdpa.parquet \
            --hex 's3://public-wdpa/wdpa/staging-1000/full-r4/hex/h0=*/data_0.parquet' \
            --reference 's3://public-wdpa/wdpa/hex/h0=*/data_0.parquet' \
            --out s3://public-wdpa/wdpa/staging-1000/full-r4/validation
        volumeMounts:
        - {name: script, mountPath: /opt/script, readOnly: true}
        resources:
          requests: {cpu: '8', memory: 32Gi, ephemeral-storage: 60Gi}
          limits: {cpu: '8', memory: 32Gi, ephemeral-storage: 60Gi}
      volumes:
      - name: script
        configMap: {name: wdpa-overlap-1000-script}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
