# HAND-ROLLED: cng-datasets polyfills polygons by cell centre only and has no
# per-cell coverage fraction, so the 'overlap' + cover_frac hex is built by
# hex_overlap.py in this directory (#1000; tool feature request drafted there).
#
# PHASE 2, NOT YET RUN: apply only after Carl approves the full-run cost in #1000.
# Full repartition into the published path, attributes joined from
# wdpa.parquet, completeness checked against every parcel (no skip).
# Replaces the centre-mode hex at wdpa/hex/; the STAC hex asset must be
# updated in the same change (cover_frac column, h3 notes).
apiVersion: batch/v1
kind: Job
metadata:
  name: wdpa-overlap-1000-repartition
  namespace: geo-workflows
  labels:
    k8s-app: wdpa-overlap-1000-repartition
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: wdpa-overlap-1000-repartition
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: plan
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: CNG_POD_CPU, value: '4'}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          cng-datasets repartition \
            --chunks-dir s3://public-wdpa/wdpa/staging-1000/full/chunks \
            --output-dir s3://public-wdpa/wdpa/hex \
            --source-parquet s3://public-wdpa/wdpa.parquet --memory-limit 12GiB
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        resources:
          requests: {cpu: '4', memory: 16Gi, ephemeral-storage: 30Gi}
          limits: {cpu: '4', memory: 16Gi, ephemeral-storage: 30Gi}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
