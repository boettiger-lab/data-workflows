# HAND-ROLLED: the generator does not write STAC. Metadata-only fixes (#940 items 2 and 4):
# WDPA and wetlands-ramsar each name the other as a source of Ramsar sites, and the wdpa-parquet
# asset states the CRS its GeoParquet metadata actually declares (EPSG:4326). fix_940.py
# (committed beside this file) edits each LIVE collection, so nothing else on it is touched.
#   kubectl create configmap wdpa-940-script -n geo-workflows \
#     --from-file=fix_940.py=catalog/wdpa/k8s/stac-940/fix_940.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/wdpa/k8s/stac-940/wdpa-ramsar-crs-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: wdpa-ramsar-crs-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: wdpa-ramsar-crs-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: wdpa-ramsar-crs-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }

          for pair in wdpa=nrp:public-wdpa/wdpa/stac-collection.json ramsar=nrp:public-wetlands/ramsar/stac-collection.json; do
            which=${pair%%=*}; C=${pair#*=}
            rclone cat "$C" > /tmp/c.json
            python3 /script/fix_940.py "$which" /tmp/c.json
            guard_stac /tmp/c.json "$C"
            rclone copyto /tmp/c.json "$C" $R
          done
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: wdpa-940-script}}
