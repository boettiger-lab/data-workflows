# HAND-ROLLED: a measurement for #1010, not a dataset build; cng-datasets has no step for it.
# Splits the WDPA parcels into 10-degree tiles (with a 0.2 degree margin) for edge-run.yaml:
#   s3://public-wdpa/wdpa/staging-1010/tiles/tile=K/*.parquet
#
#   kubectl create configmap wdpa-edge-1010-script -n geo-workflows \
#     --from-file=edge_tests.py=catalog/wdpa/k8s/edge-tests-1010/edge_tests.py \
#     --from-file=tiles.txt=catalog/wdpa/k8s/edge-tests-1010/tiles.txt \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f catalog/wdpa/k8s/edge-tests-1010/edge-prep.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: wdpa-edge-1010-prep
  namespace: geo-workflows
  labels: {k8s-app: wdpa-edge-1010-prep}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {k8s-app: wdpa-edge-1010-prep}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 5400
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: prep
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests: {cpu: '4', memory: 16Gi, ephemeral-storage: 40Gi}
          limits:   {cpu: '4', memory: 16Gi, ephemeral-storage: 40Gi}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20"
          mkdir -p /work/out/.tmp
          rclone copy nrp:public-wdpa/wdpa.parquet /work/ $R
          python /scripts/edge_tests.py prep /work/wdpa.parquet /work/out
          rclone copy /work/out/tiles nrp:public-wdpa/wdpa/staging-1010/tiles $R --transfers 32
          echo Done.
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: scripts, mountPath: /scripts, readOnly: true}
        - {name: work, mountPath: /work}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: scripts, configMap: {name: wdpa-edge-1010-script}}
      - {name: work, emptyDir: {sizeLimit: 40Gi}}
