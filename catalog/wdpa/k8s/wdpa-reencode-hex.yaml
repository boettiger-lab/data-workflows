apiVersion: batch/v1
kind: Job
metadata:
  name: wdpa-reencode-hex
  namespace: biodiversity
  labels:
    k8s-app: wdpa-reencode-hex
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: wdpa-reencode-hex
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      containers:
      - name: reencode
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 32Gi
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |-
          set -e
          echo "=== Re-encoding wdpa-reencode-hex: VARCHAR H3 -> UBIGINT ==="

          python3 - <<'PYEOF'
          import duckdb, os
          
          con = duckdb.connect()
          con.execute("INSTALL h3 FROM community; LOAD h3")
          con.execute("INSTALL httpfs; LOAD httpfs")
          con.execute("SET http_retries=10; SET http_retry_wait_ms=3000")
          con.execute("SET memory_limit='30GB'; SET preserve_insertion_order=false")
          
          endpoint = os.environ.get("AWS_S3_ENDPOINT", "rook-ceph-rgw-nautiluss3.rook")
          key = os.environ["AWS_ACCESS_KEY_ID"]
          secret = os.environ["AWS_SECRET_ACCESS_KEY"]
          
          con.execute(f"""
              CREATE SECRET s3_secret (
                  TYPE S3, KEY_ID '{key}', SECRET '{secret}',
                  ENDPOINT '{endpoint}', URL_STYLE 'path', USE_SSL false
              )
          """)
          
          print("Converting...")
          con.execute("""
              COPY (
                  SELECT * EXCLUDE (h8, h0), h3_string_to_h3(h8) AS h8, h3_string_to_h3(h0) AS h0
                  FROM read_parquet('s3://public-wdpa/wdpa-december-2025/hex/**/*.parquet', hive_partitioning=true)
              ) TO 's3://public-wdpa/wdpa-december-2025/hex-new/'
              (FORMAT PARQUET, COMPRESSION ZSTD, PARTITION_BY (h0), OVERWRITE_OR_IGNORE true)
          """)
          print("Done.")
          PYEOF

          N=$(rclone ls nrp:public-wdpa/wdpa-december-2025/hex-new/ | wc -l)
          echo "  ${N} files in output"
          if [ "$N" -lt 1 ]; then echo "ERROR: no output files"; exit 1; fi

          SRC_DIR=$(echo "s3://public-wdpa/wdpa-december-2025/hex/**/*.parquet" | sed 's|/\*\*.*||')
          SRC_RCLONE=$(echo "$SRC_DIR" | sed 's|s3://|nrp:|')
          echo "Swapping $SRC_RCLONE -> ${SRC_RCLONE}/ ..."
          rclone delete "$SRC_RCLONE/"
          rclone move nrp:public-wdpa/wdpa-december-2025/hex-new/ "${SRC_RCLONE}/"
          echo "=== Complete ==="
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
