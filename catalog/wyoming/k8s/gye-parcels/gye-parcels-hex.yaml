apiVersion: batch/v1
kind: Job
metadata:
  name: gye-parcels-hex
  labels:
    k8s-app: gye-parcels-hex
spec:
  completions: 6
  parallelism: 6
  completionMode: Indexed
  backoffLimit: 0
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: gye-parcels-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: private-wyoming-rw
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: private-wyoming-rw
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: minio.carlboettiger.info
        - name: AWS_PUBLIC_ENDPOINT
          value: minio.carlboettiger.info
        - name: AWS_HTTPS
          value: 'true'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: private-wyoming
        - name: DATASET
          value: gye-parcels
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector --input s3://private-wyoming/gye-parcels/gye-parcels.parquet --output s3://private-wyoming/gye-parcels/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 1000 --intermediate-chunk-size 10 --resolution 10 --parent-resolutions 9,8,0
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 10Gi
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
