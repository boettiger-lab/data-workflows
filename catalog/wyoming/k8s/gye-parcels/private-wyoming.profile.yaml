# HAND-ROLLED: a cluster profile is input to the generator (--profile), which never emits one (#985).
# Cluster profile: private office store (RustFS, s3.carlboettiger.info), bucket-scoped write creds.
#
# Retargets the standard `cng-datasets workflow` generator at a PRIVATE bucket on the office
# RustFS store (it replaced MinIO on 2026-11-18, #985) instead of NRP. Pass with
# `--profile catalog/wyoming/k8s/gye-parcels/private-wyoming.profile.yaml`.
#
# ---------------------------------------------------------------------------
# PREREQUISITE SECRETS — minted by Carl by hand with the rustfs CLI `rc`, NOT in git.
# No privileged storage credential is kept on the cluster; mint scoped, run, revoke.
#
#   # 1) Least-privilege service account scoped to ONLY this bucket. Policy: Get/List/Put on
#   #    private-wyoming and private-wyoming/* (glen-ops k8s/rustfs-private-wallacea-readwrite-
#   #    policy.json with the bucket swapped; keep s3:DeleteObject only if the job overwrites).
#   #    Admin alias registered with `rc alias import`, never `rc alias set`.
#   AK=$(openssl rand -hex 10); SK=$(openssl rand -hex 20)
#   rc admin service-account create <admin-alias> "$AK" "$SK" --user wyoming-publish \
#     --policy <policy.json> --expiry <ISO-8601>
#
#   # 2) S3 secret (standard AWS_* key names the YAMLs reference):
#   kubectl -n biodiversity create secret generic private-wyoming-rw \
#     --from-literal=AWS_ACCESS_KEY_ID="$AK" --from-literal=AWS_SECRET_ACCESS_KEY="$SK"
#
#   # 3) rclone secret — remote name MUST be [nrp] (the generated YAMLs use `nrp:`):
#   printf '[nrp]\ntype = s3\nprovider = Other\naccess_key_id = %s\nsecret_access_key = %s\nendpoint = https://s3.carlboettiger.info\nforce_path_style = true\n' "$AK" "$SK" > /tmp/rc.conf
#   kubectl -n biodiversity create secret generic rclone-config-private-wyoming-rw --from-file=rclone.conf=/tmp/rc.conf
#
#   # 4) After the run, revoke (expiry enforcement on this store is untested, so do not rely
#   #    on it) and check the key now fails:
#   rc admin service-account rm <admin-alias> "$AK"
#   kubectl -n biodiversity delete secret private-wyoming-rw rclone-config-private-wyoming-rw
#
# ---------------------------------------------------------------------------
# DIVERGENCES from the standard NRP recipe (already baked into the sibling step YAMLs):
#   - AWS_HTTPS: 'true'             (the office store is https-only; NRP internal is http)
#   - NO setup-bucket step          (it sets public-read + CORS — never on a PRIVATE bucket)
#   - convert localizes the raw via rclone first, then converts from disk
#       (GDAL/ST_Read cannot open s3:// on the office store — there is no anon https path)
#   - pmtiles reads the parquet via /vsis3 (authenticated), not anon /vsicurl
#   - parquet + pmtiles land under gye-parcels/ (matches the app's STAC/configmap paths)
#
# RUN ORDER (apply step YAMLs directly; there is no orchestrator for the private path):
#   kubectl -n biodiversity apply -f gye-parcels-convert.yaml      # wait for Complete
#   kubectl -n biodiversity apply -f gye-parcels-hex.yaml \
#                                 -f gye-parcels-pmtiles.yaml      # parallel; wait for hex
#   kubectl -n biodiversity apply -f gye-parcels-repartition.yaml  # merges chunks -> hex/
# ---------------------------------------------------------------------------
name: private-wyoming-office
s3_endpoint: s3.carlboettiger.info
s3_public_endpoint: s3.carlboettiger.info
s3_secret_name: private-wyoming-rw
rclone_secret_name: rclone-config-private-wyoming-rw
rclone_remote: nrp
priority_class: opportunistic
node_affinity: gpu-avoid
