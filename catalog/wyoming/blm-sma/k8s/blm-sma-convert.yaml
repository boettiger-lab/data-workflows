apiVersion: batch/v1
kind: Job
metadata:
  name: blm-sma-convert
  labels:
    k8s-app: blm-sma-convert
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: blm-sma-convert
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: convert-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-wyoming
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          
          # Download and extract the GDB
          echo "Downloading GDB from S3..."
          mkdir -p /tmp/gdb && cd /tmp/gdb
          rclone copy nrp:public-wyoming/raw/SMA_WM.gdb.zip . -P
          
          echo "Unzipping..."
          unzip -q -o SMA_WM.gdb.zip
          
          # Get list of all layers (excluding the aggregated SurfaceManagementAgency)
          LAYERS=$(ogrinfo SMA_WM.gdb -summary | grep "^Layer:" | grep -v "SurfaceManagementAgency" | sed 's/Layer: //' | sed 's/ .*//' | tr '\n' ' ')
          
          echo "Found layers: $LAYERS"
          
          # Merge all agency-specific layers into one using ogr2ogr
          echo "Merging all layers into a single dataset..."
          ogr2ogr -f OpenFileGDB -t_srs EPSG:4326 -nln surface_management_agency /tmp/merged.gdb SMA_WM.gdb $LAYERS
          
          # Convert merged GDB to GeoParquet
          echo "Converting to GeoParquet..."
          cng-convert-to-parquet /tmp/merged.gdb s3://public-wyoming/blm-sma.parquet \
            --compression ZSTD --compression-level 15 --row-group-size 100000
          
          echo "Complete"
        resources:
          requests:
            cpu: '8'
            memory: 32Gi
          limits:
            cpu: '8'
            memory: 32Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config