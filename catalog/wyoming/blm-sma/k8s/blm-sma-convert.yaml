apiVersion: batch/v1
kind: Job
metadata:
  name: blm-sma-convert
  labels:
    k8s-app: blm-sma-convert
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: blm-sma-convert
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: convert-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_id
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-wyoming
        - name: TMPDIR
          value: /tmp
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          echo "Downloading GDB from S3..."
          rclone copy nrp:public-wyoming/raw/SMA_WM.gdb.zip /tmp/
          
          echo "Unzipping GDB..."
          cd /tmp && unzip -q SMA_WM.gdb.zip
          
          echo "Merging all layers and filtering PVT/UND parcels..."
          # Use ogr2ogr to merge all layers and filter
          ogr2ogr -f GeoJSONSeq /tmp/blm-sma-merged.geojsonl \
            /tmp/SMA_WM.gdb \
            -sql "SELECT * FROM SurfaceManagementAgency UNION ALL SELECT * FROM SurfaceMgtAgy_DOD UNION ALL SELECT * FROM SurfaceMgtAgy_BLM UNION ALL SELECT * FROM SurfaceMgtAgy_USFS UNION ALL SELECT * FROM SurfaceMgtAgy_FWS UNION ALL SELECT * FROM SurfaceMgtAgy_BOR UNION ALL SELECT * FROM SurfaceMgtAgy_BIA UNION ALL SELECT * FROM SurfaceMgtAgy_OTHFED UNION ALL SELECT * FROM SurfaceMgtAgy_STATE UNION ALL SELECT * FROM SurfaceMgtAgy_LOCAL UNION ALL SELECT * FROM SurfaceMgtAgy_PRIUNK UNION ALL SELECT * FROM SurfaceMgtAgy_NTVALL UNION ALL SELECT * FROM SurfaceMgtAgy_NTVPIC" \
            -where "ADMIN_DEPT_CODE NOT IN ('PVT', 'UND')" \
            -progress
          
          echo "Converting to GeoParquet..."
          cng-convert-to-parquet \
            /tmp/blm-sma-merged.geojsonl \
            s3://public-wyoming/blm-sma.parquet \
            --compression ZSTD \
            --compression-level 15 \
            --row-group-size 100000
          
          echo "Upload parquet to S3..."
          # Already uploaded by cng-convert-to-parquet
          
          echo "Convert complete!"
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
          limits:
            cpu: '4'
            memory: 16Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
