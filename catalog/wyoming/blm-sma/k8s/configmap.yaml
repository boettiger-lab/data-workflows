# Auto-generated ConfigMap containing job definitions
# Generated for: blm-sma workflow
# To update: regenerate workflow with cng-datasets and re-apply with kubectl apply -f configmap.yaml
apiVersion: v1
data:
  blm-sma-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: blm-sma-setup-bucket
      labels:
        k8s-app: blm-sma-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: blm-sma-setup-bucket
        spec:
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-wyoming
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Setting up bucket with public access and CORS..."
              cng-datasets storage setup-bucket \
                --bucket "${BUCKET}" \
                --remote nrp \
                --verify
              echo "Bucket setup complete!"
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
  blm-sma-convert.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: blm-sma-convert
      labels:
        k8s-app: blm-sma-convert
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: blm-sma-convert
        spec:
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
          restartPolicy: Never
          containers:
          - name: convert-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-wyoming
            - name: TMPDIR
              value: /tmp
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Downloading GDB from S3..."
              rclone copy nrp:public-wyoming/raw/SMA_WM.gdb.zip /tmp/
              cd /tmp && unzip -q SMA_WM.gdb.zip
              echo "Merging all layers and filtering PVT/UND parcels..."
              ogr2ogr -f GeoJSONSeq /tmp/blm-sma-merged.geojsonl \
                /tmp/SMA_WM.gdb \
                -sql "SELECT * FROM SurfaceManagementAgency UNION ALL SELECT * FROM SurfaceMgtAgy_DOD UNION ALL SELECT * FROM SurfaceMgtAgy_BLM UNION ALL SELECT * FROM SurfaceMgtAgy_USFS UNION ALL SELECT * FROM SurfaceMgtAgy_FWS UNION ALL SELECT * FROM SurfaceMgtAgy_BOR UNION ALL SELECT * FROM SurfaceMgtAgy_BIA UNION ALL SELECT * FROM SurfaceMgtAgy_OTHFED UNION ALL SELECT * FROM SurfaceMgtAgy_STATE UNION ALL SELECT * FROM SurfaceMgtAgy_LOCAL UNION ALL SELECT * FROM SurfaceMgtAgy_PRIUNK UNION ALL SELECT * FROM SurfaceMgtAgy_NTVALL UNION ALL SELECT * FROM SurfaceMgtAgy_NTVPIC" \
                -where "ADMIN_DEPT_CODE NOT IN ('PVT', 'UND')" \
                -progress
              echo "Converting to GeoParquet..."
              cng-convert-to-parquet \
                /tmp/blm-sma-merged.geojsonl \
                s3://public-wyoming/blm-sma.parquet \
                --compression ZSTD \
                --compression-level 15 \
                --row-group-size 100000
              echo "Convert complete!"
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
              limits:
                cpu: '4'
                memory: 16Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
  blm-sma-pmtiles.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: blm-sma-pmtiles
      labels:
        k8s-app: blm-sma-pmtiles
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: blm-sma-pmtiles
        spec:
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
          restartPolicy: Never
          containers:
          - name: pmtiles-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-wyoming
            - name: DATASET
              value: blm-sma
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Converting GeoParquet to GeoJSON for PMTiles..."
              ogr2ogr -wrapdateline -datelineoffset 15 -f GeoJSONSeq /tmp/blm-sma.geojsonl \
                /vsicurl/https://s3-west.nrp-nautilus.io/public-wyoming/blm-sma.parquet \
                -progress
              echo "Generating PMTiles..."
              tippecanoe -o /tmp/blm-sma.pmtiles -l blm-sma --drop-densest-as-needed --extend-zooms-if-still-dropping --force /tmp/blm-sma.geojsonl
              echo "Uploading PMTiles to S3..."
              rclone copy /tmp/blm-sma.pmtiles nrp:public-wyoming/
              rm /tmp/blm-sma.geojsonl /tmp/blm-sma.pmtiles
              echo "PMTiles generation complete!"
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
              limits:
                cpu: '4'
                memory: 16Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
  blm-sma-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: blm-sma-hex
      labels:
        k8s-app: blm-sma-hex
    spec:
      completions: 200
      parallelism: 50
      completionMode: Indexed
      backoffLimit: 0
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: blm-sma-hex
        spec:
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: TMPDIR
              value: /tmp
            - name: BUCKET
              value: public-wyoming
            - name: DATASET
              value: blm-sma
            command:
            - bash
            - -c
            - |
              set -e
              cng-datasets vector \
                --input s3://public-wyoming/blm-sma.parquet \
                --output s3://public-wyoming/blm-sma/chunks \
                --chunk-id ${JOB_COMPLETION_INDEX} \
                --chunk-size 1 \
                --intermediate-chunk-size 10 \
                --resolution 10 \
                --parent-resolutions 9,8,0
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
              limits:
                cpu: '4'
                memory: 32Gi
