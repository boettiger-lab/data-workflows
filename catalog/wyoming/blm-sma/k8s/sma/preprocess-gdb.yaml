apiVersion: batch/v1
kind: Job
metadata:
  name: blm-sma-preprocess
  namespace: biodiversity
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: preprocess
        image: ghcr.io/boettiger-lab/datasets:latest
        resources:
          requests:
            memory: "32Gi"
            cpu: "8"
          limits:
            memory: "32Gi"
            cpu: "8"
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: "rook-ceph-rgw-nautiluss3.rook"
        - name: AWS_VIRTUAL_HOSTING
          value: "FALSE"
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          echo "Downloading GDB from S3..."
          mkdir -p /tmp/gdb && cd /tmp/gdb
          rclone copy nrp:public-wyoming/raw/SMA_WM.gdb.zip . -P
          echo "Unzipping..."
          unzip -q -o SMA_WM.gdb.zip
          echo "Inspecting GDB layers..."
          ogrinfo SMA_WM.gdb
          echo "Converting GDB to GeoParquet..."
          cng-convert-to-parquet /tmp/gdb/SMA_WM.gdb s3://public-wyoming/blm-sma.parquet --compression ZSTD --compression-level 15 --row-group-size 100000
          echo "Complete"
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config