apiVersion: batch/v1
kind: Job
metadata:
  name: sagebrush-convert-to-cog
  labels:
    k8s-app: sagebrush-convert-to-cog
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: sagebrush-convert-to-cog
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: convert-to-cog
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-wyoming
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          
          # Create temp directory
          mkdir -p /tmp/sagebrush
          cd /tmp/sagebrush
          
          # Download the sagebrush.tif from S3
          echo "Downloading sagebrush.tif from S3..."
          rclone copy nrp:public-wyoming/raw/sagebrush.tif /tmp/sagebrush/ -P
          
          # Convert to COG using GDAL
          echo "Converting to COG..."
          gdal_translate \
            -of COG \
            -co COMPRESS=DEFLATE \
            -co PREDICTOR=2 \
            -co BLOCKSIZE=512 \
            -co OVERVIEWS=IGNORE_EXISTING \
            sagebrush.tif \
            /tmp/sagebrush-cog.tif
          
          # Upload to S3
          echo "Uploading COG to S3..."
          rclone copy /tmp/sagebrush-cog.tif nrp:public-wyoming/sagebrush-cog.tif -P
          
          echo "✓ COG conversion complete"
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
          limits:
            cpu: '4'
            memory: 16Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config