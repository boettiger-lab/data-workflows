apiVersion: batch/v1
kind: Job
metadata:
  name: nlcd-2024-download-unzip
  labels:
    k8s-app: nlcd-2024-download-unzip
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: nlcd-2024-download-unzip
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: download-unzip
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-wyoming
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          
          # Create temp directory
          mkdir -p /tmp/nlcd
          cd /tmp/nlcd
          
          # Download the raw NLCD file from S3
          echo "Downloading NLCD 2024 from S3..."
          rclone copy nrp:public-wyoming/raw/Annual_NLCD_LndCov_2024_CU_C1V1.zip /tmp/nlcd/ -P
          
          # Unzip the file
          echo "Unzipping..."
          unzip -q -o Annual_NLCD_LndCov_2024_CU_C1V1.zip
          
          # List contents to find the raster file
          echo "Contents:"
          ls -la
          
          echo "✓ Download and unzip complete"
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
          limits:
            cpu: '2'
            memory: 8Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config