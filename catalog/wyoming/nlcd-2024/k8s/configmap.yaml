# Auto-generated ConfigMap containing job definitions
# Generated for NLCD 2024 raster processing
#
# This ConfigMap contains:
#   - nlcd-2024-download-unzip.yaml
#   - nlcd-2024-convert-to-cog.yaml
#   - nlcd-2024-clip-to-wyoming.yaml
#
# To apply: kubectl apply -f configmap.yaml -n biodiversity
# To update: edit the individual job YAMLs and regenerate this configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: nlcd-2024-yamls
  namespace: biodiversity
data:
  nlcd-2024-download-unzip.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: nlcd-2024-download-unzip
      labels:
        k8s-app: nlcd-2024-download-unzip
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: nlcd-2024-download-unzip
        spec:
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
          restartPolicy: Never
          containers:
          - name: download-unzip
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-wyoming
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              
              # Create temp directory
              mkdir -p /tmp/nlcd
              cd /tmp/nlcd
              
              # Download the raw NLCD file from S3
              echo "Downloading NLCD 2024 from S3..."
              rclone copy nrp:public-wyoming/raw/Annual_NLCD_LndCov_2024_CU_C1V1.zip /tmp/nlcd/ -P
              
              # Unzip the file
              echo "Unzipping..."
              unzip -q -o Annual_NLCD_LndCov_2024_CU_C1V1.zip
              
              # List contents to find the raster file
              echo "Contents:"
              ls -la
              
              echo "✓ Download and unzip complete"
            resources:
              requests:
                cpu: '2'
                memory: 8Gi
              limits:
                cpu: '2'
                memory: 8Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
  nlcd-2024-convert-to-cog.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: nlcd-2024-convert-to-cog
      labels:
        k8s-app: nlcd-2024-convert-to-cog
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: nlcd-2024-convert-to-cog
        spec:
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
          restartPolicy: Never
          containers:
          - name: convert-to-cog
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-wyoming
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              
              # Create temp directory
              mkdir -p /tmp/nlcd
              cd /tmp/nlcd
              
              # Download and unzip the raw NLCD file from S3
              echo "Downloading NLCD 2024 from S3..."
              rclone copy nrp:public-wyoming/raw/Annual_NLCD_LndCov_2024_CU_C1V1.zip /tmp/nlcd/ -P
              
              echo "Unzipping..."
              unzip -q -o Annual_NLCD_LndCov_2024_CU_C1V1.zip
              
              # Find the raster file (should be a .img or .tif file)
              echo "Looking for raster file..."
              RASTER_FILE=$(find . -name "*.img" -o -name "*.tif" | head -1)
              echo "Found: $RASTER_FILE"
              
              # Convert to COG using GDAL
              echo "Converting to COG..."
              gdal_translate \
                -of COG \
                -co COMPRESS=DEFLATE \
                -co PREDICTOR=2 \
                -co BLOCKSIZE=512 \
                -co OVERVIEWS=IGNORE_EXISTING \
                "$RASTER_FILE" \
                /tmp/nlcd-2024-cog.tif
              
              # Upload to S3
              echo "Uploading COG to S3..."
              rclone copy /tmp/nlcd-2024-cog.tif nrp:public-wyoming/nlcd-2024-cog.tif -P
              
              echo "✓ COG conversion complete"
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
              limits:
                cpu: '4'
                memory: 16Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
  nlcd-2024-clip-to-wyoming.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: nlcd-2024-clip-to-wyoming
      labels:
        k8s-app: nlcd-2024-clip-to-wyoming
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 1
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: nlcd-2024-clip-to-wyoming
        spec:
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
          restartPolicy: Never
          containers:
          - name: clip-to-wyoming
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-wyoming
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              
              # Create temp directory
              mkdir -p /tmp/nlcd
              cd /tmp/nlcd
              
              # Download the COG from S3
              echo "Downloading COG from S3..."
              rclone copy nrp:public-wyoming/nlcd-2024-cog.tif /tmp/nlcd/ -P
              
              # Wyoming bounding box (WGS84 / EPSG:4326)
              # West: -111.05°, East: -104.05°, South: 41.00°, North: 45.00°
              WEST=-111.05
              EAST=-104.05
              SOUTH=41.00
              NORTH=45.00
              
              echo "Clipping to Wyoming bounding box: $WEST $SOUTH $EAST $NORTH"
              
              # Clip to Wyoming bounding box using gdalwarp
              # First, create a VRT to handle the coordinate transformation
              gdalwarp \
                -t_srs EPSG:4326 \
                -te $WEST $SOUTH $EAST $NORTH \
                -co COMPRESS=DEFLATE \
                -co PREDICTOR=2 \
                -co BLOCKSIZE=512 \
                -co OVERVIEWS=IGNORE_EXISTING \
                /tmp/nlcd/nlcd-2024-cog.tif \
                /tmp/nlcd-2024-wyoming-cog.tif
              
              # Upload to S3
              echo "Uploading clipped COG to S3..."
              rclone copy /tmp/nlcd-2024-wyoming-cog.tif nrp:public-wyoming/nlcd-2024-wyoming-cog.tif -P
              
              echo "✓ Clipping complete"
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
              limits:
                cpu: '4'
                memory: 16Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config