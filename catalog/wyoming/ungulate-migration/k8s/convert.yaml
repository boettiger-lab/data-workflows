apiVersion: batch/v1
kind: Job
metadata:
  name: ungulate-migration-convert
  namespace: biodiversity
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: convert
        image: ghcr.io/boettiger-lab/datasets:latest
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
          limits:
            memory: "16Gi"
            cpu: "4"
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: "rook-ceph-rgw-nautiluss3.rook"
        - name: AWS_VIRTUAL_HOSTING
          value: "FALSE"
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          echo "Converting GeoJSON to GeoParquet..."
          cng-convert-to-parquet /vsicurl/https://s3-west.nrp-nautilus.io/public-wyoming/raw/UngulateMigWestUS_PublicHerds_Polylines_Vol1to5_EPSG4326.geojson s3://public-wyoming/ungulate-migration.parquet --compression ZSTD --compression-level 15 --row-group-size 100000 --verbose
          echo "Converting to PMTiles..."
          cng-datasets vector --input s3://public-wyoming/ungulate-migration.parquet --output s3://public-wyoming/ungulate-migration.pmtiles
          echo "Complete"
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config