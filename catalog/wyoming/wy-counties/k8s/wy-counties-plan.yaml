apiVersion: batch/v1
kind: Job
metadata:
  name: wy-counties-plan
  namespace: geo-workflows
  labels:
    k8s-app: wy-counties-plan
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: wy-counties-plan
    spec:
      restartPolicy: Never
      containers:
      - name: plan-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-wyoming
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector-plan --input s3://public-wyoming/wy-counties.parquet --output s3://public-wyoming/wy-counties/_hex_plan.parquet --resolution 11 --cells-per-chunk 5000000 --max-chunks 23
        terminationMessagePolicy: File
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
          limits:
            cpu: '2'
            memory: 8Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
