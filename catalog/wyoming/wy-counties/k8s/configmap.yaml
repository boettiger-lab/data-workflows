            - |
              set -e
              cng-datasets repartition --chunks-dir s3://public-wyoming/wy-counties/chunks --output-dir s3://public-wyoming/wy-counties/hex --source-parquet s3://public-wyoming/wy-counties.parquet --cleanup
            resources:
              requests:
                cpu: '4'
                memory: 32Gi
              limits:
                cpu: '4'
                memory: 32Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
  wy-counties-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: wy-counties-setup-bucket
      labels:
        k8s-app: wy-counties-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: wy-counties-setup-bucket
        spec:
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-wyoming
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Setting up bucket with public access and CORS..."
              cng-datasets storage setup-bucket \
                --bucket "${BUCKET}" \
                --remote nrp \
                --verify

              echo "Bucket setup complete!"
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
kind: ConfigMap
metadata:
  name: wy-counties-yamls
  namespace: biodiversity
