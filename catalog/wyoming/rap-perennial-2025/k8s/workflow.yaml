apiVersion: batch/v1
kind: Job
metadata:
  name: rap-workflow
  namespace: biodiversity
spec:
  template:
    spec:
      containers:
      - args:
        - |
          set -e
          
          echo "Starting RAP perennial 2025 workflow..."
          
          # Step 1: Convert to COG (extract band 4)
          echo "Step 1: Converting to COG (extracting band 4 - perennial forbs and grasses)..."
          kubectl apply -f /yamls/rap-convert-to-cog.yaml -n biodiversity
          
          echo "Waiting for COG conversion to complete..."
          kubectl wait --for=condition=complete --timeout=3600s job/rap-convert-to-cog -n biodiversity
          
          # Step 2: Clip to Wyoming bounding box
          echo "Step 2: Clipping to Wyoming bounding box..."
          kubectl apply -f /yamls/rap-clip-to-wyoming.yaml -n biodiversity
          
          echo "Waiting for clipping to complete..."
          kubectl wait --for=condition=complete --timeout=3600s job/rap-clip-to-wyoming -n biodiversity
          
          echo "✓ Workflow complete!"
          echo ""
          echo "Output files:"
          echo "  - s3://public-wyoming/rap-v3-2025-band4-perennial-forb-grass-cog.tif (full COG)"
          echo "  - s3://public-wyoming/rap-v3-2025-band4-perennial-forb-grass-wyoming-cog.tif (Wyoming clipped)"
          echo ""
          echo "Clean up with:"
          echo "  kubectl delete jobs rap-convert-to-cog rap-clip-to-wyoming rap-workflow -n biodiversity"
          echo "  kubectl delete configmap rap-yamls -n biodiversity"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: rap-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800