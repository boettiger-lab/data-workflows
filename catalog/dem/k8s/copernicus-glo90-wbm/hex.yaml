apiVersion: batch/v1
kind: Job
metadata:
  name: copernicus-glo90-wbm-hex
  namespace: geo-workflows
  labels:
    k8s-app: copernicus-glo90-wbm-hex
spec:
  completions: 122
  parallelism: 61
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 1
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: copernicus-glo90-wbm-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: BUCKET
          value: public-dem
        - name: CNG_HEX_WORKERS
          value: '4'
        - name: CNG_HEX_CHUNK_SIZE
          value: '100000'
        - name: DUCKDB_MEMORY_LIMIT
          value: 54GiB
        - name: GDAL_CACHEMAX
          value: '512'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |-
          set -e

          cng-datasets raster --input "s3://public-dem/copernicus-glo90/copernicus-glo90-wbm-cog.tif" --output-parquet s3://public-dem/copernicus-glo90/wbm/hex/ --h0-index ${JOB_COMPLETION_INDEX} --resolution 8 --parent-resolutions 0 --value-column wbm_class --hex-resampling fractions --nodata "255"
        resources:
          requests:
            cpu: '4'
            memory: 64Gi
            ephemeral-storage: 50Gi
          limits:
            cpu: '4'
            memory: 64Gi
            ephemeral-storage: 50Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
