  erdmh1chlamday-merge.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: erdmh1chlamday-merge
      namespace: geo-workflows
      labels:
        k8s-app: erdmh1chlamday-merge
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: erdmh1chlamday-merge
        spec:
          restartPolicy: Never
          containers:
          - name: merge-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: GDAL_DATA
              value: /usr/share/gdal
            - name: PYTHONPATH
              value: /usr/lib/python3/dist-packages
            - name: BUCKET
              value: public-coastwatch
            - name: DUCKDB_MEMORY_LIMIT
              value: 13GiB
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e

              cng-datasets merge-chunks \
                --chunks-dir s3://public-coastwatch/erdMH1chlamday/hex-chunks \
                --output-dir s3://public-coastwatch/erdMH1chlamday/hex \
                --expect-chunks 230
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 50Gi
              limits:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 50Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  erdmh1chlamday-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: erdmh1chlamday-setup-bucket
      namespace: geo-workflows
      labels:
        k8s-app: erdmh1chlamday-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: erdmh1chlamday-setup-bucket
        spec:
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-coastwatch
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Setting up bucket with public access and CORS..."
              cng-datasets storage setup-bucket \
                --bucket "${BUCKET}" \
                --remote nrp \
                --verify

              echo "Bucket setup complete!"
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
