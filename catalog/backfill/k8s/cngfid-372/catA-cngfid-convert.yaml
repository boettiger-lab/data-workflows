# ⛔ THIS JOB ORPHANS EVERY HEX BUILT FROM THE FLATS IT TOUCHES. Read before re-running it,
# or before copying it as a template for another backfill.
#
# `cng-convert-to-parquet` synthesizes `_cng_fid` at CONVERSION time, so re-converting a
# published flat renumbers every feature while the hex keeps the old numbering. This job's
# 2026-07-09 run did exactly that to ten flats, and two of them had hexes:
#
#   * high-seas/hydrothermal-vents (13:07) -> data-workflows#574
#   * iucn/iucn-ranges-2025        (13:10) -> data-workflows#577
#
# Neither had any row-count, schema, or coverage symptom. A consumer joining hex->flat on
# `_cng_fid` — the documented universal key — simply got the wrong feature, for 78 days on
# one collection and across a 4-billion-row asset on the other. Only
# `check_hex_fid_matches_flat` (#549) found them, and it did not exist yet at the time.
#
# The repair cost differs enormously depending on whether the flat had been REORDERED first:
#   * not reordered -> a uniform +1 shift, losslessly re-keyable (hydrothermal-vents: minutes)
#   * reordered     -> an unrelated permutation, and since a hex carries no geometry its parts
#                      cannot be matched back to flat rows (iucn: a 22 GiB rewrite plus a
#                      permanent part-level ambiguity — see catalog/iucn/k8s/rekey-577/BUILD.md)
#
# SO, IF YOU RE-RUN OR COPY THIS: for every flat in the PAIRS list, rebuild or re-key its hex
# (and anything else keyed to `_cng_fid`) in the SAME change, and re-run
# `scripts/verify-stac.py` on those collections afterwards. Do not treat a successful convert
# as a finished backfill.
apiVersion: batch/v1
kind: Job
metadata:
  name: cngfid-backfill-cata
  labels:
    k8s-app: cngfid-backfill-cata
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: cngfid-backfill-cata
    spec:
      restartPolicy: Never
      containers:
      - name: convert-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |
          set -e
          # (source, staging) pairs — staging is a sibling; promotion happens after validation.
          PAIRS="
          s3://public-high-seas/seafloor-geomorphology.parquet|s3://public-high-seas/seafloor-geomorphology.cngfid.parquet
          s3://public-high-seas/hydrothermal-vents.parquet|s3://public-high-seas/hydrothermal-vents.cngfid.parquet
          s3://public-iucn/iucn-ranges-2025.parquet|s3://public-iucn/iucn-ranges-2025.cngfid.parquet
          s3://public-ca30x30/fmmp-2022.parquet|s3://public-ca30x30/fmmp-2022.cngfid.parquet
          s3://public-social-vulnerability/2022/SVI2022_US_county.parquet|s3://public-social-vulnerability/2022/SVI2022_US_county.cngfid.parquet
          s3://public-social-vulnerability/2022/SVI2022_US_tract.parquet|s3://public-social-vulnerability/2022/SVI2022_US_tract.cngfid.parquet
          s3://public-social-vulnerability/2022/SVI2022_TRIBAL_TRACTS.parquet|s3://public-social-vulnerability/2022/SVI2022_TRIBAL_TRACTS.cngfid.parquet
          s3://public-wdpa/wdoecm-may-2026/wdoecm-may-2026.parquet|s3://public-wdpa/wdoecm-may-2026/wdoecm-may-2026.cngfid.parquet
          s3://public-trails/federal-trails-2026.parquet|s3://public-trails/federal-trails-2026.cngfid.parquet
          s3://public-overturemaps/2026-02-18.0/regions.parquet|s3://public-overturemaps/2026-02-18.0/regions.cngfid.parquet
          "
          echo "$PAIRS" | while IFS='|' read -r SRC DST; do
            [ -z "$SRC" ] && continue
            echo "==================== $SRC -> $DST ===================="
            cng-convert-to-parquet "$SRC" "$DST" --row-group-size 2000
          done
          echo "ALL CONVERTS DONE"
        resources:
          requests: {cpu: '4', memory: 32Gi}
          limits: {cpu: '4', memory: 32Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
