# data-workflows#578 — publish STAC for the four consumer-facing public-wgfd
# collections and register them as children of the bucket collection.
# Asserts the bucket collection ends with exactly 7 children (3 crucial + 4 here).
#
# The STAC JSON is NOT in this repo (AGENTS.md Hard Boundary 1, #892). The live collections on
# NRP are canonical: pull them, edit, gate, and hand them to the job as the `stac-publish-wgfd2-stac`
# ConfigMap, which the job mounts at /stac:
#
#   mkdir -p /tmp/stac-publish-wgfd2-stac
#   curl -fsS https://s3-west.nrp-nautilus.io/public-wgfd/elk-seasonal/stac-collection.json -o /tmp/stac-publish-wgfd2-stac/elk-seasonal.json
#   curl -fsS https://s3-west.nrp-nautilus.io/public-wgfd/mule-deer-seasonal/stac-collection.json -o /tmp/stac-publish-wgfd2-stac/mule-deer-seasonal.json
#   curl -fsS https://s3-west.nrp-nautilus.io/public-wgfd/pronghorn-seasonal/stac-collection.json -o /tmp/stac-publish-wgfd2-stac/pronghorn-seasonal.json
#   curl -fsS https://s3-west.nrp-nautilus.io/public-wgfd/sage-grouse-priority/stac-collection.json -o /tmp/stac-publish-wgfd2-stac/sage-grouse-priority.json
#   # ...edit...
#   scripts/verify-stac.py --no-data /tmp/stac-publish-wgfd2-stac/*.json     # must be clean
#   kubectl create configmap stac-publish-wgfd2-stac -n geo-workflows \
#     --from-file=/tmp/stac-publish-wgfd2-stac/ --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: stac-publish-wgfd2
  namespace: geo-workflows
data:
  publish.py: "\nimport json, subprocess, sys\nNRP='https://s3-west.nrp-nautilus.io'; B='public-wgfd'\n\
    DS=['elk-seasonal', 'mule-deer-seasonal', 'pronghorn-seasonal', 'sage-grouse-priority']\nPK=f'nrp:{B}/stac-collection.json'\n\
    for ds in DS:\n    doc=json.load(open(f'/config/{ds}.json'))\n    open('/tmp/o.json','w').write(json.dumps(doc,indent=2));\
    \ json.load(open('/tmp/o.json'))\n    subprocess.check_call(['rclone','copyto','/tmp/o.json',f'nrp:{B}/{ds}/stac-collection.json'])\n\
    \    print('published\\t%s' % doc['id'])\n# add each as a child of the bucket collection\nparent=json.loads(subprocess.check_output(['rclone','cat',PK]))\n\
    added=[]\nfor ds in DS:\n    href=f'{NRP}/{B}/{ds}/stac-collection.json'\n    if any(l.get('rel')=='child'\
    \ and l.get('href')==href for l in parent['links']): continue\n    title=json.load(open(f'/config/{ds}.json'))['title']\n\
    \    parent['links'].append({'rel':'child','href':href,'type':'application/json','title':title})\n\
    \    added.append(ds)\nif added:\n    open('/tmp/p.json','w').write(json.dumps(parent,indent=2));\
    \ json.load(open('/tmp/p.json'))\n    subprocess.check_call(['rclone','copyto','/tmp/p.json',PK])\n\
    back=json.loads(subprocess.check_output(['rclone','cat',PK]))\nn=sum(1 for l in back['links'] if l.get('rel')=='child')\n\
    print('parent\\tchildren=%d\\tadded=%s' % (n, ','.join(added) or 'none'))\nif n!=7: print('FAIL: expected\
    \ 7 children, got %d'%n); sys.exit(1)\nprint('done')\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stac-publish-wgfd2
  namespace: geo-workflows
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        env:
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: cfg
          mountPath: /config
          readOnly: true
        - name: stac
          mountPath: /stac
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          # stac-publish-guard.py (#890): guard copies of the ConfigMap's collections against the live
          # ones, then run publish.py on the guarded copies. Exits if the guard refuses.
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs
          mkdir -p /tmp/config && cp -L /config/* /stac/*.json /tmp/config/
          guard_stac() {
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "/tmp/config/$1" /tmp/stac-guard/live.json
          }
          guard_stac elk-seasonal.json nrp:public-wgfd/elk-seasonal/stac-collection.json
          guard_stac mule-deer-seasonal.json nrp:public-wgfd/mule-deer-seasonal/stac-collection.json
          guard_stac pronghorn-seasonal.json nrp:public-wgfd/pronghorn-seasonal/stac-collection.json
          guard_stac sage-grouse-priority.json nrp:public-wgfd/sage-grouse-priority/stac-collection.json
          set +e
          sed 's|/config/|/tmp/config/|g' /config/publish.py > /tmp/publish.py
          python3 /tmp/publish.py
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 1Gi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 1Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: cfg
        configMap:
          name: stac-publish-wgfd2
      - name: stac
        configMap:
          name: stac-publish-wgfd2-stac
