apiVersion: batch/v1
kind: Job
metadata:
  name: fdap-2025b-cocoa-peru-2024-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\necho \"Starting fdap-2025b-cocoa-peru-2024 raster workflow...\"\
          \n\n# Step 0: Setup bucket\necho \"Step 0: Setting up bucket...\"\nkubectl\
          \ apply -f /yamls/fdap-2025b-cocoa-peru-2024-setup-bucket.yaml -n geo-workflows\n\
          kubectl wait --for=condition=complete --timeout=600s job/fdap-2025b-cocoa-peru-2024-setup-bucket\
          \ -n geo-workflows\n\n# Step 1: H3 hexagonal tiling\necho \"Step 1: H3 hexagonal\
          \ tiling...\"\nkubectl apply -f /yamls/fdap-2025b-cocoa-peru-2024-hex.yaml\
          \ -n geo-workflows\nkubectl wait --for=condition=complete --timeout=7200s\
          \ job/fdap-2025b-cocoa-peru-2024-hex -n geo-workflows\n\necho \"\u2713 Workflow\
          \ complete!\"\necho \"Clean up with:\"\necho \"  kubectl delete jobs fdap-2025b-cocoa-peru-2024-setup-bucket\
          \ fdap-2025b-cocoa-peru-2024-hex fdap-2025b-cocoa-peru-2024-workflow -n\
          \ geo-workflows\"\necho \"  kubectl delete configmap fdap-2025b-cocoa-peru-2024-yamls\
          \ -n geo-workflows\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: fdap-2025b-cocoa-peru-2024-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
