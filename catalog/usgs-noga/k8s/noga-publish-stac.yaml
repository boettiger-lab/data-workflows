# Publish the NOGA Assessment Units STAC + README (issue #700). STAC and README are
# canonical on NRP S3 and never committed to this repo, so they are generated locally
# by catalog/usgs-noga/make-stac.py, verified with scripts/verify-stac.py --no-data,
# and uploaded from a ConfigMap by this job. The job reads the live bucket STAC and README,
# adds this collection's child link if missing, and replaces or appends its own README section.
#
#   kubectl -n geo-workflows create configmap noga-stac \
#     --from-file=stac-collection.json=/tmp/stac-collection.json \
#     --from-file=README.md=/tmp/README.md \
#     --from-file=bucket-section.md=/tmp/bucket-section.md \
#     -o yaml --dry-run=client | kubectl apply -n geo-workflows -f -
#   kubectl apply -n geo-workflows -f catalog/usgs-noga/k8s/noga-publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: noga-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: noga-publish-stac}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {k8s-app: noga-publish-stac}
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: upload
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: stac, mountPath: /stac, readOnly: true}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          keep_styles() {  # #881: replacing a live collection must not drop its default style assets or renders
            case "$2" in *.json) ;; *) return 0 ;; esac
            mkdir -p /tmp/keep-styles
            rclone cat "$2" > /tmp/keep-styles/live.json 2>/dev/null || return 0
            python3 -c '
          import json, sys
          try:
              new = json.load(open(sys.argv[1])); live = json.load(open(sys.argv[2]))
          except Exception:
              sys.exit(0)
          kept = {k: a for k, a in live.get("assets", {}).items()
                  if "style" in (a.get("roles") or []) and k not in new.setdefault("assets", {})}
          new["assets"].update(kept)
          renders = {k: v for k, v in live.get("renders", {}).items() if k not in new.get("renders", {})}
          if renders:
              new.setdefault("renders", {}).update(renders)
          for e in live.get("stac_extensions", []):
              if "/render/" in e and e not in new.setdefault("stac_extensions", []):
                  new["stac_extensions"].append(e)
          if kept or renders:
              json.dump(new, open(sys.argv[1], "w"), indent=2)
              print(f"  kept {len(kept)} style asset(s) and {len(renders)} render(s) from the live collection")
          ' "$1" /tmp/keep-styles/live.json
          }
          # ConfigMap keys mount as symlinks (key -> ..data/key) and rclone copyto does
          # not follow a symlink source, so dereference through cat first.
          publish() {
            cat "/stac/$1" > "/tmp/$1"
            case "$1" in *.json) python3 -c "import json,sys; json.load(open('/tmp/$1'))";; esac
            keep_styles "/tmp/$1" "nrp:$2"
            rclone copyto "/tmp/$1" "nrp:$2"
            echo "uploaded $2"
          }
          publish stac-collection.json public-usgs/noga-assessment-units/stac-collection.json
          publish README.md            public-usgs/noga-assessment-units/README.md
          rclone copyto nrp:public-usgs/stac-collection.json /tmp/parent.json
          rclone copyto nrp:public-usgs/README.md /tmp/bucket-README.md
          cat /stac/bucket-section.md > /tmp/bucket-section.md
          python3 - <<'PY'
          import json
          child = json.load(open("/tmp/stac-collection.json"))
          href = next(l["href"] for l in child["links"] if l["rel"] == "self")
          p = json.load(open("/tmp/parent.json"))
          if any(l.get("href") == href for l in p["links"]):
              print("child link already present")
          else:
              p["links"].append({"rel": "child", "href": href, "type": "application/json",
                                 "title": child["title"]})
              json.dump(p, open("/tmp/parent.json", "w"), indent=1)
              print("child link added")
          readme = open("/tmp/bucket-README.md").read()
          section = open("/tmp/bucket-section.md").read()
          start = readme.find("\n" + section.splitlines()[0] + "\n")
          if start < 0:
              readme = readme.rstrip("\n") + "\n\n---\n\n" + section
              print("bucket README section added")
          else:
              end = readme.find("\n---\n", start + 1)
              end = len(readme) if end < 0 else end
              readme = readme[:start + 1] + section + readme[end:]
              print("bucket README section replaced")
          open("/tmp/bucket-README.md", "w").write(readme)
          PY
          keep_styles /tmp/parent.json nrp:public-usgs/stac-collection.json
          rclone copyto /tmp/parent.json nrp:public-usgs/stac-collection.json
          rclone copyto /tmp/bucket-README.md nrp:public-usgs/README.md
          echo done
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: stac, configMap: {name: noga-stac}}
