apiVersion: batch/v1
kind: Job
metadata:
  name: noga-assessment-units-hex
  namespace: geo-workflows
  labels:
    k8s-app: noga-assessment-units-hex
spec:
  # Hand-tuned (issue #700). cng-datasets floors chunk_size at 1000 for small
  # datasets, which would hex all 240 assessment units in one pod. AU footprints
  # run from a single field to 366,000 km2, about 12M H3 resolution 8 cells in
  # total, so the work is split 4 units per pod.
  completions: 60
  parallelism: 50
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 1
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: noga-assessment-units-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-usgs
        - name: DATASET
          value: noga-assessment-units
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector --input s3://public-usgs/noga-assessment-units.parquet --output s3://public-usgs/noga-assessment-units/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 4 --intermediate-chunk-size 10 --resolution 8 --parent-resolutions 0
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 32Gi
            ephemeral-storage: 10Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
