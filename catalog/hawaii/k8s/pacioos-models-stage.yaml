  parallelism: 4
  completionMode: Indexed
  backoffLimitPerIndex: 4
  maxFailedIndexes: 20
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
  template:
