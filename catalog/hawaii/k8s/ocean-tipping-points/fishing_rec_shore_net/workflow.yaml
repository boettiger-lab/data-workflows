apiVersion: batch/v1
kind: Job
metadata:
  name: ocean-tipping-points-fishing-rec-shore-net-workflow
  namespace: geo-workflows
spec:
  template:
    spec:
      containers:
      - args:
        - "set -e\n\nwait_job() {\n  local job=\"$1\" ns=\"$2\" timeout=\"$3\" waited=0\
          \ state\n  echo \"Waiting for $job (up to ${timeout}s)...\"\n  while :;\
          \ do\n    state=$(kubectl get job \"$job\" -n \"$ns\" -o jsonpath='{.status.conditions[?(@.status==\"\
          True\")].type}')\n    case \" $state \" in\n      *\" Complete \"*) echo\
          \ \"\u2713 $job complete\"; return 0 ;;\n      *\" Failed \"*)\n       \
          \ echo \"\u2717 $job failed, so the workflow stops here:\"\n        kubectl\
          \ get job \"$job\" -n \"$ns\" -o jsonpath='{range .status.conditions[*]}\
          \  {.type}: {.reason} {.message}{\"\\n\"}{end}'\n        echo \"  Inspect\
          \ it with: kubectl logs job/$job -n $ns\"\n        exit 1 ;;\n    esac\n\
          \    if [ \"$waited\" -ge \"$timeout\" ]; then\n      echo \"\u2717 $job\
          \ did not finish within ${timeout}s\"\n      exit 1\n    fi\n    sleep 30\n\
          \    waited=$((waited + 30))\n  done\n}\n\necho \"Starting ocean-tipping-points-fishing-rec-shore-net\
          \ raster workflow...\"\n\n# Step 0: Setup bucket\necho \"Step 0: Setting\
          \ up bucket...\"\nkubectl apply -f /yamls/ocean-tipping-points-fishing-rec-shore-net-setup-bucket.yaml\
          \ -n geo-workflows\nwait_job ocean-tipping-points-fishing-rec-shore-net-setup-bucket\
          \ geo-workflows 600\n\n# Step 1: H3 hexagonal tiling\necho \"Step 1: H3\
          \ hexagonal tiling...\"\nkubectl apply -f /yamls/ocean-tipping-points-fishing-rec-shore-net-hex.yaml\
          \ -n geo-workflows\nwait_job ocean-tipping-points-fishing-rec-shore-net-hex\
          \ geo-workflows 7200\n\necho \"\u2713 Workflow complete!\"\necho \"Clean\
          \ up with:\"\necho \"  kubectl delete jobs ocean-tipping-points-fishing-rec-shore-net-setup-bucket\
          \ ocean-tipping-points-fishing-rec-shore-net-hex ocean-tipping-points-fishing-rec-shore-net-workflow\
          \ -n geo-workflows\"\necho \"  kubectl delete configmap ocean-tipping-points-fishing-rec-shore-net-yamls\
          \ -n geo-workflows\"\n"
        command:
        - bash
        - -c
        image: bitnami/kubectl:latest
        name: workflow
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - mountPath: /yamls
          name: yamls
      restartPolicy: OnFailure
      serviceAccountName: cng-datasets-workflow
      volumes:
      - configMap:
          name: ocean-tipping-points-fishing-rec-shore-net-yamls
        name: yamls
  ttlSecondsAfterFinished: 10800
