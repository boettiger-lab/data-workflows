            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-hawaii
            - name: DUCKDB_MEMORY_LIMIT
              value: 3481MiB
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              cng-convert-to-parquet \
                s3://public-hawaii/raw/cwb-beach-water-quality/sites.parquet \
                s3://public-hawaii/cwb-beach-water-quality.parquet \
                --row-group-size 100000 \
                --expect-features 473
            resources:
              requests:
                cpu: '4'
                memory: 4Gi
              limits:
                cpu: '4'
                memory: 4Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
