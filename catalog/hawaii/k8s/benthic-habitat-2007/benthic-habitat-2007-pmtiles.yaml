apiVersion: batch/v1
kind: Job
metadata:
  name: benthic-habitat-2007-pmtiles
  namespace: geo-workflows
  labels:
    k8s-app: benthic-habitat-2007-pmtiles
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: benthic-habitat-2007-pmtiles
    spec:
      restartPolicy: Never
      containers:
      - name: pmtiles-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-hawaii
        - name: DATASET
          value: benthic-habitat-2007
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          # Use optimized GeoParquet (has ID column) from convert job
          # GDAL can read parquet via vsicurl
          ogr2ogr -wrapdateline -datelineoffset 15 -f GeoJSONSeq /tmp/$DATASET.geojsonl /vsicurl/https://s3-west.nrp-nautilus.io/public-hawaii/benthic-habitat-2007.parquet -progress

          # Generate PMTiles from GeoJSONSeq
          # TIPPECANOE_MAX_THREADS must be a power of 2; Kubernetes nodes can expose
          # non-power-of-2 logical CPU counts which triggers an internal assertion
          # failure "N shards not a power of 2" (felt/tippecanoe#216).
          # Size from the pod's cgroup CPU quota, not os.cpu_count() (the node's cores),
          # round down to a power of 2, and cap at 128: at 256+ threads tippecanoe caps
          # its shards at 745, not a power of 2, and aborts anyway (issue #273).
          # Must be `export`ed: tippecanoe is a child process and reads this from the
          # environment, not the shell. A plain assignment is invisible to it, so it
          # falls back to the raw (non-power-of-2) CPU count and crashes (issue #77).
          export TIPPECANOE_MAX_THREADS=$(python3 -c "from cng_datasets.raster.cog import _cgroup_cpu_count as c; n=min(c() or 4, 128); print(1<<(n.bit_length()-1))")

          # Raise the soft open-file limit before tippecanoe (issue #154). It opens many
          # temp files (per-thread x per-tile shards); on high-core nodes os.cpu_count()
          # reports the node's full core count, so the thread/shard count blows past the
          # container's default soft nofile limit (often 1024) and aborts with
          # "Too many open files". `|| true` keeps going if the limit can't be raised.
          ulimit -n 65536 || true
          tippecanoe -o /tmp/$DATASET.pmtiles -l $DATASET --coalesce-densest-as-needed --drop-densest-as-needed -z 13 --force /tmp/$DATASET.geojsonl

          # Upload to S3 using rclone
          rclone copy /tmp/$DATASET.pmtiles nrp:public-hawaii/
          rm /tmp/$DATASET.geojsonl /tmp/$DATASET.pmtiles
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
          limits:
            cpu: '4'
            memory: 8Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
