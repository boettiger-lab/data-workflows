# HAND-ROLLED: the generator does not write STAC. A metadata-only fix (#949): corrects wrong
# edition, citation and licence text on LIVE collections from
# fixes.json, through the publish guard, and their READMEs from readme-fixes.json. Each fix records
# its evidence.
#   kubectl create configmap editions-949 -n geo-workflows \
#     --from-file=apply.py=catalog/editions-949/apply.py \
#     --from-file=fixes.json=catalog/editions-949/fixes.json \
#     --from-file=collections.txt=catalog/editions-949/collections.txt \
#     --from-file=readme.py=catalog/editions-949/readme.py \
#     --from-file=readme-fixes.json=catalog/editions-949/readme-fixes.json \
#     --from-file=guard.py=scripts/stac-publish-guard.py
#   kubectl create -f catalog/editions-949/editions-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: editions-949
  namespace: geo-workflows
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: editions
        image: ghcr.io/boettiger-lab/datasets@sha256:246dc706ea34728a75c0bf1bc8589fd8f5c2e6526876f6c7192660a272cec1b3
        resources:
          requests: {cpu: '1', memory: 1Gi}
          limits: {cpu: '1', memory: 1Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: in, mountPath: /in, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          n=0
          while read -r p; do
            [ -n "$p" ] || continue
            rclone cat "nrp:$p" > /tmp/live.json
            cp /tmp/live.json /tmp/c.json
            python3 /in/apply.py /in/fixes.json "$p" /tmp/c.json
            python3 -c "import json,sys; sys.exit(json.load(open('/tmp/c.json')) == json.load(open('/tmp/live.json')))" || { echo "unchanged $p"; continue; }
            python3 /in/guard.py /tmp/c.json /tmp/live.json
            rclone copyto /tmp/c.json "nrp:$p" $R
            n=$((n+1))
          done < /in/collections.txt
          echo "DONE: $n collections rewritten"
          for p in $(python3 -c "import json; print(' '.join(x['path'] for x in json.load(open('/in/readme-fixes.json'))))"); do
            rclone cat "nrp:$p" > /tmp/r.md
            cp /tmp/r.md /tmp/r0.md
            python3 /in/readme.py /in/readme-fixes.json "$p" /tmp/r.md
            cmp -s /tmp/r.md /tmp/r0.md || rclone copyto /tmp/r.md "nrp:$p" $R
          done
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: in, configMap: {name: editions-949}}
