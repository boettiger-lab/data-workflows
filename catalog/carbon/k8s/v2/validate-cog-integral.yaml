apiVersion: batch/v1
kind: Job
metadata:
  name: carbon-cog-integral-validate
  namespace: biodiversity
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      containers:
      - name: integral
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        resources:
          requests: {cpu: '4', memory: 16Gi, ephemeral-storage: 45Gi}
          limits: {cpu: '4', memory: 16Gi, ephemeral-storage: 45Gi}
        command:
        - bash
        - -c
        - |
          set -e
          cd /tmp
          echo "" | base64 -d > /tmp/integral.py
          ENDPOINT="http://rook-ceph-rgw-nautiluss3.rook"
          STEMS="irrecoverable_c_total_2018 irrecoverable_c_total_2022 irrecoverable_c_total_2023 irrecoverable_c_total_2024 vulnerable_c_total_2010 vulnerable_c_total_2018 vulnerable_c_total_2024 manageable_c_total_2010 manageable_c_total_2018 manageable_c_total_2024"
          for STEM in $STEMS; do
            echo ">>> ${STEM}: download $(date +%T)"
            aws s3 cp "s3://public-carbon/v2/cogs/${STEM}.tif" "/tmp/${STEM}.tif" --endpoint-url "$ENDPOINT" --no-progress
            echo ">>> ${STEM}: integrate $(date +%T)"
            python3 -u /tmp/integral.py "$STEM"
            rm -f "/tmp/${STEM}.tif"
          done
          echo "=== DONE ==="
