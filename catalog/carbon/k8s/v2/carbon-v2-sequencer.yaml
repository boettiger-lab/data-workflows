# Sequentially submits all 9 remaining v2 carbon hex workflows, then re-encodes
# each output from VARCHAR to UBIGINT H3 keys.
# (vulnerable-carbon-2024 already hexed and re-encoded separately)
# Monitor: kubectl logs -f job/carbon-v2-sequencer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: carbon-v2-sequencer
  namespace: biodiversity
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      serviceAccountName: cng-datasets-workflow
      containers:
      - name: sequencer
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 8Gi
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        volumeMounts:
        - name: workflows
          mountPath: /workflows
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          LOG() { echo "$(date '+%Y-%m-%d %H:%M:%S') $*"; }

          # Install kubectl (not in datasets image)
          LOG "Installing kubectl..."
          KUBECTL_VERSION=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -sLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          LOG "kubectl $(kubectl version --client --short 2>/dev/null | head -1) ready"

          wait_for_job() {
            local name=$1
            local timeout=${2:-86400}
            LOG "Waiting for ${name}..."
            local elapsed=0
            while [ $elapsed -lt $timeout ]; do
              # If job no longer exists, it was TTL-deleted after completion — treat as complete
              if ! kubectl get job "${name}" -n biodiversity &>/dev/null; then
                LOG "${name} no longer exists (TTL-deleted after completion)."
                return 0
              fi
              local status
              status=$(kubectl get job "${name}" -n biodiversity \
                -o jsonpath='{.status.conditions[0].type}' 2>/dev/null || echo "unknown")
              if [ "$status" = "Complete" ] || [ "$status" = "SuccessCriteriaMet" ]; then
                LOG "${name} complete."
                return 0
              elif [ "$status" = "Failed" ]; then
                LOG "ERROR: ${name} failed."
                kubectl describe job "${name}" -n biodiversity | tail -20
                return 1
              fi
              sleep 20
              elapsed=$((elapsed + 20))
            done
            LOG "ERROR: ${name} timed out after ${timeout}s."
            return 1
          }

          reencode() {
            local dataset=$1
            local bucket=$2
            local value_col=$3   # non-h3 value columns (space-separated)
            local h3_cols=$4     # h3 cols other than h0 (space-separated, e.g. "h8")
            LOG "Re-encoding ${dataset} hex: VARCHAR → UBIGINT..."
            python3 - <<PYEOF
          import duckdb, os

          con = duckdb.connect()
          con.execute("INSTALL h3 FROM community; LOAD h3")
          con.execute("INSTALL httpfs; LOAD httpfs")
          con.execute("SET http_retries=10; SET http_retry_wait_ms=3000")

          endpoint = os.environ.get("AWS_S3_ENDPOINT", "rook-ceph-rgw-nautiluss3.rook")
          key = os.environ["AWS_ACCESS_KEY_ID"]
          secret = os.environ["AWS_SECRET_ACCESS_KEY"]

          con.execute(f"""
              CREATE SECRET s3_secret (
                  TYPE S3, KEY_ID '{key}', SECRET '{secret}',
                  ENDPOINT '{endpoint}', URL_STYLE 'path', USE_SSL false
              )
          """)

          dataset = "${dataset}"
          bucket = "${bucket}"
          value_cols = "${value_col}".split()
          h3_cols = "${h3_cols}".split()

          # Detect schema — only apply h3_string_to_h3 to VARCHAR columns
          schema = con.execute(f"""
              DESCRIBE SELECT * FROM read_parquet(
                  's3://{bucket}/{dataset}/hex/**/*.parquet',
                  hive_partitioning=true
              ) LIMIT 1
          """).fetchall()
          col_types = {row[0]: row[1] for row in schema}
          print(f"Schema: {col_types}")

          def maybe_cast(col):
              if col_types.get(col, "VARCHAR") == "VARCHAR":
                  return f"h3_string_to_h3({col}) AS {col}"
              return col  # already UBIGINT

          select_parts = value_cols + \
              [maybe_cast(c) for c in h3_cols] + \
              [maybe_cast("h0")]

          sql = f"""
              COPY (
                  SELECT {", ".join(select_parts)}
                  FROM read_parquet(
                      's3://{bucket}/{dataset}/hex/**/*.parquet',
                      hive_partitioning=true
                  )
              ) TO 's3://{bucket}/{dataset}/hex-new/'
              (FORMAT PARQUET, COMPRESSION ZSTD, PARTITION_BY (h0))
          """
          print(f"Running: {sql[:300]}...")
          con.execute(sql)
          print("✓ Conversion complete")
          PYEOF

            local N
            N=$(rclone ls "nrp:${bucket}/${dataset}/hex-new/" | wc -l)
            LOG "hex-new/ has ${N} files"
            if [ "${N}" -lt 5 ]; then
              LOG "ERROR: too few files (${N}), aborting swap"
              return 1
            fi
            rclone delete "nrp:${bucket}/${dataset}/hex/"
            rclone move "nrp:${bucket}/${dataset}/hex-new/" "nrp:${bucket}/${dataset}/hex/"
            LOG "Re-encode complete: ${dataset}"
          }

          # irrecoverable-carbon-2024 already hexed and re-encoded — skip it
          # vulnerable-carbon-2024 already hexed and re-encoded — skip it
          # irrecoverable-carbon-2023 hex done (122/122); re-encoded separately — skip it
          # irrecoverable-carbon-2022 hex done (85 files); re-encoded separately — skip it
          # irrecoverable-carbon-2018 hex done (122/122); re-encoded separately — skip it
          # irrecoverable-carbon-2010 has NO v2 COG in public-carbon/v2/cogs/ — skip it

          DATASETS=(
            manageable-carbon-2024
            manageable-carbon-2018
            manageable-carbon-2010
            vulnerable-carbon-2018
            vulnerable-carbon-2010
          )

          for dataset in "${DATASETS[@]}"; do
            LOG "=== ${dataset}: hex ==="
            kubectl apply \
              -f "/workflows/${dataset}-configmap.yaml" \
              -f "/workflows/${dataset}-workflow.yaml" \
              -n biodiversity

            wait_for_job "${dataset}-workflow" 86400

            LOG "=== ${dataset}: re-encode ==="
            reencode "${dataset}" "public-carbon" "carbon" "h8"

            LOG "=== ${dataset}: DONE ==="
          done

          LOG "All remaining v2 carbon datasets complete with integer H3 encoding."
        volumeMounts:
        - name: workflows
          mountPath: /workflows
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
      volumes:
      - name: workflows
        configMap:
          name: carbon-v2-sequencer-workflows
      - name: rclone-config
        secret:
          secretName: rclone-config
