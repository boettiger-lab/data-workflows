# Generation command: cng-datasets mdim-workflow --dataset crw-5km-daily/ssta --input /vsicurl/https://www.star.nesdis.noaa.gov/pub/sod/mecb/crw/data/5km/v3.1_op/nc/v1.0/daily/ssta/2026/ct5km_ssta_v3.1_20261024.nc --variable sea_surface_temperature_anomaly --bucket public-coral-reef-watch --h3-resolution 6 --fan-out time --namespace geo-workflows --parent-resolutions 0
# Only this setup-bucket step is kept from that output; the daily tier's hex is run by
# daily/update-daily.sh (see the HAND-ROLLED note there).
apiVersion: batch/v1
kind: Job
metadata:
  name: crw-setup-bucket
  namespace: geo-workflows
  labels:
    k8s-app: crw-setup-bucket
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: crw-setup-bucket
    spec:
      restartPolicy: Never
      containers:
      - name: setup-bucket-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-coral-reef-watch
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          echo "Setting up bucket with public access and CORS..."
          cng-datasets storage setup-bucket \
            --bucket "${BUCKET}" \
            --remote nrp \
            --verify

          echo "Bucket setup complete!"
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '1'
            memory: 2Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
