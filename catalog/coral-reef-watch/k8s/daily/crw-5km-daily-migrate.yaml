# HAND-ROLLED: one-off server-side move of the daily hex into date= partitions
# (migrate-date-partitions.sh, data-workflows#802). Run after the backfill finishes and
# outside the 18:00 UTC CronJob run. Small pod (1 CPU, 1Gi): rclone server-side moves only.
apiVersion: batch/v1
kind: Job
metadata:
  name: crw-5km-daily-migrate
  namespace: geo-workflows
  labels: {k8s-app: crw-5km-daily-migrate}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {k8s-app: crw-5km-daily-migrate}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: migrate
        image: ghcr.io/boettiger-lab/datasets@sha256:246dc706ea34728a75c0bf1bc8589fd8f5c2e6526876f6c7192660a272cec1b3
        imagePullPolicy: IfNotPresent
        command: [bash, /scripts/migrate-date-partitions.sh]
        env:
        - {name: BUCKET, value: public-coral-reef-watch}
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /scripts, readOnly: true}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: crw-5km-daily-script, defaultMode: 0755}}
