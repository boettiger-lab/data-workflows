# HAND-ROLLED: one-off fill of the 13-month daily window with the CronJob's script, one week
# per index (data-workflows#802). WINDOW_START + 7*index .. +6 days, capped at WINDOW_END;
# 2025-09-25 .. 2026-10-25 is 396 days = 57 indexes. Pod shape follows `cng-datasets mdim-workflow`,
# DEVIATION (#802): opportunistic priority (units 10-16 min, exempt from NRP usage checks, #804);
# memory 3Gi/3.5Gi (hex in 8 h0 batches; whole-grid calls OOMed at 4.5GiB) and
# NRP policy (limit/request <= 1.2, low-utilization block on over-requesting accounts).
apiVersion: batch/v1
kind: Job
metadata:
  name: crw-5km-daily-backfill
  namespace: geo-workflows
  labels: {k8s-app: crw-5km-daily-backfill}
spec:
  completions: 57
  parallelism: 10
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 10
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {k8s-app: crw-5km-daily-backfill}
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic  # week units run 10-16 min; idempotent, a preempted week is redone on retry
      automountServiceAccountToken: false
      containers:
      - name: update
        image: ghcr.io/boettiger-lab/datasets@sha256:7b9c4fd11144c2a7574e5cf46f40fa184111bf214a0d5c7f25c28eb97bbe6721  # DEVIATION (#802): pinned; :latest 04c8b5e6 (2026-10-26) breaks pyarrow (numpy 1.26)
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          s=$(date -u -d "$WINDOW_START +$((JOB_COMPLETION_INDEX * 7)) days" +%F)
          e=$(date -u -d "$s +6 days" +%F)
          if [[ "$e" > "$WINDOW_END" ]]; then e=$WINDOW_END; fi
          exec bash /scripts/update-daily.sh "$s" "$e"
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: GDAL_DATA, value: /usr/share/gdal}
        - {name: BUCKET, value: public-coral-reef-watch}
        - {name: DUCKDB_MEMORY_LIMIT, value: 1800MiB}
        - {name: GDAL_CACHEMAX, value: '1024'}
        - {name: WINDOW_START, value: '2025-09-25'}
        - {name: WINDOW_END, value: '2026-10-25'}
        resources:
          requests: {cpu: '2', memory: 3Gi, ephemeral-storage: 10Gi}
          limits: {cpu: '2', memory: 3584Mi, ephemeral-storage: 10Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /scripts, readOnly: true}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: crw-5km-daily-script, defaultMode: 0755}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
