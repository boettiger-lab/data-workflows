# HAND-ROLLED: one-off first compaction of the monthly backfill into one file per h0 cell
# (data-workflows#802): 80 indexes, 8 cell shards for each of the 10 products (CELL_SHARD).
# update-monthly.sh with an empty month range only compacts: monthly files from closed years are
# folded into hex/h0=<cell>/data_0.parquet; the current year's stay beside it until it closes.
# Idempotent: a rerun continues from the cells already compacted. Run after the backfill finishes.
# DEVIATION (#802): default priority, not opportunistic, since pods can run over an hour.
apiVersion: batch/v1
kind: Job
metadata:
  name: crw-5km-monthly-compact
  namespace: geo-workflows
  labels: {k8s-app: crw-5km-monthly-compact}
spec:
  completions: 80
  parallelism: 40
  completionMode: Indexed
  backoffLimitPerIndex: 2
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {k8s-app: crw-5km-monthly-compact}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: compact
        image: ghcr.io/boettiger-lab/datasets@sha256:246dc706ea34728a75c0bf1bc8589fd8f5c2e6526876f6c7192660a272cec1b3  # DEVIATION (#802): pinned, as in the CronJob
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          products=(sst-min sst-mean sst-max ssta-min ssta-mean ssta-max hs-max dhw-max baa-max baa5-max)
          export ONLY_PRODUCTS=${products[$((JOB_COMPLETION_INDEX / 8))]} CELL_SHARD=$((JOB_COMPLETION_INDEX % 8))/8
          exec bash /scripts/update-monthly.sh 2000-02 2000-01
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: BUCKET, value: public-coral-reef-watch}
        - {name: DUCKDB_MEMORY_LIMIT, value: 1800MiB}
        resources:
          requests: {cpu: '2', memory: 3Gi, ephemeral-storage: 10Gi}
          limits: {cpu: '2', memory: 3584Mi, ephemeral-storage: 10Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /scripts, readOnly: true}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: crw-5km-monthly-script, defaultMode: 0755}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}
