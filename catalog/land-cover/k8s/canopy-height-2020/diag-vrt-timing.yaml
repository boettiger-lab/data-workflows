# HAND-ROLLED diagnostic (#440): the same res-2 chunk (h0 grid position 37, a Peru h0, chunk 10),
# hexed once from the Peru VRT (index 0) and once from the global, 360-degree VRT (index 1), to test
# whether the global VRT makes units slower. Output goes to a throwaway prefix.
apiVersion: batch/v1
kind: Job
metadata:
  name: canopy-height-diag-vrt
  namespace: geo-workflows
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimitPerIndex: 0
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      containers:
      - name: t
        image: ghcr.io/boettiger-lab/datasets:latest
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: GDAL_DATA, value: /usr/share/gdal}
        - {name: CNG_HEX_WORKERS, value: '4'}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          V=(height-peru.vrt height.vrt)
          SRC=${V[$JOB_COMPLETION_INDEX]}
          s=$(date +%s)
          cng-datasets raster --input "s3://public-land-cover/canopy-height-2020/$SRC" \
            --output-parquet "s3://public-land-cover/_scratch/canopy-diag/$JOB_COMPLETION_INDEX/" \
            --chunk-resolution 2 --chunk-index 10 --h0-subset 37 --resolution 9 --parent-resolutions 8,0 \
            --value-column canopy_height_m --hex-resampling mean --nodata 255 2>&1 | grep -vE '100%' | tail -12
          echo "RESULT source=$SRC seconds=$(( $(date +%s) - s ))"
        resources:
          requests: {cpu: '4', memory: 16Gi, ephemeral-storage: 20Gi}
          limits:   {cpu: '4', memory: 16Gi, ephemeral-storage: 20Gi}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
