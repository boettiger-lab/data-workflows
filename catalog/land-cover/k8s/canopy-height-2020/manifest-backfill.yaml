# HAND-ROLLED (#440): one height tile (N36W102) reached S3 but its pod was preempted before writing
# the manifest row, and the resumed shard skipped it as present. This validates the tile by a full
# pixel read and writes its row to manifest/backfill.tsv.
apiVersion: batch/v1
kind: Job
metadata:
  name: canopy-height-manifest-backfill
  namespace: geo-workflows
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      containers:
      - name: b
        image: ghcr.io/boettiger-lab/datasets:latest
        env:
        - {name: GDAL_DATA, value: /usr/share/gdal}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          f=ETH_GlobalCanopyHeight_10m_2020_N36W102_Map.tif; k=canopy-height-2020/height/tiles/$f
          cd /tmp && rclone copyto nrp:public-land-cover/$k $f
          gdalinfo -checksum $f | grep -E 'Size is|Checksum|NoData'
          mt=$(rclone lsjson nrp:public-land-cover/$k | python3 -c 'import json,sys;print(json.load(sys.stdin)[0]["ModTime"][:19]+"Z")')
          B='https://libdrive.ethz.ch/index.php/s/cO8or7iOe5dT2Rt/download?path=%2F3deg_cogs&files='
          printf 'path\tbytes\tsha256\tsource\taccessed\n%s\t%s\t%s\t%s\t%s\n' "$k" "$(stat -c%s $f)" "$(sha256sum $f | cut -d' ' -f1)" "$B$f" "$mt" > backfill.tsv
          cat backfill.tsv
          rclone copyto backfill.tsv nrp:public-land-cover/raw/canopy-height-2020/manifest/backfill.tsv --s3-no-check-bucket
        resources:
          requests: {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
          limits:   {cpu: '1', memory: 2Gi, ephemeral-storage: 2Gi}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
