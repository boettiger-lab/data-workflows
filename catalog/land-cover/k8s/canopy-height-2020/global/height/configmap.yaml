# Auto-generated ConfigMap for raster workflow
# Generation command: cng-datasets raster-workflow --dataset canopy-height-2020/height --source-url "s3://public-land-cover/canopy-height-2020/height.vrt" --bucket public-land-cover --h3-resolution 9 --parent-resolutions "8,0"
apiVersion: v1
data:
  canopy-height-2020-height-hex.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: canopy-height-2020-height-hex
      namespace: geo-workflows
      labels:
        k8s-app: canopy-height-2020-height-hex
    spec:
      completions: 5882
      parallelism: 190
      completionMode: Indexed
      backoffLimitPerIndex: 4
      maxFailedIndexes: 30
      podFailurePolicy:
        rules:
        - action: Ignore
          onPodConditions:
          - type: DisruptionTarget
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: canopy-height-2020-height-hex
        spec:
          restartPolicy: Never
          containers:
          - name: hex-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: GDAL_DATA
              value: /usr/share/gdal
            - name: PYTHONPATH
              value: /usr/lib/python3/dist-packages
            - name: BUCKET
              value: public-land-cover
            - name: CNG_HEX_WORKERS
              value: '4'
            - name: CNG_HEX_CHUNK_SIZE
              value: '100000'
            - name: DUCKDB_MEMORY_LIMIT
              value: 13GiB
            - name: GDAL_CACHEMAX
              value: '512'
            command:
            - bash
            - -c
            - |-
              set -e

              cng-datasets raster --input "s3://public-land-cover/canopy-height-2020/height.vrt" --output-parquet s3://public-land-cover/canopy-height-2020/height/hex-chunks/ --chunk-resolution 2 --chunk-index ${JOB_COMPLETION_INDEX} --resolution 9 --parent-resolutions 8,0 --value-column canopy_height_m --hex-resampling mean --nodata "255"
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 20Gi
              limits:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 20Gi
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  canopy-height-2020-height-merge.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: canopy-height-2020-height-merge
      namespace: geo-workflows
      labels:
        k8s-app: canopy-height-2020-height-merge
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: canopy-height-2020-height-merge
        spec:
          restartPolicy: Never
          containers:
          - name: merge-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: GDAL_DATA
              value: /usr/share/gdal
            - name: PYTHONPATH
              value: /usr/lib/python3/dist-packages
            - name: BUCKET
              value: public-land-cover
            - name: DUCKDB_MEMORY_LIMIT
              value: 13GiB
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e

              cng-datasets merge-chunks \
                --chunks-dir s3://public-land-cover/canopy-height-2020/height/hex-chunks \
                --output-dir s3://public-land-cover/canopy-height-2020/height/hex \
                --expect-chunks 5882
            resources:
              requests:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 100Gi
              limits:
                cpu: '4'
                memory: 16Gi
                ephemeral-storage: 100Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
  canopy-height-2020-height-setup-bucket.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: canopy-height-2020-height-setup-bucket
      namespace: geo-workflows
      labels:
        k8s-app: canopy-height-2020-height-setup-bucket
    spec:
      completions: 1
      parallelism: 1
      backoffLimit: 2
      ttlSecondsAfterFinished: 10800
      template:
        metadata:
          labels:
            k8s-app: canopy-height-2020-height-setup-bucket
        spec:
          restartPolicy: Never
          containers:
          - name: setup-bucket-task
            image: ghcr.io/boettiger-lab/datasets:latest
            imagePullPolicy: Always
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_S3_ENDPOINT
              value: rook-ceph-rgw-nautiluss3.rook
            - name: AWS_PUBLIC_ENDPOINT
              value: s3-west.nrp-nautilus.io
            - name: AWS_HTTPS
              value: 'false'
            - name: AWS_VIRTUAL_HOSTING
              value: 'FALSE'
            - name: BUCKET
              value: public-land-cover
            volumeMounts:
            - name: rclone-config
              mountPath: /root/.config/rclone
              readOnly: true
            command:
            - bash
            - -c
            - |
              set -e
              echo "Setting up bucket with public access and CORS..."
              cng-datasets storage setup-bucket \
                --bucket "${BUCKET}" \
                --remote nrp \
                --verify

              echo "Bucket setup complete!"
            resources:
              requests:
                cpu: '1'
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
          volumes:
          - name: rclone-config
            secret:
              secretName: rclone-config
          priorityClassName: opportunistic
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values:
                    - 'true'
