# HAND-ROLLED: raster-workflow's preprocess-cog clips only to a bbox (--target-extent); the scope (#984)
# is Peru's national boundary, which needs a polygon mask (datasets#344).
#
# Builds s3://public-land-cover/worldcover-2021/peru-cog.tif from the 26 staged WorldCover tiles:
#   1. VRT over the tiles (all EPSG:4326 on one 1/12000-degree grid).
#   2. gdal_translate -srcwin: the VRT window around the Overture 2026-02-18.0 Peru polygon (country PE,
#      class land), snapped outward to the source pixel grid. No warp, so every pixel is copied unchanged.
#   3. gdal_rasterize -i -burn 0: set every pixel whose centre is outside the polygon to nodata 0.
#      (A gdalwarp -cutline over this 152k x 220k window wrote ~6 MB/min and grew past 10 GiB.)
#   4. COG, DEFLATE, NEAREST overviews (categorical; the COG default CUBIC would invent class codes).
# Gates: output grid aligned to the source grid; 20,000 random valid pixels equal the source VRT;
# only WorldCover class codes present. Writes the class histogram (pixel counts) and the mask used to
#   s3://public-land-cover/raw/worldcover-2021/peru-cog-histogram.json
#   s3://public-land-cover/raw/worldcover-2021/peru-boundary.geojson
apiVersion: batch/v1
kind: Job
metadata:
  name: worldcover-2021-peru-cog
  namespace: geo-workflows
  labels:
    k8s-app: worldcover-2021-peru-cog
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        k8s-app: worldcover-2021-peru-cog
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      containers:
      - name: cog
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: GDAL_DATA, value: /usr/share/gdal}
        - {name: GDAL_CACHEMAX, value: '2048'}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          W=/tmp/w; mkdir -p $W/map && cd $W
          rclone copy nrp:public-land-cover/raw/worldcover-2021/map/ map/ --transfers 8
          [ "$(ls map/*_Map.tif | wc -l)" = 26 ] || { echo "expected 26 tiles"; exit 1; }
          rclone copyto nrp:public-overturemaps/2026-02-18.0/countries.parquet countries.parquet
          ogr2ogr -f GeoJSON peru.geojson -where "country='PE' AND class='land'" -select country,class countries.parquet countries
          gdalbuildvrt -srcnodata 0 -vrtnodata 0 tiles.vrt map/*_Map.tif
          python3 - <<'EOF'
          import math, subprocess
          from osgeo import gdal, ogr
          gdal.UseExceptions()
          v = gdal.Open('tiles.vrt'); gt = v.GetGeoTransform(); res = gt[1]
          assert abs(res - 1/12000) < 1e-12 and abs(gt[5] + 1/12000) < 1e-12, gt
          ds = ogr.Open('peru.geojson'); lyr = ds.GetLayer(); assert lyr.GetFeatureCount() == 1
          xmin, xmax, ymin, ymax = lyr.GetExtent()
          # snap outward to the source pixel grid
          c0 = math.floor((xmin - gt[0]) / res); c1 = math.ceil((xmax - gt[0]) / res)
          r0 = math.floor((gt[3] - ymax) / res); r1 = math.ceil((gt[3] - ymin) / res)
          te = [gt[0] + c0*res, gt[3] - r1*res, gt[0] + c1*res, gt[3] - r0*res]
          print('srcwin', c0, r0, c1-c0, r1-r0, 'te', te, flush=True)
          open('win.txt','w').write(f'{c0} {r0} {c1-c0} {r1-r0}')
          subprocess.run(['gdal_translate', '-srcwin', str(c0), str(r0), str(c1-c0), str(r1-r0),
              '-co', 'TILED=YES', '-co', 'BLOCKXSIZE=512', '-co', 'BLOCKYSIZE=512',
              '-co', 'COMPRESS=ZSTD', '-co', 'BIGTIFF=YES', '-co', 'SPARSE_OK=TRUE',
              '-co', 'NUM_THREADS=ALL_CPUS', 'tiles.vrt', 'clip.tif'], check=True)
          subprocess.run(['gdal_rasterize', '-i', '-burn', '0', 'peru.geojson', 'clip.tif'], check=True)
          EOF
          gdal_translate -of COG -co COMPRESS=DEFLATE -co BLOCKSIZE=512 -co RESAMPLING=NEAREST \
            -co OVERVIEWS=IGNORE_EXISTING -co BIGTIFF=IF_SAFER -co NUM_THREADS=ALL_CPUS clip.tif peru-cog.tif
          rm -f clip.tif
          python3 - <<'EOF'
          import json
          import numpy as np
          from osgeo import gdal
          gdal.UseExceptions()
          c0, r0, nx, ny = map(int, open('win.txt').read().split())
          v = gdal.Open('tiles.vrt'); o = gdal.Open('peru-cog.tif')
          gv, go = v.GetGeoTransform(), o.GetGeoTransform()
          assert (o.RasterXSize, o.RasterYSize) == (nx, ny), (o.RasterXSize, o.RasterYSize)
          assert abs(go[0] - (gv[0] + c0*gv[1])) < 1e-9 and abs(go[3] - (gv[3] + r0*gv[5])) < 1e-9, (go, gv)
          assert go[1] == gv[1] and go[5] == gv[5], (go, gv)
          b = o.GetRasterBand(1); assert b.GetNoDataValue() == 0
          print('color table:', b.GetColorTable() is not None)
          counts = np.zeros(256, dtype=np.int64)
          bs = 4096
          for y in range(0, ny, bs):
              a = b.ReadAsArray(0, y, nx, min(bs, ny - y))
              counts += np.bincount(a.ravel(), minlength=256)
          hist = {int(k): int(counts[k]) for k in np.nonzero(counts)[0]}
          print('histogram', hist, flush=True)
          valid = {10, 20, 30, 40, 50, 60, 70, 80, 90, 95, 100}
          assert set(hist) - {0} <= valid, set(hist) - {0} - valid
          # sample check: random valid output pixels equal the source
          rng = np.random.default_rng(984); vb = v.GetRasterBand(1); n = 0; tries = 0
          while n < 20000 and tries < 2_000_000:
              tries += 1
              x, y = int(rng.integers(nx)), int(rng.integers(ny))
              ov = int(b.ReadAsArray(x, y, 1, 1)[0, 0])
              if ov == 0: continue
              sv = int(vb.ReadAsArray(c0 + x, r0 + y, 1, 1)[0, 0])
              assert ov == sv, (x, y, ov, sv)
              n += 1
          assert n == 20000, n
          print('sample check ok', n)
          json.dump({'pixels': hist, 'nodata': 0, 'size': [nx, ny], 'geotransform': list(go)},
                    open('peru-cog-histogram.json', 'w'), indent=1)
          EOF
          gdalinfo peru-cog.tif > info.txt; head -40 info.txt
          rclone copyto peru-cog.tif nrp:public-land-cover/worldcover-2021/peru-cog.tif --s3-no-check-bucket --retries 5
          rclone copyto peru-cog-histogram.json nrp:public-land-cover/raw/worldcover-2021/peru-cog-histogram.json --s3-no-check-bucket
          rclone copyto peru.geojson nrp:public-land-cover/raw/worldcover-2021/peru-boundary.geojson --s3-no-check-bucket
          ls -la peru-cog.tif; sha256sum peru-cog.tif
        resources:
          requests: {cpu: '8', memory: 12Gi, ephemeral-storage: 30Gi}
          limits:   {cpu: '8', memory: 12Gi, ephemeral-storage: 30Gi}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
