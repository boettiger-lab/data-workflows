apiVersion: batch/v1
kind: Job
metadata:
  name: nlcd-2001-publish-stac
  namespace: geo-workflows
  labels:
    k8s-app: nlcd-2001-publish-stac
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: nlcd-2001-publish-stac
    spec:
      restartPolicy: Never
      containers:
      - name: publish-stac
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: stac-files
          mountPath: /stac
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          keep_styles() {  # #881: replacing a live collection must not drop its default style assets or renders
            case "$2" in *.json) ;; *) return 0 ;; esac
            mkdir -p /tmp/keep-styles
            rclone cat "$2" > /tmp/keep-styles/live.json 2>/dev/null || return 0
            python3 -c '
          import json, sys
          try:
              new = json.load(open(sys.argv[1])); live = json.load(open(sys.argv[2]))
          except Exception:
              sys.exit(0)
          kept = {k: a for k, a in live.get("assets", {}).items()
                  if "style" in (a.get("roles") or []) and k not in new.setdefault("assets", {})}
          new["assets"].update(kept)
          renders = {k: v for k, v in live.get("renders", {}).items() if k not in new.get("renders", {})}
          if renders:
              new.setdefault("renders", {}).update(renders)
          for e in live.get("stac_extensions", []):
              if "/render/" in e and e not in new.setdefault("stac_extensions", []):
                  new["stac_extensions"].append(e)
          if kept or renders:
              json.dump(new, open(sys.argv[1], "w"), indent=2)
              print(f"  kept {len(kept)} style asset(s) and {len(renders)} render(s) from the live collection")
          ' "$1" /tmp/keep-styles/live.json
          }
          # Publishes only s3://public-land-cover/nlcd/stac-collection.json, from the
          # ConfigMap built by patch-stac.py:
          #   python3 patch-stac.py
          #   kubectl -n geo-workflows create configmap nlcd-2001-stac-files \
          #     --from-file=stac-collection.json=/tmp/nlcd-stac-collection.json
          f=/stac/stac-collection.json
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['id']=='nlcd'" "$f"
          # ConfigMap entries are symlinks; copy to a real file for rclone.
          cat "$f" > /tmp/payload
          keep_styles /tmp/payload nrp:public-land-cover/nlcd/stac-collection.json
          rclone copyto /tmp/payload nrp:public-land-cover/nlcd/stac-collection.json
          rclone size nrp:public-land-cover/nlcd/stac-collection.json
          echo "ALL DONE"
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: '1'
            memory: 2Gi
            ephemeral-storage: 2Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: stac-files
        configMap:
          name: nlcd-2001-stac-files
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
