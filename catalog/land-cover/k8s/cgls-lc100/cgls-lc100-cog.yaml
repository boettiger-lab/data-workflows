apiVersion: batch/v1
kind: Job
metadata:
  name: cgls-lc100-cog
  labels:
    k8s-app: cgls-lc100-cog
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: cgls-lc100-cog
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: cog-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: CPL_VSIL_USE_TEMP_FILE_FOR_RANDOM_WRITE
          value: 'YES'
        - name: GDAL_CACHEMAX
          value: '4096'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          echo "Downloading raw GeoTIFF from S3 (~1.7 GB)..."
          rclone copyto nrp:public-land-cover/raw/cgls-lc100-2019.tif \
            /tmp/cgls-lc100-2019.tif --progress

          echo "Converting to COG..."
          gdal_translate /tmp/cgls-lc100-2019.tif /tmp/cgls-lc100-2019-cog.tif \
            -of COG \
            -co COMPRESS=ZSTD \
            -co BLOCKSIZE=512 \
            -co RESAMPLING=NEAREST \
            --config GDAL_CACHEMAX 4096

          echo "Uploading COG to S3..."
          rclone copyto /tmp/cgls-lc100-2019-cog.tif \
            nrp:public-land-cover/cgls-lc100-2019-cog.tif --progress

          echo "Done. Size:"
          ls -lh /tmp/cgls-lc100-2019-cog.tif
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 20Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
