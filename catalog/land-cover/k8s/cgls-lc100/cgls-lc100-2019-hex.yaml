apiVersion: batch/v1
kind: Job
metadata:
  name: cgls-lc100-2019-hex
  labels:
    k8s-app: cgls-lc100-2019-hex
spec:
  completions: 122
  parallelism: 30
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 122
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: cgls-lc100-2019-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: BUCKET
          value: public-land-cover
        # rclone-config is required: the current tool localizes the COG to local
        # NVMe (rclone copy nrp:...) before hexing; without it localization fails.
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |-
          set -e

          # Locate PROJ database dynamically to avoid version mismatches
          PROJ_DB=$(find /usr /opt -name "proj.db" 2>/dev/null | head -1)
          if [ -n "$PROJ_DB" ]; then
            export PROJ_DATA="$(dirname $PROJ_DB)"
            export PROJ_LIB="$PROJ_DATA"
          fi

          cng-datasets raster --input "s3://public-land-cover/cgls-lc100-2019-cog.tif" --output-parquet s3://public-land-cover/cgls-lc100-2019/hex --h0-index ${JOB_COMPLETION_INDEX} --resolution 9 --parent-resolutions 8,7,6,5,0 --value-column lc_class --hex-resampling mode
        resources:
          requests:
            cpu: '4'
            memory: 128Gi
            ephemeral-storage: 50Gi
          limits:
            cpu: '4'
            memory: 128Gi
            ephemeral-storage: 50Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
