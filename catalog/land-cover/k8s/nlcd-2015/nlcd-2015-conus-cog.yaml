apiVersion: batch/v1
kind: Job
metadata:
  name: nlcd-2015-conus-cog
  namespace: geo-workflows
  labels: {k8s-app: nlcd-2015-conus-cog}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {k8s-app: nlcd-2015-conus-cog}}
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: cog
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: TMPDIR, value: /scratch}
        command:
        - bash
        - -c
        - |-
          set -e
          # Build the FULL CONUS Annual NLCD 2015 land-cover WGS84 COG from the raw
          # MRLC source (Annual NLCD Collection 1 v0, staged to NRP raw/ from the
          # requester-pays usgs-landcover archive). Mirrors nlcd-2024-conus-cog.
          # -r near is REQUIRED: bilinear/average would corrupt categorical class codes.
          # nodata 250 = Annual NLCD LndCov fill.
          PROJ_DB=$(find /usr /opt -name "proj.db" 2>/dev/null | head -1)
          [ -n "$PROJ_DB" ] && export PROJ_DATA="$(dirname $PROJ_DB)" PROJ_LIB="$(dirname $PROJ_DB)"
          cd /scratch
          echo "=== download raw source (direct .tif) ==="
          rclone copy nrp:public-land-cover/raw/Annual_NLCD_LndCov_2015_CU_C1V0.tif /scratch/ -P
          SRC=/scratch/Annual_NLCD_LndCov_2015_CU_C1V0.tif
          gdalinfo "$SRC" | grep -E 'Size is|Pixel Size|Origin'
          echo "=== gdalwarp full-extent -> EPSG:4326 COG ==="
          gdalwarp -t_srs EPSG:4326 -r near -of COG \
            -srcnodata 250 -dstnodata 250 \
            -multi -wo NUM_THREADS=ALL_CPUS -wm 4096 \
            -co COMPRESS=DEFLATE -co PREDICTOR=2 -co BLOCKSIZE=512 \
            -co OVERVIEW_RESAMPLING=NEAREST -co NUM_THREADS=ALL_CPUS \
            "$SRC" /scratch/nlcd-2015-cog-4326.tif
          echo "=== verify output bounds (expect ~ -124.8,24.5 .. -66.9,49.4) ==="
          gdalinfo /scratch/nlcd-2015-cog-4326.tif | grep -E 'Size is|Corner|Lower|Upper|Center'
          echo "=== publish ==="
          rclone copyto /scratch/nlcd-2015-cog-4326.tif nrp:public-land-cover/nlcd-2015-cog.tif -P
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: scratch, mountPath: /scratch, subPath: nlcd-2015-conus-cog}
        resources:
          requests: {cpu: '8', memory: 32Gi, ephemeral-storage: 10Gi}
          limits:   {cpu: '8', memory: 32Gi, ephemeral-storage: 10Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: scratch, persistentVolumeClaim: {claimName: rechunk-scratch}}
