apiVersion: batch/v1
kind: Job
metadata:
  name: nlcd-2024-conus-hex
  namespace: geo-workflows
  labels:
    k8s-app: nlcd-2024-conus-hex
spec:
  completions: 122
  parallelism: 6
  completionMode: Indexed
  backoffLimitPerIndex: 3
  maxFailedIndexes: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: nlcd-2024-conus-hex
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      # No single-node pin: 256Gi/8cpu pods must spread across the cluster to run
      # concurrently. Pinning to one Berkeley node serializes res-10 (each full-land
      # h0 base cell is ~282M cells, ~1.5-2h); backoffLimitPerIndex retries cover
      # the occasional opportunistic preemption.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: CNG_HEX_WORKERS
          value: '8'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |-
          set -e
          # Re-hex full CONUS NLCD 2024 from the rebuilt full-extent COG (data-workflows #307).
          # One indexed pod per H3 res-0 base cell (0..121); ocean/empty cells skip silently.
          # #409 idempotent re-run: `mode` is a SPARSE reducer — it writes a partition ONLY for
          # h0 cells that contain valid pixels, so CONUS lands in exactly 6 POPULATED h0. #409
          # ("6 of 11") was a false alarm: the fractions layer is a full-grid reducer that also
          # materializes 5 EMPTY (0-row, ~214 B) partitions for h0 it merely touches, so a raw
          # directory-count comparison over-reported gaps. The coverage gate below compares
          # POPULATED partitions on both sides (see scripts/check-hex-coverage.sh) and passes at
          # 6==6. The job is only marked Complete when all 122 indexes succeed, so a genuine
          # partial run still surfaces as a Failed Job (FailedIndexes) instead of silent gaps.
          H0=${JOB_COMPLETION_INDEX}
          echo "=== NLCD CONUS res-10 mode, h0-index $H0 ==="
          cng-datasets raster \
            --input "s3://public-land-cover/nlcd-2024-cog.tif" \
            --output-parquet s3://public-land-cover/nlcd-2024/hex/ \
            --h0-index ${H0} --resolution 10 --parent-resolutions 9,8,7,6,5,0 \
            --value-column nlcd --hex-resampling mode --nodata "250"
        resources:
          requests:
            cpu: '8'
            memory: 256Gi
            ephemeral-storage: 40Gi
          limits:
            cpu: '8'
            memory: 256Gi
            ephemeral-storage: 40Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
