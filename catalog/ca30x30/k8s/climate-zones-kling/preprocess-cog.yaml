apiVersion: batch/v1
kind: Job
metadata:
  name: ca-climate-zones-preprocess-cog
  labels:
    k8s-app: ca-climate-zones-preprocess-cog
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: ca-climate-zones-preprocess-cog
    spec:
      restartPolicy: Never
      containers:
      - name: preprocess-cog-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          echo "Localizing raw TIF via rclone..."
          rclone copyto nrp:public-ca30x30/raw/clusters_10.tif /tmp/clusters_10_raw.tif -v

          echo "Reprojecting to WGS84 (nearest-neighbor for categorical data)..."
          gdalwarp \
            -t_srs EPSG:4326 \
            -r near \
            -dstnodata -9999 \
            -of GTiff \
            /tmp/clusters_10_raw.tif /tmp/clusters_10_wgs84.tif

          echo "Creating COG..."
          gdal_translate \
            -of COG \
            -co COMPRESS=LZW \
            -co OVERVIEW_RESAMPLING=NEAREST \
            /tmp/clusters_10_wgs84.tif /tmp/ca-climate-zones-cog.tif

          echo "Verifying COG..."
          gdalinfo /tmp/ca-climate-zones-cog.tif | grep -E "Size|Type|NoData|Min|Max|EPSG|WGS"

          echo "Uploading COG to S3..."
          rclone copyto /tmp/ca-climate-zones-cog.tif nrp:public-ca30x30/ca-climate-zones-cog.tif -v

          echo "Done."
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 2Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
