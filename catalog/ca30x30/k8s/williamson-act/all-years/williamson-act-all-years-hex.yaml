apiVersion: batch/v1
kind: Job
metadata:
  name: williamson-act-all-years-hex
  labels:
    k8s-app: williamson-act-all-years-hex
spec:
  completions: 188
  parallelism: 30
  completionMode: Indexed
  backoffLimitPerIndex: 3
  maxFailedIndexes: 1
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: williamson-act-all-years-hex
    spec:
      restartPolicy: Never
      # Turn a running-hang on a flaky node into a retryable Failure.
      activeDeadlineSeconds: 1800
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-ca30x30
        - name: DATASET
          value: williamson-act-all-years
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector --input s3://public-ca30x30/williamson-act/all-years.parquet --output s3://public-ca30x30/williamson-act/all-years/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 3000 --intermediate-chunk-size 10 --resolution 10 --parent-resolutions 9,8,0
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: '4'
            memory: 16Gi
            ephemeral-storage: 10Gi
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
              # Exclude nodes with observed broken egress/S3 connectivity (AGENTS.md).
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hpc-nrp-g1.nmsu.edu
                - service-02.nrp.mghpcc.org
