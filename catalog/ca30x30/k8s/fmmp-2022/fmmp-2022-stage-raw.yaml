# Stage FMMP 2022 raw from DOC's "2022 FMMP File Geodatabase" portal item (#615).
#
# Source: https://gis.conservation.ca.gov/portal/home/item.html?id=35847d8050fc498a9c4614d745e05c2e
# DOC adds counties to this edition in place (the zip is named
# Important_Farmland_2022_in_progress.zip), so the staged copy is the provenance anchor.
#
# Writes two objects to s3://public-ca30x30/raw/:
#   fmmp-2022-fgdb-2026-09-23.zip         the download, unmodified
#   fmmp-2022-fgdb-2026-09-23-merged.zip  the 44 per-county layers merged into one
#                                         GeoPackage layer; this is the convert input
# plus fmmp-2022-fgdb-2026-09-23-counts.json (per-layer and per-county counts).
#
# merge_fgdb.py fails the job unless the merged count equals both the FGDB layer sum and
# the CaliforniaImportantFarmland_2022 FeatureServer count. The script is mounted from a
# configMap, so create it before applying this job:
#
#   kubectl create configmap fmmp-2022-stage-raw-script -n geo-workflows \
#     --from-file=merge_fgdb.py=catalog/ca30x30/k8s/fmmp-2022/merge_fgdb.py \
#     --dry-run=client -o yaml | kubectl apply -n geo-workflows -f -
#   kubectl apply -n geo-workflows -f catalog/ca30x30/k8s/fmmp-2022/fmmp-2022-stage-raw.yaml
#
# This job is NOT part of the orchestrator DAG in workflow.yaml. It must finish before the
# convert step runs.
apiVersion: batch/v1
kind: Job
metadata:
  name: fmmp-2022-stage-raw
  namespace: geo-workflows
  labels:
    k8s-app: fmmp-2022-stage-raw
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: fmmp-2022-stage-raw
    spec:
      restartPolicy: Never
      dnsConfig:
        nameservers: ["8.8.8.8", "1.1.1.1"]
        options:
        - {name: timeout, value: "2"}
        - {name: attempts, value: "3"}
      containers:
      - name: stage-raw
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: script
          mountPath: /script
          readOnly: true
        command: [bash, -c]
        args:
        - |
          set -euo pipefail
          SRC=https://gis.conservation.ca.gov/portal/sharing/rest/content/items/35847d8050fc498a9c4614d745e05c2e/data
          RAW=fmmp-2022-fgdb-2026-09-23

          echo "==> Downloading the 2022 FMMP File Geodatabase"
          echo "read_start: $(date -u +%FT%TZ)"
          curl -sSfL --retry 8 --retry-delay 5 --retry-all-errors -o /tmp/$RAW.zip "$SRC"
          echo "read_end: $(date -u +%FT%TZ)"
          ls -l /tmp/$RAW.zip

          echo "==> Merging per-county layers"
          mkdir -p /tmp/src && cd /tmp/src && python3 -m zipfile -e /tmp/$RAW.zip .
          GDB=$(ls -d /tmp/src/*.gdb)
          echo "gdb: $GDB"
          OGR_ORGANIZE_POLYGONS=SKIP python3 /script/merge_fgdb.py "$GDB" /tmp/fmmp-2022.gpkg /tmp/$RAW-counts.json
          cat /tmp/$RAW-counts.json

          echo "==> Staging to s3://public-ca30x30/raw/"
          # The datasets image has no zip(1); python's zipfile module is always present.
          cd /tmp && python3 -m zipfile -c $RAW-merged.zip fmmp-2022.gpkg
          rclone copyto /tmp/$RAW.zip nrp:public-ca30x30/raw/$RAW.zip -v
          rclone copyto /tmp/$RAW-merged.zip nrp:public-ca30x30/raw/$RAW-merged.zip -v
          rclone copyto /tmp/$RAW-counts.json nrp:public-ca30x30/raw/$RAW-counts.json -v
          echo "Done."
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: '2'
            memory: 8Gi
            ephemeral-storage: 20Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: script
        configMap:
          name: fmmp-2022-stage-raw-script
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
