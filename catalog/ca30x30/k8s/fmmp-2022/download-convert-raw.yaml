apiVersion: batch/v1
kind: Job
metadata:
  name: fmmp-2022-download-raw
  labels:
    k8s-app: fmmp-2022-download-raw
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: fmmp-2022-download-raw
    spec:
      restartPolicy: Never
      containers:
      - name: download-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          echo "Downloading FMMP 2022 shapefile from ArcGIS Hub..."
          curl -fL --retry 5 -o /tmp/fmmp-2022.zip \
            "https://hub.arcgis.com/api/download/v1/items/f0c1e05504354d219f977d8d342872c2/shapefile?redirect=true&layers=0"
          echo "File size: $(du -sh /tmp/fmmp-2022.zip)"
          echo "Upload to S3 raw..."
          rclone copyto /tmp/fmmp-2022.zip nrp:public-ca30x30/raw/fmmp-2022.zip -v
          echo "Pre-flight: ogrinfo"
          ogrinfo /tmp/fmmp-2022.zip -al -so 2>&1 | head -60
          echo "Done."
        resources:
          requests:
            cpu: '1'
            memory: 4Gi
            ephemeral-storage: 4Gi
          limits:
            cpu: '1'
            memory: 4Gi
            ephemeral-storage: 4Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
