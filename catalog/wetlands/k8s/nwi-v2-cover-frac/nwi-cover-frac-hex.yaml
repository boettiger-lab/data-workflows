# DEVIATION from generated output (#1082): staged under the unlinked prefix nwi-cover-frac/ while
# public-bucket publishes are frozen; the generator derives the input from --dataset, so the
# source is pointed back at the existing NWI conversion, s3://public-wetlands/nwi-v2.parquet.
apiVersion: batch/v1
kind: Job
metadata:
  name: nwi-cover-frac-hex
  namespace: geo-workflows
  labels:
    k8s-app: nwi-cover-frac-hex
spec:
  completions: 7614
  parallelism: 80
  completionMode: Indexed
  backoffLimitPerIndex: 3
  maxFailedIndexes: 1
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: nwi-cover-frac-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-wetlands
        - name: DATASET
          value: nwi-cover-frac
        - name: DUCKDB_MEMORY_LIMIT
          value: 40GiB
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector --input s3://public-wetlands/nwi-v2.parquet --output s3://public-wetlands/nwi-cover-frac/chunks --chunk-id ${JOB_COMPLETION_INDEX} --chunk-size 5000 --intermediate-chunk-size 10 --resolution 10 --parent-resolutions 9,8,0 --polyfill overlap
        resources:
          requests:
            cpu: '4'
            memory: 48Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: '4'
            memory: 48Gi
            ephemeral-storage: 20Gi
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
