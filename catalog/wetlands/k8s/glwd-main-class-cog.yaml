apiVersion: batch/v1
kind: Job
metadata:
  name: glwd-main-class-cog
  labels:
    k8s-app: glwd-main-class-cog
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: glwd-main-class-cog
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: cog-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          echo "Converting GLWD main_class.tif to proper COG..."
          gdal_translate \
            -of COG \
            -co COMPRESS=DEFLATE \
            -co PREDICTOR=2 \
            -co OVERVIEWS=IGNORE_EXISTING \
            -co BLOCKSIZE=512 \
            /vsicurl/https://s3-west.nrp-nautilus.io/public-wetlands/GLWD_v2_0/GLWD_v2_0_combined_classes/GLWD_v2_0_main_class.tif \
            /tmp/glwd-main-class-cog.tif
          echo "Upload to S3..."
          rclone copyto /tmp/glwd-main-class-cog.tif nrp:public-wetlands/glwd/glwd-main-class-cog.tif
          echo "Done."
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 30Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 30Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
