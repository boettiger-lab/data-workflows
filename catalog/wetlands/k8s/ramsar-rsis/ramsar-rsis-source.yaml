# HAND-ROLLED: assembling RSIS boundaries, centroids and the site-details attributes is a
# dataset-specific join the generator has no step for (#1074). Reads the download on the
# rechunk-scratch PVC (ramsar-rsis-download.yaml) and writes the source GeoParquet to the unlinked
# prefix s3://public-wetlands/ramsar-rsis-build/, which the generated workflow converts and hexes.
#   kubectl create configmap ramsar-rsis-source-script -n geo-workflows \
#     --from-file=build_source.py=catalog/wetlands/k8s/ramsar-rsis/build_source.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/wetlands/k8s/ramsar-rsis/ramsar-rsis-source.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ramsar-rsis-source
  namespace: geo-workflows
  labels: {k8s-app: ramsar-rsis-source}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {k8s-app: ramsar-rsis-source}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 7200
      priorityClassName: opportunistic
      containers:
      - name: source
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: OGR_GEOJSON_MAX_OBJ_SIZE, value: "0"}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        - {name: scratch, mountPath: /scratch}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          python3 /script/build_source.py /scratch/ramsar-rsis-1074 /tmp/source.parquet
          rclone copyto /tmp/source.parquet nrp:public-wetlands/ramsar-rsis-build/source.parquet --retries 10
          echo OK
        resources:
          requests: {cpu: '2', memory: 16Gi, ephemeral-storage: 10Gi}
          limits:   {cpu: '2', memory: 16Gi, ephemeral-storage: 10Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: ramsar-rsis-source-script}}
      - {name: scratch, persistentVolumeClaim: {claimName: rechunk-scratch}}
