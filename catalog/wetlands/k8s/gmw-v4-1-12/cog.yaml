# GMW v4.1.12 (data-workflows #443): 9-epoch WGS84 COG from the 1,696-tile 41-band stack.
# 0 = non-mangrove is kept as a VALID value (source tags NoData=0, overridden) so the hex
# `mean` yields a mangrove fraction; 255 = nodata outside the GMW tile footprint.
apiVersion: batch/v1
kind: Job
metadata:
  name: gmw-v4-1-12-cog
  namespace: geo-workflows
  labels:
    k8s-app: gmw-v4-1-12-cog
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        k8s-app: gmw-v4-1-12-cog
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      containers:
      - name: cog
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        env:
        - {name: GDAL_CACHEMAX, value: "8192"}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          W=/tmp/gmw && mkdir -p $W && cd $W
          rclone copy nrp:public-wetlands/raw/gmw-v4-1-12/gmw_mng_ext_v4112_stack.tar.gz . --s3-no-check-bucket
          tar -xzf gmw_mng_ext_v4112_stack.tar.gz --exclude='._*' && rm gmw_mng_ext_v4112_stack.tar.gz
          find . -name 'GMW_*.tif' | sort > tiles.txt
          echo "tiles: $(wc -l < tiles.txt)"; gdalinfo "$(head -1 tiles.txt)" | grep -E 'Size is|Pixel Size|NoData|Band 41' | head

          YEARS=(1985 1990 1995 2000 2005 2010 2015 2020 2025)
          for y in "${YEARS[@]}"; do
            b=$(( y - 1984 ))
            gdalbuildvrt -q -resolution highest -b $b -srcnodata None -vrtnodata 255 \
              -input_file_list tiles.txt epoch_$y.vrt
          done
          gdalbuildvrt -q -separate stack9.vrt $(for y in "${YEARS[@]}"; do echo epoch_$y.vrt; done)
          python3 - <<'PY'
          from osgeo import gdal
          ds = gdal.Open("stack9.vrt", gdal.GA_Update)
          for i, y in enumerate([1985,1990,1995,2000,2005,2010,2015,2020,2025], 1):
              b = ds.GetRasterBand(i); b.SetDescription(f"mangrove_{y}"); b.SetNoDataValue(255)
          ds = None
          PY
          gdal_translate stack9.vrt gmw-v4-1-12-extent-cog.tif -of COG \
            -co COMPRESS=DEFLATE -co BLOCKSIZE=512 -co SPARSE_OK=TRUE \
            -co NUM_THREADS=ALL_CPUS -co BIGTIFF=YES -co OVERVIEW_RESAMPLING=NEAREST
          gdalinfo gmw-v4-1-12-extent-cog.tif | head -40
          ls -la gmw-v4-1-12-extent-cog.tif
          rclone copyto gmw-v4-1-12-extent-cog.tif \
            nrp:public-wetlands/global-mangrove-watch-v4-1-12/gmw-v4-1-12-extent-cog.tif --s3-no-check-bucket
        resources:
          requests: {cpu: '16', memory: 48Gi, ephemeral-storage: 50Gi}
          limits:   {cpu: '16', memory: 48Gi, ephemeral-storage: 50Gi}
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
