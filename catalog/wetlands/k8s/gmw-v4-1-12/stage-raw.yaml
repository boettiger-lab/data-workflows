# GMW v4.1.12 (data-workflows #443): stage upstream Zenodo files to NRP raw/.
apiVersion: batch/v1
kind: Job
metadata:
  name: gmw-v4-1-12-stage-raw
  namespace: geo-workflows
  labels:
    k8s-app: gmw-v4-1-12-stage-raw
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        k8s-app: gmw-v4-1-12-stage-raw
    spec:
      priorityClassName: opportunistic
      restartPolicy: Never
      containers:
      - name: stage
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          BASE=https://zenodo.org/api/records/21346457/files
          DEST=nrp:public-wetlands/raw/gmw-v4-1-12/
          mkdir -p /tmp/gmw && cd /tmp/gmw
          for f in gmw_mng_ext_v4112_stack.tar.gz \
                   gmw_v4_timeseries_4112_gmw_country_stats_corr_area_formatted.xlsx \
                   gmw_v4112_tiles.geojson README.txt; do
            echo "Downloading $f ..."
            curl -fL --retry 5 --retry-delay 10 -o "$f" "$BASE/$f/content"
          done
          # Integrity: Zenodo md5 checksums
          curl -fsS https://zenodo.org/api/records/21346457 | python3 -c '
          import json,sys,hashlib
          d=json.load(sys.stdin)
          for f in d["files"]:
              try: h=hashlib.md5(open(f["key"],"rb").read()).hexdigest()
              except FileNotFoundError: continue
              ok = "md5:"+h == f["checksum"]
              print(f["key"], "OK" if ok else "MISMATCH"); assert ok'
          rclone copy /tmp/gmw "$DEST" --s3-no-check-bucket --retries 5
          rclone ls "$DEST"
        resources:
          requests: {cpu: '2', memory: 4Gi, ephemeral-storage: 8Gi}
          limits:   {cpu: '2', memory: 4Gi, ephemeral-storage: 8Gi}
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
