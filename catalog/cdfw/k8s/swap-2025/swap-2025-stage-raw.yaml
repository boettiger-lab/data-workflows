apiVersion: batch/v1
kind: Job
metadata:
  name: swap-2025-stage-raw
  labels:
    k8s-app: swap-2025-stage-raw
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: swap-2025-stage-raw
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: stage-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: script
          mountPath: /opt/scripts
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          TS3=https://services2.arcgis.com/Uq9r85Potqm3MfRV/arcgis/rest/services/SWAP_target_strategy_v3_gdb/FeatureServer
          SGCN=https://services2.arcgis.com/Uq9r85Potqm3MfRV/arcgis/rest/services/SWAP_SGCN_V4_gdb/FeatureServer
          REF=https://services2.arcgis.com/Uq9r85Potqm3MfRV/arcgis/rest/services/SWAP_Reference_Layers_WFL1/FeatureServer
          FS=/opt/scripts/fs2geojson.py

          echo "=== vector layers -> geojson ==="
          python3 $FS $TS3/1   /tmp/provinces.geojson                  --page 500
          python3 $FS $TS3/0   /tmp/conservation-units.geojson         --page 500
          python3 $FS $SGCN/0  /tmp/sgcn-ranges.geojson                --page 50
          python3 $FS $REF/5   /tmp/marine-bioregions.geojson          --page 500
          python3 $FS $REF/4   /tmp/noaa-esu-dps.geojson               --page 500
          python3 $FS $REF/0   /tmp/bay-delta-conservation-unit.geojson --page 500

          echo "=== tables -> ndjson ==="
          python3 $FS $TS3/3   /tmp/targets.json             --table --page 1000
          python3 $FS $TS3/2   /tmp/strategies.json          --table --page 1000
          python3 $FS $SGCN/1  /tmp/sgcn-species.json        --table --page 2000
          python3 $FS $SGCN/4  /tmp/sgcn-species-units.json  --table --page 2000

          echo "=== stage to raw/ ==="
          for f in /tmp/*.geojson /tmp/*.json; do
            b=$(basename "$f")
            rclone copyto "$f" "nrp:public-cdfw/raw/swap-2025-$b" -v
          done
          echo "=== staged files ==="
          rclone lsf nrp:public-cdfw/raw/ | grep '^swap-2025-'
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
          limits:
            cpu: '2'
            memory: 8Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: script
        configMap:
          name: swap-2025-scripts
