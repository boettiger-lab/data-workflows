apiVersion: batch/v1
kind: Job
metadata:
  name: swap-2025-tables-convert
  labels:
    k8s-app: swap-2025-tables-convert
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: swap-2025-tables-convert
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: tables-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          for t in targets strategies sgcn-species sgcn-species-units; do
            echo "=== $t ==="
            rclone copyto "nrp:public-cdfw/raw/swap-2025-$t.json" "/tmp/$t.json" -v
            # ArcGIS attribute rows (newline-delimited JSON) -> parquet, with a
            # universal per-row _cng_fid (fact tables; #369 uniform key intent).
            duckdb -c "COPY (
              SELECT row_number() OVER () AS _cng_fid, *
              FROM read_json('/tmp/$t.json', format='newline_delimited', auto_detect=true)
            ) TO '/tmp/$t.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);"
            rclone copyto "/tmp/$t.parquet" "nrp:public-cdfw/swap-2025/$t.parquet" -v
            echo "rows:"; duckdb -c "SELECT COUNT(*) FROM read_parquet('/tmp/$t.parquet');"
          done
          echo "DONE"
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
          limits:
            cpu: '2'
            memory: 8Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
