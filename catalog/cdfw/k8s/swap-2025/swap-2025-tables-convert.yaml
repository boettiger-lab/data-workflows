apiVersion: batch/v1
kind: Job
metadata:
  name: swap-2025-tables-convert
  labels:
    k8s-app: swap-2025-tables-convert
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: swap-2025-tables-convert
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: tables-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: script
          mountPath: /opt/scripts
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          for t in targets strategies sgcn-species sgcn-species-units; do
            echo "=== $t ==="
            rclone copyto "nrp:public-cdfw/raw/swap-2025-$t.json" "/tmp/$t.json" -v
            python3 /opt/scripts/tables2parquet.py "/tmp/$t.json" "/tmp/$t.parquet"
            rclone copyto "/tmp/$t.parquet" "nrp:public-cdfw/swap-2025/$t.parquet" -v
          done
          echo "DONE"
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
          limits:
            cpu: '2'
            memory: 8Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: script
        configMap:
          name: swap-2025-scripts
