apiVersion: batch/v1
kind: Job
metadata:
  name: ace-terrestrial-biodiversity-summary-hex-chunk29
  labels:
    k8s-app: ace-terrestrial-biodiversity-summary-hex-chunk29
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: ace-terrestrial-biodiversity-summary-hex-chunk29
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - prp-gpu-2.t2.ucsd.edu
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-cdfw
        - name: DATASET
          value: ace-terrestrial-biodiversity-summary
        command:
        - bash
        - -c
        - |-
          set -e
          cng-datasets vector --input s3://public-cdfw/ace/terrestrial-biodiversity-summary.parquet --output s3://public-cdfw/ace/terrestrial-biodiversity-summary/chunks --chunk-id 29 --chunk-size 320 --intermediate-chunk-size 10 --resolution 8 --parent-resolutions 0
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
          limits:
            cpu: '4'
            memory: 8Gi
