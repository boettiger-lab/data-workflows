apiVersion: batch/v1
kind: Job
metadata:
  name: american-rivers-preprocess-remaining
  namespace: biodiversity
  labels:
    k8s-app: american-rivers-preprocess-remaining
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: american-rivers-preprocess-remaining
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - "true"
      containers:
      - name: preprocess
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
          limits:
            memory: "16Gi"
            cpu: "4"
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: "rook-ceph-rgw-nautiluss3.rook"
        - name: AWS_PUBLIC_ENDPOINT
          value: "s3-west.nrp-nautilus.io"
        - name: AWS_HTTPS
          value: "false"
        - name: AWS_VIRTUAL_HOSTING
          value: "FALSE"
        - name: BUCKET
          value: "public-rivers"
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e

          # Helper: download via ESRIJSON driver with retries (handles pagination automatically)
          download_esrijson() {
            local esrijson_url="$1"
            local outfile="$2"
            local layer="$3"
            for attempt in 1 2 3 4 5; do
              rm -f "$outfile"
              echo "  Attempt $attempt: downloading $layer..."
              if ogr2ogr -f GPKG "$outfile" "$esrijson_url" -nln "$layer" -progress; then
                echo "  ✓ Download complete"
                return 0
              fi
              echo "  Failed, retrying in 60s..."
              sleep 60
            done
            echo "All attempts failed for $layer"
            exit 1
          }

          # ── IRA Drinking Water Watersheds (Polygon) ───────────────────────────
          echo "=== IRA Drinking Water Watersheds ==="
          download_esrijson \
            "ESRIJSON:https://services9.arcgis.com/90v9hhDSTUTen7c9/arcgis/rest/services/IRA_influenced_drinking_water/FeatureServer/0/query?where=1=1&outFields=*&returnGeometry=true&f=json" \
            "/tmp/ira-watersheds.gpkg" \
            "ira_watersheds"
          rclone copyto /tmp/ira-watersheds.gpkg nrp:public-rivers/american-rivers/raw/ira-watersheds.gpkg
          cng-convert-to-parquet /tmp/ira-watersheds.gpkg \
            s3://public-rivers/american-rivers/ira-watersheds.parquet \
            --compression ZSTD --compression-level 15
          echo "✓ IRA watersheds done"

          # ── ROO/CJEST Tracts (Polygon) ────────────────────────────────────────
          echo "=== ROO/CJEST Tracts ==="
          download_esrijson \
            "ESRIJSON:https://services9.arcgis.com/90v9hhDSTUTen7c9/arcgis/rest/services/ROO_CJEST_rev/FeatureServer/0/query?where=1=1&outFields=*&returnGeometry=true&f=json" \
            "/tmp/roo-cjest.gpkg" \
            "roo_cjest"
          rclone copyto /tmp/roo-cjest.gpkg nrp:public-rivers/american-rivers/raw/roo-cjest.gpkg
          cng-convert-to-parquet /tmp/roo-cjest.gpkg \
            s3://public-rivers/american-rivers/roo-cjest.parquet \
            --compression ZSTD --compression-level 15
          echo "✓ ROO/CJEST done"

          echo "=== All preprocessing complete ==="
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
