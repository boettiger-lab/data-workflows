# HAND-ROLLED: the generator does not write STAC or retire collections (#976). Builds the final
# SGCN ranges collection and README from the live collection with make_collection.py, uploads
# them with the default style through the publish guard, removes the retired v4 tables
# (sgcn-species, sgcn-species-units) from the public-swap/california catalog, then deletes
# their files. Uploads the thumbnail when the ConfigMap carries one. Re-runnable: unchanged
# files are not re-uploaded and already-deleted files are skipped.
#   kubectl create configmap sgcn-final-publish -n geo-workflows \
#     --from-file=make_collection.py=catalog/swap/california/k8s/swap-2025/sgcn-final/make_collection.py \
#     --from-file=sgcn-ranges-taxonomic-group.json=catalog/swap/california/k8s/swap-2025/sgcn-final/sgcn-ranges-taxonomic-group.json \
#     --from-file=guard.py=scripts/stac-publish-guard.py \
#     [--from-file=thumbnail.png=DIR/thumbnail.png]
#   kubectl create -f catalog/swap/california/k8s/swap-2025/sgcn-final/publish-stac.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: sgcn-final-publish
  namespace: geo-workflows
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      automountServiceAccountToken: false
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets@sha256:246dc706ea34728a75c0bf1bc8589fd8f5c2e6526876f6c7192660a272cec1b3
        resources:
          requests: {cpu: '1', memory: 1Gi}
          limits: {cpu: '1', memory: 1Gi}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: in, mountPath: /in, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          B=public-swap/california
          D=$B/swap-2025
          put() {  # put <local> <path>: upload when it differs from the live object
            if rclone cat "nrp:$2" 2>/dev/null | cmp -s - "$1"; then echo "unchanged $2"
            else cp -L "$1" /tmp/upload && rclone copyto /tmp/upload "nrp:$2" $R && echo "uploaded $2"; fi
          }
          HEX=$(rclone lsjson "nrp:$D/sgcn-ranges/hex/" -R --files-only \
                | python3 -c "import json,sys; print(max(x['ModTime'] for x in json.load(sys.stdin))[:19] + 'Z')")
          echo "hex created $HEX"
          rclone cat "nrp:$D/sgcn-ranges/stac-collection.json" > /tmp/live.json
          python3 /in/make_collection.py ranges /tmp/live.json /tmp/c.json "$HEX" /tmp/README.md
          python3 /in/guard.py /tmp/c.json /tmp/live.json
          put /in/sgcn-ranges-taxonomic-group.json "$D/sgcn-ranges/styles/sgcn-ranges-taxonomic-group.json"
          put /tmp/README.md "$D/sgcn-ranges/README.md"
          [ -e /in/thumbnail.png ] && put /in/thumbnail.png "$D/sgcn-ranges/thumbnail.png"
          put /tmp/c.json "$D/sgcn-ranges/stac-collection.json"
          rclone cat "nrp:$B/stac-collection.json" > /tmp/plive.json
          python3 /in/make_collection.py parent /tmp/plive.json /tmp/p.json
          python3 /in/guard.py /tmp/p.json /tmp/plive.json
          put /tmp/p.json "$B/stac-collection.json"
          for r in sgcn-species sgcn-species-units; do
            for f in "$D/$r.parquet" "$D/$r/stac-collection.json"; do
              if rclone lsf "nrp:$f" >/dev/null 2>&1 && [ -n "$(rclone lsf "nrp:$f")" ]; then
                rclone deletefile "nrp:$f" $R && echo "deleted $f"
              else echo "absent $f"; fi
            done
          done
          rclone lsf "nrp:$D/" | grep sgcn
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: in, configMap: {name: sgcn-final-publish}}
