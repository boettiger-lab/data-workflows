# HAND-ROLLED: the generator does not write STAC. Metadata for #1047: edits the LIVE
# collection in place via set_province_cu.py (asserts every passage it touches).
#   kubectl create configmap sgcn-stac-1047-script -n geo-workflows \
#     --from-file=set_province_cu.py=catalog/swap/california/k8s/sgcn-province-cu-1047/set_province_cu.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/swap/california/k8s/sgcn-province-cu-1047/sgcn-ranges-publish-stac-1047.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: sgcn-ranges-publish-stac-1047
  namespace: geo-workflows
  labels: {k8s-app: sgcn-ranges-publish-stac-1047}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: sgcn-ranges-publish-stac-1047}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }

          P=nrp:public-swap/california/swap-2025/sgcn-ranges/stac-collection.json
          rclone cat "$P" > /tmp/c.json
          python3 /script/set_province_cu.py /tmp/c.json
          guard_stac /tmp/c.json "$P"
          rclone copyto /tmp/c.json "$P" $R
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: sgcn-stac-1047-script}}
