apiVersion: batch/v1
kind: Job
metadata:
  name: nevada-stage-raw
  labels:
    k8s-app: nevada-stage-raw
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: nevada-stage-raw
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: stage-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: script
          mountPath: /opt/scripts
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          B=https://services.arcgis.com/RyxlXSfFi87rAosq/arcgis/rest/services
          FS=/opt/scripts/fs2geojson.py
          python3 $FS $B/Nevada_State_Wildlife_Action_Plan_Species_Distributions_Layer/FeatureServer/0 /tmp/species-distributions.geojson --page 20
          python3 $FS $B/keyhab_merge/FeatureServer/0 /tmp/key-habitats.geojson --page 500
          for f in /tmp/*.geojson; do
            rclone copyto "$f" "nrp:public-swap/nevada/raw/swap-2022-$(basename $f)" -v
          done
          rclone lsf nrp:public-swap/nevada/raw/ | grep '^swap-2022-'
        resources:
          requests: {cpu: '2', memory: 8Gi}
          limits: {cpu: '2', memory: 8Gi}
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: script
        configMap:
          name: nvmo-scripts
