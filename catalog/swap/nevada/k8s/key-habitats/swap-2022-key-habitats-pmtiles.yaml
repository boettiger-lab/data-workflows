apiVersion: batch/v1
kind: Job
metadata:
  name: swap-2022-key-habitats-pmtiles
  namespace: geo-workflows
  labels:
    k8s-app: swap-2022-key-habitats-pmtiles
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: swap-2022-key-habitats-pmtiles
    spec:
      restartPolicy: Never
      containers:
      - name: pmtiles-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: TMPDIR
          value: /tmp
        - name: BUCKET
          value: public-swap
        - name: DATASET
          value: key-habitats
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          # Final GeoParquet (has _cng_fid), localized over the internal endpoint (#741)
          ulimit -n 65536 || true
          rclone copyto nrp:public-swap/nevada/swap-2022/key-habitats.parquet /tmp/$DATASET.parquet
          ogr2ogr -wrapdateline -datelineoffset 15 -f GeoJSONSeq /tmp/$DATASET.geojsonl /tmp/$DATASET.parquet -progress
          rm /tmp/$DATASET.parquet

          # Generate PMTiles from GeoJSONSeq
          # TIPPECANOE_MAX_THREADS must be a power of 2; Kubernetes nodes can expose
          # non-power-of-2 logical CPU counts which triggers an internal assertion
          # failure "N shards not a power of 2" (felt/tippecanoe#216).
          # Round detected CPU count down to nearest power of 2 to preserve I/O parallelism.
          # Must be `export`ed: tippecanoe is a child process and reads this from the
          # environment, not the shell. A plain assignment is invisible to it, so it
          # falls back to the raw (non-power-of-2) CPU count and crashes (issue #77).
          export TIPPECANOE_MAX_THREADS=$(python3 -c "import os; n=os.cpu_count() or 1; print(1<<(n.bit_length()-1))")
          tippecanoe -o /tmp/$DATASET.pmtiles -l $DATASET --coalesce-densest-as-needed --drop-densest-as-needed -z 11 --force /tmp/$DATASET.geojsonl

          # Refuse to publish tiles without _cng_fid
          python3 - <<'PY'
          import gzip, json, os, struct
          f = open(f"/tmp/{os.environ['DATASET']}.pmtiles", "rb"); h = f.read(127)
          mo, ml = struct.unpack_from("<QQ", h, 24); f.seek(mo); m = f.read(ml)
          md = json.loads(gzip.decompress(m) if h[97] == 2 else m)
          fields = {k for l in md["vector_layers"] for k in l.get("fields", {})}
          print("layers", [l["id"] for l in md["vector_layers"]], "zoom", h[100], h[101], "fields", sorted(fields))
          assert "_cng_fid" in fields
          PY

          # Upload to S3 using rclone
          rclone copy /tmp/$DATASET.pmtiles nrp:public-swap/nevada/swap-2022/
          rm /tmp/$DATASET.geojsonl /tmp/$DATASET.pmtiles
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
          limits:
            cpu: '4'
            memory: 32Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
