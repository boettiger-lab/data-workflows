# HAND-ROLLED: the generator does not write STAC; this follows the publish-stac pattern of
# catalog/pesticides/k8s/tang-2021/tang-2021-publish-stac.yaml (#882).
#
# Steps 5-6: publish the invest-peru-2019 carbon collection and the
# invest-peru-2019/habitat-quality collection (provisional; its own collection so the label
# applies to those layers only, agreed 2026-11-12) with their READMEs, copy the model tables
# beside them, and add a child link for each to the public-ncp bucket collection. Runs gen_stac.py
# (committed beside this file) from a ConfigMap, so the committed script is the single source:
#   kubectl create configmap invest-peru-2019-stac-script -n geo-workflows \
#     --from-file=gen_stac.py=catalog/ncp/k8s/invest-peru-2019/gen_stac.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/ncp/k8s/invest-peru-2019/invest-peru-2019-publish-stac.yaml
#
# carbon_pools.csv, threats.csv and sensitivity.csv are copied out of raw/derived/ so no table
# asset points under raw/ (the raw/ prefix is excluded from mirrors by asset href).
#
# The parent is patched, not rewritten: the gate asserts every existing parent field and link
# survives and at most two links are added, and the children are uploaded before the parent
# links them.
apiVersion: batch/v1
kind: Job
metadata:
  name: invest-peru-2019-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: invest-peru-2019-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: invest-peru-2019-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}]}
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script, mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          # stac-publish-guard.py (#890): keep the live styles, renders and rel pmtiles links; refuse a
          # file that would drop the live column dictionary or revert an asset-key rename.
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }

          rclone copyto nrp:public-ncp/raw/derived/invest-peru-2019/carbon/carbon_pools.csv \
            nrp:public-ncp/invest-peru-2019/carbon_pools.csv $R
          for f in threats.csv sensitivity.csv; do
            rclone copyto nrp:public-ncp/raw/derived/invest-peru-2019/habitat-quality/$f \
              nrp:public-ncp/invest-peru-2019/habitat-quality/$f $R
          done

          # Sizes, MD5s and created times are read from the objects (#417). Paths are made
          # bucket-relative so gen_stac.py can look up both prefixes.
          rclone lsjson --hash -R nrp:public-ncp/invest-peru-2019/ > /tmp/a.json
          rclone lsjson --hash -R nrp:public-ncp/raw/fao-gez-2010/ > /tmp/b.json
          python3 - <<'PY'
          import json
          a = [dict(r, Path="invest-peru-2019/" + r["Path"]) for r in json.load(open("/tmp/a.json"))]
          b = [dict(r, Path="raw/fao-gez-2010/" + r["Path"]) for r in json.load(open("/tmp/b.json"))]
          json.dump(a + b, open("/tmp/objects.json", "w"))
          PY
          rclone copyto nrp:public-ncp/stac-collection.json /tmp/parent.json $R

          python3 /script/gen_stac.py /tmp/stac /tmp/objects.json /tmp/parent.json
          find /tmp/stac -type f | sort

          python3 - <<'PY'
          import json
          old = json.load(open("/tmp/parent.json"))
          new = json.load(open("/tmp/stac/stac-collection.json"))
          assert {k: v for k, v in old.items() if k != "links"} == \
                 {k: v for k, v in new.items() if k != "links"}, "parent fields changed"
          assert new["links"][:len(old["links"])] == old["links"], "existing parent links changed"
          assert len(new["links"]) - len(old["links"]) in (0, 1, 2), "more than two links added"
          c = json.load(open("/tmp/stac/invest-peru-2019/stac-collection.json"))
          assert c["license"] == "CC-BY-4.0" and len(c["assets"]) == 5, (c["license"], len(c["assets"]))
          assert len(c["renders"]) == 2 and len(c["table:columns"]) == 5, (len(c["renders"]), len(c["table:columns"]))
          h = json.load(open("/tmp/stac/invest-peru-2019/habitat-quality/stac-collection.json"))
          assert h["license"] == "CC-BY-4.0" and len(h["assets"]) == 6, (h["license"], len(h["assets"]))
          assert len(h["renders"]) == 2 and len(h["table:columns"]) == 5, (len(h["renders"]), len(h["table:columns"]))
          assert "provisional" in h["title"].lower() and h["description"].startswith("**Provisional"), h["title"]
          print("gate OK:", len(old["links"]), "->", len(new["links"]), "parent links")
          PY

          guard_stac /tmp/stac/invest-peru-2019/stac-collection.json nrp:public-ncp/invest-peru-2019/stac-collection.json
          rclone copyto /tmp/stac/invest-peru-2019/stac-collection.json nrp:public-ncp/invest-peru-2019/stac-collection.json $R
          rclone copyto /tmp/stac/invest-peru-2019/README.md nrp:public-ncp/invest-peru-2019/README.md $R
          guard_stac /tmp/stac/invest-peru-2019/habitat-quality/stac-collection.json nrp:public-ncp/invest-peru-2019/habitat-quality/stac-collection.json
          rclone copyto /tmp/stac/invest-peru-2019/habitat-quality/stac-collection.json nrp:public-ncp/invest-peru-2019/habitat-quality/stac-collection.json $R
          rclone copyto /tmp/stac/invest-peru-2019/habitat-quality/README.md nrp:public-ncp/invest-peru-2019/habitat-quality/README.md $R
          guard_stac /tmp/stac/stac-collection.json nrp:public-ncp/stac-collection.json
          rclone copyto /tmp/stac/stac-collection.json nrp:public-ncp/stac-collection.json $R
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: invest-peru-2019-stac-script}}
