# HAND-ROLLED: a one-off measurement, not a build step; the generator has no analysis jobs (#882).
#
# InVEST Peru (#882): measure the two candidate rules for turning the 10 m FDAP 2024 cocoa
# probability into a cocoa class on the 100 m CGLS-LC100 grid, before one is chosen:
#   (a) the mean of the 10 m probabilities in the 100 m pixel is >= 0.5
#   (b) more than half of the valid 10 m sub-pixels in the 100 m pixel are >= 0.5
# Also reports the 10 m reference area (every 10 m pixel >= 0.5). Each of the 12 indexes takes
# one latitude strip of the CGLS grid over Peru; gdalwarp -r average weights sub-pixels by their
# overlap with the 100 m pixel. Areas are spherical (R = 6371.0088 km). Results go to the log
# only, one JSON line per strip.
#
#   kubectl apply -n geo-workflows -f catalog/ncp/k8s/invest-peru-2019/measure-cocoa-rules.yaml
#   kubectl -n geo-workflows logs -l job-name=invest-peru-2019-measure-cocoa-rules --tail=-1 | grep '^RESULT'
apiVersion: batch/v1
kind: Job
metadata:
  name: invest-peru-2019-measure-cocoa-rules
  namespace: geo-workflows
  labels: {k8s-app: invest-peru-2019-measure-cocoa-rules}
spec:
  completionMode: Indexed
  completions: 12
  parallelism: 12
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {k8s-app: invest-peru-2019-measure-cocoa-rules}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 3600
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            # nrp-c17 hung on the image pull for every pod on 2026-11-10.
            - {matchExpressions: [{key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ['true']}, {key: kubernetes.io/hostname, operator: NotIn, values: [nrp-c17.nysernet.org]}]}
      containers:
      - name: measure
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_HTTPS, value: "false"}
        - {name: AWS_VIRTUAL_HOSTING, value: "FALSE"}
        - {name: AWS_NO_SIGN_REQUEST, value: "YES"}
        - {name: GDAL_CACHEMAX, value: "256"}
        command:
        - python3
        - -c
        - |
          import json, math, os, subprocess
          import numpy as np
          from osgeo import gdal
          gdal.UseExceptions()
          SRC = "/vsis3/public-commodities/fdap-2025b/cocoa-peru-2024-cog.tif"
          RES = 1 / 1008                      # CGLS-LC100 pixel, origin (-180, 80)
          N, i = 12, int(os.environ["JOB_COMPLETION_INDEX"])
          src = gdal.Open(SRC)
          gx, sx, _, gy, _, sy = src.GetGeoTransform()
          W, H = src.RasterXSize, src.RasterYSize
          # Peru on the CGLS grid, snapped outward to whole CGLS pixels
          c0 = math.floor((gx + 180) / RES); c1 = math.ceil((gx + W * sx + 180) / RES)
          r0 = math.floor((80 - gy) / RES);  r1 = math.ceil((80 - (gy + H * sy)) / RES)
          rows = r1 - r0; a_ = r0 + rows * i // N; b_ = r0 + rows * (i + 1) // N
          xmin, xmax = -180 + c0 * RES, -180 + c1 * RES
          ymax, ymin = 80 - a_ * RES, 80 - b_ * RES
          # the 10 m strip, with a margin so every overlapping sub-pixel is included
          run = lambda *a: subprocess.run(a, check=True)
          m = 2 * RES
          # clamped to the source extent: gdal_translate fills outside it with 0, which would read as p = 0
          pw = [max(xmin - m, gx), min(ymax + m, gy), min(xmax + m, gx + W * sx), max(ymin - m, gy + H * sy)]
          run("gdal_translate", "-q", "-projwin", *map(str, pw),
              "-co", "TILED=YES", "-co", "COMPRESS=DEFLATE", "-co", "BIGTIFF=YES", SRC, "/tmp/c10.tif")
          # 10 m binary: 1 where p >= 0.5, 0 where p < 0.5, 255 where no data; plus 10 m reference area
          c10 = gdal.Open("/tmp/c10.tif"); b = c10.GetRasterBand(1)
          cgt = c10.GetGeoTransform(); cw, ch = c10.RasterXSize, c10.RasterYSize
          drv = gdal.GetDriverByName("GTiff")
          out = drv.Create("/tmp/bin10.tif", cw, ch, 1, gdal.GDT_Byte,
                           ["TILED=YES", "COMPRESS=DEFLATE", "BIGTIFF=YES"])
          out.SetGeoTransform(cgt); out.SetProjection(c10.GetProjection())
          ob = out.GetRasterBand(1); ob.SetNoDataValue(255)
          R = 6371.0088; dlon = math.radians(abs(cgt[1]))
          ref_km2 = 0.0
          for y in range(0, ch, 128):
              n = min(128, ch - y)
              p = b.ReadAsArray(0, y, cw, n)
              v = (p >= 0.5).view(np.uint8); v[np.isnan(p)] = 255; del p
              ob.WriteArray(v, 0, y)
              lat_top = cgt[3] + y * cgt[5]
              lats = lat_top + np.arange(n + 1) * cgt[5]
              ra = R * R * dlon * np.abs(np.diff(np.sin(np.radians(lats))))
              # count only 10 m pixels whose centre lies inside this CGLS strip, so strips don't overlap
              cy = lat_top + (np.arange(n) + 0.5) * cgt[5]
              cx = cgt[0] + (np.arange(cw) + 0.5) * cgt[1]
              rin = (cy <= ymax) & (cy > ymin); cin = (cx >= xmin) & (cx < xmax)
              ref_km2 += float(((v == 1)[rin][:, cin].sum(axis=1) * ra[rin]).sum())
          out = None; c10 = None
          te = [str(xmin), str(ymin), str(xmax), str(ymax)]; tr = [str(RES), str(RES)]
          run("gdalwarp", "-q", "-r", "average", "-te", *te, "-tr", *tr, "-wm", "256",
              "-dstnodata", "nan", "-ot", "Float32", "/tmp/c10.tif", "/tmp/a.tif")
          run("gdalwarp", "-q", "-r", "average", "-te", *te, "-tr", *tr, "-wm", "256",
              "-srcnodata", "255", "-dstnodata", "nan", "-ot", "Float32", "/tmp/bin10.tif", "/tmp/b.tif")
          A = gdal.Open("/tmp/a.tif").ReadAsArray(); B = gdal.Open("/tmp/b.tif").ReadAsArray()
          lats = ymax - np.arange(A.shape[0] + 1) * RES
          ra = R * R * math.radians(RES) * np.abs(np.diff(np.sin(np.radians(lats))))
          ia = A >= 0.5; ib = B > 0.5          # NaN compares False
          km2 = lambda mask: float((mask.sum(axis=1) * ra).sum())
          print("RESULT " + json.dumps({
              "strip": i, "ymax": round(ymax, 4), "ymin": round(ymin, 4),
              "px_a": int(ia.sum()), "px_b": int(ib.sum()), "px_both": int((ia & ib).sum()),
              "px_a_only": int((ia & ~ib).sum()), "px_b_only": int((ib & ~ia).sum()),
              "km2_a": km2(ia), "km2_b": km2(ib), "km2_both": km2(ia & ib),
              "km2_ref_10m": ref_km2, "px_valid": int((~np.isnan(A)).sum())}), flush=True)
        resources:
          requests: {cpu: '2', memory: 8Gi, ephemeral-storage: 20Gi}
          limits:   {cpu: '2', memory: 8Gi, ephemeral-storage: 20Gi}
