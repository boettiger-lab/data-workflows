# Creates the public-obis bucket. MUST complete before any staging or hex job:
# the bucket does not exist until this runs, and rclone --s3-no-check-bucket would
# transfer for many minutes and only then fail with NoSuchBucket (AGENTS.md Step 1b).
apiVersion: batch/v1
kind: Job
metadata:
  name: obis-setup-bucket
  namespace: geo-workflows
  labels:
    k8s-app: obis-setup-bucket
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: obis-setup-bucket
    spec:
      restartPolicy: Never
      containers:
      - name: setup-bucket-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: BUCKET
          value: public-obis
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -e
          cng-datasets storage setup-bucket --bucket "${BUCKET}" --remote nrp --verify
          echo "Bucket setup complete"
        resources:
          requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
          limits:   {cpu: "2", memory: 4Gi, ephemeral-storage: 4Gi}
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
