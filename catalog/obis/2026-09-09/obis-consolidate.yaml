# OBIS 2026-09-09 Stage 2: one file per h0 -> 2026-09-09/hex/h0=<int>/data_0.parquet
# Run AFTER obis-2026-09-09-hex completes. completions=122 (one per h0 cell);
# indices beyond the number of populated partitions exit 0.
apiVersion: batch/v1
kind: Job
metadata:
  name: obis-2026-09-09-consolidate
  namespace: geo-workflows
  labels:
    k8s-app: obis-2026-09-09-consolidate
spec:
  completions: 122
  parallelism: 30
  completionMode: Indexed
  backoffLimitPerIndex: 5
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: obis-2026-09-09-consolidate
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values: ["true"]
      containers:
        - name: consolidate
          image: ghcr.io/boettiger-lab/datasets:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
            - name: AWS_S3_ENDPOINT
              value: "rook-ceph-rgw-nautiluss3.rook"
            - name: AWS_PUBLIC_ENDPOINT
              value: "s3-west.nrp-nautilus.io"
            - name: AWS_HTTPS
              value: "false"
            - name: AWS_VIRTUAL_HOSTING
              value: "FALSE"
            - name: TMPDIR
              value: "/tmp"
            - name: DUCKDB_MEMORY_LIMIT
              value: "40GB"
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          resources:
            requests: {cpu: "4", memory: 48Gi, ephemeral-storage: 30Gi}
            limits:   {cpu: "4", memory: 48Gi, ephemeral-storage: 30Gi}
          command:
            - bash
            - -lc
            - |
              pip install -q boto3
              python3 -u /scripts/consolidate_h0_partitions.py
      volumes:
        - name: scripts
          configMap:
            name: obis-2026-09-09-scripts
