apiVersion: batch/v1
kind: Job
metadata: {name: rap-bio-publish-stac, namespace: geo-workflows, labels: {k8s-app: rap-bio-publish-stac}}
spec:
  completions: 1
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {k8s-app: rap-bio-publish-stac}}
    spec:
      restartPolicy: Never
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        env:
        - {name: RCLONE_CONFIG, value: /root/.config/rclone/rclone.conf}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: stac, mountPath: /stac, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          keep_styles() {  # #881: replacing a live collection must not drop its default style assets or renders
            case "$2" in *.json) ;; *) return 0 ;; esac
            mkdir -p /tmp/keep-styles
            rclone cat "$2" > /tmp/keep-styles/live.json 2>/dev/null || return 0
            python3 -c '
          import json, sys
          try:
              new = json.load(open(sys.argv[1])); live = json.load(open(sys.argv[2]))
          except Exception:
              sys.exit(0)
          kept = {k: a for k, a in live.get("assets", {}).items()
                  if "style" in (a.get("roles") or []) and k not in new.setdefault("assets", {})}
          new["assets"].update(kept)
          renders = {k: v for k, v in live.get("renders", {}).items() if k not in new.get("renders", {})}
          if renders:
              new.setdefault("renders", {}).update(renders)
          for e in live.get("stac_extensions", []):
              if "/render/" in e and e not in new.setdefault("stac_extensions", []):
                  new["stac_extensions"].append(e)
          if kept or renders:
              json.dump(new, open(sys.argv[1], "w"), indent=2)
              print(f"  kept {len(kept)} style asset(s) and {len(renders)} render(s) from the live collection")
          ' "$1" /tmp/keep-styles/live.json
          }
          # ConfigMap keys are symlinks into ..data/; rclone will not follow them.
          mkdir -p /tmp/stac && cp -L /stac/* /tmp/stac/
          for f in /tmp/stac/*.json; do python3 -c "import json;json.load(open('$f'))"; done

          keep_styles /tmp/stac/rap-pfg-biomass-stac-collection.json nrp:public-rap/rap-pfg-biomass/stac-collection.json
          rclone copyto --s3-no-check-bucket /tmp/stac/rap-pfg-biomass-stac-collection.json \
            nrp:public-rap/rap-pfg-biomass/stac-collection.json
          keep_styles /tmp/stac/parent-stac-collection.json nrp:public-rap/stac-collection.json
          rclone copyto --s3-no-check-bucket /tmp/stac/parent-stac-collection.json \
            nrp:public-rap/stac-collection.json

          echo "=== live ==="
          rclone cat nrp:public-rap/rap-pfg-biomass/stac-collection.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(' ', d['id'], '|', d['license'], '|', d['extent']['spatial']['bbox'][0])"
          rclone cat nrp:public-rap/stac-collection.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('  parent children:', len([l for l in d['links'] if l.get('rel')=='child']))"
          echo "published"
        resources: {requests: {cpu: '1', memory: 2Gi}, limits: {cpu: '1', memory: 2Gi}}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: stac, configMap: {name: rap-bio-stac}}
