# Issue #666 (defect 1) + #667: the published rap-pfg-cover-cog.tif is the raw 6-band RAP v3
# vegetation-cover stack -- the band subset never happened. TiTiler cannot colormap it
# ("Source data must be 1 band"), and because the hex step was handed this multi-band file with
# no band selection it silently read BAND 1, so the published "pfg" hex is actually AFG (#666
# defect 3).
#
# This job produces BOTH single-band COGs from the existing published COG (already reprojected to
# WGS84 with overviews, so extracting preserves georeferencing exactly and keeps the new AFG
# partitions consistent with the migrated ones):
#   band 1 -> rap-afg-cover-cog.tif   (annual forb & grass, #667)
#   band 4 -> rap-pfg-cover-cog.tif   (perennial forb & grass, #666 -- replaces the 6-band file)
#
# BIGTIFF=YES is REQUIRED, not defensive: a single band of this raster is ~6.6 GB, past the
# 4 GB classic-TIFF limit. The COG driver's default sizing guessed wrong on compressed
# output and the first run died ~70% through with
#   ERROR 1: TIFFAppendToStrip:Maximum TIFF file size exceeded. Use BIGTIFF=YES
#
# Safe to overwrite rap-pfg-cover-cog.tif: the upstream original is staged at
# s3://public-rap/raw/vegetation-cover-v3-2025.tif (37.59 GB). Both extracts complete before
# either upload, so a failure cannot leave the bucket half-updated.
apiVersion: batch/v1
kind: Job
metadata:
  name: rap-extract-bands
  namespace: geo-workflows
  labels: {k8s-app: rap-extract-bands}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {k8s-app: rap-extract-bands}
    spec:
      restartPolicy: Never
      tolerations:
      - {key: "nautilus.io/issue", operator: Exists, effect: NoSchedule}
      containers:
      - name: extract-bands
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_PUBLIC_ENDPOINT, value: s3-west.nrp-nautilus.io}
        - {name: AWS_HTTPS, value: 'false'}
        - {name: AWS_VIRTUAL_HOSTING, value: 'FALSE'}
        - {name: GDAL_DATA, value: /usr/share/gdal}
        - {name: GDAL_CACHEMAX, value: '4096'}
        - {name: GDAL_HTTP_TIMEOUT, value: '120'}
        - {name: GDAL_HTTP_MAX_RETRY, value: '5'}
        - {name: CPL_TMPDIR, value: /tmp/work}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          mkdir -p /tmp/work && cd /tmp/work
          SRC=/vsis3/public-rap/rap-pfg-cover-cog.tif

          echo "=== source band count (expect 6) ==="
          gdalinfo $SRC | grep -c '^Band ' || true

          extract () {
            BAND=$1; OUT=$2; LABEL=$3
            echo "=== extracting band ${BAND} (${LABEL}) -> ${OUT} ==="
            gdal_translate -b ${BAND} -a_nodata 255 \
              -of COG \
              -co COMPRESS=DEFLATE -co BLOCKSIZE=512 -co NUM_THREADS=ALL_CPUS \
              -co OVERVIEWS=IGNORE_EXISTING -co BIGTIFF=YES \
              --config GDAL_NUM_THREADS ALL_CPUS \
              $SRC /tmp/work/${OUT}
            echo "--- verifying ${OUT} is single-band ---"
            N=$(gdalinfo /tmp/work/${OUT} | grep -c '^Band ' || true)
            echo "band count: $N"
            test "$N" = "1"
            ls -lh /tmp/work/${OUT}
          }

          # Both extracts run BEFORE any upload, so the 6-band source is still intact if either fails.
          extract 1 rap-afg-cover-cog.tif "annual forb & grass"
          extract 4 rap-pfg-cover-cog.tif "perennial forb & grass"

          echo "=== uploading ==="
          rclone copyto --s3-no-check-bucket /tmp/work/rap-afg-cover-cog.tif nrp:public-rap/rap-afg-cover-cog.tif
          rclone copyto --s3-no-check-bucket /tmp/work/rap-pfg-cover-cog.tif nrp:public-rap/rap-pfg-cover-cog.tif

          # Stale sidecar: carries the 6-band statistics and would misreport the rebuilt file.
          echo "=== removing stale aux.xml ==="
          rclone delete nrp:public-rap/rap-pfg-cover-cog.tif.aux.xml 2>/dev/null || echo "(already absent)"

          echo "✓ done: rap-afg-cover-cog.tif (band 1), rap-pfg-cover-cog.tif (band 4)"
        resources:
          requests: {cpu: '8', memory: 32Gi, ephemeral-storage: 50Gi}
          limits:   {cpu: '8', memory: 32Gi, ephemeral-storage: 50Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
