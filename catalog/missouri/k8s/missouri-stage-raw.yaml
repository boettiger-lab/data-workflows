apiVersion: batch/v1
kind: Job
metadata:
  name: missouri-stage-raw
  labels:
    k8s-app: missouri-stage-raw
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: missouri-stage-raw
    spec:
      priorityClassName: opportunistic
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
      restartPolicy: Never
      containers:
      - name: stage-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: script
          mountPath: /opt/scripts
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          M=https://gisblue.mdc.mo.gov/arcgis/rest/services/Land_Cover/CCS/MapServer
          FS=/opt/scripts/fs2geojson.py
          python3 $FS $M/0 /tmp/grassland-prairie-savanna-coa.geojson --page 500
          python3 $FS $M/1 /tmp/glade-coa.geojson              --page 500
          python3 $FS $M/2 /tmp/forest-woodland-coa.geojson     --page 500
          python3 $FS $M/3 /tmp/cave-karst-coa.geojson          --page 500
          python3 $FS $M/5 /tmp/stream-reach-coa.geojson        --page 500
          python3 $FS $M/6 /tmp/wetland-coa.geojson             --page 500
          python3 $FS $M/7 /tmp/priority-geographies.geojson    --page 500
          for f in /tmp/*.geojson; do
            rclone copyto "$f" "nrp:public-missouri/raw/ccs-2022-$(basename $f)" -v
          done
          rclone lsf nrp:public-missouri/raw/ | grep '^ccs-2022-'
        resources:
          requests: {cpu: '2', memory: 8Gi}
          limits: {cpu: '2', memory: 8Gi}
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: script
        configMap:
          name: nvmo-scripts
