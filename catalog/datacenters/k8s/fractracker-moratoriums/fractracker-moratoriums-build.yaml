# HAND-ROLLED: cng-datasets cannot geocode a table of jurisdiction names; this job stages the
# FracTracker moratorium sheet and attaches each record's Census 2024 boundary, producing the
# GeoParquet the generated workflow in this directory converts.
#
# Staged to s3://public-datacenters/raw/fractracker/moratoriums/:
#   moratoriums-workbook.xlsx   FracTracker's whole workbook (xlsx export)
#   moratoriums.csv             its "Live Data" tab, dates as ISO 8601
#   2024_Gaz_*_national.zip     Census 2024 Gazetteer files used for name matching
#   tl_2024_*_cousub.zip, tl_2024_us_aiannh.zip   TIGER/Line 2024 boundaries not in public-census
#   MANIFEST.sha256             sha256 + byte size of every staged file
#   derived/matched.csv                      every record with geo_level, geoid, census_name
#   derived/moratoriums-boundaries.parquet   input to fractracker-moratoriums-convert
#
# Matching (match_jurisdictions.py): "State of X" -> state; "X County/Parish" -> county;
# "X Township" and New England / New York / Wisconsin towns -> county subdivision; others ->
# incorporated place, then county subdivision; same-named townships are told apart by the county
# named in the record's notes or source links; four tribal areas are mapped by hand to TIGER
# AIANNH codes. Records with no unique match keep a null geometry. State, county and place
# boundaries come from s3://public-census/census-2024/ (TIGER/Line 2024).
#
#   Landing page: https://www.fractracker.org/data-centers/
#   Sheet:        https://docs.google.com/spreadsheets/d/1OLJ-EkkxLfX6l4dTBHsIdtn_zRSyOraS02vd3LMfbEI
# The sheet is updated continuously and has no edition label: the staged files plus their sha256
# are the provenance. Convert asserts --expect-features 841 (the row count on 2026-11-15).
# This job made the first staging; the weekly sync (catalog/datacenters/k8s/fractracker-sync/)
# restages each change and passes convert the new count.
#
#   Issue: https://github.com/boettiger-lab/data-workflows/issues/931
apiVersion: batch/v1
kind: Job
metadata:
  name: fractracker-moratoriums-build
  namespace: geo-workflows
  labels:
    k8s-app: fractracker-moratoriums-build
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: fractracker-moratoriums-build
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      activeDeadlineSeconds: 3600
      dnsConfig:
        nameservers:
        - 8.8.8.8
        - 1.1.1.1
      containers:
      - name: build
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          pip install --quiet openpyxl
          DEST="nrp:public-datacenters/raw/fractracker/moratoriums"
          mkdir -p /work/derived && cd /work
          C="curl -fsSL --retry 8 --retry-all-errors --retry-delay 30 --max-time 600"
          $C -o moratoriums-workbook.xlsx "https://docs.google.com/spreadsheets/d/1OLJ-EkkxLfX6l4dTBHsIdtn_zRSyOraS02vd3LMfbEI/export?format=xlsx"
          echo "accessed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -I /scripts/sheet_to_csv.py moratoriums-workbook.xlsx "Live Data" moratoriums.csv
          G=https://www2.census.gov/geo/docs/maps-data/data/gazetteer/2024_Gazetteer
          mkdir -p gaz
          for k in counties place cousubs aiannh; do
            $C -o 2024_Gaz_${k}_national.zip "$G/2024_Gaz_${k}_national.zip"
            unzip -oq 2024_Gaz_${k}_national.zip -d gaz
          done
          python3 -I /scripts/match_jurisdictions.py moratoriums.csv gaz derived/matched.csv
          T=https://www2.census.gov/geo/tiger/TIGER2024
          for ss in $(python3 -I -c "import csv; print(' '.join(sorted({r['geoid'][:2] for r in csv.DictReader(open('derived/matched.csv')) if r['geo_level'] == 'county_subdivision'})))"); do
            $C -o tl_2024_${ss}_cousub.zip "$T/COUSUB/tl_2024_${ss}_cousub.zip"
          done
          $C -o tl_2024_us_aiannh.zip "$T/AIANNH/tl_2024_us_aiannh.zip"
          python3 -I /scripts/attach_boundaries.py derived/matched.csv /work derived/moratoriums-boundaries.parquet
          rm -rf gaz
          find . -maxdepth 1 -type f ! -name MANIFEST.sha256 | sort | while read -r f; do
            echo "$(sha256sum "$f" | cut -d' ' -f1)  $(stat -c %s "$f")  ${f#./}"
          done > MANIFEST.sha256
          cat MANIFEST.sha256
          rclone copy . "$DEST" --s3-no-check-bucket
          echo "staged -> s3://public-datacenters/raw/fractracker/moratoriums/"
        resources:
          requests: {cpu: '2', memory: 4Gi, ephemeral-storage: 10Gi}
          limits: {cpu: '2', memory: 4Gi, ephemeral-storage: 10Gi}
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      - name: scripts
        configMap:
          name: fractracker-moratoriums-scripts
