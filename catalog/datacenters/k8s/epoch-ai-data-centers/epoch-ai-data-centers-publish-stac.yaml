# HAND-ROLLED: the generator does not write STAC; this follows the publish-stac pattern of
# catalog/ncp/k8s/invest-peru-2019/invest-peru-2019-publish-stac.yaml (#933).
#
# Step 5: publish the epoch/ai-data-centers and epoch/ai-data-center-footprints collections,
# their READMEs, default styles and (once drawn) thumbnails. Nothing here touches the bucket-level
# collection (public-datacenters/stac-collection.json) or any other dataset's files.
#
# The files are built outside the repo (STAC JSON and READMEs are never committed) and shipped in
# the epoch-ai-data-centers-stac ConfigMap:
#   python3 catalog/datacenters/k8s/epoch-ai-data-centers/gen_stac.py $OUT/stac
#   scripts/default-style.py build <collection> --asset ai-data-centers-pmtiles --column owner_name ...
#   scripts/default-style.py build <collection> --asset ai-data-center-footprints-pmtiles --column feature_type ...
#   (after a first publish) scripts/thumbnail.py <live collection url> --out $OUT/thumbs
#   kubectl create configmap epoch-ai-data-centers-stac -n geo-workflows \
#     --from-file=sites.json=.../epoch/ai-data-centers/stac-collection.json \
#     --from-file=sites-README.md=... --from-file=sites-style.json=... [--from-file=sites-thumbnail.png=...] \
#     --from-file=fp.json=... --from-file=fp-README.md=... --from-file=fp-style.json=... [--from-file=fp-thumbnail.png=...] \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n geo-workflows -f catalog/datacenters/k8s/epoch-ai-data-centers/epoch-ai-data-centers-publish-stac.yaml
#
#   Issue: https://github.com/boettiger-lab/data-workflows/issues/933
apiVersion: batch/v1
kind: Job
metadata:
  name: epoch-ai-data-centers-publish-stac
  namespace: geo-workflows
  labels: {k8s-app: epoch-ai-data-centers-publish-stac}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata: {labels: {k8s-app: epoch-ai-data-centers-publish-stac}}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 1800
      priorityClassName: opportunistic
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: stac, mountPath: /stac, readOnly: true}
        command:
        - bash
        - -c
        - |-
          set -euo pipefail
          R="--retries 10 --low-level-retries 20 --retries-sleep 20s"
          # stac-publish-guard.py (#890): keep the live styles, renders and rel pmtiles links; refuse a
          # file that would drop the live column dictionary or revert an asset-key rename.
          curl -fsSL https://raw.githubusercontent.com/boettiger-lab/data-workflows/main/scripts/stac-publish-guard.py -o /tmp/stac-guard/guard.py --create-dirs || exit 1
          guard_stac() {  # guard_stac <new.json> <nrp:path>; exits the job if the guard refuses
            case "$2" in *.json) ;; *) return 0 ;; esac
            rclone cat "$2" > /tmp/stac-guard/live.json 2>/dev/null || : > /tmp/stac-guard/live.json
            python3 /tmp/stac-guard/guard.py "$1" /tmp/stac-guard/live.json || exit 1
          }
          mkdir -p /tmp/stac && cp -L /stac/* /tmp/stac/ && ls -l /tmp/stac
          python3 - <<'PY'
          import json
          for f, cid in (("sites", "epoch-ai-data-centers"), ("fp", "epoch-ai-data-center-footprints")):
              c = json.load(open(f"/tmp/stac/{f}.json"))
              assert c["id"] == cid and c["license"] == "CC-BY-4.0", (c["id"], c["license"])
              assert any(l["rel"] == "license" for l in c["links"]), "no license link"
              assert sum("default" in a.get("roles", []) for a in c["assets"].values()) == 1, "default styles"
              print("gate OK:", cid, len(c["assets"]), "assets")
          PY
          put() {  # put <file in /tmp/stac> <nrp path>; skips an optional file that is absent
            [ -f "/tmp/stac/$1" ] || { echo "skip $1"; return 0; }
            case "$2" in */stac-collection.json) guard_stac "/tmp/stac/$1" "$2" ;; esac
            rclone copyto "/tmp/stac/$1" "$2" $R --s3-no-check-bucket
            echo "put $1 -> $2"
          }
          S=nrp:public-datacenters/epoch/ai-data-centers
          F=nrp:public-datacenters/epoch/ai-data-center-footprints
          put sites-style.json     $S/styles/ai-data-centers-owner-name.json
          put sites-thumbnail.png  $S/thumbnail.png
          put sites-README.md      $S/README.md
          put sites.json           $S/stac-collection.json
          put fp-style.json        $F/styles/ai-data-center-footprints-feature-type.json
          put fp-thumbnail.png     $F/thumbnail.png
          put fp-README.md         $F/README.md
          put fp.json              $F/stac-collection.json
          echo OK
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: stac, configMap: {name: epoch-ai-data-centers-stac}}
