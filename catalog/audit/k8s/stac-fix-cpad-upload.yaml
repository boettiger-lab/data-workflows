# data-workflows#509 — upload the corrected cpad STAC collections. The pre-gate audit
# flagged all three (cpad-holdings, cpad-units, cced) for a collection-level table:columns
# and a flat GeoParquet asset with no table:columns. The corrected STACs were generated by
# catalog/cpad/repair/fix_cpad.py (move the collection-level schema onto the flat asset,
# reconciled to the actual parquet schema; give the hex the full self-describing schema +
# per-feature-duplication note; document cced's iucncat categorical from the ingested
# distinct; drop the collection-level table:columns) and validated with verify-stac
# --no-data before this upload. Each file's ConfigMap key IS its S3 object name under
# public-cpad/. Runs in-cluster (STAC canonical on NRP S3).
apiVersion: batch/v1
kind: Job
metadata:
  name: stac-fix-cpad-upload
  namespace: geo-workflows
  labels: {k8s-app: stac-fix-cpad-upload}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {k8s-app: stac-fix-cpad-upload}
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: upload
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: stac, mountPath: /stac, readOnly: true}
        command:
        - bash
        - -c
        - |
          set -euo pipefail
          # ConfigMap keys are mounted as SYMLINKS (key -> ..data/key); rclone copyto does
          # not follow a symlink source without -L, so dereference via cat to a real file.
          for f in /stac/*.json; do
            name=$(basename "$f")
            cat "$f" > "/tmp/${name}"
            python3 -c "import json; json.load(open('/tmp/${name}'))"   # validate re-parses
            rclone copyto "/tmp/${name}" "nrp:public-cpad/${name}"
            echo "uploaded public-cpad/${name}"
          done
          echo done
        resources:
          requests: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
          limits:   {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: stac, configMap: {name: cpad-stac-fix}}
