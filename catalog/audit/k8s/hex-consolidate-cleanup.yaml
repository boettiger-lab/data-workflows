# data-workflows#332 — cleanup for the two targets whose "sharding" was actually a stale
# pre-_cng_fid leftover shard (data_1) coexisting with the current build (data_0), NOT genuine
# parallel-COPY auto-sharding. The consolidation job's schema check correctly refused to merge
# these (a merge would have double-counted the redundant rows).
#
#   * public-ecoregion/ecoregion/hex : delete the 2 stale data_1 shards (verified data_1 ⊆ data_0,
#     no _cng_fid). data_0 is the complete current build; keep it.
#   * public-wdpa/wdpa-december-2025  : PURGE the whole prefix. It is a superseded December-2025
#     edition, orphaned from the catalog tree (own STAC, not linked as a child), fully replaced by
#     the canonical wdpa/wdpa June-2026 collection.
apiVersion: batch/v1
kind: Job
metadata:
  name: hex-consolidate-cleanup-332
  namespace: geo-workflows
  labels:
    k8s-app: hex-consolidate-cleanup
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        k8s-app: hex-consolidate-cleanup
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic
      containers:
      - name: cleanup
        image: rclone/rclone:latest
        env:
        - {name: RCLONE_CONFIG, value: /config/rclone/rclone.conf}
        volumeMounts:
        - {name: rclone-config, mountPath: /config/rclone, readOnly: true}
        command:
        - sh
        - -c
        - |
          set -e
          echo "=== #332 cleanup: ecoregion stale shards ==="
          for CELL in 580331033233195007 580401401977372671; do
            P="nrp:public-ecoregion/ecoregion/hex/h0=${CELL}"
            echo "before: $(rclone lsf ${P}/ | tr '\n' ' ')"
            rclone deletefile "${P}/data_1.parquet"
            echo "after:  $(rclone lsf ${P}/ | tr '\n' ' ')"
          done

          echo "=== #332 cleanup: purge superseded wdpa-december-2025 ==="
          echo "size before: $(rclone size nrp:public-wdpa/wdpa-december-2025/ 2>/dev/null || echo '?')"
          rclone purge nrp:public-wdpa/wdpa-december-2025/
          echo "purged; verifying empty:"
          rclone lsf nrp:public-wdpa/wdpa-december-2025/ 2>&1 | head || echo "(gone)"
          echo "=== cleanup done ==="
        resources:
          requests: {cpu: "250m", memory: "256Mi", ephemeral-storage: "1Gi"}
          limits: {cpu: "500m", memory: "512Mi", ephemeral-storage: "2Gi"}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
