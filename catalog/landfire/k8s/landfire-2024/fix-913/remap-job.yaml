# HAND-ROLLED: a one-off rewrite of the 13 published LANDFIRE 2024 COGs (32767 fill -> -9999,
# #913); cng-datasets has no step that remaps values in an existing COG. ConfigMap:
#   kubectl create configmap landfire-913-remap -n geo-workflows --from-file=remap.py \
#     --dry-run=client -o yaml > configmap.yaml
# Each index writes nrp:public-landfire/staging/913-fixed/<key>; swap-job.yaml replaces the
# live COGs after review.
apiVersion: batch/v1
kind: Job
metadata:
  name: landfire-913-remap
  namespace: geo-workflows
  labels:
    k8s-app: landfire-913-remap
spec:
  completions: 13
  parallelism: 7
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 13
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        k8s-app: landfire-913-remap
    spec:
      restartPolicy: Never
      priorityClassName: opportunistic  # ~15 min per file (pilot, ch); idempotent, a preempted index retries
      automountServiceAccountToken: false
      activeDeadlineSeconds: 14400
      containers:
      - name: remap
        image: ghcr.io/boettiger-lab/datasets@sha256:246dc706ea34728a75c0bf1bc8589fd8f5c2e6526876f6c7192660a272cec1b3
        imagePullPolicy: IfNotPresent
        command: [python3, /opt/913/remap.py]
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}
        - {name: AWS_S3_ENDPOINT, value: rook-ceph-rgw-nautiluss3.rook}
        - {name: AWS_HTTPS, value: "NO"}
        - {name: AWS_VIRTUAL_HOSTING, value: "FALSE"}
        - {name: GDAL_CACHEMAX, value: "1024"}
        - {name: GDAL_DISABLE_READDIR_ON_OPEN, value: EMPTY_DIR}
        - {name: CPL_TMPDIR, value: /scratch}
        - {name: WORK, value: /scratch}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: code, mountPath: /opt/913, readOnly: true}
        - {name: scratch, mountPath: /scratch}
        resources:
          requests: {cpu: "4", memory: 3Gi, ephemeral-storage: 30Gi}
          limits: {cpu: "4", memory: 3Gi, ephemeral-storage: 30Gi}
      volumes:
      - name: rclone-config
        secret: {secretName: rclone-config}
      - name: code
        configMap: {name: landfire-913-remap}
      - name: scratch
        emptyDir: {sizeLimit: 30Gi}
