apiVersion: batch/v1
kind: Job
metadata:
  name: landfire-2024-fvt-hex
  namespace: geo-workflows
  labels:
    k8s-app: landfire-2024-fvt-hex
spec:
  completions: 6
  parallelism: 3
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 6
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: landfire-2024-fvt-hex
    spec:
      restartPolicy: Never
      containers:
      - name: hex-task
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        env:
        # DEVIATION from generated output (boettiger-lab/datasets#195, open): no --hex-workers
        # flag exists, so CNG_HEX_WORKERS must be set by hand. Tool default (48-64) peaked at
        # 190.5 GiB on this tranche; 8 holds it to ~37-48 GiB. Drop this once #195 lands.
        - {name: CNG_HEX_WORKERS, value: '8'}
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_ENDPOINT
          value: rook-ceph-rgw-nautiluss3.rook
        - name: AWS_PUBLIC_ENDPOINT
          value: s3-west.nrp-nautilus.io
        - name: AWS_HTTPS
          value: 'false'
        - name: AWS_VIRTUAL_HOSTING
          value: 'FALSE'
        - name: GDAL_DATA
          value: /usr/share/gdal
        - name: PYTHONPATH
          value: /usr/lib/python3/dist-packages
        - name: BUCKET
          value: public-landfire
        volumeMounts:
        - name: rclone-config
          mountPath: /root/.config/rclone
          readOnly: true
        command:
        - bash
        - -c
        - "set -e\n\n# Only the h0 base cells this source overlaps (--h0-subset);\
          \ the\n# completion index selects one of them.\nH0S=(12 14 20 50 71 78)\n\
          H0=${H0S[$JOB_COMPLETION_INDEX]}\nif [ -z \"${JOB_COMPLETION_INDEX}\" ]\
          \ || [ -z \"$H0\" ]; then\n  echo \"No h0 cell for completion index '${JOB_COMPLETION_INDEX}'\
          \ in (${H0S[*]}) \u2014 completions must match the --h0-subset length\"\
          \ >&2\n  exit 1\nfi\n\ncng-datasets raster --input \"s3://public-landfire/landfire-2024-fvt/landfire-2024-fvt-cog.tif\"\
          \ --output-parquet s3://public-landfire/landfire-2024-fvt/hex/ --h0-index\
          \ ${H0} --resolution 10 --parent-resolutions 9,8,0 --value-column fvt --hex-resampling\
          \ mode --nodata \"-9999,32767\""
        resources:
          requests:
            cpu: '4'
            memory: 96Gi
            ephemeral-storage: 80Gi
          limits:
            cpu: '4'
            memory: 96Gi
            ephemeral-storage: 80Gi
      volumes:
      - name: rclone-config
        secret:
          secretName: rclone-config
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: NotIn
                values:
                - 'true'
