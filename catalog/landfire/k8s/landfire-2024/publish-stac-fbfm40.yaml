# Step 5: publish the FBFM40 collection and re-register the bucket collection (#623).
#
# The script is supplied as a ConfigMap so the committed file is the single source:
#   kubectl create configmap landfire-2024-stac-script -n geo-workflows \
#     --from-file=make-stac-structure.py=catalog/landfire/k8s/landfire-2024/make-stac-structure.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Scoped with --only fbfm40 ON PURPOSE. The other ten collections are already live and were
# verified byte-identical against this generator before this job was written, so there is no
# reason to rewrite them and every reason not to risk a diff in published metadata.
#
# Writes exactly two objects:
#   public-landfire/landfire-2024-fbfm40/stac-collection.json   (new)
#   public-landfire/stac-collection.json                        (10 -> 11 children)
apiVersion: batch/v1
kind: Job
metadata:
  name: landfire-2024-fbfm40-publish-stac
  namespace: geo-workflows
  labels:
    k8s-app: landfire-2024-fbfm40-publish-stac
spec:
  backoffLimit: 1
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 10800
  template:
    metadata:
      labels:
        k8s-app: landfire-2024-fbfm40-publish-stac
    spec:
      restartPolicy: Never
      containers:
      - name: publish
        image: ghcr.io/boettiger-lab/datasets:latest
        imagePullPolicy: Always
        resources:
          requests: {memory: "4Gi", cpu: "1", ephemeral-storage: "8Gi"}
          limits:   {memory: "4Gi", cpu: "1", ephemeral-storage: "8Gi"}
        env:
        - {name: AWS_ACCESS_KEY_ID,     valueFrom: {secretKeyRef: {name: aws, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: aws, key: AWS_SECRET_ACCESS_KEY}}}
        - {name: AWS_S3_ENDPOINT,     value: "rook-ceph-rgw-nautiluss3.rook"}
        - {name: AWS_PUBLIC_ENDPOINT, value: "s3-west.nrp-nautilus.io"}
        - {name: AWS_HTTPS,           value: "false"}
        - {name: AWS_VIRTUAL_HOSTING, value: "FALSE"}
        volumeMounts:
        - {name: rclone-config, mountPath: /root/.config/rclone, readOnly: true}
        - {name: script,        mountPath: /script, readOnly: true}
        command:
        - bash
        - -c
        - |
          set -euo pipefail

          # Class legends come from the CSV shipped in each product zip, staged beside the raw.
          rclone copy nrp:public-landfire/raw/landfire-2024/ /tmp/legends/ --include '*.csv'
          test -s /tmp/legends/FBFM40/LF2024_FBFM40.csv

          python3 /script/make-stac-structure.py \
            --legends /tmp/legends --out /tmp/stac --only fbfm40

          # Gate before writing anything. A silent shape change here republishes the bucket
          # collection, so the child count and the measured values are both checked.
          python3 - <<'PY'
          import json
          c = json.load(open('/tmp/stac/landfire-2024-fbfm40.json'))
          assert c['id'] == 'landfire-2024-fbfm40', c['id']
          hexa = c['assets']['fbfm40-hex']
          assert hexa['h3:native_resolution'] == 10, hexa['h3:native_resolution']
          assert hexa['h3:parent_resolutions'] == [9, 8, 0], hexa['h3:parent_resolutions']
          vals = [x for x in hexa['table:columns'] if x['name'] == 'fbfm40'][0]['values']
          assert len(vals) == 44, len(vals)
          assert {91, 92, 93, 98, 99} <= set(vals), 'NB classes missing from values'
          b = json.load(open('/tmp/stac/landfire-bucket.json'))
          kids = [l['id'] for l in b['links'] if l['rel'] == 'child']
          assert len(kids) == 11, kids
          assert 'landfire-2024-fbfm40' in kids, kids
          print('gate OK:', len(vals), 'values,', len(kids), 'children')
          PY

          # Child first, then the root, so the new collection is never advertised before it exists.
          rclone copyto /tmp/stac/landfire-2024-fbfm40.json \
            nrp:public-landfire/landfire-2024-fbfm40/stac-collection.json
          rclone copyto /tmp/stac/landfire-bucket.json \
            nrp:public-landfire/stac-collection.json

          echo "=== published ==="
          rclone lsl nrp:public-landfire/landfire-2024-fbfm40/stac-collection.json
          rclone lsl nrp:public-landfire/stac-collection.json
          echo OK
      volumes:
      - {name: rclone-config, secret: {secretName: rclone-config}}
      - {name: script, configMap: {name: landfire-2024-stac-script}}
