name: Dataset ingest
description: Ingest one dataset into the CNG catalog
title: "<bucket>/<dataset>: <short description>"
labels: ["type: data"]
body:
  - type: markdown
    attributes:
      value: |
        This issue defines **what** to deliver, not **how** to build it. Scope belongs here
        because it outlives the session that wrote it. Implementation does not: it goes stale,
        and a reader cannot tell a considered decision from a guess typed in passing.

        Rules for filling this in:

        1. Keep it concise.
        2. Do not write which scripts or jobs to create, k8s vs armada, chunk sizes, memory,
           or parallelism. Those belong to whoever builds it, with the tooling as it is that day.
        3. Unknown -> write `UNKNOWN: <the question>`. Never speculate, and never synthesize a
           version, edition, or license you did not verify.
        4. Scope changes later are edits to this issue, not comments and not memory.

  - type: input
    id: dataset
    attributes:
      label: Dataset
      description: What it is, in one line.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source
      description: >
        The about page, the description page carrying the metadata that will inform the STAC
        (abstract, methods, units, edition), not a direct-download link. Then where the bytes
        come from, and the date you pulled them.
      placeholder: |
        About: https://...
        Download: https://...
        Accessed: 2026-09-22
    validations:
      required: true

  - type: textarea
    id: license
    attributes:
      label: License
      description: >
        Describe the data's license: what upstream actually grants, and where it says so.
        If no terms can be found, say that plainly rather than naming a license upstream never gave.
      placeholder: |
        CC-BY-4.0, stated at https://.../terms
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target bucket and dataset path
      description: >
        Copy the convention from the most recent ingests rather than inventing one. Check
        `gh issue list --label "type: data"` and the live catalog. The last path segment becomes
        the S3 prefix, the PMTiles source-layer, and the k8s job prefix. No dots in the name.
      placeholder: "s3://public-<bucket>/, dataset <group>/<name>"
    validations:
      required: true
