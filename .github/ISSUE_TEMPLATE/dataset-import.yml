name: Dataset ingest
description: Ingest one dataset into the CNG catalog
title: "<bucket>/<dataset>: <short description>"
labels: ["type: data"]
body:
  - type: markdown
    attributes:
      value: |
        This issue defines **what** to deliver, not **how** to build it. Scope belongs here
        because it outlives the session that wrote it. Implementation does not: it goes stale,
        and a reader cannot tell a considered decision from a guess typed in passing.

        Rules for filling this in:

        1. One line per field. Two only if the second changes what gets built.
        2. Under 200 words total. No background, no build plan, no summary, no restating
           the source in prose. Nothing outside these fields.
        3. Do not write which scripts or jobs to create, k8s vs armada, chunk sizes, memory,
           or parallelism. Those belong to whoever builds it, with the tooling as it is that day.
        4. Unknown -> write `UNKNOWN: <the question>`. Never speculate, and never synthesize a
           version, edition, or license you did not verify.
        5. Scope changes later are edits to this issue, not comments and not memory.

  - type: input
    id: dataset
    attributes:
      label: Dataset
      description: What it is, in one line.
    validations:
      required: true

  - type: input
    id: extent
    attributes:
      label: Geographic scope
      description: >
        Process the full upstream extent whenever it is feasible. If the request named a subset
        of a larger dataset, ingest the whole thing and say so here. One catalog-wide dataset
        serves every downstream clip, where a bespoke ingest per geographic scope does not.
      value: "Full upstream extent."
    validations:
      required: true

  - type: input
    id: h3
    attributes:
      label: H3 resolutions
      description: >
        Native must match the source pixel or feature size. `h0` always; `h8` is the catalog's
        universal join key, so anything finer than 8 must carry it. A source too coarse for `h8`
        is a sanctioned case, but say so here. Do not guess: ask, and leave `UNKNOWN` until answered.
      placeholder: "native 7, parents 6, 0 (source pixel is 3 km, too coarse for h8)"
    validations:
      required: true

  - type: input
    id: reducer
    attributes:
      label: Reducer (rasters only)
      description: >
        sum / mean / mode / max / min. Follows the source UNITS, not the conceptual quantity.
        Summing a density is the recurring error. Do not guess.
      placeholder: "mean (source is degC, an intensive quantity)"

  - type: textarea
    id: source
    attributes:
      label: Source
      description: >
        The about page, the description page carrying the metadata that will inform the STAC
        (abstract, methods, units, edition), not a direct-download link. Then where the bytes
        come from, and the date you pulled them.
      placeholder: |
        About: https://...
        Download: https://...
        Accessed: 2026-09-22
    validations:
      required: true

  - type: textarea
    id: license
    attributes:
      label: License
      description: >
        Describe the data's license: what upstream actually grants, and where it says so.
        If no terms can be found, say that plainly rather than naming a license upstream never gave.
      placeholder: |
        CC-BY-4.0, stated at https://.../terms
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target bucket and dataset path
      description: >
        Copy the convention from the most recent ingests rather than inventing one. Check
        `gh issue list --label "type: data"` and the live catalog. The last path segment becomes
        the S3 prefix, the PMTiles source-layer, and the k8s job prefix. No dots in the name.
      placeholder: "s3://public-<bucket>/, dataset <group>/<name>"
    validations:
      required: true
