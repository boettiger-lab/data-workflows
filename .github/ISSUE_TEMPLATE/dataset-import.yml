name: Dataset request
description: Ask us to add a dataset to the catalog
labels: ["type: data"]
body:

  - type: markdown
    attributes:
      value: >
        Thanks for the request. All we need is a link to the data; we will work out the rest from
        there. Give the issue any title you like.

  - type: input
    id: link
    attributes:
      label: Link
      description: A web page for the dataset, or a download link.
      placeholder: https://...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional. What the data is, and which parts, places or years you need.
    validations:
      required: false

  - type: input
    id: license
    attributes:
      label: License
      description: Optional. The data's license or terms of use, if you know them.
    validations:
      required: false
